name: Construir APK Android

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "android/**"
      - ".github/workflows/android-debug-apk.yml"

permissions:
  contents: write

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar proyecto
        uses: actions/checkout@v4

      - name: Preparar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Preparar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Compilar APK de pruebas
        run: gradle -p android --no-daemon assembleDebug

      - name: Preparar descarga directa
        run: cp android/app/build/outputs/apk/debug/app-debug.apk VobixChat-1.2.3-debug.apk

      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: VobixChat-1.2.3-debug
          path: VobixChat-1.2.3-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publicar APK para descarga directa
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.2.3
          name: VobixChat 1.2.3
          body: APK de pruebas con correcciones de teclado, cabecera del chat y permisos persistentes.
          files: VobixChat-1.2.3-debug.apk
          prerelease: true
