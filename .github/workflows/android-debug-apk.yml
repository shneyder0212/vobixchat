name: Retirar APK defectuosa

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/android-debug-apk.yml"

permissions:
  contents: write

jobs:
  retirar-version-1-2-3:
    runs-on: ubuntu-latest
    steps:
      - name: Retirar versión pública defectuosa
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release delete v1.2.3 --repo "${{ github.repository }}" --cleanup-tag --yes || true
