<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VOBIXCHAT</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: Arial, sans-serif; }
        body { background-color: #0b0b0b; color: #fff; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
        
        header { display: flex; justify-content: space-between; align-items: center; background: #1a1a1a; padding: 12px 15px; border-bottom: 2px solid #00ffcc; }
        .sala-directa { font-size: 16px; font-weight: bold; color: #00ffcc; }
        .btn-salir { background-color: #ff3333; color: white; border: none; padding: 6px 14px; border-radius: 6px; font-weight: bold; cursor: pointer; }

        #login-screen { display: flex; flex-direction: column; justify-content: center; align-items: center; flex: 1; padding: 20px; background: #0b0b0b; }
        #login-screen input { width: 100%; max-width: 300px; padding: 12px; margin-bottom: 10px; border-radius: 8px; border: 1px solid #444; background: #222; color: #fff; }
        #login-screen button { width: 100%; max-width: 300px; padding: 12px; background: #00ffcc; color: #000; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; }

        #chat-screen { display: none; flex-direction: column; flex: 1; overflow: hidden; }
        #chat-messages { flex: 1; padding: 15px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; scroll-behavior: smooth; }
        
        .message { padding: 10px 14px; border-radius: 10px; max-width: 80%; word-wrap: break-word; animation: subirMensaje 0.3s ease-out; }
        .user-msg { background: #00ffcc; color: #000; align-self: flex-end; }
        .bot-msg { background: #222; color: #fff; align-self: flex-start; border: 1px solid #444; }
        @keyframes subirMensaje { from { opacity: 0; transform: translateY(15px); } to { opacity: 1; transform: translateY(0); } }

        #chat-input-area { display: flex; padding: 12px 12px 25px 12px; background: #1a1a1a; border-top: 1px solid #333; }
        #chat-input-area input { flex: 1; padding: 12px; border-radius: 8px; border: 1px solid #444; background: #222; color: #fff; outline: none; }
        #chat-input-area button { background: #00ffcc; color: #000; border: none; padding: 0 18px; margin-left: 8px; border-radius: 8px; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>

    <header>
        <div class="sala-directa">🟢 VOBIXCHAT // SALA DIRECTA</div>
        <button class="btn-salir" onclick="cerrarSesion()">Salir</button>
    </header>

    <div id="login-screen">
        <h2 style="margin-bottom: 20px; color: #00ffcc;">VOBIXCHAT</h2>
        <input type="text" id="username" placeholder="Escribe tu nombre para entrar...">
        <button onclick="guardarRegistro()">Entrar a la App</button>
    </div>

    <div id="chat-screen">
        <div id="chat-messages">
            <div class="message bot-msg">¡Hola! Ya estás conectado en VOBIXCHAT.</div>
        </div>
        <div id="chat-input-area">
            <input type="text" id="message-input" placeholder="Escribe un mensaje..." onkeypress="manejarEnter(event)">
            <button onclick="enviarMensaje()">Enviar</button>
        </div>
    </div>

    <script>
        window.onload = function() {
            if (localStorage.getItem("vobixchat_usuario")) {
                mostrarChat();
            }
        };

        function guardarRegistro() {
            const nombre = document.getElementById("username").value.trim();
            if (nombre !== "") {
                localStorage.setItem("vobixchat_usuario", nombre);
                mostrarChat();
            } else {
                alert("Por favor, introduce un nombre.");
            }
        }

        function mostrarChat() {
            document.getElementById("login-screen").style.display = "none";
            document.getElementById("chat-screen").style.display = "flex";
            irAlFondo();
        }

        function cerrarSesion() {
            localStorage.removeItem("vobixchat_usuario");
            location.reload();
        }

        function manejarEnter(event) {
            if (event.key === "Enter") {
                enviarMensaje();
            }
        }

        function enviarMensaje() {
            const input = document.getElementById("message-input");
            const texto = input.value.trim();
            if (texto === "") return;

            const contenedorChat = document.getElementById("chat-messages");
            const msgUser = document.createElement("div");
            msgUser.className = "message user-msg";
            msgUser.textContent = texto;
            contenedorChat.appendChild(msgUser);

            input.value = "";
            irAlFondo();

            setTimeout(() => {
                const msgBot = document.createElement("div");
                msgBot.className = "message bot-msg";
                msgBot.textContent = "Eco: " + texto;
                contenedorChat.appendChild(msgBot);
                irAlFondo();
            }, 500);
        }

        function irAlFondo() {
            const contenedorChat = document.getElementById("chat-messages");
            contenedorChat.scrollTop = contenedorChat.scrollHeight;
        }
    </script>
</body>
</html>
