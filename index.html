<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>VOBIXCHAT // Quantum WhatsApp Style</title>
    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
    <style>
        * { box-sizing: border-box; }
        body { 
            margin: 0; padding: 0; background: #050505; color: #fff; 
            font-family: 'Segoe UI', sans-serif; height: 100vh; 
            display: flex; flex-direction: column; overflow: hidden; 
        }
        
        /* Barra superior */
        #header { height: 60px; background: #111; display: flex; align-items: center; justify-content: space-between; padding: 0 15px; border-bottom: 2px solid #00f0ff; z-index: 10; }
        
        /* Área de Chat */
        #messages { flex: 1; overflow-y: auto; padding: 15px; display: flex; flex-direction: column; gap: 10px; }
        .msg { background: #1a1a1a; padding: 12px; border-radius: 15px; max-width: 85%; align-self: flex-start; border: 1px solid #333; font-size: 16px; }
        
        /* Área de escritura fija abajo */
        #input-area { height: 70px; background: #000; display: flex; align-items: center; padding: 10px; gap: 10px; border-top: 1px solid #00f0ff; }
        #messageInput { flex: 1; height: 50px; background: #222; color: #fff; border: 1px solid #00f0ff; border-radius: 25px; padding: 0 20px; font-size: 16px; outline: none; }
        #sendBtn { background: #00f0ff; color: #000; border: none; padding: 0 20px; height: 50px; border-radius: 25px; font-weight: bold; }
        
        /* Botones de llamada */
        .call-btn { background: #00f0ff; color: #000; border: none; border-radius: 50%; font-size: 18px; width: 40px; height: 40px; cursor: pointer; }

        /* --- ESTILO WHATSAPP PARA LLAMADAS Y VÍDEO --- */
        .overlay-screen {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background: #0b141a; display: none; flex-direction: column; z-index: 1500; justify-content: space-between; padding: 20px;
        }
        
        /* Pantalla de Vídeo Principal (Estilo WhatsApp) */
        #remoteVideo {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; z-index: 1;
        }
        
        /* Tu propia cámara flotante en la esquina */
        #localVideo {
            position: absolute; top: 20px; right: 20px; width: 100px; height: 150px; object-fit: cover;
            border-radius: 12px; border: 2px solid #00f0ff; background: #000; z-index: 5; display: none;
        }

        /* Pantalla de Llamada de Voz (Sin cámaras, solo avatar) */
        .voice-call-ui {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle, #1f2c34 0%, #0b141a 100%);
            display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 2; gap: 20px;
        }
        .caller-avatar {
            width: 100px; height: 100px; border-radius: 50%; background: #00f0ff; color: #000;
            display: flex; align-items: center; justify-content: center; font-size: 40px; font-weight: bold;
            box-shadow: 0 0 20px rgba(0,240,255,0.4);
        }

        /* Controles inferiores flotantes en llamada */
        .call-controls-bar {
            position: relative; z-index: 10; display: flex; justify-content: center; gap: 20px; margin-bottom: 20px;
        }
        .call-action-btn {
            background: rgba(255,255,255,0.15); border: none; color: #fff; padding: 15px 25px;
            border-radius: 30px; font-weight: bold; cursor: pointer; font-size: 14px; backdrop-filter: blur(5px);
        }
        .call-action-btn.danger { background: #ff3b30; }
    </style>
</head>
<body>

    <div id="header">
        <div style="font-weight:bold;">CHAT WILLIAM</div>
        <div style="display:flex; gap:15px;">
            <button class="call-btn" onclick="iniciarLlamada('audio')">📞</button>
            <button class="call-btn" onclick="iniciarLlamada('video')">📹</button>
        </div>
    </div>

    <div id="messages">
        <div class="msg">Conectado a VOBIXCHAT.</div>
    </div>

    <div id="input-area">
        <input type="text" id="messageInput" placeholder="Escribe aquí...">
        <button id="sendBtn" onclick="enviarMensaje()">ENVIAR</button>
    </div>

    <!-- PANTALLA UNIFICADA DE LLAMADA / VÍDEO -->
    <div class="overlay-screen" id="mediaCallScreen">
        <!-- Vídeo de la otra persona (Fondo completo estilo WhatsApp) -->
        <video id="remoteVideo" autoplay playsinline></video>

        <!-- Interfaz exclusiva para llamada de voz (Se oculta en vídeo) -->
        <div class="voice-call-ui" id="voiceCallUI">
            <div class="caller-avatar" id="callAvatarText">W</div>
            <div style="font-size: 22px; font-weight: bold;" id="callContactName">William</div>
            <div style="font-size: 14px; color: #8696a0;" id="callStatusText">Llamando...</div>
        </div>

        <!-- Tu propia cámara en miniatura (Solo visible en videollamada) -->
        <video id="localVideo" autoplay playsinline muted></video>

        <!-- Barra inferior de botones -->
        <div class="call-controls-bar">
            <button class="call-action-btn" id="toggleMuteAudioBtn" onclick="toggleMuteAudio()">🎤 Silenciar</button>
            <button class="call-action-btn danger" onclick="endMediaCall()">COLGAR ☎</button>
        </div>
    </div>

    <script>
        const socket = io();
        let localStream = null;
        let peerConnection = null;

        const iceServers = {
            iceServers: [
                { urls: 'stun:stun.l.google.com:19302' },
                { urls: 'stun:stun1.l.google.com:19302' }
            ]
        };

        function enviarMensaje() {
            const input = document.getElementById('messageInput');
            if(input.value.trim() !== "") {
                const msg = document.createElement('div');
                msg.className = 'msg';
                msg.textContent = input.value;
                document.getElementById('messages').appendChild(msg);
                input.value = '';
                document.getElementById('messages').scrollTop = document.getElementById('messages').scrollHeight;
            }
        }

        // --- GESTIÓN DE LLAMADAS (AUDIO VS VÍDEO) ---
        async function iniciarLlamada(tipo) {
            try {
                const conVideo = (tipo === 'video');
                
                // Configurar interfaz según sea voz o vídeo
                if (conVideo) {
                    document.getElementById('voiceCallUI').style.display = 'none';
                    document.getElementById('localVideo').style.display = 'block';
                } else {
                    document.getElementById('voiceCallUI').style.display = 'flex';
                    document.getElementById('localVideo').style.display = 'none';
                }

                document.getElementById('mediaCallScreen').style.display = 'flex';

                localStream = await navigator.mediaDevices.getUserMedia({
                    audio: { echoCancellation: true, noiseSuppression: true },
                    video: conVideo ? { width: { ideal: 1280 }, height: { ideal: 720 } } : false
                });

                if (conVideo) {
                    document.getElementById('localVideo').srcObject = localStream;
                }

                socket.emit('call_user', { room: 'SALA_GENERAL_VOBIX', sender: 'Usuario', type: tipo });
            } catch (err) {
                alert("Error: Asegúrate de habilitar los permisos de Cámara y Micrófono en el navegador.");
            }
        }

        function createPeerConnection(remoteSocketId, conVideo) {
            peerConnection = new RTCPeerConnection(iceServers);
            
            localStream.getTracks().forEach(track => {
                peerConnection.addTrack(track, localStream);
            });

            peerConnection.ontrack = event => {
                if (conVideo) {
                    document.getElementById('remoteVideo').srcObject = event.streams[0];
                }
            };

            peerConnection.onicecandidate = event => {
                if (event.candidate) {
                    socket.emit('ice_candidate', { room: 'SALA_GENERAL_VOBIX', candidate: event.candidate, to: remoteSocketId });
                }
            };
        }

        window.endMediaCall = () => {
            if(localStream) {
                localStream.getTracks().forEach(t => t.stop());
                localStream = null;
            }
            if(peerConnection) {
                peerConnection.close();
                peerConnection = null;
            }
            document.getElementById('localVideo').srcObject = null;
            document.getElementById('remoteVideo').srcObject = null;
            document.getElementById('mediaCallScreen').style.display = 'none';
        };

        window.toggleMuteAudio = () => {
            if(localStream) {
                const audioTrack = localStream.getAudioTracks()[0];
                if(audioTrack) {
                    audioTrack.enabled = !audioTrack.enabled;
                    document.getElementById('toggleMuteAudioBtn').textContent = audioTrack.enabled ? "🎤 Silenciar" : "🔇 Activado";
                }
            }
        };

        document.getElementById('messageInput').addEventListener('keypress', function (e) {
            if (e.key === 'Enter') enviarMensaje();
        });
    </script>
</body>
</html>
