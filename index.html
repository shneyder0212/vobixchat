<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VOBIXCHAT // Quantum Ultimate</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #0b0f19; color: #e2e8f0; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
        
        /* Barra Superior */
        .top-bar { background: #131b2e; border-bottom: 1px solid #1e293b; padding: 10px 20px; display: flex; justify-content: space-between; align-items: center; }
        .logo { color: #38bdf8; font-weight: bold; letter-spacing: 1px; font-size: 1.1rem; }
        .top-buttons { display: flex; gap: 10px; }
        .top-btn { background: #1a2238; border: 1px solid #334155; color: #38bdf8; padding: 6px 12px; border-radius: 6px; font-size: 0.8rem; cursor: pointer; font-weight: bold; }

        /* Contenedor Principal */
        .main-layout { display: flex; flex: 1; height: calc(100vh - 50px); overflow: hidden; }

        /* Panel Izquierdo */
        .sidebar-left { width: 280px; background: #131b2e; border-right: 1px solid #1e293b; padding: 15px; display: flex; flex-direction: column; gap: 12px; overflow-y: auto; }
        .panel-box { background: #1a2238; border: 1px solid #2a3655; border-radius: 8px; padding: 12px; }
        .panel-title { font-size: 0.75rem; color: #38bdf8; font-weight: bold; margin-bottom: 8px; text-transform: uppercase; }
        .menu-btn { width: 100%; background: #0f172a; border: 1px solid #334155; color: #e2e8f0; padding: 10px; border-radius: 6px; text-align: left; font-size: 0.85rem; cursor: pointer; margin-bottom: 6px; transition: 0.2s; }
        .menu-btn:hover { border-color: #38bdf8; color: #38bdf8; }
        .menu-btn.active { background: #0284c7; border-color: #38bdf8; color: #fff; font-weight: bold; }

        /* Panel Central (Chat) */
        .chat-center { flex: 1; display: flex; flex-direction: column; background: #0b0f19; }
        .chat-header-bar { background: #131b2e; padding: 12px 20px; border-bottom: 1px solid #1e293b; display: flex; justify-content: space-between; align-items: center; }
        .chat-messages { flex: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; }
        .message { background: #1e293b; padding: 10px 14px; border-radius: 8px; max-width: 80%; border: 1px solid #2a3655; }
        .message b { color: #38bdf8; display: block; font-size: 0.75rem; margin-bottom: 3px; }
        .chat-input-area { padding: 15px 20px; background: #131b2e; border-top: 1px solid #1e293b; display: flex; gap: 10px; align-items: center; }
        .chat-input-area input { flex: 1; background: #0b0f19; border: 1px solid #334155; padding: 10px 14px; border-radius: 6px; color: #fff; outline: none; }
        .chat-input-area button { background: #0ea5e9; color: white; border: none; padding: 10px 20px; border-radius: 6px; font-weight: bold; cursor: pointer; }

        /* Panel Derecho */
        .sidebar-right { width: 300px; background: #131b2e; border-left: 1px solid #1e293b; padding: 15px; display: flex; flex-direction: column; gap: 12px; overflow-y: auto; font-size: 0.85rem; }
        .right-group { background: #1a2238; border: 1px solid #2a3655; border-radius: 8px; padding: 12px; }
        .right-group label { display: block; color: #94a3b8; font-size: 0.75rem; margin-bottom: 4px; }
        .right-group input { width: 100%; background: #0f172a; border: 1px solid #334155; padding: 8px; border-radius: 6px; color: #fff; margin-bottom: 8px; font-size: 0.85rem; }
        .action-btn { width: 100%; background: #0284c7; border: none; color: white; padding: 8px; border-radius: 6px; font-weight: bold; cursor: pointer; margin-top: 4px; font-size: 0.8rem; }
        .action-btn.red { background: #e11d48; }
    </style>
</head>
<body>

    <!-- BARRA SUPERIOR -->
    <div class="top-bar">
        <div class="logo">VOBIXCHAT</div>
        <div class="top-buttons">
            <button class="top-btn">📞 Videollamada 00</button>
            <button class="top-btn">🎥 Videoconferencia 00</button>
            <button class="top-btn">⭐ VIP</button>
        </div>
    </div>

    <!-- DISEÑO DE 3 COLUMNAS -->
    <div class="main-layout">
        
        <!-- PANEL IZQUIERDO -->
        <div class="sidebar-left">
            <div class="panel-box">
                <div class="panel-title">SHNEYDER PROPIETARIO</div>
                <div style="font-size: 0.8rem; color: #94a3b8;">ID: 01</div>
            </div>

            <div class="panel-box">
                <div class="panel-title">DISPOSITIVOS CONECTADOS</div>
                <div id="deviceCount" style="font-size: 1.2rem; font-weight: bold; color: #38bdf8;">1</div>
            </div>

            <div class="panel-box">
                <div class="panel-title">MODO PROPIETARIO ACTIVO</div>
                <button class="menu-btn active" id="modeBtn">🔒 ACTIVAR MODO ABUELO</button>
            </div>

            <div class="panel-title">NAVEGACIÓN</div>
            <button class="menu-btn active">💬 Chats & Traductor</button>
            <button class="menu-btn">📊 Estados & Historias</button>
            <button class="menu-btn">📄 Escáner PDF</button>
            <button class="menu-btn">🛡️ Búnker Offline</button>
        </div>

        <!-- PANEL CENTRAL (CHAT GLOBAL) -->
        <div class="chat-center">
            <div class="chat-header-bar">
                <span style="color: #38bdf8; font-weight: bold; font-size: 0.9rem;">[CANAL GLOBAL SECURE]</span>
                <span style="font-size: 0.75rem; color: #94a3b8;">13:46</span>
            </div>

            <div id="messages" class="chat-messages">
                <div class="message">
                    <b>[SISTEMA] VobixChat Quantum</b>
                    Canal global seguro establecido correctamente.
                </div>
            </div>

            <form id="form" class="chat-input-area">
                <input id="input" autocomplete="off" placeholder="Escribe un mensaje..." required />
                <button type="submit">ENVIAR</button>
            </form>
        </div>

        <!-- PANEL DERECHO (CONFIGURACIÓN) -->
        <div class="sidebar-right">
            <div class="right-group">
                <div class="panel-title">🛠️ GESTIÓN CLAVE DE SOCIO</div>
                <label>Nueva Clave de Socio (Secreta):</label>
                <input type="text" value="0000" />
                <button class="action-btn">ACTUALIZAR CLAVE DE SOCIO</button>
            </div>

            <div class="right-group">
                <div class="panel-title">⚡ CONTROL DE VIGILANCIA/CITA</div>
                <label>Anuncio Global:</label>
                <input type="text" placeholder="Ticket global..." />
                <button class="action-btn">PUBLICAR ANUNCIO</button>
            </div>

            <div class="right-group">
                <div class="panel-title">🔒 SEGURIDAD ANTIESPÍA</div>
                <button class="action-btn red">BLOQUEAR CAPTURAS</button>
            </div>

            <div class="right-group">
                <div class="panel-title">👶 MODO NIÑO</div>
                <button class="action-btn" id="childModeToggle">ACTIVAR MODO NIÑO</button>
            </div>
        </div>

    </div>

    <!-- SOCKET.IO Y LÓGICA -->
    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();
        const form = document.getElementById('form');
        const input = document.getElementById('input');
        const messages = document.getElementById('messages');
        const deviceCount = document.getElementById('deviceCount');
        const modeBtn = document.getElementById('modeBtn');
        const childModeToggle = document.getElementById('childModeToggle');

        let isChildMode = false;

        // Enviar mensaje
        form.addEventListener('submit', function(e) {
            e.preventDefault();
            if (input.value.trim()) {
                socket.emit('chat_message', { name: isChildMode ? "Niño" : "Shneyder (Propietario)", text: input.value });
                input.value = '';
            }
        });

        // Recibir mensaje
        socket.on('chat_message', function(msg) {
            const item = document.createElement('div');
            item.className = 'message';
            item.innerHTML = `<b>${msg.name}</b>${msg.text}`;
            messages.appendChild(item);
            messages.scrollTop = messages.scrollHeight;
        });

        // Contador de dispositivos
        socket.on('device_count', function(count) {
            deviceCount.textContent = count;
        });

        // Botón de Modo Niño (simula el cambio de interfaz para niños que mencionabas)
        childModeToggle.addEventListener('click', () => {
            isChildMode = !isChildMode;
            if(isChildMode) {
                childModeToggle.textContent = "DESACTIVAR MODO NIÑO";
                childModeToggle.style.background = "#e11d48";
                modeBtn.textContent = "👶 MODO NIÑO ACTIVO";
                alert("Modo Niño activado en la interfaz.");
            } else {
                childModeToggle.textContent = "ACTIVAR MODO NIÑO";
                childModeToggle.style.background = "#0284c7";
                modeBtn.textContent = "🔒 ACTIVAR MODO ABUELO";
                alert("Modo Niño desactivado.");
            }
        });
    </script>
</body>
</html>
