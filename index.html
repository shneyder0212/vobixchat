<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VOBIXCHAT // Quantum Mobile Pro</title>
  <style>
    .neon-theme {
      background-color: #05050a;
      color: #00ffcc;
      font-family: 'Courier New', monospace;
      padding: 20px;
      border: 1px solid #00ffcc;
      box-shadow: 0 0 15px #00ffcc;
      margin-bottom: 15px;
    }
    .input-container {
      display: flex;
      gap: 10px;
      margin-top: 5px;
    }
    #country-code, #phone-number, #sms-pin-input, #numero-destino-input {
      background: #111;
      color: #00ffcc;
      border: 1px solid #00ffcc;
      padding: 8px;
    }
    .btn-confirmar {
      background: #00ffcc;
      color: #000;
      border: none;
      font-weight: bold;
      cursor: pointer;
      padding: 10px;
    }
    .btn-abortar {
      background: #ff3366;
      color: #fff;
      border: none;
      font-weight: bold;
      cursor: pointer;
      padding: 10px;
    }
    .log-line-alert {
      color: #ff3366;
    }
    .paneles-video-cuantico {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 15px;
      margin-top: 20px;
    }
    .pantalla-media {
      border: 1px dashed #00ffcc;
      background-color: #000;
      padding: 5px;
    }
    .tag-video {
      font-size: 11px;
      color: #00ffcc;
      margin: 0 0 5px 0;
    }
    video {
      width: 100%;
      height: auto;
      border: 1px solid #00ffcc;
      background: #020205;
    }
    @keyframes blink {
      50% { opacity: 0.4; }
    }
  </style>
  <script src="/socket.io/socket.io.js"></script>
</head>
<body>
  <!-- TERMINAL DE REGISTRO INICIAL -->
  <div id="vobixchat-terminal" class="neon-theme">
    <h2>VOBIXCHAT // MAIN TERMINAL</h2>
    <div class="form-group">
      <label for="phone-number">Identidad Usuario:</label>
      <div class="input-container">
        <select id="country-code">
          <option value="US">US +1</option>
          <option value="ES" selected>ES +34</option>
          <option value="MX">MX +52</option>
          <option value="AR">AR +54</option>
          <option value="CO">CO +57</option>
          <option value="VE">VE +58</option>
          <option value="PE">PE +51</option>
          <option value="DO">DO +1</option>
        </select>
        <input type="tel" id="phone-number" placeholder="Número de teléfono móvil">
      </div>
    </div>
    <button id="btn-enviar-datos" class="btn-confirmar" style="margin-top: 15px;" onclick="enviarIdentidadUsuario()">ENLAZAR Y GENERAR PIN</button>
  </div>
  <!-- HUD DE LOGS Y CONFIRMACIÓN DE ACCESO -->
  <div id="vobixchat-hud" class="neon-theme">
    <div class="sys-logs">
      <p>[SYS]: CANAL CUÁNTICO INICIALIZADO...</p>
      <p id="sys-status" class="log-line-alert">[SYS]: ESPERANDO CREDENCIALES DE USUARIO...</p>
    </div>

    <div id="seccion-confirmacion" style="display: none; margin-top: 15px; border-top: 1px dashed #00ffcc; padding-top: 10px;">
      <h3>CONFIRMAR ENLACE</h3>
      <p>¿Desea inicializar este enlace seguro con el código enviado por SMS?</p>
      <input type="text" id="sms-pin-input" placeholder="Introduce el PIN de 4 dígitos" maxlength="4">
      <div class="botones-accion" style="margin-top: 10px;">
        <button class="btn-confirmar" onclick="confirmarEnlaceSeguro()">SÍ, ENLAZAR</button>
        <button class="btn-abortar" onclick="window.interrumpirYApagarCanales()">ABORTAR</button>
      </div>
    </div>
    <!-- PANELES OCULTOS MULTIMEDIA (DESBLOQUEADOS POST-PIN) -->
    <div id="modulo-marcado-cuantico" style="display: none; margin-top: 15px; border-top: 1px solid #00ffcc; padding-top: 10px;">
      <label for="numero-destino-input">Establecer Conexión Directa Privada:</label>
      <div class="input-container">
        <input type="tel" id="numero-destino-input" placeholder="Número destino internacional">
        <button id="btn-conectar-llamada" class="btn-confirmar" onclick="ejecutarMarcadoDesdeHUD()">LLAMAR</button>
      </div>
    </div>

    <div id="modulo-captura-multimedia" style="display: none; margin-top: 15px; border-top: 1px dashed #00ffcc; padding-top: 10px;">
      <p class="tag-video">ALMACENAMIENTO MÓVIL LOCAL Y CÁMARA:</p>
      <div class="controles-archivos">
        <input type="file" id="input-archivo-cuantico" accept="image/*" capture="environment" style="display: none;" onchange="detectarSeleccionArchivo()">
        <button class="btn-confirmar" onclick="document.getElementById('input-archivo-cuantico').click()">📎 DISPARAR CÁMARA / CARGAR FOTO</button>
        <button class="btn-abortar" onclick="limpiarConsolaLogsLocal()">❌ Borrar Logs</button>
      </div>
    </div>
    <div class="paneles-video-cuantico">
      <div class="pantalla-media">
        <p class="tag-video">VISTA LOCAL (TÚ):</p>
        <video id="local-video-preview" autoplay playsinline muted></video>
      </div>
      <div class="pantalla-media">
        <p class="tag-video">VISTA REMOTA:</p>
        <video id="remote-video-display" autoplay playsinline></video>
      </div>
    </div>
  </div>

  <!-- BARRA DE CONTROL DE NOTAS DE VOZ -->
  <div id="barra-mensajeria-inferior" class="neon-theme" style="display: none; align-items: center; justify-content: space-between; padding: 10px;">
    <div style="font-size: 20px; cursor: pointer;">😊</div>
    <div id="contenedor-grabando-status" style="display: none; align-items: center; gap: 10px;">
      <span style="color: #ff3366; font-weight: bold; animation: blink 1s infinite;">🔴 GRABANDO:</span>
      <span id="contador-tiempo-voz" style="color: #00ffcc; font-weight: bold;">00:00</span>
    </div>
    <div style="display: flex; align-items: center; gap: 10px;">
      <button id="btn-borrar-nota" class="btn-abortar" style="display: none; padding: 5px 10px; font-size: 12px;" onclick="window.cancelarYBorrarNotaVoz()">BORRAR</button>
      <div id="btn-microfono-disparador" style="background-color: #00ffcc; color: #000; padding: 10px; border-radius: 50%; cursor: pointer; display: flex; align-items: center; justify-content: center; font-weight: bold;" onclick="window.alternarEstadoNotaVoz()">
        🎤
      </div>
    </div>
  </div>

  <script src="cliente-comunicaciones.js"></script>
</body>
</html>
