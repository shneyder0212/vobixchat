<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VOBIXCHAT // Quantum Ultimate</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #0b0f19; color: #e2e8f0; height: 100vh; display: flex; flex-direction: column; justify-content: center; align-items: center; }
        .chat-container { width: 100%; max-width: 600px; height: 90vh; background: #131b2e; border: 1px solid #1e293b; border-radius: 12px; display: flex; flex-direction: column; overflow: hidden; box-shadow: 0 8px 24px rgba(0,0,0,0.5); }
        .chat-header { background: #1a2238; padding: 15px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #2a3655; }
        .chat-header h2 { font-size: 1.1rem; color: #38bdf8; letter-spacing: 1px; }
        .device-counter { font-size: 0.85rem; background: #0284c7; padding: 4px 10px; border-radius: 20px; color: #fff; }
        .chat-messages { flex: 1; padding: 15px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; }
        .message { background: #1e293b; padding: 10px 14px; border-radius: 8px; max-width: 80%; word-break: break-word; }
        .message b { color: #38bdf8; display: block; font-size: 0.8rem; margin-bottom: 3px; }
        .chat-input-area { padding: 15px; background: #1a2238; display: flex; gap: 10px; border-top: 1px solid #2a3655; }
        .chat-input-area input { flex: 1; background: #0b0f19; border: 1px solid #334155; padding: 12px; border-radius: 8px; color: #fff; outline: none; font-size: 1rem; }
        .chat-input-area input:focus { border-color: #38bdf8; }
        .chat-input-area button { background: #0ea5e9; color: white; border: none; padding: 0 20px; border-radius: 8px; font-weight: bold; cursor: pointer; transition: background 0.2s; }
        .chat-input-area button:hover { background: #0284c7; }
    </style>
</head>
<body>

    <div class="chat-container">
        <div class="chat-header">
            <h2>VOBIXCHAT // LIVE</h2>
            <div id="deviceCount" class="device-counter">Conectados: 1</div>
        </div>

        <div id="messages" class="chat-messages">
            <div class="message"><b>Sistema</b>¡Bienvenido al chat en vivo, Shneyder!</div>
        </div>

        <form id="form" class="chat-input-area">
            <input id="input" autocomplete="off" placeholder="Escribe tu mensaje aquí..." required />
            <button type="submit">Enviar</button>
        </form>
    </div>

    <!-- Script de Socket.io -->
    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();

        const form = document.getElementById('form');
        const input = document.getElementById('input');
        const messages = document.getElementById('messages');
        const deviceCount = document.getElementById('deviceCount');

        // Pedir nombre de usuario al entrar
        const username = prompt("Introduce tu alias o nombre:") || "Anónimo";

        form.addEventListener('submit', function(e) {
            e.preventDefault();
            if (input.value) {
                socket.emit('chat_message', { name: username, text: input.value });
                input.value = '';
            }
        });

        socket.on('chat_message', function(msg) {
            const item = document.createElement('div');
            item.className = 'message';
            item.innerHTML = `<b>${msg.name}</b>${msg.text}`;
            messages.appendChild(item);
            messages.scrollTop = messages.scrollHeight;
        });

        socket.on('device_count', function(count) {
            deviceCount.textContent = `Conectados: ${count}`;
        });
    </script>
</body>
</html>
