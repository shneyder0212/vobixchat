<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>VOBIXCHAT TODO EN UNO 🔒</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@600;800&display=swap" rel="stylesheet">
<script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Outfit',sans-serif;background:#050a06;height:100vh;color:#fff;overflow:hidden}
.bg{position:fixed;inset:0;background:radial-gradient(700px at 15% 0%,rgba(0,255,136,.18),transparent),#050a06}
#login{position:relative;z-index:2;height:100vh;display:flex;align-items:center;justify-content:center}
.card{width:400px;background:rgba(15,25,17,.95);border:1px solid rgba(0,255,136,.15);border-radius:26px;padding:38px 32px;text-align:center;box-shadow:0 30px 80px rgba(0,0,0,.6)}
.icon{width:72px;height:72px;margin:0 auto 14px;background:linear-gradient(180deg,#00ff88,#00b35e);border-radius:20px;display:grid;place-items:center;font-size:34px;box-shadow:0 12px 30px rgba(0,255,136,.4)}
.card h1{font-size:32px;font-weight:800;letter-spacing:-1px}
.card h1 span{color:#00ff88}
.card p{font-size:11px;letter-spacing:5px;opacity:.4;margin:6px 0 24px}
.card input{width:100%;padding:15px;border-radius:12px;border:1px solid rgba(255,255,255,.1);background:#000;color:#fff;text-align:center;outline:none}
.card input:focus{border-color:#00ff88}
.btn{width:100%;margin-top:14px;padding:15px;border-radius:12px;border:none;background:#00ff88;color:#00210f;font-weight:800;cursor:pointer}
#app{display:none;position:relative;z-index:2;height:100vh;flex-direction:column}
header{height:60px;background:rgba(10,20,13,.95);border-bottom:1px solid rgba(0,255,136,.1);display:flex;align-items:center;justify-content:space-between;padding:0 18px}
header b{color:#00ff88}
#main{flex:1;display:flex;overflow:hidden}
#side{width:300px;background:rgba(8,14,10,.95);border-right:1px solid rgba(0,255,136,.08);display:flex;flex-direction:column}
#sideTop{padding:10px;display:flex;gap:6px}
#sideTop input{flex:1;padding:10px;border-radius:10px;border:1px solid rgba(255,255,255,.08);background:#000;color:#fff}
#sideTop button{width:36px;border-radius:10px;border:none;background:#00ff88;font-weight:800}
#list{flex:1;overflow:auto}
.item{padding:12px;border-bottom:1px solid rgba(255,255,255,.03);cursor:pointer;display:flex;gap:10px;align-items:center}
.item.active{background:rgba(0,255,136,.1);border-left:3px solid #00ff88}
.av{width:34px;height:34px;border-radius:50%;background:#122219;display:grid;place-items:center;color:#00ff88;font-weight:800;font-size:12px}
#chat{flex:1;display:flex;flex-direction:column}
#msgs{flex:1;overflow:auto;padding:16px;display:flex;flex-direction:column;gap:8px}
.m{max-width:70%;padding:10px 14px;border-radius:16px;font-size:14px}
.me{align-self:flex-end;background:#00ff88;color:#00210f;border-bottom-right-radius:4px}
.other{align-self:flex-start;background:#1d2b20}
#bar{padding:10px;display:flex;gap:6px;background:rgba(10,20,13,.95);border-top:1px solid rgba(0,255,136,.08)}
#bar input{flex:1;padding:12px 16px;border-radius:22px;border:1px solid rgba(255,255,255,.08);background:#000;color:#fff}
#bar button{padding:0 16px;border-radius:22px;border:none;background:#00ff88;font-weight:800;cursor:pointer}
</style>
</head>
<body>
<div class="bg"></div>
<div id="login">
<div class="card">
<div class="icon">🔒</div>
<h1>VOBIXCHAT <span>TODO EN UNO</span></h1>
<p>SEGURO • RAPIDO • PRIVADO</p>
<input id="ident" placeholder="Tu identificador">
<button class="btn" onclick="entrar()">ENTRAR</button>
</div>
</div>
<div id="app">
<header><b>🔒 VOBIXCHAT TODO EN UNO</b><span id="yo"></span></header>
<div id="main">
<div id="side"><div id="sideTop"><input id="newId" placeholder="Añadir usuario"><button onclick="addChat()">+</button></div><div id="list"></div></div>
<div id="chat"><div id="msgs"></div><div id="bar"><input id="txt" placeholder="Mensaje..."><button onclick="enviar()">➤</button><button onclick="remote()" style="background:#111;color:#00ff88;border:1px solid #00ff88">REMOTE</button></div></div>
</div>
</div>
<script>
let socket,miId,chatActual=null,chats={},remotes={};
function entrar(){
miId=document.getElementById('ident').value.trim();if(!miId)return alert('Pon identificador');
socket=io();socket.on('connect',()=>{
socket.emit('registrar-canal-llamada',{identificador_usuario:miId});
document.getElementById('login').style.display='none';
document.getElementById('app').style.display='flex';
document.getElementById('yo').innerText=miId;
});
socket.on('mensaje-privado-recibido',d=>{
if(!chats[d.de]) crearChat(d.de);
chats[d.de].push({de:d.de,txt:d.mensaje});if(chatActual==d.de) pintar();
});
socket.on('solicitud-remote-recibida',d=>{if(confirm('REMOTE de '+d.de+'?')){remotes[d.id]=d.de;crearChat('remote-'+d.id,true);alert('Remote '+d.id+' aceptado')}});
socket.on('senal-remote-recibida',d=>{console.log('señal',d)});
}
function addChat(){let id=document.getElementById('newId').value.trim();if(!id)return;crearChat(id);document.getElementById('newId').value='';}
function crearChat(id,esRemote=false){
if(chats[id]){cambiarChat(id);return;}
chats[id]=[];let div=document.createElement('div');div.className='item';div.id='chat-'+id;div.innerHTML=`<div class="av">${id[0].toUpperCase()}</div><span>${id}</span>`;
div.onclick=()=>cambiarChat(id);document.getElementById('list').appendChild(div);cambiarChat(id);
}
function cambiarChat(id){chatActual=id;document.querySelectorAll('.item').forEach(e=>e.classList.remove('active'));let el=document.getElementById('chat-'+id);if(el)el.classList.add('active');pintar();}
function pintar(){let c=document.getElementById('msgs');c.innerHTML='';(chats[chatActual]||[]).forEach(m=>{let d=document.createElement('div');d.className='m '+(m.de==miId?'me':'other');d.innerText=m.txt;c.appendChild(d)});c.scrollTop=c.scrollHeight;}
function enviar(){let t=document.getElementById('txt');let msg=t.value.trim();if(!msg||!chatActual)return;
chats[chatActual].push({de:miId,txt:msg});pintar();t.value='';
if(chatActual.startsWith('remote-')){let rid=chatActual.replace('remote-','');socket.emit('senal-remote',{dest:rid,id:rid,senal:msg});}
else socket.emit('mensaje-privado',{para:chatActual,de:miId,mensaje:msg});
}
function remote(){let id=prompt('ID del otro usuario para REMOTE:');if(!id)return;socket.emit('solicitar-remote',{id:id,de:miId});alert('Solicitud enviada a '+id);}
document.getElementById('txt')?.addEventListener('keydown',e=>{if(e.key=='Enter')enviar()});
</script>
</body>
</html>
