<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>VOBIXCHAT // Quantum Mobile Pro</title>
    
    <!-- ENLACE DE FUENTES SEGURO: Carga inmediata sin bloqueos de red -->
    <link href="https://googleapis.com" rel="stylesheet">
    
    <!-- LIBRERÍA DE RED NATIVA DESDE EL SERVIDOR -->
    <script src="/socket.io/socket.io.js"></script>
    
    <style>
        :root, body.theme-violet {
            --bg-quantum: #090212; --panel-hud: rgba(14, 5, 26, 0.98); --neon-blue: #00f0ff; --neon-violet: #bd00ff; --neon-green: #00ff66; --neon-amber: #ffaa00; --neon-red: #ff0055; --text-main: #f3e8ff; --text-dim: #9d8ec4; --border-hud: rgba(189, 0, 255, 0.25);
            --bg-pattern: radial-gradient(circle at 50% 50%, rgba(189, 0, 255, 0.08) 0%, rgba(9, 2, 18, 0.95) 100%), repeating-linear-gradient(0deg, transparent, transparent 40px, rgba(189, 0, 255, 0.02) 40px, rgba(189, 0, 255, 0.02) 41px);
        }
        body.theme-blue {
            --bg-quantum: #010814; --panel-hud: rgba(4, 15, 33, 0.98); --neon-blue: #00f0ff; --neon-violet: #0066ff; --neon-green: #00ffcc; --neon-amber: #ffaa00; --neon-red: #ff0055; --text-main: #e8f4fc; --text-dim: #7aa2c2; --border-hud: rgba(0, 240, 255, 0.3);
            --bg-pattern: radial-gradient(circle at 50% 50%, rgba(0, 240, 255, 0.1) 0%, rgba(1, 8, 20, 0.95) 100%), linear-gradient(90deg, rgba(0,240,255,0.03) 1px, transparent 1px), linear-gradient(0deg, rgba(0,240,255,0.03) 1px, transparent 1px);
        }
        body.theme-matrix {
            --bg-quantum: #020a05; --panel-hud: rgba(4, 20, 10, 0.98); --neon-blue: #00ff66; --neon-violet: #00ccff; --neon-green: #00ff33; --neon-amber: #ccff00; --neon-red: #ff0033; --text-main: #e8fcf0; --text-dim: #7ac295; --border-hud: rgba(0, 255, 102, 0.3);
            --bg-pattern: radial-gradient(circle at 50% 50%, rgba(0, 255, 102, 0.1) 0%, rgba(2, 10, 5, 0.95) 100%), repeating-linear-gradient(45deg, rgba(0,255,102,0.02) 0, rgba(0,255,102,0.02) 2px, transparent 0, transparent 10px);
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        html, body { background-color: var(--bg-quantum); background-image: var(--bg-pattern); font-family: 'Rajdhani', sans-serif; color: var(--text-main); width: 100%; height: 100%; height: 100dvh; display: flex; justify-content: center; align-items: center; overflow: hidden; position: fixed; top: 0; left: 0; overscroll-behavior-y: none; }
        
        .app-container { width: 100%; height: 100%; height: 100dvh; max-width: 1400px; background: var(--panel-hud); display: flex; flex-direction: column; overflow: hidden; position: relative; border: 1px solid var(--border-hud); box-shadow: 0 0 35px rgba(0,0,0,0.9); backdrop-filter: blur(15px); }
        .auth-overlay, .confirm-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(4, 2, 8, 0.96); backdrop-filter: blur(25px); display: flex; justify-content: center; align-items: center; z-index: 2000; padding: 15px; }
        .confirm-overlay { display: none; z-index: 1800; background: rgba(5,2,12,0.85); }
        
        .auth-card, .confirm-card { width: 100%; max-width: 380px; background: var(--panel-hud); border: 1px solid var(--border-hud); border-radius: 14px; padding: 22px; display: flex; flex-direction: column; gap: 12px; box-shadow: 0 0 25px rgba(0,0,0,0.8); }
        .confirm-card { border-color: var(--neon-amber); text-align: center; gap: 15px; }
        .confirm-card h3 { font-family: 'Orbitron'; color: var(--neon-amber); }
        .auth-card h2 { font-family: 'Orbitron', sans-serif; color: var(--neon-blue); font-size: 1.1rem; text-align: center; }
        .auth-card p, .confirm-card p { font-family: 'Share Tech Mono', monospace; font-size: 0.8rem; color: var(--text-dim); text-align: center; }
        
        .auth-input { background: #000; border: 1px solid var(--border-hud); color: #fff; padding: 12px; font-family: 'Share Tech Mono'; border-radius: 6px; outline: none; font-size: 1rem; width: 100%; }
        .auth-btn { background: var(--neon-blue); color: #000; border: none; padding: 12px; font-family: 'Orbitron'; font-weight: bold; border-radius: 6px; cursor: pointer; font-size: 0.95rem; text-align: center; transition: 0.2s; }
        .auth-btn:hover { filter: brightness(1.2); }
        
        .phone-group { display: flex; gap: 6px; align-items: center; width: 100%; }
        .detected-country-badge { background: rgba(0, 240, 255, 0.08); border: 1px solid var(--neon-blue); color: var(--neon-blue); padding: 12px 10px; font-family: 'Share Tech Mono'; font-size: 0.85rem; border-radius: 6px; text-align: center; white-space: nowrap; }
        .big-pin-display { font-family: 'Orbitron', sans-serif; font-size: 2.2rem; color: var(--neon-green); text-align: center; letter-spacing: 4px; background: rgba(0,255,102,0.05); border: 1px dashed var(--neon-green); padding: 12px; border-radius: 8px; margin: 10px 0; display: none; }
        
        .main-header-bar { padding: 4px 8px; background: rgba(2, 4, 10, 0.95); border-bottom: 1px solid var(--border-hud); display: flex; justify-content: space-between; align-items: center; flex-shrink: 0; z-index: 100; height: 50px; }
        .header-profile-section { display: flex; align-items: center; gap: 6px; flex: 1; min-width: 0; }
        .profile-avatar-container { width: 32px; height: 32px; border-radius: 50%; border: 1px solid var(--neon-blue); background: linear-gradient(135deg, var(--neon-blue), var(--neon-violet)); display: flex; align-items: center; justify-content: center; font-family: 'Orbitron'; font-weight: bold; color: #000; font-size: 0.75rem; flex-shrink: 0; }
        .header-info-group { display: flex; flex-direction: column; min-width: 0; }
        .header-username-display { font-family: 'Orbitron', sans-serif; font-size: 0.7rem; font-weight: bold; }
        .header-user-status { font-size: 0.45rem; color: var(--neon-green); font-family: 'Share Tech Mono'; }
        
        .header-right-group { display: flex; gap: 6px; align-items: center; flex-shrink: 0; }
        .whatsapp-icon-btn, .shield-quantum-btn { background: rgba(0, 240, 255, 0.08); border: 1px solid var(--neon-blue); color: var(--neon-blue); border-radius: 50%; width: 26px; height: 26px; display: flex; align-items: center; justify-content: center; cursor: pointer; font-size: 0.65rem; }
        .logout-action-btn { background: var(--neon-red); color: #fff; border: none; padding: 4px 6px; border-radius: 4px; font-family: 'Share Tech Mono'; font-size: 0.7rem; cursor: pointer; }
        .call-icon-btn { background: rgba(0, 255, 102, 0.1); border: 1px solid var(--neon-green); color: var(--neon-green); border-radius: 50%; width: 32px; height: 32px; display: flex; align-items: center; justify-content: center; cursor: pointer; font-size: 0.8rem; }
        
        .video-call-overlay { position: absolute; top:0; left:0; width:100%; height:100%; background: rgba(5, 2, 10, 0.98); z-index: 1500; display: none; flex-direction: column; justify-content: space-between; padding: 20px; box-sizing: border-box; padding-bottom: calc(20px + env(safe-area-inset-bottom)); }
        .video-grid { display: flex; flex-direction: column; gap: 15px; width: 100%; height: 75%; }
        video { width: 100%; height: 48%; object-fit: cover; border: 1px solid var(--border-hud); border-radius: 12px; background: #000; }
        #local-video { border-color: var(--neon-violet); } #remote-video { border-color: var(--neon-blue); }
        
        .voice-only-status { display: none; flex-direction: column; align-items: center; justify-content: center; flex: 1; font-family: 'Orbitron'; color: var(--neon-green); gap: 10px; }
        .voice-avatar { width: 90px; height: 90px; border-radius: 50%; border: 2px dashed var(--neon-green); display: flex; align-items: center; justify-content: center; font-size: 2rem; animation: pulse 2s infinite linear; }
        @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.05); } 100% { transform: scale(1); } }
        
        .chat-area { flex: 1; display: flex; flex-direction: column; background: rgba(0,0,0,0.2); overflow-y: auto; padding: 15px; }
        .chat-input-area { padding: 10px; background: rgba(2, 4, 10, 0.95); border-top: 1px solid var(--border-hud); display: flex; gap: 8px; align-items: center; padding-bottom: calc(10px + env(safe-area-inset-bottom)); }
        .quantum-input { flex: 1; background: #000; border: 1px solid var(--border-hud); padding: 10px; color: #fff; border-radius: 6px; outline: none; font-family: 'Share Tech Mono'; }
    </style>
</head>
<body>
    <div class="app-container">
        <!-- FORMULARIO DE REGISTRO AVANZADO -->
        <div class="auth-overlay" id="auth-layer">
            <div class="auth-card">
                <h2>VOBIXCHAT // Quantum Mobile Pro</h2>
                <p id="device-detect-label" style="color: var(--neon-blue); font-weight: bold; letter-spacing: 1px;"></p>
                
                <input type="text" id="username-in" class="auth-input" placeholder="Nombre de Usuario Agente..." autocomplete="off">
                
                <div class="phone-group">
                    <span class="detected-country-badge" id="country-badge">...</span>
                    <input type="tel" id="phone-in" class="auth-input" placeholder="Número de Teléfono Móvil..." autocomplete="off">
                </div>
                
                <button class="auth-btn" style="background: var(--neon-amber);" id="btn-pin-generator">GENERAR PIN CUÁNTICO</button>
                <div class="big-pin-display" id="pin-display">0000</div>
