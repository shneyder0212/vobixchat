<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>VOBIXCHAT // Quantum Mobile Pro</title>
    <link href="https://googleapis.com" rel="stylesheet">
    <script src="/socket.io/socket.io.js"></script>
    <style>
        :root {
            --bg-quantum: #04010a; 
            --panel-hud: rgba(10, 3, 20, 0.99); 
            --neon-blue: #00f0ff; 
            --neon-violet: #bd00ff; 
            --neon-green: #00ff66; 
            --neon-amber: #ffaa00; 
            --neon-red: #ff0055; 
            --text-main: #f3e8ff; 
            --text-dim: #8b7aa6; 
            --border-hud: rgba(189, 0, 255, 0.35);
            --bg-pattern: radial-gradient(circle at 50% 50%, rgba(189, 0, 255, 0.05) 0%, rgba(4, 1, 10, 0.98) 100%), repeating-linear-gradient(0deg, transparent, transparent 40px, rgba(189, 0, 255, 0.02) 40px, rgba(189, 0, 255, 0.02) 41px);
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        html, body { background-color: var(--bg-quantum); background-image: var(--bg-pattern); font-family: 'Rajdhani', sans-serif; color: var(--text-main); width: 100%; height: 100%; height: 100dvh; display: flex; justify-content: center; align-items: center; overflow: hidden; position: fixed; top: 0; left: 0; overscroll-behavior-y: none; }
        .app-container { width: 100%; height: 100%; height: 100dvh; max-width: 1400px; background: var(--panel-hud); display: flex; flex-direction: column; overflow: hidden; position: relative; border: 1px solid var(--border-hud); box-shadow: 0 0 50px rgba(0,0,0,0.95); backdrop-filter: blur(15px); }
        .auth-overlay, .confirm-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(3, 1, 6, 0.97); backdrop-filter: blur(30px); display: flex; justify-content: center; align-items: center; z-index: 2000; padding: 15px; }
        .confirm-overlay { display: none; z-index: 1800; background: rgba(5,2,12,0.85); }
        .auth-card { width: 100%; max-width: 430px; background: rgba(14, 5, 26, 0.75); border: 2px solid var(--neon-blue); border-radius: 4px; padding: 30px 24px; display: flex; flex-direction: column; gap: 16px; box-shadow: 0 0 40px rgba(0, 240, 255, 0.15); position: relative; overflow: hidden; }
        .laser-scanner { position: absolute; top: 0; left: 0; width: 100%; height: 2px; background: linear-gradient(90deg, transparent, var(--neon-blue), transparent); box-shadow: 0 0 12px var(--neon-blue); animation: scan 3.5s infinite linear; pointer-events: none; }
        @keyframes scan { 0% { top: 0%; } 50% { top: 100%; } 100% { top: 0%; } }
        .confirm-card { width: 100%; max-width: 380px; background: var(--panel-hud); border: 1px solid var(--border-hud); border-radius: 14px; padding: 22px; display: flex; flex-direction: column; gap: 12px; border-color: var(--neon-amber); text-align: center; gap: 15px; }
        .confirm-card h3 { font-family: 'Orbitron'; color: var(--neon-amber); }
        .auth-card h2 { font-family: 'Orbitron', sans-serif; color: #fff; font-size: 1.3rem; text-align: center; letter-spacing: 2px; font-weight: 900; text-shadow: 0 0 10px var(--neon-blue); }
        .auth-card p, .confirm-card p { font-family: 'Share Tech Mono', monospace; font-size: 0.8rem; color: var(--text-dim); text-align: center; }
        .field-container { display: flex; flex-direction: column; gap: 6px; }
        .field-label { font-family: 'Orbitron'; font-size: 0.65rem; color: var(--neon-blue); letter-spacing: 1px; text-transform: uppercase; margin-bottom: 2px; }
        .auth-input { background: rgba(0,0,0,0.6); border: 1px solid var(--border-hud); color: #fff; padding: 14px; font-family: 'Share Tech Mono'; border-radius: 4px; outline: none; font-size: 1rem; width: 100%; }
        .auth-input:focus { border-color: var(--neon-blue); box-shadow: 0 0 10px rgba(0, 240, 255, 0.2); }
        .auth-btn { background: transparent; border: 1px solid var(--neon-blue); color: var(--neon-blue); padding: 14px; font-family: 'Orbitron'; font-weight: bold; border-radius: 4px; cursor: pointer; font-size: 0.95rem; text-align: center; letter-spacing: 1px; transition: 0.2s; }
        .auth-btn:hover { background: var(--neon-blue); color: #000; box-shadow: 0 0 15px var(--neon-blue); }
        .phone-group { display: flex; gap: 8px; align-items: center; width: 100%; }
        .detected-country-select { background: rgba(0,0,0,0.6); border: 1px solid var(--border-hud); color: var(--neon-blue); padding: 14px 10px; font-family: 'Share Tech Mono'; font-size: 0.95rem; border-radius: 4px; outline: none; cursor: pointer; min-width: 95px; }
        .phone-input-style { flex: 1; background: rgba(0,0,0,0.6); border: 1px solid var(--border-hud); color: #fff; padding: 14px; font-family: 'Share Tech Mono'; border-radius: 4px; outline: none; font-size: 1rem; width: 100%; }
        .big-pin-display { font-family: 'Orbitron', sans-serif; font-size: 2.4rem; color: var(--neon-green); text-align: center; letter-spacing: 6px; background: rgba(0,255,102,0.03); border: 1px dashed var(--neon-green); padding: 16px; border-radius: 4px; margin: 5px 0; display: none; text-shadow: 0 0 12px var(--neon-green); position: relative; }
        .big-pin-display::before { content: 'CIFRADO ENCRIPTADO AES-256'; position: absolute; bottom: 2px; left: 50%; transform: translateX(-50%); font-family: 'Share Tech Mono'; font-size: 0.45rem; color: rgba(0,255,102,0.5); letter-spacing: 1px; }
        .hud-logger { width: 100%; background: rgba(0,0,0,0.4); border: 1px solid rgba(0, 240, 255, 0.1); padding: 6px; font-family: 'Share Tech Mono'; font-size: 0.6rem; color: var(--text-dim); display: flex; flex-direction: column; gap: 2px; max-height: 40px; overflow-y: auto; }
        .main-header-bar { padding: 4px 8px; background: rgba(2, 4, 10, 0.95); border-bottom: 1px solid var(--border-hud); display: flex; justify-content: space-between; align-items: center; flex-shrink: 0; z-index: 100; height: 50px; }
        .header-profile-section { display: flex; align-items: center; gap: 6px; flex: 1; min-width: 0; }
        .profile-avatar-container { width: 32px; height: 32px; border-radius: 50%; border: 1px solid var(--neon-blue); background: linear-gradient(135deg, var(--neon-blue), var(--neon-violet)); display: flex; align-items: center; justify-content: center; font-family: 'Orbitron'; font-weight: bold; color: #000; font-size: 0.75rem; flex-shrink: 0; }
        .header-info-group { display: flex; flex-direction: column; min-width: 0; }
        .header-username-display { font-family: 'Orbitron', sans-serif; font-size: 0.7rem; font-weight: bold; }
        .header-user-status { font-size: 0.45rem; color: var(--neon-green); font-family: 'Share Tech Mono'; }
        .header-right-group { display: flex; gap: 6px; align-items: center; flex-shrink: 0; }
        .whatsapp-icon-btn, .shield-quantum-btn { background: rgba(0, 240, 255, 0.08); border: 1px solid var(--neon-blue); color: var(--neon-blue); border-radius: 50%; width: 26px; height: 26px; display: flex; align-items: center; justify-content: center; cursor: pointer; font-size: 0.65rem; }
        .logout-action-btn { background: var(--neon-red); color: #fff; border: none; padding: 4px 6px; border-radius: 4px; font-family: 'Share Tech Mono'; font-size: 0.7rem; cursor: pointer; }
        .call-icon-btn { background: rgba(0, 255, 102, 0.1); border: 1px solid var(--neon-green); color: var(--neon-green); border-radius: 50%; width: 32px; height: 32px; display: flex; align-items: center; justify-content: center; cursor: pointer; font-size: 0.8rem; }
        .video-call-overlay { position: absolute; top:0; left:0; width:100%; height:100%; background: rgba(5, 2, 10, 0.98); z-index: 1500; display: none; flex-direction: column; justify-content: space-between; padding: 20px; box-sizing: border-box; padding-bottom: calc(20px + env(safe-area-inset-bottom)); }
        .video-grid { display: flex; flex-direction: column; gap: 15px; width: 100%; height: 75%; }
        video { width: 100%; height: 48%; object-fit: cover; border: 1px solid var(--border-hud); border-radius: 12px; background: #000; }
        #local-video { border-color: var(--neon-violet); } #remote-video { border-color: var(--neon-blue); }
        .voice-only-status { display: none; flex-direction: column; align-items: center; justify-content: center; flex: 1; font-family: 'Orbitron'; color: var(--neon-green); gap: 10px; }
        .voice-avatar { width: 90px; height: 90px; border-radius: 50%; border: 2px dashed var(--neon-green); display: flex; align-items: center; justify-content: center; font-size: 2rem; animation: pulse 2s infinite linear; }
        @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.05); } 100% { transform: scale(1); } }
        .chat-area { flex: 1; display: flex; flex-direction: column; background: rgba(0,0,0,0.2); overflow-y: auto; padding: 15px; }
        .chat-input-area { padding: 10px; background: rgba(2, 4, 10, 0.95); border-top: 1px solid var(--border-hud); display: flex; gap: 8px; align-items: center; padding-bottom: calc(10px + env(safe-area-inset-bottom)); }
        .quantum-input { flex: 1; background: #000; border: 1px solid var(--border-hud); padding: 10px; color: #fff; border-radius: 6px; outline: none; font-family: 'Share Tech Mono'; }
    </style>
</head>
<body>
    <div class="app-container">
        <!-- VENTANA CENTRAL DE CONTROL DE REGISTRO E IDENTIDAD -->
        <div class="auth-overlay" id="auth-layer">
            <div class="auth-card">
                <div class="laser-scanner"></div>
                <h2>VOBIXCHAT // MAIN TERMINAL</h2>
                <p id="device-detect-label" style="color: var(--neon-blue); font-weight: bold; font-size: 0.75rem; letter-spacing: 1px;"></p>
                
                <div class="field-container">
                    <span class="field-label">Identidad Agente:</span>
                    <input type="text" id="username-in" class="auth-input" placeholder="Nombre de Código..." autocomplete="off">
                </div>
                
                <div class="field-container">
                    <span class="field-label">Línea de Enlace Móvil:</span>
                    <div class="phone-group">
                        <select class="detected-country-select" id="country-badge">
                            <option value="+1">US +1</option>
                            <option value="+34">ES +34</option>
                            <option value="+52">MX +52</option>
                            <option value="+54">AR +54</option>
                            <option value="+57">CO +57</option>
                            <option value="+58">VE +58</option>
                            <option value="+51">PE +51</option>
                            <option value="+1">DO +1</option>
                        </select>
                        <input type="tel" id="phone-in" class="phone-input-style" placeholder="Frecuencia Telefónica..." autocomplete="off">
                    </div>
                </div>
                
                <button class="auth-btn" style="border-color: var(--neon-amber); color: var(--neon-amber);" id="btn-pin-generator">ENLAZAR Y GENERAR PIN</button>
                <div class="big-pin-display" id="pin-display">0000</div>
                <button class="auth-btn" id="btn-login-trigger" style="display:none; border-color: var(--neon-green); color: var(--neon-green);">INICIALIZAR INTERFAZ HUD</button>

                <div class="hud-logger" id="system-logger">
                    <div>[SYS]: CANAL CUÁNTICO INICIALIZADO...</div>
                    <div id="log-dynamic">[SYS]: ESPERANDO CREDENCIALES DE AGENTE...</div>
                </div>
            </div>
        </div>
        <!-- CAPA INTERMEDIA DE BLOQUEO ANTI ACCIDENTES -->
        <div class="confirm-overlay" id="confirm-layer">
            <div class="confirm-card">
                <h3 id="confirm-title">CONFIRMAR ENLACE</h3>
                <p id="confirm-msg">¿Desea inicializar este enlace seguro?</p>
                <div style="display:flex; gap:10px;">
                    <button class="auth-btn" style="border-color:var(--neon-green); color:var(--neon-green); flex:1;" id="confirm-yes-btn">SÍ, ENLAZAR</button>
                    <button class="auth-btn" style="border-color:var(--neon-red); color:var(--neon-red); flex:1;" id="btn-abort-trigger">ABORTAR</button>
                </div>
            </div>
        </div>

        <!-- BARRA SUPERIOR DE HERRAMIENTAS ORIGINALES PROTEGIDAS -->
        <header class="main-header-bar">
            <div class="header-profile-section">
                <div class="profile-avatar-container" id="avatar-char">VX</div>
                <div class="header-info-group">
                    <span class="header-username-display" id="user-display">Invitado</span>
                    <span class="header-user-status">● ONLINE</span>
                </div>
            </div>
            <div class="header-right-group">
                <!-- ACCESOS INTEGRALES MULTIMEDIA ESTILO WHATSAPP -->
                <button class="call-icon-btn" id="btn-voice-trigger">🎙️</button>
                <button class="call-icon-btn" id="btn-video-trigger">📹</button>
                
                <!-- TUS BOTONES ORIGINALES INTACTOS -->
                <button class="whatsapp-icon-btn">💬</button>
                <button class="shield-quantum-btn">🛡️</button>
                <button class="logout-action-btn">LOGOUT</button>
            </div>
        </header>
        <!-- ÁREA CENTRAL DE COMUNICACIÓN DE TEXTO -->
        <div class="chat-area" id="chat-box"></div>
        <div class="chat-input-area">
            <input type="text" id="chat-input" class="quantum-input" placeholder="Escribir mensaje cifrado...">
            <button class="auth-btn" style="padding: 10px 15px;" id="btn-send-trigger">ENVIAR</button>
        </div>

        <!-- PANTALLA FLOTANTE DE VIDEO / AUDIO DE ALTA FIDELIDAD -->
        <div class="video-call-overlay" id="video-call-hud">
            <div class="video-grid" id="container-video-elements">
                <video id="remote-video" autoplay playsinline></video>
                <video id="local-video" autoplay playsinline muted></video>
            </div>
            <div class="voice-only-status" id="container-voice-elements">
                <div class="voice-avatar">🎙️</div>
                <div id="voice-call-label">TRANSMISIÓN DE VOZ ACTIVA...</div>
            </div>
            <div class="call-controls" style="display:flex; gap:10px; width:100%;">
                <button id="btn-toggle-mic" class="auth-btn" style="border-color:var(--neon-amber); color:var(--neon-amber); flex:1;">MUTEAR CANAL</button>
                <button id="btn-hangup" class="auth-btn" style="border-color:var(--neon-red); color:var(--neon-red); flex:1;">CERRAR ENLACE</button>
            </div>
        </div>
    </div> <!-- Cierre de .app-container -->
    <script>
        let socket=null;try{if(typeof io!=="undefined"){socket=io();}}catch(e){console.error(e);}
        let localStream=null,peerConnection=null,isMuted=false,currentCallMode='video',pendingCallMode=null;
        
        // CORRECCIÓN CRÍTICA DE SINTAXIS STUN SERVERS DE GOOGLE
        const iceConfiguration={iceServers:[
            {urls:'stun:://google.com'},
            {urls:'stun:://google.com'}
        ]};
        
        document.addEventListener("DOMContentLoaded",()=>{
            const isMobile=/Android|iPhone|iPad|iPod/i.test(navigator.userAgent);
            document.getElementById('device-detect-label').innerText=isMobile?"[SISTEMA]: ACCESO MÓVIL DETECTADO":"[SISTEMA]: ACCESO PC DETECTADO";
            document.getElementById('btn-pin-generator').addEventListener('click',generateQuantumPIN);
            document.getElementById('btn-login-trigger').addEventListener('click',loginQuantum);
            document.getElementById('btn-send-trigger').addEventListener('click',sendText);
            document.getElementById('btn-abort-trigger').addEventListener('click',cancelAccidentalCall);
            document.getElementById('btn-toggle-mic').addEventListener('click',toggleMute);
            document.getElementById('btn-hangup').addEventListener('click',endCall);
            document.getElementById('btn-voice-trigger').addEventListener('click',()=>triggerCallConfirmation('voice'));
            document.getElementById('btn-video-trigger').addEventListener('click',()=>triggerCallConfirmation('video'));
            document.getElementById('chat-input').addEventListener('keydown',(e)=>{if(e.key==='Enter')sendText();});
        });
        // REEMPLAZO DE ALERT POR LOGS INTEGRADOS EN TERMINAL HUD
        function printHudLog(text, isError=false) {
            const logger = document.getElementById('system-logger');
            const logLine = document.createElement('div');
            logLine.innerText = `[SYS]: ${text}`;
            if(isError) logLine.style.color = "var(--neon-red)";
            else logLine.style.color = "var(--neon-green)";
            logger.appendChild(logLine);
            logger.scrollTop = logger.scrollHeight;
        }

        function generateQuantumPIN(){
            const name=document.getElementById('username-in').value.trim();
            const phone=document.getElementById('phone-in').value.trim();
            if(!name||!phone) {
                printHudLog("ERROR: Faltan ingresar credenciales de Agente.", true);
                return;
            }
            
            const pin=Math.floor(1000+Math.random()*9000);
            const display=document.getElementById('pin-display');
            display.innerText=pin;
            display.style.display='block';
            
            document.getElementById('log-dynamic').innerText="[SYS]: PIN GENERADO. ACCESO AUTORIZADO.";
            document.getElementById('log-dynamic').style.color="var(--neon-green)";
            
            document.getElementById('btn-pin-generator').style.display='none';
            document.getElementById('btn-login-trigger').style.display='block';
        }
        
        function loginQuantum(){
            const name=document.getElementById('username-in').value.trim();
            document.getElementById('user-display').innerText=name.toUpperCase();
            document.getElementById('avatar-char').innerText=name.substring(0,2).toUpperCase();
            document.getElementById('auth-layer').style.display='none';
        }
        function sendText(){
            const input=document.getElementById('chat-input');if(!input.value.trim())return;
            const chatBox=document.getElementById('chat-box'),p=document.createElement('p');
            p.style.margin="5px 0";p.style.fontFamily="'Share Tech Mono'";
            p.innerHTML=`<b style="color:var(--neon-blue)">Tú:</b> ${input.value}`;
            chatBox.appendChild(p);input.value="";chatBox.scrollTop=chatBox.scrollHeight;
        }
        
        function triggerCallConfirmation(mode){
            pendingCallMode=mode;const title=document.getElementById('confirm-title'),msg=document.getElementById('confirm-msg');
            if(mode==='voice'){title.innerText="LLAMADA DE VOZ";msg.innerText="¿Iniciar transmisión de audio HD?";}
            else{title.innerText="VIDEOLLAMADA";msg.innerText="¿Abrir canales de video y audio HD?";}
            document.getElementById('confirm-layer').style.display='flex';
            document.getElementById('confirm-yes-btn').onclick=function(){document.getElementById('confirm-layer').style.display='none';initiateCall(pendingCallMode);};
        }
        
        function cancelAccidentalCall(){document.getElementById('confirm-layer').style.display='none';pendingCallMode=null;}
        
        function setupCallUI(mode) {
            currentCallMode=mode;document.getElementById('video-call-hud').style.display='flex';
            if(mode==='voice'){document.getElementById('container-video-elements').style.display='none';document.getElementById('container-voice-elements').style.display='flex';}
            else{document.getElementById('container-video-elements').style.flex='1';document.getElementById('container-video-elements').style.display='flex';document.getElementById('container-voice-elements').style.display='none';}
        }
        async function initiateCall(mode) {
            try{
                setupCallUI(mode);
                // CONFIGURACIÓN DE FILTROS ESTRICTOS DE AUDIO ESTUDIO (SIN ECO / SIN RUIDO / SIN INTERFERENCIAS)
                localStream=await navigator.mediaDevices.getUserMedia({
                    audio:{
                        echoCancellation: true,
                        noiseSuppression: true,
                        autoGainControl: false, // Desactivado para evitar la amplificación del siseo/ruido de fondo en silencios
                        sampleRate: 48000,      // Frecuencia máxima de audio HD nativa
                        channelCount: 1,
                        googEchoCancellation: true,
                        googNoiseSuppression: true,
                        googAutoGainControl: false
                    },
                    video:mode==='video'?{
                        facingMode:"user",
                        width: { ideal: 1280 },
                        height: { ideal: 720 },
                        frameRate: { ideal: 30 } // Tasa constante para evitar interferencias y tirones por ancho de banda
                    }:false
                });
                
                if(mode==='video'){document.getElementById('local-video').srcObject=localStream;}
                peerConnection=new RTCPeerConnection(iceConfiguration);
                localStream.getTracks().forEach(track=>peerConnection.addTrack(track,localStream));
                
                // CORRECCIÓN CRÍTICA DE TRAZAS MULTIMEDIA (EXTRACCIÓN DIRECTA DE PISTAS INDIVIDUALES)
                peerConnection.ontrack=(event)=>{
                    const rv=document.getElementById('remote-video');
                    if(rv && !rv.srcObject && event.streams && event.streams[0]){
                        rv.srcObject=event.streams[0]; // Vinculación limpia del stream completo remoto
                    }
                };
                peerConnection.onicecandidate=(event)=>{if(event.candidate&&socket){socket.emit('webrtc-candidate',event.candidate);}};
                const offer=await peerConnection.createOffer();await peerConnection.setLocalDescription(offer);if(socket)socket.emit('webrtc-offer',{offer:offer,mode:mode});
            }catch(err){
                console.error(err);
                executeLocalClose();
                printHudLog("Fallo de hardware: Denegado el acceso a Multimedia.", true);
            }
        }
        if(socket){
            socket.on('webrtc-offer', async(data)=>{
                const incomingMode=data.mode;setupCallUI(incomingMode);
                if(!peerConnection){
                    peerConnection=new RTCPeerConnection(iceConfiguration);
                    peerConnection.ontrack=(event)=>{
                        const rv=document.getElementById('remote-video');
                        if(rv&&!rv.srcObject&&event.streams&&event.streams){rv.srcObject=event.streams;}
                    };
                    peerConnection.onicecandidate=(event)=>{if(event.candidate){socket.emit('webrtc-candidate',event.candidate);}};
                }
                await peerConnection.setRemoteDescription(new RTCSessionDescription(data.offer));
                try{
                    // FILTROS ESTRICTOS DE AUDIO EN RECEPCIÓN (EVITA RETROALIMENTACIÓN DE ECO)
                    localStream=await navigator.mediaDevices.getUserMedia({
                        audio:{
                            echoCancellation: true,
                            noiseSuppression: true,
                            autoGainControl: false,
                            sampleRate: 48000,
                            googEchoCancellation: true,
                            googNoiseSuppression: true,
                            googAutoGainControl: false
                        },
                        video:incomingMode==='video'?{facingMode:"user",width:{ideal:1280},height:{ideal:720},frameRate:{ideal:30}}:false
                    });
                    if(incomingMode==='video'){document.getElementById('local-video').srcObject=localStream;}
                    localStream.getTracks().forEach(track=>peerConnection.addTrack(track,localStream));
                    const answer=await peerConnection.createAnswer();await peerConnection.setLocalDescription(answer);socket.emit('webrtc-answer',answer);
                }catch(err){console.error(err);}
            });
            socket.on('webrtc-answer',async(answer)=>{if(peerConnection&&peerConnection.signalingState!=="stable"){await peerConnection.setRemoteDescription(new RTCSessionDescription(answer));}});
            socket.on('webrtc-candidate',async(candidate)=>{if(peerConnection&&peerConnection.remoteDescription){try{await peerConnection.addIceCandidate(new RTCIceCandidate(candidate));}catch(e){}}});
            socket.on('webrtc-hangup',()=> {executeLocalClose();});
        }
        function toggleMute(){if(localStream){isMuted=!isMuted;localStream.getAudioTracks().forEach(track=>track.enabled=!isMuted);document.getElementById('btn-toggle-mic').innerText=isMuted?"DESMUTEAR CANAL":"MUTEAR CANAL";}}
        function endCall(){if(socket)socket.emit('webrtc-hangup');executeLocalClose();}
        function executeLocalClose(){if(localStream){localStream.getTracks().forEach(track=>track.stop());localStream=null;}if(peerConnection){peerConnection.close();peerConnection=null;}document.getElementById('video-call-hud').style.display='none';document.getElementById('local-video').srcObject=null;document.getElementById('remote-video').srcObject=null;}
    </script>
</body>
</html>
