<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>VOBIXCHAT // Quantum Mobile Pro</title>
    <link href="https://googleapis.com" rel="stylesheet">
    <script src="/socket.io/socket.io.js"></script>
    <style>
        :root, body.theme-violet {
            --bg-quantum: #090212;
            --panel-hud: rgba(14, 5, 26, 0.98);
            --neon-blue: #00f0ff;
            --neon-violet: #bd00ff;
            --neon-green: #00ff66;
            --neon-amber: #ffaa00;
            --neon-red: #ff0055;
            --text-main: #f3e8ff;
            --text-dim: #9d8ec4;
            --border-hud: rgba(189, 0, 255, 0.25);
            --bg-pattern: radial-gradient(circle at 50% 50%, rgba(189, 0, 255, 0.08) 0%, rgba(9, 2, 18, 0.95) 100%), repeating-linear-gradient(0deg, transparent, transparent 40px, rgba(189, 0, 255, 0.02) 40px, rgba(189, 0, 255, 0.02) 41px);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        html, body {
            background-color: var(--bg-quantum);
            background-image: var(--bg-pattern);
            font-family: 'Rajdhani', sans-serif;
            color: var(--text-main);
            width: 100%; height: 100%; height: 100dvh;
            display: flex; justify-content: center; align-items: center;
            overflow: hidden; position: fixed; top: 0; left: 0;
            overscroll-behavior-y: none;
        }

        .app-container {
            width: 100%; height: 100%; height: 100dvh; max-width: 1400px;
            background: var(--panel-hud); display: flex; flex-direction: column;
            overflow: hidden; position: relative; border: 1px solid var(--border-hud);
        }

        /* CAPAS DE OVERLAY GENERALES */
        .auth-overlay, .confirm-overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(4, 2, 8, 0.96); backdrop-filter: blur(25px);
            display: flex; justify-content: center; align-items: center; z-index: 2000; padding: 15px;
        }
        
        .confirm-overlay { display: none; z-index: 1800; background: rgba(5,2,12,0.85); }

        .auth-card, .confirm-card {
            width: 100%; max-width: 380px; background: var(--panel-hud);
            border: 1px solid var(--border-hud); border-radius: 14px; padding: 22px; display: flex; flex-direction: column; gap: 14px;
            box-shadow: 0 0 20px rgba(0,0,0,0.6);
        }

        .confirm-card { border-color: var(--neon-amber); text-align: center; }
        .confirm-card h3 { font-family: 'Orbitron'; color: var(--neon-amber); font-size: 1.1rem; }
        .confirm-card p { font-family: 'Share Tech Mono'; color: var(--text-main); font-size: 0.9rem; }

        .auth-input { background: #000; border: 1px solid var(--border-hud); color: #fff; padding: 12px; font-family: 'Share Tech Mono'; border-radius: 6px; outline: none; width: 100%; }
        .auth-btn { background: var(--neon-blue); color: #000; border: none; padding: 12px; font-family: 'Orbitron'; font-weight: bold; border-radius: 6px; cursor: pointer; text-align: center; }

        .main-header-bar {
            padding: 4px 8px; background: rgba(2, 4, 10, 0.95); border-bottom: 1px solid var(--border-hud);
            display: flex; justify-content: space-between; align-items: center; height: 50px;
        }
        
        .header-profile-section { display: flex; align-items: center; gap: 6px; }
        .profile-avatar-container {
            width: 32px; height: 32px; border-radius: 50%; border: 1px solid var(--neon-blue);
            background: linear-gradient(135deg, var(--neon-blue), var(--neon-violet));
            display: flex; align-items: center; justify-content: center; font-family: 'Orbitron'; font-size: 0.75rem; color: #000;
        }
        .header-username-display { font-family: 'Orbitron'; font-size: 0.7rem; }

        .header-right-group { display: flex; gap: 8px; align-items: center; }
        .call-icon-btn {
            background: rgba(0, 255, 102, 0.1); border: 1px solid var(--neon-green); color: var(--neon-green); 
            border-radius: 50%; width: 32px; height: 32px; display: flex; align-items: center; justify-content: center;
            cursor: pointer; font-size: 0.8rem;
        }

        /* HUD DE LLAMADAS */
        .video-call-overlay {
            position: absolute; top:0; left:0; width:100%; height:100%; 
            background: rgba(5, 2, 10, 0.98); z-index: 1500; 
            display: none; flex-direction: column; justify-content: space-between; 
            padding: 20px; box-sizing: border-box;
            padding-bottom: calc(20px + env(safe-area-inset-bottom));
        }
        
        .voice-only-status {
            display: none; flex-direction: column; align-items: center; justify-content: center;
            flex: 1; font-family: 'Orbitron'; color: var(--neon-green); gap: 10px; text-shadow: 0 0 8px var(--neon-green);
        }
        .voice-avatar {
            width: 90px; height: 90px; border-radius: 50%; border: 2px dashed var(--neon-green);
            display: flex; align-items: center; justify-content: center; font-size: 2rem;
            animation: pulse 2s infinite linear;
        }

        @keyframes pulse {
            0% { transform: scale(1); box-shadow: 0 0 0 0 rgba(0, 255, 102, 0.4); }
            50% { transform: scale(1.05); box-shadow: 0 0 15px 5px rgba(0, 255, 102, 0.2); }
            100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(0, 255, 102, 0); }
        }

        .video-grid { display: flex; flex-direction: column; gap: 15px; width: 100%; height: 75%; }
        video { width: 100%; height: 48%; object-fit: cover; border: 1px solid var(--border-hud); border-radius: 12px; background: #000; }
        #local-video { border-color: var(--neon-violet); }
        #remote-video { border-color: var(--neon-blue); }
        .call-controls { display: flex; justify-content: center; gap: 15px; width: 100%; }

        .chat-area { flex: 1; display: flex; flex-direction: column; background: rgba(0,0,0,0.2); overflow-y: auto; padding: 15px; }
        .chat-input-area {
            padding: 10px; background: rgba(2, 4, 10, 0.95); border-top: 1px solid var(--border-hud);
            display: flex; gap: 8px; align-items: center;
            padding-bottom: calc(10px + env(safe-area-inset-bottom));
        }
        .quantum-input { flex: 1; background: #000; border: 1px solid var(--border-hud); padding: 10px; color: #fff; border-radius: 6px; outline: none; font-family: 'Share Tech Mono'; }
    </style>
</head>
<body>

    <div class="app-container">
        <!-- CAPA DE AUTENTICACIÓN -->
        <div class="auth-overlay" id="auth-layer">
            <div class="auth-card">
                <h2>VOBIXCHAT // ACCESO SECURE</h2>
                <input type="text" id="username-in" class="auth-input" placeholder="Nombre de Agente..." autocomplete="off">
                <button class="auth-btn" onclick="loginQuantum()">INICIALIZAR HUD</button>
            </div>
        </div>

        <!-- MODAL DE CONFIRMACIÓN ANTI-ACCIDENTES -->
        <div class="confirm-overlay" id="confirm-layer">
            <div class="confirm-card">
                <h3 id="confirm-title">CONFIRMAR ACCIÓN</h3>
                <p id="confirm-msg">¿Desea inicializar este enlace?</p>
                <div style="display:flex; gap:10px;">
                    <button class="auth-btn" style="background:var(--neon-green); flex:1;" id="confirm-yes-btn">SÍ, ENLAZAR</button>
                    <button class="auth-btn" style="background:var(--neon-red); color:#fff; flex:1;" onclick="cancelAccidentalCall()">ABORTAR</button>
                </div>
            </div>
        </div>

        <header class="main-header-bar">
            <div class="header-profile-section">
                <div class="profile-avatar-container" id="avatar-char">VX</div>
                <div class="header-info-group"><span class="header-username-display" id="user-display">Invitado</span></div>
            </div>
            <div class="header-right-group">
                <button class="call-icon-btn" onclick="triggerCallConfirmation('voice')">🎙️</button>
                <button class="call-icon-btn" onclick="triggerCallConfirmation('video')">📹</button>
            </div>
        </header>

        <div class="chat-area" id="chat-box"></div>

        <div class="chat-input-area">
            <input type="text" id="chat-input" class="quantum-input" placeholder="Escribir mensaje...">
            <button class="auth-btn" style="padding: 10px 15px;" onclick="sendText()">ENVIAR</button>
        </div>

        <!-- HUD DE PANEL DE LLAMADA -->
        <div class="video-call-overlay" id="video-call-hud">
            <div class="video-grid" id="container-video-elements">
                <video id="remote-video" autoplay playsinline></video>
                <video id="local-video" autoplay playsinline muted></video>
            </div>

            <div class="voice-only-status" id="container-voice-elements">
                <div class="voice-avatar">🎙️</div>
                <div id="voice-call-label">TRANSMISIÓN DE VOZ EN CURSO...</div>
            </div>

            <div class="call-controls">
                <button id="btn-toggle-mic" class="auth-btn" style="background: var(--neon-amber); color: #000; flex: 1;" onclick="toggleMute()">MUTEAR</button>
                <button id="btn-hangup" class="auth-btn" style="background: var(--neon-red); color: #fff; flex: 1;" onclick="endCall()">COLGAR</button>
            </div>
        </div>
    </div>

    <script>
        const socket = io();
        let localStream = null;
