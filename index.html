<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>VOBIXCHAT // Quantum Mobile Pro Final</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Rajdhani:wght@500;600;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
    <style>
        :root, body.theme-violet {
            --bg-quantum: #090212;
            --panel-hud: rgba(14, 5, 26, 0.98);
            --neon-blue: #00f0ff;
            --neon-violet: #bd00ff;
            --neon-green: #00ff66;
            --neon-amber: #ffaa00;
            --neon-red: #ff0055;
            --text-main: #f3e8ff;
            --text-dim: #9d8ec4;
            --border-hud: rgba(189, 0, 255, 0.25);
            --bg-pattern: radial-gradient(circle at 50% 50%, rgba(189, 0, 255, 0.08) 0%, rgba(9, 2, 18, 0.95) 100%), repeating-linear-gradient(0deg, transparent, transparent 40px, rgba(189, 0, 255, 0.02) 40px, rgba(189, 0, 255, 0.02) 41px);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        html, body {
            background-color: var(--bg-quantum);
            background-image: var(--bg-pattern);
            font-family: 'Rajdhani', sans-serif;
            color: var(--text-main);
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: fixed;
            top: 0;
            left: 0;
            overscroll-behavior-y: none;
        }

        .app-container {
            width: 100vw; height: 100vh; max-width: 1400px;
            background: var(--panel-hud); display: flex; flex-direction: column;
            overflow: hidden; position: relative; border: 1px solid var(--border-hud); 
            box-shadow: 0 0 35px rgba(0,0,0,0.9); backdrop-filter: blur(15px);
        }

        .main-header-bar {
            padding: 4px 12px; background: rgba(2, 4, 10, 0.95); border-bottom: 1px solid var(--border-hud);
            display: flex; justify-content: space-between; align-items: center; flex-shrink: 0; height: 55px; z-index: 100;
        }
        
        .header-profile-section { display: flex; align-items: center; gap: 8px; cursor: pointer; }
        .profile-avatar-container {
            width: 34px; height: 34px; border-radius: 50%; border: 1px solid var(--neon-blue);
            background: linear-gradient(135deg, var(--neon-blue), var(--neon-violet));
            display: flex; align-items: center; justify-content: center; font-family: 'Orbitron'; font-weight: bold; color: #000; font-size: 0.8rem;
        }
        
        .header-info-group { display: flex; flex-direction: column; }
        .header-username-display { font-family: 'Orbitron', sans-serif; font-size: 0.75rem; color: var(--text-main); font-weight: bold; }
        .header-user-status { font-size: 0.5rem; color: var(--neon-green); font-family: 'Share Tech Mono'; }

        .header-right-group { display: flex; gap: 8px; align-items: center; }
        .whatsapp-icon-btn {
            background: none; border: none; color: var(--neon-blue); cursor: pointer; font-size: 1.1rem;
            display: flex; align-items: center; justify-content: center; padding: 4px; transition: 0.2s;
        }
        .whatsapp-icon-btn:hover { color: #fff; transform: scale(1.1); }

        .workspace-area { flex: 1; display: flex; flex-direction: column; position: relative; overflow: hidden; background: transparent; height: calc(100vh - 55px); }
        .screen-view { display: flex; flex-direction: column; flex: 1; height: 100%; overflow: hidden; position: relative; }
        
        .messages-display { flex: 1; padding: 15px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; padding-bottom: 80px; }
        .quantum-msg { max-width: 85%; padding: 12px 16px; border-radius: 10px; font-size: 1rem; line-height: 1.4; word-break: break-word; }
        .quantum-msg.incoming { background: rgba(0, 240, 255, 0.05); border-left: 3px solid var(--neon-blue); align-self: flex-start; }
        .quantum-msg.outgoing { background: rgba(189, 0, 255, 0.08); border-right: 3px solid var(--neon-violet); align-self: flex-end; text-align: right; }

        /* Área de escritura fija abajo para abrir el teclado en Samsung sin fallos */
        .chat-input-deck {
            padding: 10px 15px; background: rgba(2, 4, 10, 0.95); border-top: 1px solid var(--border-hud);
            display: flex; gap: 10px; align-items: center; flex-shrink: 0; position: absolute; 
            bottom: 0; left: 0; right: 0; z-index: 100; height: 70px; width: 100%;
        }
        .quantum-input {
            flex: 1; min-width: 0; background: rgba(0, 0, 0, 0.85); border: 1px solid var(--neon-blue); border-radius: 25px;
            padding: 10px 18px; color: var(--text-main); font-family: 'Share Tech Mono', monospace; font-size: 1rem; outline: none;
        }
        .send-action-btn {
            background: var(--neon-blue); color: #000; border: none; padding: 0 22px; height: 46px;
            border-radius: 25px; font-family: 'Orbitron'; font-weight: bold; cursor: pointer; font-size: 0.9rem; flex-shrink: 0;
        }

        /* Pantalla de llamadas estilo WhatsApp */
        .overlay-screen {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background: #0b141a; display: none; flex-direction: column; z-index: 1500; justify-content: space-between; padding: 20px;
        }
        #remoteVideo {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; z-index: 1; background: #000;
        }
        #localVideo {
            position: absolute; top: 20px; right: 20px; width: 110px; height: 160px; object-fit: cover;
            border-radius: 12px; border: 2px solid var(--neon-blue); background: #000; z-index: 10; display: none;
        }
        .voice-call-ui {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle, #1f2c34 0%, #0b141a 100%);
            display: none; flex-direction: column; align-items: center; justify-content: center; z-index: 5; gap: 20px;
        }
        .caller-avatar {
            width: 110px; height: 110px; border-radius: 50%; background: #00f0ff; color: #000;
            display: flex; align-items: center; justify-content: center; font-size: 45px; font-weight: bold;
            box-shadow: 0 0 25px rgba(0,240,255,0.4);
        }
        .call-controls-bar {
            position: relative; z-index: 20; display: flex; justify-content: center; gap: 20px; margin-bottom: 25px;
        }
        .call-action-btn {
            background: rgba(255,255,255,0.2); border: none; color: #fff; padding: 15px 30px;
            border-radius: 30px; font-weight: bold; cursor: pointer; font-size: 15px; backdrop-filter: blur(5px);
        }
        .call-action-btn.danger { background: #ff3b30; }
    </style>
</head>
<body>

    <!-- Pantalla de llamadas estilo WhatsApp -->
    <div class="overlay-screen" id="mediaCallScreen">
        <video id="remoteVideo" autoplay playsinline></video>
        <div class="voice-call-ui" id="voiceCallUI">
            <div class="caller-avatar" id="callAvatarText">W</div>
            <div style="font-size: 24px; font-weight: bold;" id="callContactName">William</div>
            <div style="font-size: 15px; color: #8696a0;" id="callStatusText">Conectando llamada...</div>
        </div>
        <video id="localVideo" autoplay playsinline muted></video>
        <div class="call-controls-bar">
            <button class="call-action-btn" id="toggleMuteAudioBtn" onclick="toggleMuteAudio()">🎤 Silenciar</button>
            <button class="call-action-btn danger" onclick="endMediaCall()">COLGAR ☎</button>
        </div>
    </div>

    <div class="app-container">
        <div class="main-header-bar">
            <div class="header-profile-section">
                <div class="profile-avatar-container" id="profileAvatarInitial">W</div>
                <div class="header-info-group">
                    <div class="header-username-display" id="roomTitleDisplay">WILLIAM</div>
                    <div class="header-user-status">🟢 En línea</div>
                </div>
            </div>

            <div class="header-right-group">
                <button class="whatsapp-icon-btn" onclick="iniciarLlamada('video')" title="Videollamada HD">📹</button>
                <button class="whatsapp-icon-btn" onclick="iniciarLlamada('audio')" title="Llamada de Voz HD">📞</button>
            </div>
        </div>

        <div class="workspace-area">
            <div class="screen-view" id="viewChatSection">
                <div class="messages-display" id="messagesContainer">
                    <div class="quantum-msg incoming">
                        <strong>[SISTEMA]</strong>: Canal seguro abierto con William. Teclado y llamadas listos.
                    </div>
                </div>

                <div class="chat-input-deck" id="chatInputDeckArea">
                    <input type="text" id="messageInput" class="quantum-input" placeholder="Escribe tu mensaje..." autocomplete="off">
                    <button class="send-action-btn" onclick="enviarMensaje()">ENVIAR</button>
                </div>
            </div>
        </div>
    </div>

    <audio id="notificationSound" preload="auto">
        <source src="https://assets.mixkit.co/active_storage/sfx/2869/2869-preview.mp3" type="audio/mpeg">
    </audio>

    <script>
        const socket = io();
        let myUsername = "Shneyder";
        let currentRoom = "SALA_WILLIAM_CHAT";
        let localStream = null;
        let peerConnection = null;
        let isVideoCallActive = true;

        const iceServers = {
            iceServers: [
                { urls: 'stun:stun.l.google.com:19302' },
                { urls: 'stun:stun1.l.google.com:19302' }
            ]
        };

        // --- GESTIÓN DE LLAMADAS ESTILO WHATSAPP ---
        async function iniciarLlamada(tipo) {
            isVideoCallActive = (tipo === 'video');
            document.getElementById('mediaCallScreen').style.display = 'flex';

            if (isVideoCallActive) {
                document.getElementById('voiceCallUI').style.display = 'none';
                document.getElementById('localVideo').style.display = 'block';
                document.getElementById('remoteVideo').style.display = 'block';
            } else {
                document.getElementById('voiceCallUI').style.display = 'flex';
                document.getElementById('localVideo').style.display = 'none';
                document.getElementById('remoteVideo').style.display = 'none';
            }

            try {
                localStream = await navigator.mediaDevices.getUserMedia({
                    audio: { echoCancellation: true, noiseSuppression: true },
                    video: isVideoCallActive ? { width: { ideal: 1280 }, height: { ideal: 720 } } : false
                });

                if (isVideoCallActive) {
                    document.getElementById('localVideo').srcObject = localStream;
                }

                socket.emit('call_user', { room: currentRoom, sender: myUsername, type: tipo });
            } catch(e) {
                alert("Permiso denegado de cámara o micrófono.");
                endMediaCall();
            }
        }

        function createPeerConnection(remoteSocketId) {
            peerConnection = new RTCPeerConnection(iceServers);
            
            localStream.getTracks().forEach(track => {
                peerConnection.addTrack(track, localStream);
            });

            peerConnection.ontrack = event => {
                if (isVideoCallActive) {
                    document.getElementById('remoteVideo').srcObject = event.streams[0];
                }
            };

            peerConnection.onicecandidate = event => {
                if (event.candidate) {
                    socket.emit('ice_candidate', { room: currentRoom, candidate: event.candidate, to: remoteSocketId });
                }
            };
        }

        socket.on('call_incoming', async (data) => {
            if (data.sender === myUsername) return;
            if (confirm(`📞 ¡Llamada entrante de ${data.sender}! ¿Deseas contestar?`)) {
                await window.iniciarLlamada(data.type || 'video');
                createPeerConnection(data.socketId);
                const offer = await peerConnection.createOffer();
                await peerConnection.setLocalDescription(offer);
                socket.emit('call_offer', { room: currentRoom, offer, sender: myUsername });
            }
        });

        socket.on('call_offer', async (data) => {
            createPeerConnection(data.socketId);
            await peerConnection.setRemoteDescription(new RTCSessionDescription(data.offer));
            const answer = await peerConnection.createAnswer();
            await peerConnection.setLocalDescription(answer);
            socket.emit('call_answer', { room: currentRoom, answer, sender: myUsername });
        });

        socket.on('call_answer', async (data) => {
            await peerConnection.setRemoteDescription(new RTCSessionDescription(data.answer));
        });

        socket.on('ice_candidate', async (data) => {
            if (peerConnection) {
                await peerConnection.addIceCandidate(new RTCIceCandidate(data.candidate));
            }
        });

        window.endMediaCall = () => {
            if(localStream) {
                localStream.getTracks().forEach(t => t.stop());
                localStream = null;
            }
            if(peerConnection) {
                peerConnection.close();
                peerConnection = null;
            }
            document.getElementById('localVideo').srcObject = null;
            document.getElementById('remoteVideo').srcObject = null;
            document.getElementById('mediaCallScreen').style.display = 'none';
        };

        window.toggleMuteAudio = () => {
            if(localStream) {
                const audioTrack = localStream.getAudioTracks()[0];
                if(audioTrack) {
                    audioTrack.enabled = !audioTrack.enabled;
                    document.getElementById('toggleMuteAudioBtn').textContent = audioTrack.enabled ? "🎤 Silenciar" : "🔇 Activado";
                }
            }
        };

        // Envío de mensajes optimizado para el teclado de Samsung
        function enviarMensaje() {
            const input = document.getElementById('messageInput');
            let val = input.value.trim();
            if(!val) return;
            
            socket.emit('chat_message', { room: currentRoom, type: 'text', text: val, sender: myUsername });
            input.value = '';
            input.focus();
        }

        document.getElementById('messageInput').addEventListener('keypress', function (e) {
            if (e.key === 'Enter') enviarMensaje();
        });

        socket.on('chat_message', (data) => {
            if (data.sender !== myUsername) {
                const sonido = document.getElementById('notificationSound');
                if (sonido) sonido.play().catch(e => {});
            }

            const type = data.sender === myUsername ? 'quantum-msg outgoing' : 'quantum-msg incoming';
            const div = document.createElement('div');
            div.className = type;
            div.innerHTML = `<strong>[${data.sender}]</strong>: ${data.text}`;
            
            const messagesContainer = document.getElementById('messagesContainer');
            messagesContainer.appendChild(div);
            messagesContainer.scrollTop = messagesContainer.scrollHeight;
        });
    </script>
</body>
</html>
