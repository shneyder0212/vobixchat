<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>VOBIXCHAT // Quantum WhatsApp Fixed</title>
    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
    <style>
        * { box-sizing: border-box; }
        body { 
            margin: 0; padding: 0; background: #050505; color: #fff; 
            font-family: 'Segoe UI', sans-serif; height: 100vh; 
            display: flex; flex-direction: column; overflow: hidden; 
        }
        
        /* Barra superior */
        #header { height: 60px; background: #111; display: flex; align-items: center; justify-content: space-between; padding: 0 15px; border-bottom: 2px solid #00f0ff; z-index: 10; }
        
        /* Área de Chat */
        #messages { flex: 1; overflow-y: auto; padding: 15px; display: flex; flex-direction: column; gap: 10px; }
        .msg { background: #1a1a1a; padding: 12px; border-radius: 15px; max-width: 85%; align-self: flex-start; border: 1px solid #333; font-size: 16px; }
        
        /* Área de escritura fija abajo para tu S24 Plus */
        #input-area { height: 70px; background: #000; display: flex; align-items: center; padding: 10px; gap: 10px; border-top: 1px solid #00f0ff; }
        #messageInput { flex: 1; height: 50px; background: #222; color: #fff; border: 1px solid #00f0ff; border-radius: 25px; padding: 0 20px; font-size: 16px; outline: none; }
        #sendBtn { background: #00f0ff; color: #000; border: none; padding: 0 20px; height: 50px; border-radius: 25px; font-weight: bold; cursor: pointer; }

        /* --- PANTALLA DE LLAMADA ESTILO WHATSAPP CORREGIDA --- */
        .overlay-screen {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background: #0b141a; display: none; flex-direction: column; z-index: 1500; justify-content: space-between; padding: 20px;
        }
        
        /* La otra persona ocupa TODO el fondo */
        #remoteVideo {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; z-index: 1; background: #000;
        }
        
        /* Tu cámara va FLOTANDO en la esquina superior derecha (Estilo WhatsApp) */
        #localVideo {
            position: absolute; top: 20px; right: 20px; width: 110px; height: 160px; object-fit: cover;
            border-radius: 12px; border: 2px solid #00f0ff; background: #000; z-index: 10; display: none;
        }

        /* Interfaz de llamada de voz (Limpia, sin cámaras) */
        .voice-call-ui {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle, #1f2c34 0%, #0b141a 100%);
            display: none; flex-direction: column; align-items: center; justify-content: center; z-index: 5; gap: 20px;
        }
        .caller-avatar {
            width: 110px; height: 110px; border-radius: 50%; background: #00f0ff; color: #000;
            display: flex; align-items: center; justify-content: center; font-size: 45px; font-weight: bold;
            box-shadow: 0 0 25px rgba(0,240,255,0.4);
        }

        /* Botones inferiores de la llamada */
        .call-controls-bar {
            position: relative; z-index: 20; display: flex; justify-content: center; gap: 20px; margin-bottom: 25px;
        }
        .call-action-btn {
            background: rgba(255,255,255,0.2); border: none; color: #fff; padding: 15px 30px;
            border-radius: 30px; font-weight: bold; cursor: pointer; font-size: 15px; backdrop-filter: blur(5px);
        }
        .call-action-btn.danger { background: #ff3b30; }
    </style>
</head>
<body>

    <div id="header">
        <div style="font-weight:bold;">CHAT WILLIAM</div>
        <div style="display:flex; gap:15px;">
            <button class="call-btn" onclick="iniciarLlamada('audio')" style="background:#00f0ff; border:none; border-radius:50%; width:40px; height:40px; cursor:pointer;">📞</button>
            <button class="call-btn" onclick="iniciarLlamada('video')" style="background:#00f0ff; border:none; border-radius:50%; width:40px; height:40px; cursor:pointer;">📹</button>
        </div>
    </div>

    <div id="messages">
        <div class="msg">Conectado a VOBIXCHAT.</div>
    </div>

    <div id="input-area">
        <input type="text" id="messageInput" placeholder="Escribe tu mensaje..." autocomplete="off">
        <button id="sendBtn" onclick="enviarMensaje()">ENVIAR</button>
    </div>

    <!-- PANTALLA DE LLAMADAS CORREGIDA -->
    <div class="overlay-screen" id="mediaCallScreen">
        <video id="remoteVideo" autoplay playsinline></video>
        
        <div class="voice-call-ui" id="voiceCallUI">
            <div class="caller-avatar" id="callAvatarText">W</div>
            <div style="font-size: 24px; font-weight: bold;" id="callContactName">William</div>
            <div style="font-size: 15px; color: #8696a0;" id="callStatusText">Conectando llamada...</div>
        </div>

        <video id="localVideo" autoplay playsinline muted></video>

        <div class="call-controls-bar">
            <button class="call-action-btn" id="toggleMuteAudioBtn" onclick="toggleMuteAudio()">🎤 Silenciar</button>
            <button class="call-action-btn danger" onclick="endMediaCall()">COLGAR ☎</button>
        </div>
    </div>

    <script>
        const socket = io();
        let myUsername = "Usuario";
        let currentRoom = "SALA_GENERAL_VOBIX";
        let localStream = null;
        let peerConnection = null;
        let isVideoCallActive = true;

        const iceServers = {
            iceServers: [
                { urls: 'stun:stun.l.google.com:19302' },
                { urls: 'stun:stun1.l.google.com:19302' }
            ]
        };

        // --- GESTIÓN DE LLAMADAS CORREGIDA ---
        async function iniciarLlamada(tipo) {
            isVideoCallActive = (tipo === 'video');

            // Limpiar estados de pantalla anteriores
            document.getElementById('mediaCallScreen').style.display = 'flex';

            if (isVideoCallActive) {
                document.getElementById('voiceCallUI').style.display = 'none';
                document.getElementById('localVideo').style.display = 'block';
                document.getElementById('remoteVideo').style.display = 'block';
            } else {
                document.getElementById('voiceCallUI').style.display = 'flex';
                document.getElementById('localVideo').style.display = 'none';
                document.getElementById('remoteVideo').style.display = 'none';
            }

            try {
                localStream = await navigator.mediaDevices.getUserMedia({
                    audio: { echoCancellation: true, noiseSuppression: true },
                    video: isVideoCallActive ? { width: { ideal: 1280 }, height: { ideal: 720 } } : false
                });

                if (isVideoCallActive) {
                    document.getElementById('localVideo').srcObject = localStream;
                }

                socket.emit('call_user', { room: currentRoom, sender: myUsername, type: tipo });
            } catch(e) {
                alert("Permiso denegado de cámara o micrófono.");
                endMediaCall();
            }
        }

        function createPeerConnection(remoteSocketId) {
            peerConnection = new RTCPeerConnection(iceServers);
            
            localStream.getTracks().forEach(track => {
                peerConnection.addTrack(track, localStream);
            });

            peerConnection.ontrack = event => {
                if (isVideoCallActive) {
                    document.getElementById('remoteVideo').srcObject = event.streams[0];
                }
            };

            peerConnection.onicecandidate = event => {
                if (event.candidate) {
                    socket.emit('ice_candidate', { room: currentRoom, candidate: event.candidate, to: remoteSocketId });
                }
            };
        }

        socket.on('call_incoming', async (data) => {
            if (data.sender === myUsername) return;
            if (confirm(`📞 ¡Llamada entrante de ${data.sender}! ¿Deseas contestar?`)) {
                await window.iniciarLlamada(data.type || 'video');
                createPeerConnection(data.socketId);
                const offer = await peerConnection.createOffer();
                await peerConnection.setLocalDescription(offer);
                socket.emit('call_offer', { room: currentRoom, offer, sender: myUsername });
            }
        });

        socket.on('call_offer', async (data) => {
            createPeerConnection(data.socketId);
            await peerConnection.setRemoteDescription(new RTCSessionDescription(data.offer));
            const answer = await peerConnection.createAnswer();
            await peerConnection.setLocalDescription(answer);
            socket.emit('call_answer', { room: currentRoom, answer, sender: myUsername });
        });

        socket.on('call_answer', async (data) => {
            await peerConnection.setRemoteDescription(new RTCSessionDescription(data.answer));
        });

        socket.on('ice_candidate', async (data) => {
            if (peerConnection) {
                await peerConnection.addIceCandidate(new RTCIceCandidate(data.candidate));
            }
        });

        window.endMediaCall = () => {
            if(localStream) {
                localStream.getTracks().forEach(t => t.stop());
                localStream = null;
            }
            if(peerConnection) {
                peerConnection.close();
                peerConnection = null;
            }
            document.getElementById('localVideo').srcObject = null;
            document.getElementById('remoteVideo').srcObject = null;
            document.getElementById('mediaCallScreen').style.display = 'none';
        };

        window.toggleMuteAudio = () => {
            if(localStream) {
                const audioTrack = localStream.getAudioTracks()[0];
                if(audioTrack) {
                    audioTrack.enabled = !audioTrack.enabled;
                    document.getElementById('toggleMuteAudioBtn').textContent = audioTrack.enabled ? "🎤 Silenciar" : "🔇 Activado";
                }
            }
        };

        // Envío de mensajes optimizado para el teclado del S24 Plus
        function enviarMensaje() {
            const input = document.getElementById('messageInput');
            let val = input.value.trim();
            if(!val) return;
            
            socket.emit('chat_message', { room: currentRoom, type: 'text', text: val, sender: myUsername });
            input.value = '';
            input.focus();
        }

        document.getElementById('messageInput').addEventListener('keypress', function (e) {
            if (e.key === 'Enter') enviarMensaje();
        });

        socket.on('chat_message', (data) => {
            if (data.sender !== myUsername) {
                const sonido = document.getElementById('notificationSound');
                if (sonido) sonido.play().catch(e => {});
            }

            const type = data.sender === myUsername ? 'outgoing' : 'incoming';
            const div = document.createElement('div');
            div.className = `quantum-msg ${type}`;
            div.innerHTML = `<strong>[${data.sender}]</strong>: ${data.text}`;
            
            const messagesContainer = document.getElementById('messages');
            messagesContainer.appendChild(div);
            messagesContainer.scrollTop = messagesContainer.scrollHeight;
        });
    </script>
</body>
</html>
