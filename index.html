<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VobixChat - Global</title>
<style>
body{font-family:Arial;background:#0f0f0f;color:white;display:flex;justify-content:center;align-items:center;min-height:100vh;margin:0}
.card{background:#1c1c1c;padding:30px;border-radius:15px;width:90%;max-width:380px;text-align:center;box-shadow:0 0 20px #00ff88}
input{width:90%;padding:12px;margin:10px 0;border-radius:8px;border:none}
button{width:95%;padding:12px;background:#00ff88;border:none;border-radius:8px;font-weight:bold;cursor:pointer}
.lang{position:fixed;top:10px;right:10px;background:#222;padding:8px;border-radius:20px}
.lang span{cursor:pointer;margin:0 4px}
</style>
</head>
<body>
<div class="lang">
<span onclick="setLang('es')">🇪🇸</span>
<span onclick="setLang('en')">🇺🇸</span>
<span onclick="setLang('fr')">🇫🇷</span>
<span onclick="setLang('pt')">🇧🇷</span>
<span onclick="setLang('de')">🇩🇪</span>
<span onclick="setLang('it')">🇮🇹</span>
</div>

<div class="card">
<h2 id="t-title">VobixChat</h2>
<p id="t-sub">Verifica tu número para continuar</p>
<input id="phone" placeholder="+34...">
<button onclick="sendPin()" id="t-btn1">Enviar código</button>
<input id="pin" placeholder="123456" style="display:none">
<button onclick="verifyPin()" id="t-btn2" style="display:none">Verificar</button>
<p id="msg"></p>
</div>

<script>
const TRAD = {
 es:{title:"VobixChat",sub:"Verifica tu número para continuar",b1:"Enviar código",b2:"Verificar",ph:"+34 600 000 000",sending:"Enviando..."},
 en:{title:"VobixChat",sub:"Verify your number to continue",b1:"Send code",b2:"Verify",ph:"+1 555 000 000",sending:"Sending..."},
 fr:{title:"VobixChat",sub:"Vérifiez votre numéro pour continuer",b1:"Envoyer le code",b2:"Vérifier",ph:"+33 6 00 00 00 00",sending:"Envoi..."},
 pt:{title:"VobixChat",sub:"Verifique seu número para continuar",b1:"Enviar código",b2:"Verificar",ph:"+55 11 90000 0000",sending:"Enviando..."},
 de:{title:"VobixChat",sub:"Bestätige deine Nummer",b1:"Code senden",b2:"Bestätigen",ph:"+49 170 0000000",sending:"Senden..."},
 it:{title:"VobixChat",sub:"Verifica il tuo numero",b1:"Invia codice",b2:"Verifica",ph:"+39 300 0000000",sending:"Invio..."}
};

function detectLang(){
 let nav = (navigator.language || 'es').substring(0,2);
 return TRAD[nav]? nav : 'en';
}
let current = localStorage.getItem('vobix_lang') || detectLang();

function applyLang(){
 let t = TRAD[current];
 document.getElementById('t-title').innerText = t.title;
 document.getElementById('t-sub').innerText = t.sub;
 document.getElementById('t-btn1').innerText = t.b1;
 document.getElementById('t-btn2').innerText = t.b2;
 document.getElementById('phone').placeholder = t.ph;
}
function setLang(l){ current=l; localStorage.setItem('vobix_lang',l); applyLang(); }
applyLang();

async function sendPin(){
 let phone=document.getElementById('phone').value;
 if(!phone) return alert('Pon número');
 document.getElementById('msg').innerText=TRAD[current].sending;
 let r=await fetch('/send-pin',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({phone})});
 let d=await r.json();
 if(d.ok){ document.getElementById('pin').style.display='block'; document.getElementById('t-btn2').style.display='block'; document.getElementById('msg').innerText='PIN enviado!'; }
 else document.getElementById('msg').innerText='Error: '+(d.error||'');
}
async function verifyPin(){
 let phone=document.getElementById('phone').value;
 let pin=document.getElementById('pin').value;
 let r=await fetch('/verify-pin',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({phone,pin})});
 let d=await r.json();
 document.getElementById('msg').innerText = d.ok? '¡Verificado! Bienvenido' : 'PIN incorrecto';
}
</script>
</body>
</html>
