    <script>
        let socket = null;
        try { if (typeof io !== "undefined") { socket = io(); } } catch(e) { console.error(e); }
        
        let localStream = null, peerConnection = null, isMuted = false, isVideoMuted = false, currentCallMode = 'video', pendingCallMode = null;
        let myUsername = "Invitado";

        let isMirrorActive = false;
        let isSeniorActive = false;

        let isEphemeralActive = false; 

        const iceConfiguration = { iceServers: [{ urls: 'stun:://google.com' }, { urls: 'stun:://google.com' }] };
        const urlParams = new URLSearchParams(window.location.search);
        let privateRoomId = urlParams.get('room');
        if (!privateRoomId) { privateRoomId = 'bunker-' + Math.floor(100000 + Math.random() * 900000); }

        const dictionaryAI = {
            "en": { "hola": "hello", "buenos dias": "good morning", "como estas": "how are you", "bien": "i am fine", "firmado": "signed", "bunker": "bunker" },
            "fr": { "hola": "bonjour", "buenos dias": "bonjour", "como estas": "comment ça va", "bien": "ça va bien", "firmado": "signé", "bunker": "bunker" }
        };

        document.addEventListener("DOMContentLoaded", () => {
            const isMobile = /Android|iPhone|iPad|iPod/i.test(navigator.userAgent);
            document.getElementById('device-detect-label').innerText = isMobile ? "[SISTEMA]: ACCESO MÓVIL DETECTADO" : "[SISTEMA]: ACCESO PC DETECTADO";

            if (localStorage.getItem('vobix_senior') === 'true') { toggleSeniorMode(true); }

                document.getElementById('room-status-indicator').innerText = "● EN LÍNEA";

            // CONTROLES DE MENÚ DESPLEGABLE (SUBE Y BAJA ELÁSTICO)
            const dotsBtn = document.getElementById('btn-dropdown-trigger');
            const menuPanel = document.getElementById('dropdown-menu-panel');
            
            dotsBtn.addEventListener('click', (e) => {
                e.stopPropagation();
                if (menuPanel.style.display === 'none' || menuPanel.style.opacity === '0') {
                    menuPanel.style.display = 'block';
                    setTimeout(() => { menuPanel.style.transform = 'translateY(0)'; menuPanel.style.opacity = '1'; }, 10);

            document.addEventListener('click', () => {

            // GEOLOCALIZACIÓN CIFRADA P2P (MADRID - BARCELONA)
            document.getElementById('btn-share-location').addEventListener('click', () => {
                if (navigator.geolocation) {

                        document.getElementById('messageInput').value = coordsText;

            });

                alert(`🚀 Transmitiendo [${fileInput.files[0].name}] hacia la nube ilimitada...\n\n[PROCESO COSTE CERO PROTEGIDO]`);

            });

            // CAMBIAR MICRÓFONO A FLECHA AL ESCRIBIR

                if (chatInput.value.trim().length > 0) { sendBtn.innerText = "➤"; sendBtn.style.fontSize = "1.2rem"; } 
                else { sendBtn.innerText = "🎙️"; sendBtn.style.fontSize = "1.1rem"; }
            });

            // FIRMA DE CONTRATOS MADRID - BARCELONA
            document.getElementById('btn-sign-contract-action').addEventListener('click', () => {

                if(socket) socket.emit('contract-signed-broadcast', { room: privateRoomId, user: myUsername, doc: bodyText });
                executeLocalSignature(myUsername, bodyText);
            });
        });

        function toggleSeniorMode(forceState = null) {
            isSeniorActive = forceState !== null ? forceState : !isSeniorActive;
            const btn = document.getElementById('btn-toggle-senior');
            if(isSeniorActive) { document.body.classList.add('senior-mode'); btn.innerHTML = "<span>👴</span> Modo Senior: ON"; }
            else { document.body.classList.remove('senior-mode'); btn.innerHTML = "<span>👴</span> Modo Senior: OFF"; }
            localStorage.setItem('vobix_senior', isSeniorActive);
        }
