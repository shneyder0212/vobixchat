<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>VOBIXCHAT // Quantum Ultra Mobile 16K Final</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Rajdhani:wght@500;600;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
    <style>
        :root {
            --bg-quantum: #010308;
            --panel-hud: rgba(5, 12, 25, 0.99);
            --neon-blue: #00f0ff;
            --neon-violet: #9d00ff;
            --neon-green: #00ff66;
            --neon-amber: #ffaa00;
            --neon-red: #ff0055;
            --text-main: #f0f6fc;
            --text-dim: #7a9ec2;
            --border-hud: rgba(0, 240, 255, 0.18);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background-color: var(--bg-quantum);
            font-family: 'Rajdhani', sans-serif;
            color: var(--text-main);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        body.senior-mode { font-size: 1.35rem !important; }
        body.senior-mode .quantum-input, body.senior-mode .transmit-btn, body.senior-mode .action-btn { font-size: 1.2rem !important; padding: 14px !important; }
        body.senior-mode .quantum-msg { font-size: 1.2rem !important; padding: 14px !important; }

        /* CONTENEDOR PRINCIPAL OCUPANDO TODA LA PANTALLA PERFECTAMENTE */
        .app-container {
            width: 100vw; max-width: 1400px; height: 100vh;
            background: var(--panel-hud); display: flex; flex-direction: column;
            overflow: hidden; position: relative; border: 1px solid var(--border-hud);
        }

        /* PANTALLA DE ACCESO Y PIN ALEATORIO */
        .auth-overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(1, 3, 8, 0.98); backdrop-filter: blur(20px);
            display: flex; justify-content: center; align-items: center; z-index: 2000; padding: 15px;
        }
        .auth-card {
            width: 100%; max-width: 380px; background: rgba(8, 16, 32, 0.98);
            border: 1px solid var(--border-hud); border-radius: 12px; padding: 20px; display: flex; flex-direction: column; gap: 12px;
        }
        .auth-card h2 { font-family: 'Orbitron', sans-serif; color: var(--neon-blue); font-size: 1.1rem; text-align: center; }
        .auth-card p { font-family: 'Share Tech Mono', monospace; font-size: 0.7rem; color: var(--text-dim); text-align: center; }
        .auth-select, .auth-input { background: #000; border: 1px solid var(--border-hud); color: #fff; padding: 12px; font-family: 'Share Tech Mono'; border-radius: 6px; outline: none; font-size: 1rem; width: 100%; }
        .auth-btn { background: var(--neon-blue); color: #000; border: none; padding: 12px; font-family: 'Orbitron'; font-weight: bold; border-radius: 6px; cursor: pointer; font-size: 0.9rem; text-align: center; }

        /* BARRA SUPERIOR */
        .top-bar {
            background: rgba(3, 7, 15, 0.98); border-bottom: 1px solid var(--border-hud);
            padding: 10px 14px; display: flex; justify-content: space-between; align-items: center; flex-shrink: 0; z-index: 10;
        }
        .logo { font-family: 'Orbitron'; color: var(--neon-blue); font-size: 0.9rem; font-weight: 900; }
        .top-actions { display: flex; gap: 6px; align-items: center; }
        .top-btn { background: rgba(0,240,255,0.08); border: 1px solid var(--border-hud); color: var(--neon-blue); padding: 6px 10px; border-radius: 6px; font-size: 0.75rem; cursor: pointer; font-family: 'Share Tech Mono'; }

        /* ÁREA DE CHAT PRINCIPAL */
        .workspace-area { flex: 1; display: flex; flex-direction: column; position: relative; overflow: hidden; background: #02050c; }
        .screen-view { display: flex; flex-direction: column; flex: 1; height: 100%; overflow: hidden; }

        .messages-display { flex: 1; padding: 15px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; }
        .quantum-msg { max-width: 88%; padding: 10px 14px; border-radius: 8px; font-size: 0.95rem; line-height: 1.4; word-break: break-word; }
        .quantum-msg.incoming { background: rgba(0, 240, 255, 0.05); border-left: 3px solid var(--neon-blue); align-self: flex-start; }
        .quantum-msg.outgoing { background: rgba(157, 0, 255, 0.12); border-right: 3px solid var(--neon-violet); align-self: flex-end; text-align: right; }
        .quantum-msg .msg-meta { font-family: 'Share Tech Mono'; font-size: 0.55rem; color: var(--text-dim); margin-top: 3px; }

        /* BARRA INFERIOR DE ENTRADA (BOTÓN ENVIAR FIJO E INTEGRADO) */
        .chat-input-deck {
            padding: 12px; background: rgba(3, 7, 15, 0.99); border-top: 1px solid var(--border-hud);
            display: flex; gap: 8px; align-items: center; flex-shrink: 0; width: 100%; position: relative; z-index: 100;
        }
        .quantum-input {
            flex: 1; background: #000; border: 1px solid var(--border-hud); border-radius: 6px;
            padding: 12px; color: #fff; font-family: 'Share Tech Mono'; font-size: 0.95rem; outline: none; min-width: 0;
        }
        .action-btn { background: rgba(0, 240, 255, 0.08); border: 1px solid var(--border-hud); color: var(--neon-blue); padding: 12px; border-radius: 6px; cursor: pointer; font-size: 1rem; flex-shrink: 0; }
        .action-btn.recording { background: var(--neon-red); color: #fff; animation: pulseRec 1s infinite; }
        @keyframes pulseRec { 0% { opacity: 1; } 50% { opacity: 0.4; } 100% { opacity: 1; } }
        
        .transmit-btn {
            background: linear-gradient(135deg, var(--neon-blue), var(--neon-violet)); border: none; border-radius: 6px;
            padding: 12px 20px; color: #010308; font-family: 'Orbitron'; font-weight: 900; cursor: pointer; font-size: 0.95rem; flex-shrink: 0;
        }

        /* POPUP DE EMOJIS FLOTANTE SEGURO */
        .emoji-popup {
            display: none; position: absolute; bottom: 75px; left: 10px; background: rgba(4, 10, 22, 0.98);
            border: 1px solid var(--border-hud); border-radius: 8px; padding: 10px; gap: 6px; flex-wrap: wrap; width: 260px; max-height: 160px; overflow-y: auto; z-index: 300; box-shadow: 0 -4px 15px rgba(0,0,0,0.5);
        }
        .emoji-option { font-size: 1.3rem; cursor: pointer; padding: 3px; }

        /* PANTALLA DE VÍDEO */
        .overlay-video {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: #000;
            display: none; flex-direction: column; z-index: 1000; justify-content: center; align-items: center;
        }
        .overlay-video video { width: 100%; height: 100%; object-fit: cover; }
        .hangup-floating-btn { position: absolute; bottom: 30px; background: var(--neon-red); color: #fff; border: none; padding: 12px 24px; border-radius: 8px; font-family: 'Orbitron'; font-weight: bold; cursor: pointer; z-index: 1010; }
    </style>
</head>
<body>

    <!-- AUTENTICACIÓN ANTI-VOIP Y PIN ALEATORIO -->
    <div class="auth-overlay" id="authOverlay">
        <div class="auth-card" id="authStep1">
            <h2>VOBIXCHAT // ACCESO 16K</h2>
            <p>Filtro anti-VoIP activo.</p>
            <select id="countrySelect" class="auth-select">
                <option value="+34">🇪🇸 España (+34)</option>
                <option value="+1">🇩🇴 República Dominicana (+1)</option>
            </select>
            <input type="text" id="authPhoneInput" class="auth-input" placeholder="Móvil real">
            <input type="text" id="authNameInput" class="auth-input" placeholder="Tu Nombre o Alias">
            <button class="auth-btn" id="requestRandomPinBtn">ENVIAR PIN ALEATORIO</button>
            <div id="authErrorMsg" style="color:var(--neon-red); font-size:0.65rem; text-align:center;"></div>
        </div>

        <div class="auth-card" id="authStep2" style="display:none;">
            <h2>VERIFICACIÓN DE SEGURIDAD</h2>
            <p id="pinInstructionsText">Introduce el código aleatorio.</p>
            <input type="text" id="authPinInput" class="auth-input" placeholder="PIN de 4 dígitos" maxlength="4">
            <button class="auth-btn" id="verifyRandomPinBtn">CONFIRMAR & ENTRAR</button>
            <div id="pinErrorMsg" style="color:var(--neon-red); font-size:0.65rem; text-align:center;"></div>
        </div>
    </div>

    <!-- PANTALLA DE VÍDEO -->
    <div class="overlay-video" id="videoCallOverlay">
        <video id="remoteWebcamVideo" autoplay playsinline></video>
        <button class="hangup-floating-btn" onclick="end16KVideoCall()">FINALIZAR LLAMADA</button>
    </div>

    <div class="app-container">
        <div class="top-bar">
            <div class="logo">VOBIXCHAT // <span id="roomNameDisplay">SALA DIRECTA</span></div>
            <div class="top-actions">
                <button class="top-btn" id="inviteLinkBtn">🔗 Invitar</button>
                <button class="top-btn" style="background:var(--neon-red); color:#fff; border:none;" onclick="location.reload()">SALIR</button>
            </div>
        </div>

        <div class="workspace-area">
            <div class="screen-view" id="screenChat">
                <div class="messages-display" id="messagesContainer">
                    <div class="quantum-msg incoming">
                        <strong>[SISTEMA]</strong>: Canal seguro activo. Botón de enviar optimizado, notas de voz HD y llamadas integradas.
                        <div class="msg-meta"><span>12:00</span></div>
                    </div>
                </div>

                <div class="emoji-popup" id="emojiPopupBox">
                    <span class="emoji-option" onclick="insertEmoji('😀')">😀</span> <span class="emoji-option" onclick="insertEmoji('😂')">😂</span> <span class="emoji-option" onclick="insertEmoji('🔥')">🔥</span> <span class="emoji-option" onclick="insertEmoji('🚀')">🚀</span> <span class="emoji-option" onclick="insertEmoji('⭐')">⭐</span> <span class="emoji-option" onclick="insertEmoji('💎')">💎</span> <span class="emoji-option" onclick="insertEmoji('🎉')">🎉</span> <span class="emoji-option" onclick="insertEmoji('👍')">👍</span> <span class="emoji-option" onclick="insertEmoji('❤️')">❤️</span> <span class="emoji-option" onclick="insertEmoji('💡')">💡</span>
                </div>

                <!-- BARRA INFERIOR DE CHAT CON BOTÓN ENVIAR VISIBLE -->
                <div class="chat-input-deck">
                    <button class="action-btn" id="toggleEmojiBtn" title="Emojis">😊</button>
                    <button class="action-btn" id="recordAudioBtn" title="Nota de Voz HD">🎙️</button>
                    <label class="action-btn" title="Enviar Archivo/Vídeo">📁<input type="file" id="mediaFileInput" accept="video/*,image/*,.pdf" style="display:none;" onchange="handleMediaUpload(event)"></label>
                    <input type="text" id="messageInput" class="quantum-input" placeholder="Escribe un mensaje..." autocomplete="off">
                    <button class="transmit-btn" id="sendBtn">ENVIAR</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        const socket = io();
        let myUsername = "Usuario Móvil";
        let generatedRandomPin = "";

        // Autenticación anti-VoIP y PIN
        document.getElementById('requestRandomPinBtn').addEventListener('click', () => {
            const phone = document.getElementById('authPhoneInput').value.trim();
            const name = document.getElementById('authNameInput').value.trim();
            if(!phone || !name) return document.getElementById('authErrorMsg').textContent = "Introduce móvil y nombre.";
            if(phone.startsWith("0") || phone.length < 8) return document.getElementById('authErrorMsg').textContent = "🚫 VoIP bloqueado.";
            myUsername = name;
            generatedRandomPin = Math.floor(1000 + Math.random() * 9000).toString();
            document.getElementById('authStep1').style.display = 'none';
            document.getElementById('authStep2').style.display = 'flex';
            document.getElementById('pinInstructionsText').textContent = `PIN asignado: [ ${generatedRandomPin} ]`;
        });

        document.getElementById('verifyRandomPinBtn').addEventListener('click', () => {
            if(document.getElementById('authPinInput').value.trim() === generatedRandomPin) {
                document.getElementById('authOverlay').style.display = 'none';
            } else {
                document.getElementById('pinErrorMsg').textContent = "❌ PIN incorrecto.";
            }
        });

        // Enlace de invitación directo
        const urlParams = new URLSearchParams(window.location.search);
        const incomingRoom = urlParams.get('room');
        if(incomingRoom) document.getElementById('roomNameDisplay').textContent = `SALA: ${incomingRoom}`;

        document.getElementById('inviteLinkBtn').addEventListener('click', () => {
            const inviteUrl = `${window.location.origin + window.location.pathname}?room=${encodeURIComponent(myUsername)}`;
            navigator.clipboard.writeText(inviteUrl).then(() => alert(`🔗 Enlace copiado al portapapeles:\n\n${inviteUrl}`));
        });

        // Notificaciones con sonido y vibración
        function triggerMessageNotification() {
            if("vibrate" in navigator) navigator.vibrate([200, 100, 200]);
            try {
                const ctx = new (window.AudioContext || window.webkitAudioContext)();
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.frequency.setValueAtTime(587.33, ctx.currentTime);
                gain.gain.setValueAtTime(0.1, ctx.currentTime);
                osc.connect(gain); gain.connect(ctx.destination);
                osc.start(); osc.stop(ctx.currentTime + 0.15);
            } catch(e) {}
        }

        // Grabador de notas de voz HD funcional
        let mediaRecorder;
        let audioChunks = [];
        const recordBtn = document.getElementById('recordAudioBtn');
        let isRecording = false;

        recordBtn.addEventListener('click', async () => {
            if(!isRecording) {
                try {
                    const stream = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: true, noiseSuppression: true } });
                    mediaRecorder = new MediaRecorder(stream);
                    audioChunks = [];
                    mediaRecorder.ondataavailable = e => { if(e.data.size > 0) audioChunks.push(e.data); };
                    mediaRecorder.onstop = () => {
                        const audioBlob = new Blob(audioChunks, { type: 'audio/webm' });
                        const audioUrl = URL.createObjectURL(audioBlob);
                        socket.emit('chat_message', { type: 'audio', text: `🎙️ Nota de voz HD:<br><audio controls src="${audioUrl}"></audio>`, sender: myUsername });
                    };
                    mediaRecorder.start();
                    isRecording = true;
                    recordBtn.classList.add('recording');
                    recordBtn.textContent = "⏹️";
                } catch(e) { alert("⚠️ Micrófono bloqueado o no disponible."); }
            } else {
                mediaRecorder.stop();
                isRecording = false;
                recordBtn.classList.remove('recording');
                recordBtn.textContent = "🎙️";
            }
        });

        // Subida de archivos / vídeos
        window.handleMediaUpload = (e) => {
            const file = e.target.files[0];
            if(!file) return;
            const reader = new FileReader();
            reader.readAsDataURL(file);
            reader.onloadend = () => {
                const isVideo = file.type.startsWith('video');
                const html = isVideo ? `<video controls src="${reader.result}" style="width:100%; max-height:220px; border-radius:6px;"></video>` : `<a href="${reader.result}" download="${file.name}" style="color:var(--neon-blue);">📁 Descargar ${file.name}</a>`;
                socket.emit('chat_message', { type: 'media', text: html, sender: myUsername });
            };
        };

        // Emojis
        const emojiBox = document.getElementById('emojiPopupBox');
        document.getElementById('toggleEmojiBtn').addEventListener('click', (e) => {
            e.stopPropagation();
            emojiBox.style.display = emojiBox.style.display === 'flex' ? 'none' : 'flex';
        });

        window.insertEmoji = (em) => {
            document.getElementById('messageInput').value += em;
            emojiBox.style.display = 'none';
        };

        document.addEventListener('click', () => {
            emojiBox.style.display = 'none';
        });

        // Envío de mensajes de chat
        const messagesContainer = document.getElementById('messagesContainer');
        const messageInput = document.getElementById('messageInput');

        function handleSend() {
            const val = messageInput.value.trim();
            if(!val) return;
            socket.emit('chat_message', { type: 'text', text: val, sender: myUsername });
            messageInput.value = '';
            emojiBox.style.display = 'none';
        }

        document.getElementById('sendBtn').addEventListener('click', handleSend);
        messageInput.addEventListener('keypress', (e) => { if(e.key === 'Enter') handleSend(); });

        socket.on('chat_message', (data) => {
            const type = data.sender === myUsername ? 'outgoing' : 'incoming';
            const div = document.createElement('div');
            div.className = `quantum-msg ${type}`;
            div.innerHTML = `<strong>[${data.sender}]</strong>: ${data.text}<div class="msg-meta"><span>${new Date().toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'})}</span></div>`;
            messagesContainer.appendChild(div);
            messagesContainer.scrollTop = messagesContainer.scrollHeight;

            if(data.sender !== myUsername) triggerMessageNotification();
        });
    </script>
</body>
</html>
