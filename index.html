<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>VOBIXCHAT // Quantum Mobile Pro</title>
    <link href="https://googleapis.com" rel="stylesheet">
    <script src="/socket.io/socket.io.js"></script>
    <style>
        :root, body.theme-violet {
            --bg-quantum: #04010a; --panel-hud: rgba(10, 3, 20, 0.99); --neon-blue: #00f0ff; --neon-violet: #bd00ff; --neon-green: #00ff66; --neon-amber: #ffaa00; --neon-red: #ff0055; --text-main: #f3e8ff; --text-dim: #8b7aa6; --border-hud: rgba(189, 0, 255, 0.35);
            --bg-pattern: radial-gradient(circle at 50% 50%, rgba(189, 0, 255, 0.05) 0%, rgba(4, 1, 10, 0.98) 100%), repeating-linear-gradient(0deg, transparent, transparent 30px, rgba(189, 0, 255, 0.015) 30px, rgba(189, 0, 255, 0.015) 31px);
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        html, body { background-color: var(--bg-quantum); background-image: var(--bg-pattern); font-family: 'Rajdhani', sans-serif; color: var(--text-main); width: 100%; height: 100%; height: 100dvh; display: flex; justify-content: center; align-items: center; overflow: hidden; position: fixed; top: 0; left: 0; overscroll-behavior-y: none; }
        
        .app-container { width: 100%; height: 100%; height: 100dvh; max-width: 1400px; background: var(--panel-hud); display: flex; flex-direction: column; overflow: hidden; position: relative; border: 2px solid var(--border-hud); box-shadow: 0 0 50px rgba(189, 0, 255, 0.15); backdrop-filter: blur(20px); }
        
        /* INTERFAZ DE ACCESO IMPONENTE MATRIZ MILITAR */
        .auth-overlay, .confirm-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(3, 1, 6, 0.98); backdrop-filter: blur(30px); display: flex; justify-content: center; align-items: center; z-index: 2000; padding: 20px; }
        .confirm-overlay { display: none; z-index: 1800; background: rgba(2,0,5,0.9); }
        
        .auth-card { width: 100%; max-width: 430px; background: rgba(14, 5, 26, 0.75); border: 2px solid var(--neon-blue); border-radius: 4px; padding: 30px; display: flex; flex-direction: column; gap: 18px; box-shadow: 0 0 40px rgba(0, 240, 255, 0.25); position: relative; clip-path: polygon(0 0, 93% 0, 100% 7%, 100% 100%, 7% 100%, 0 93%); }
        .auth-card::before { content: 'SECURE TERMINAL // V.2.06'; position: absolute; top: 6px; left: 15px; font-family: 'Share Tech Mono'; font-size: 0.65rem; color: var(--neon-blue); opacity: 0.7; }
        
        .confirm-card { width: 100%; max-width: 380px; background: var(--panel-hud); border: 2px solid var(--neon-amber); border-radius: 4px; padding: 25px; display: flex; flex-direction: column; gap: 15px; text-align: center; box-shadow: 0 0 30px rgba(255, 170, 0, 0.2); }
        .confirm-card h3 { font-family: 'Orbitron'; color: var(--neon-amber); font-size: 1.2rem; letter-spacing: 1px; }
        
        .auth-card h2 { font-family: 'Orbitron', sans-serif; color: #fff; font-size: 1.4rem; font-weight: 900; text-align: center; letter-spacing: 2px; text-shadow: 0 0 10px rgba(255,255,255,0.2), 0 0 20px var(--neon-blue); margin-top: 10px; }
        .auth-card p, .confirm-card p { font-family: 'Share Tech Mono', monospace; font-size: 0.8rem; color: var(--text-dim); text-align: center; text-transform: uppercase; letter-spacing: 1px; }
        
        .field-container { display: flex; flex-direction: column; gap: 6px; }
        .field-label { font-family: 'Share Tech Mono'; font-size: 0.75rem; color: var(--neon-blue); text-transform: uppercase; letter-spacing: 1px; display: flex; justify-content: space-between; }
        
        .auth-input { background: rgba(0,0,0,0.6); border: 1px solid rgba(0, 240, 255, 0.3); color: #fff; padding: 14px; font-family: 'Share Tech Mono'; border-radius: 2px; outline: none; font-size: 1rem; width: 100%; transition: 0.3s; }
        .auth-input:focus { border-color: var(--neon-blue); box-shadow: 0 0 12px rgba(0, 240, 255, 0.2); background: #000; }
        
        .phone-group { display: flex; gap: 8px; align-items: center; width: 100%; }
        .detected-country-select { background: #000; border: 1px solid rgba(0, 240, 255, 0.3); color: var(--neon-blue); padding: 14px 10px; font-family: 'Share Tech Mono'; font-size: 0.95rem; border-radius: 2px; outline: none; cursor: pointer; min-width: 95px; height: 48px; transition: 0.3s; }
        .detected-country-select:focus { border-color: var(--neon-blue); }
        .phone-input-style { flex: 1; height: 48px; }
        
        .auth-btn { background: var(--neon-blue); color: #000; border: none; padding: 14px; font-family: 'Orbitron'; font-weight: 900; border-radius: 2px; cursor: pointer; font-size: 0.95rem; text-align: center; transition: 0.3s; letter-spacing: 1px; text-transform: uppercase; }
        .auth-btn:hover { filter: brightness(1.2); box-shadow: 0 0 15px rgba(0, 240, 255, 0.4); }
        
        .big-pin-display { font-family: 'Orbitron', sans-serif; font-size: 2.5rem; color: var(--neon-green); text-align: center; letter-spacing: 8px; background: rgba(0,255,102,0.03); border: 1px dashed var(--neon-green); padding: 15px; border-radius: 4px; margin: 5px 0; display: none; text-shadow: 0 0 15px var(--neon-green); animation: pulseGlow 2s infinite ease-in-out; }
        @keyframes pulseGlow { 0% { opacity: 0.8; } 50% { opacity: 1; box-shadow: inset 0 0 15px rgba(0,255,102,0.1); } 100% { opacity: 0.8; } }
        
        /* CABECERA Y CORE HUD */
        .main-header-bar { padding: 0 15px; background: rgba(2, 1, 5, 0.98); border-bottom: 1px solid var(--border-hud); display: flex; justify-content: space-between; align-items: center; flex-shrink: 0; z-index: 100; height: 55px; }
        .header-profile-section { display: flex; align-items: center; gap: 10px; flex: 1; min-width: 0; }
        .profile-avatar-container { width: 36px; height: 36px; border-radius: 4px; border: 1px solid var(--neon-blue); background: linear-gradient(135deg, #000, rgba(0, 240, 255, 0.2)); display: flex; align-items: center; justify-content: center; font-family: 'Orbitron'; font-weight: 900; color: var(--neon-blue); font-size: 0.85rem; flex-shrink: 0; box-shadow: 0 0 8px rgba(0, 240, 255, 0.2); }
        .header-info-group { display: flex; flex-direction: column; min-width: 0; }
        .header-username-display { font-family: 'Orbitron', sans-serif; font-size: 0.8rem; font-weight: 900; letter-spacing: 1px; color: #fff; }
        .header-user-status { font-size: 0.5rem; color: var(--neon-green); font-family: 'Share Tech Mono'; letter-spacing: 1px; margin-top: 2px; }
        
        .header-right-group { display: flex; gap: 10px; align-items: center; flex-shrink: 0; }
        .whatsapp-icon-btn, .shield-quantum-btn { background: rgba(0, 240, 255, 0.04); border: 1px solid rgba(0, 240, 255, 0.3); color: var(--neon-blue); border-radius: 4px; width: 30px; height: 36px; display: flex; align-items: center; justify-content: center; cursor: pointer; font-size: 0.9rem; transition: 0.2s; }
        .whatsapp-icon-btn:hover, .shield-quantum-btn:hover { border-color: var(--neon-blue); color: #fff; background: rgba(0, 240, 255, 0.1); }
        .logout-action-btn { background: rgba(255, 0, 85, 0.1); color: var(--neon-red); border: 1px solid rgba(255, 0, 85, 0.4); padding: 8px 12px; border-radius: 4px; font-family: 'Orbitron'; font-weight: 700; font-size: 0.65rem; cursor: pointer; letter-spacing: 1px; transition: 0.2s; height: 36px; }
        .logout-action-btn:hover { background: var(--neon-red); color: #000; box-shadow: 0 0 10px var(--neon-red); }
        
        .call-icon-btn { background: rgba(0, 255, 102, 0.04); border: 1px solid rgba(0, 255, 102, 0.3); color: var(--neon-green); border-radius: 4px; width: 36px; height: 36px; display: flex; align-items: center; justify-content: center; cursor: pointer; font-size: 1rem; transition: 0.2s; }
        .call-icon-btn:hover { background: rgba(0, 255, 102, 0.15); border-color: var(--neon-green); color: #fff; box-shadow: 0 0 10px rgba(0, 255, 102, 0.2); }
        
        /* MULTIMEDIA HUD CONEXIÓN */
        .video-call-overlay { position: absolute; top:0; left:0; width:100%; height:100%; background: #020005; z-index: 1500; display: none; flex-direction: column; justify-content: space-between; padding: 25px; box-sizing: border-box; padding-bottom: calc(25px + env(safe-area-inset-bottom)); }
        .video-grid { display: flex; flex-direction: column; gap: 20px; width: 100%; height: 75%; }
        video { width: 100%; height: 48%; object-fit: cover; border: 2px solid rgba(0, 240, 255, 0.2); border-radius: 4px; background: #000; box-shadow: 0 0 20px rgba(0,0,0,0.8); }
        #local-video { border-color: var(--neon-violet); } #remote-video { border-color: var(--neon-blue); }
        .call-controls { display: flex; justify-content: center; gap: 20px; width: 100%; }
        
        .chat-area { flex: 1; display: flex; flex-direction: column; background: rgba(0,0,0,0.4); overflow-y: auto; padding: 20px; border-left: 1px solid rgba(189, 0, 255, 0.05); }
        .chat-input-area { padding: 15px; background: rgba(4, 2, 8, 0.98); border-top: 1px solid var(--border-hud); display: flex; gap: 10px; align-items: center; padding-bottom: calc(15px + env(safe-area-inset-bottom)); }
        .quantum-input { flex: 1; background: #000; border: 1px solid rgba(189, 0, 255, 0.25); padding: 14px; color: #fff; border-radius: 4px; outline: none; font-family: 'Share Tech Mono'; font-size: 1rem; transition: 0.3s; }
        .quantum-input:focus { border-color: var(--neon-violet); box-shadow: 0 0 10px rgba(189, 0, 255, 0.15); }
    </style>
</head>
<body>
    <div class="app-container">
