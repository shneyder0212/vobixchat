<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>VOBIXCHAT // Quantum WhatsApp 16K Mobile Pro</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Rajdhani:wght@500;600;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
    <style>
        :root, body.theme-violet {
            --bg-quantum: #090212;
            --panel-hud: rgba(14, 5, 26, 0.98);
            --neon-blue: #00f0ff;
            --neon-violet: #bd00ff;
            --neon-green: #00ff66;
            --neon-amber: #ffaa00;
            --neon-red: #ff0055;
            --text-main: #f3e8ff;
            --text-dim: #9d8ec4;
            --border-hud: rgba(189, 0, 255, 0.25);
            --bg-pattern: radial-gradient(circle at 50% 50%, rgba(189, 0, 255, 0.08) 0%, rgba(9, 2, 18, 0.95) 100%), repeating-linear-gradient(0deg, transparent, transparent 40px, rgba(189, 0, 255, 0.02) 40px, rgba(189, 0, 255, 0.02) 41px);
        }

        body.theme-blue {
            --bg-quantum: #010814;
            --panel-hud: rgba(4, 15, 33, 0.98);
            --neon-blue: #00f0ff;
            --neon-violet: #0066ff;
            --neon-green: #00ffcc;
            --neon-amber: #ffaa00;
            --neon-red: #ff0055;
            --text-main: #e8f4fc;
            --text-dim: #7aa2c2;
            --border-hud: rgba(0, 240, 255, 0.3);
            --bg-pattern: radial-gradient(circle at 50% 50%, rgba(0, 240, 255, 0.1) 0%, rgba(1, 8, 20, 0.95) 100%), linear-gradient(90deg, rgba(0,240,255,0.03) 1px, transparent 1px), linear-gradient(0deg, rgba(0,240,255,0.03) 1px, transparent 1px);
            background-size: 100% 100%, 30px 30px, 30px 30px;
        }

        body.theme-matrix {
            --bg-quantum: #020a05;
            --panel-hud: rgba(4, 20, 10, 0.98);
            --neon-blue: #00ff66;
            --neon-violet: #00ccff;
            --neon-green: #00ff33;
            --neon-amber: #ccff00;
            --neon-red: #ff0033;
            --text-main: #e8fcf0;
            --text-dim: #7ac295;
            --border-hud: rgba(0, 255, 102, 0.3);
            --bg-pattern: radial-gradient(circle at 50% 50%, rgba(0, 255, 102, 0.1) 0%, rgba(2, 10, 5, 0.95) 100%), repeating-linear-gradient(45deg, rgba(0,255,102,0.02) 0, rgba(0,255,102,0.02) 2px, transparent 0, transparent 10px);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        html, body {
            background-color: var(--bg-quantum);
            background-image: var(--bg-pattern);
            font-family: 'Rajdhani', sans-serif;
            color: var(--text-main);
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: fixed;
            top: 0;
            left: 0;
            transition: background 0.5s ease;
        }

        .app-container {
            width: 100vw; height: 100vh; max-width: 1400px;
            background: var(--panel-hud); display: flex; flex-direction: column;
            overflow: hidden; position: relative; border: 1px solid var(--border-hud);
            backdrop-filter: blur(15px);
        }

        /* ACCESO Y LOGIN */
        .auth-overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(4, 2, 8, 0.96); backdrop-filter: blur(25px);
            display: flex; justify-content: center; align-items: center; z-index: 2000; padding: 15px;
        }
        .auth-card {
            width: 100%; max-width: 380px; background: var(--panel-hud);
            border: 1px solid var(--border-hud); border-radius: 14px; padding: 22px; display: flex; flex-direction: column; gap: 12px;
            box-shadow: 0 0 25px rgba(0,0,0,0.8);
        }
        .auth-card h2 { font-family: 'Orbitron', sans-serif; color: var(--neon-blue); font-size: 1.1rem; text-align: center; }
        .auth-card p { font-family: 'Share Tech Mono', monospace; font-size: 0.7rem; color: var(--text-dim); text-align: center; }
        .auth-input { background: #000; border: 1px solid var(--border-hud); color: #fff; padding: 12px; font-family: 'Share Tech Mono'; border-radius: 6px; outline: none; font-size: 1rem; width: 100%; }
        .auth-btn { background: var(--neon-blue); color: #000; border: none; padding: 12px; font-family: 'Orbitron'; font-weight: bold; border-radius: 6px; cursor: pointer; font-size: 0.95rem; text-align: center; transition: 0.2s; }
        .auth-btn:hover { filter: brightness(1.2); }

        .big-pin-display {
            font-family: 'Orbitron', sans-serif; font-size: 2.2rem; color: var(--neon-green);
            text-align: center; letter-spacing: 4px; background: rgba(0,255,102,0.05);
            border: 1px dashed var(--neon-green); padding: 12px; border-radius: 8px; margin: 10px 0;
        }

        /* BARRA SUPERIOR */
        .main-header-bar {
            padding: 4px 6px; background: rgba(2, 4, 10, 0.95); border-bottom: 1px solid var(--border-hud);
            display: flex; justify-content: space-between; align-items: center; flex-shrink: 0; height: 50px;
        }
        
        .header-profile-section { display: flex; align-items: center; gap: 5px; flex: 1; min-width: 0; }
        .profile-avatar-container {
            width: 30px; height: 30px; border-radius: 50%; border: 1px solid var(--neon-blue);
            background: linear-gradient(135deg, var(--neon-blue), var(--neon-violet));
            display: flex; align-items: center; justify-content: center; font-family: 'Orbitron'; font-weight: bold; color: #000; font-size: 0.75rem;
        }
        
        .header-info-group { display: flex; flex-direction: column; min-width: 0; }
        .header-username-display { font-family: 'Orbitron', sans-serif; font-size: 0.7rem; color: var(--text-main); font-weight: bold; white-space: nowrap; overflow: hidden; }
        .header-user-status { font-size: 0.4rem; color: var(--neon-green); font-family: 'Share Tech Mono'; }

        .header-right-group { display: flex; gap: 2px; align-items: center; flex-shrink: 0; }
        .whatsapp-icon-btn { background: none; border: none; color: var(--neon-blue); cursor: pointer; font-size: 0.9rem; padding: 3px; }
        .logout-action-btn { background: var(--neon-red); color: #fff; border: none; padding: 3px 5px; border-radius: 4px; font-size: 0.5rem; cursor: pointer; }

        /* NUEVO MENÚ MODAL CENTRADO (ESTILO VENTANA FLOTANTE PERFECTA) */
        .modal-menu-overlay {
            display: none; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(2, 2, 8, 0.85); backdrop-filter: blur(10px); z-index: 9999;
            justify-content: center; align-items: center; padding: 20px;
        }
        .modal-menu-box {
            background: var(--panel-hud); border: 1px solid var(--neon-blue); border-radius: 16px;
            width: 100%; max-width: 340px; max-height: 80vh; display: flex; flex-direction: column;
            box-shadow: 0 0 40px rgba(0, 240, 255, 0.3); overflow: hidden;
        }
        .modal-menu-header {
            padding: 12px 15px; background: rgba(0,0,0,0.6); border-bottom: 1px solid var(--border-hud);
            display: flex; justify-content: space-between; align-items: center; font-family: 'Orbitron'; color: var(--neon-blue); font-size: 0.85rem;
        }
        .modal-menu-content {
            padding: 12px; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; flex: 1;
        }
        .dropdown-item {
            background: rgba(255, 255, 255, 0.03); border: 1px solid var(--border-hud); color: var(--text-main);
            padding: 11px 14px; border-radius: 8px; font-family: 'Share Tech Mono', monospace; font-size: 0.85rem; cursor: pointer; text-align: left; transition: 0.2s;
        }
        .dropdown-item:hover { background: rgba(0, 240, 255, 0.15); color: var(--neon-blue); border-color: var(--neon-blue); }
        .dropdown-item.danger { border-color: rgba(255,0,85,0.4); color: var(--neon-red); }
        .dropdown-item.danger:hover { background: rgba(255,0,85,0.15); }

        /* ÁREA CHAT */
        .workspace-area { flex: 1; display: flex; flex-direction: column; position: relative; overflow: hidden; height: calc(100vh - 50px); }
        .messages-display { flex: 1; padding: 12px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; padding-bottom: 90px; }
        
        .writing-popup-overlay {
            position: absolute; top: 0; left: 0; right: 0; bottom: 0;
            background: var(--panel-hud); padding: 12px; display: none; flex-direction: column; z-index: 250;
        }
        .writing-popup-overlay.active { display: flex; }
        
        .chat-input-deck {
            padding: 8px 12px; background: rgba(2, 4, 10, 0.95); border-top: 1px solid var(--border-hud);
            display: flex; gap: 8px; align-items: center; position: absolute; bottom: 0; width: 100%; height: 60px;
        }
        .quantum-input {
            flex: 1; background: #000; border: 1px solid var(--neon-blue); border-radius: 25px;
            padding: 9px 15px; color: var(--text-main); font-size: 0.85rem; outline: none;
        }
    </style>
</head>
<body class="theme-violet">

    <div class="auth-overlay" id="authOverlay">
        <div class="auth-card">
            <h2>VOBIXCHAT // ACCESO</h2>
            <p>Introduce tus datos de acceso.</p>
            <input type="text" id="authPhoneInput" class="auth-input" placeholder="Tu Teléfono" style="margin-bottom: 8px;">
            <input type="text" id="authNameInput" class="auth-input" placeholder="Tu Nombre o Alias" style="margin-bottom: 8px;">
            <button class="auth-btn" id="requestRandomPinBtn">ENVIAR PIN</button>
            <div id="authErrorMsg" style="color:var(--neon-red); font-size:0.65rem; text-align:center; margin-top:4px;"></div>
        </div>
    </div>

    <!-- BARRA SUPERIOR -->
    <div class="main-header-bar">
        <div class="header-profile-section">
            <div class="profile-avatar-container" id="profileAvatarInitial">V</div>
            <div class="header-info-group">
                <div class="header-username-display" id="roomTitleDisplay">GENERAL</div>
                <div class="header-user-status">🟢 En línea</div>
            </div>
        </div>

        <div class="header-right-group">
            <button class="whatsapp-icon-btn" onclick="openToolsModal()" title="Menú de Herramientas" style="font-size: 1.2rem;">⋮</button>
            <button class="logout-action-btn" onclick="location.reload()">SALIR</button>
        </div>
    </div>

    <!-- VENTANA MODAL DE HERRAMIENTAS CENTRADA -->
    <div class="modal-menu-overlay" id="toolsModalOverlay" onclick="closeToolsModal(event)">
        <div class="modal-menu-box" onclick="event.stopPropagation()">
            <div class="modal-menu-header">
                <span>🛠️ HERRAMIENTAS VOBIX</span>
                <button onclick="closeToolsModal()" style="background:none; border:none; color:var(--neon-red); font-weight:bold; font-size:1rem; cursor:pointer;">✕</button>
            </div>
            <div class="modal-menu-content">
                <button class="dropdown-item" onclick="switchActiveChatPrompt(); closeToolsModal();">💬 Abrir Nuevo Chat / Sala</button>
                <button class="dropdown-item" onclick="switchTheme('violet'); closeToolsModal();">🟪 Tema: Cyber-Vortex (Violeta)</button>
                <button class="dropdown-item" onclick="switchTheme('blue'); closeToolsModal();">🟦 Tema: Quantum Grid (Azul)</button>
                <button class="dropdown-item" onclick="switchTheme('matrix'); closeToolsModal();">🟩 Tema: Cyberpunk Matrix (Verde)</button>
                <button class="dropdown-item danger" onclick="alert('Usuario bloqueado'); closeToolsModal();">🚫 Bloquear / Desbloquear</button>
                <button class="dropdown-item" onclick="alert('Traductor AI abierto'); closeToolsModal();">🌐 Traductor AI</button>
                <button class="dropdown-item" onclick="alert('Nube abierta'); closeToolsModal();">☁️ Nube Ilimitada</button>
                <button class="dropdown-item" onclick="alert('Reuniones'); closeToolsModal();">📅 Reuniones / Citas</button>
                <button class="dropdown-item" onclick="alert('Firma'); closeToolsModal();">📜 Firma Remota</button>
                <button class="dropdown-item" onclick="alert('Búnker'); closeToolsModal();">📦 Búnker</button>
                <button class="dropdown-item" onclick="alert('Señas'); closeToolsModal();">🤟 Lector de Señas</button>
            </div>
        </div>
    </div>

    <!-- ÁREA CHAT -->
    <div class="workspace-area">
        <div class="messages-display" id="messagesContainer">
            <div class="quantum-msg incoming" style="background:rgba(0,240,255,0.05); padding:10px; border-radius:8px;">
                <strong>[SISTEMA]</strong>: Menú centralizado modal activado con éxito.
            </div>
        </div>

        <div class="chat-input-deck" id="chatInputDeckArea">
            <input type="text" id="messageInput" class="quantum-input" placeholder="Escribir mensaje..." readonly>
        </div>
    </div>

    <script>
        const socket = io();
        let myUsername = "Usuario";

        document.getElementById('requestRandomPinBtn').addEventListener('click', () => {
            const name = document.getElementById('authNameInput').value.trim();
            if(!name) return document.getElementById('authErrorMsg').textContent = "Introduce un nombre.";
            myUsername = name;
            document.getElementById('roomTitleDisplay').textContent = name.toUpperCase();
            document.getElementById('profileAvatarInitial').textContent = name.charAt(0).toUpperCase();
            document.getElementById('authOverlay').style.display = 'none';
        });

        // Control de la ventana modal central
        const toolsModalOverlay = document.getElementById('toolsModalOverlay');
        window.openToolsModal = () => { toolsModalOverlay.style.display = 'flex'; };
        window.closeToolsModal = () => { toolsModalOverlay.style.display = 'none'; };

        window.switchActiveChatPrompt = () => {
            const newChat = prompt("Nombre de la sala o contacto:");
            if(newChat && newChat.trim() !== "") {
                document.getElementById('roomTitleDisplay').textContent = newChat.trim().toUpperCase();
                document.getElementById('profileAvatarInitial').textContent = newChat.trim().charAt(0).toUpperCase();
            }
        };

        window.switchTheme = (themeName) => {
            document.body.className = 'theme-' + themeName;
            localStorage.setItem('vobix_theme', themeName);
        };

        const savedTheme = localStorage.getItem('vobix_theme');
        if(savedTheme) document.body.className = 'theme-' + savedTheme;
    </script>
</body>
</html>
