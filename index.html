<script>
    // --- SOLUCIÓN DEFINITIVA DE TECLADO PARA SAMSUNG S24 PLUS ---
    const messageInput = document.getElementById('messageInput');
    const writingPopup = document.getElementById('writingPopup');
    const popupMessageInput = document.getElementById('popupMessageInput');
    const chatInputDeckArea = document.getElementById('chatInputDeckArea');
    const messagesContainer = document.getElementById('messagesContainer');
    const immersiveChatHistory = document.getElementById('immersiveChatHistory');

    // Permitir escritura directa y forzar despliegue de teclado nativo
    messageInput.removeAttribute('readonly'); // Aseguramos que no esté bloqueado
    
    const abrirTecladoNativo = (e) => {
        if(isUserBlocked) return;
        
        // Copiamos los mensajes al historial inmersivo
        immersiveChatHistory.innerHTML = messagesContainer.innerHTML;
        writingPopup.classList.add('active');
        chatInputDeckArea.style.display = 'none'; 
        
        popupMessageInput.value = messageInput.value;
        
        // Forzamos el foco de manera limpia para que el sistema abra el teclado táctil de Samsung
        setTimeout(() => {
            popupMessageInput.focus();
        }, 100);

        immersiveChatHistory.scrollTop = immersiveChatHistory.scrollHeight;
    };

    // Escuchamos el toque de manera limpia
    messageInput.addEventListener('click', abrirTecladoNativo);
    messageInput.addEventListener('focus', abrirTecladoNativo);

    window.closeWritingPopup = () => {
        writingPopup.classList.remove('active');
        chatInputDeckArea.style.display = 'flex'; 
    };

    window.sendFromPopup = () => {
        let val = popupMessageInput.value.trim();
        if(!val) return;
        socket.emit('chat_message', { room: currentRoom, type: 'text', text: val, sender: myUsername });
        messageInput.value = '';
        popupMessageInput.value = '';
        writingPopup.classList.remove('active');
        chatInputDeckArea.style.display = 'flex';
    };
</script>
