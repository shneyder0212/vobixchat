<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>VobixChat</title><script src="/socket.io/socket.io.js"></script><script src="https://unpkg.com/simple-peer@9.11.1/simplepeer.min.js"></script><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"><style>*{box-sizing:border-box;font-family:Inter,system-ui}html,body{height:100%;margin:0;background:#111b21;overflow:hidden}#loginView{min-height:100vh;display:flex;align-items:center;justify-content:center;background:#080c09;position:relative}#loginView::before{content:"";position:absolute;inset:0;background-image:radial-gradient(#6eff7a 1.2px,transparent 1.3px);background-size:32px 32px;opacity:.28}.card{position:relative;width:380px;background:#111a13;border:1.5px solid #6eff7a;border-radius:28px;padding:28px;text-align:center;box-shadow:0 0 50px rgba(110,255,122,.5)}.logo{width:88px;height:88px;margin:0 auto 14px;background:#6eff7a;border-radius:22px;display:flex;align-items:center;justify-content:center;font-size:52px;font-weight:900;color:#0a1f0e}.btn{width:100%;background:#6eff7a;border:none;padding:16px;border-radius:16px;font-weight:900;color:#0a2a12;cursor:pointer}input.login{width:100%;background:transparent;border:1.5px solid #1e3d24;border-radius:16px;padding:15px;color:#fff;outline:none;margin:6px 0}#chatView{display:none;height:100vh}.app{display:flex;height:100vh}.sidebar{width:35%;min-width:380px;background:#111b21;border-right:1px solid #222d34;display:flex;flex-direction:column}.side-top{height:60px;background:#202c33;display:flex;align-items:center;justify-content:space-between;padding:0 16px;color:#e9edef}.chat{flex:1;display:flex;flex-direction:column;background:#0b141a}.chat-header{height:60px;background:#202c33;display:flex;align-items:center;justify-content:space-between;padding:0 16px;color:#e9edef}#messages{flex:1;overflow-y:auto;padding:20px}.msg{max-width:65%;padding:8px 12px;border-radius:8px;margin:4px 0;font-size:14px}.msg.me{background:#005c4b;color:#e9edef;margin-left:auto}.msg.other{background:#202c33;color:#e9edef;margin-right:auto}.type-box{height:62px;background:#202c33;display:flex;align-items:center;gap:8px;padding:0 10px}.type-box input{flex:1;height:42px;border-radius:21px;background:#2a3942;border:none;color:#e9edef;padding:0 18px;outline:none}.icon{width:42px;height:42px;display:flex;align-items:center;justify-content:center;color:#8696a0;font-size:20px;cursor:pointer;border-radius:50%}.send{width:45px;height:45px;background:#00a884;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#111b21;cursor:pointer}#threeMenu{position:absolute;top:60px;right:10px;width:280px;background:#233138;border-radius:8px;display:none;z-index:50;border:1px solid #2a3942;overflow:hidden}.menu-item{padding:14px;color:#e9edef;cursor:pointer;display:flex;gap:12px;align-items:center}.menu-item:hover{background:#2a3942}.video-overlay{position:absolute;inset:0;background:#000;z-index:30;display:none;flex-direction:column}.video-overlay.active{display:flex}.vid-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px;flex:1;padding:10px}.vid{aspect-ratio:16/9;background:#111;border-radius:12px;border:2px solid #00a884;overflow:hidden}.vid video{width:100%;height:100%;object-fit:cover}.call-controls{height:80px;background:#202c33;display:flex;justify-content:center;gap:20px;align-items:center}.call-btn{width:56px;height:56px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:22px;cursor:pointer}.hang{background:#f15c6d;color:#fff}.emoji-panel{position:absolute;bottom:62px;left:10px;width:320px;background:#233138;border-radius:12px;display:none;padding:10px;z-index:20;flex-wrap:wrap;gap:6px}.emoji-panel.active{display:flex}</style></head><body>
<audio id="ringtone" loop src="https://cdn.pixabay.com/download/audio/2022/03/24/audio_78a0a1e47e.mp3"></audio>
<audio id="msgSound" src="https://cdn.pixabay.com/download/audio/2021/08/04/audio_0625c1539c.mp3"></audio>
<div id="loginView"><div class="card"><div class="logo">V</div><h2 style="color:#fff;margin:0">VOBIXCHAT</h2><p style="color:#6eff7a;font-weight:900;margin:4px 0">FAMILIA GRATIS</p><input class="login" id="user" placeholder="@usuario"><input class="login" id="tel" placeholder="Teléfono"><button class="btn" onclick="doLogin()">VER PIN GRATIS - BRINP</button><div id="pinBox" style="display:none;margin-top:12px"><div id="pinShow" style="background:#6eff7a;padding:14px;border-radius:12px;font-weight:900;font-size:22px;letter-spacing:3px;color:#0a1f0e"></div><input class="login" id="pinInput" placeholder="Escribe el PIN"><button class="btn" style="margin-top:8px" onclick="verifyLogin()">ENTRAR</button></div></div></div>
<div id="chatView"><div class="app"><div class="sidebar"><div class="side-top"><div style="display:flex;gap:10px;align-items:center"><div style="width:40px;height:40px;background:#00a884;border-radius:10px;display:flex;align-items:center;justify-content:center;font-weight:900;color:#111b21">V</div><b>VobixChat</b></div><i class="fa-solid fa-ellipsis-vertical" onclick="let m=document.getElementById('threeMenu');m.style.display=m.style.display==='block'?'none':'block'" style="cursor:pointer"></i><div id="threeMenu"><div class="menu-item" onclick="genInvite()"><i class="fa-solid fa-link" style="color:#00a884"></i>Invitar</div><div class="menu-item" onclick="logout()" style="color:#f15c6d;border-top:1px solid #2a3942"><i class="fa-solid fa-right-from-bracket"></i>Cerrar Sesión</div></div></div><div style="padding:12px"><input id="inviteLink" style="width:100%;background:#202c33;border:1px solid #2a3942;color:#00a884;padding:10px;border-radius:8px" readonly><button onclick="genInvite();copyInvite()" style="width:100%;margin-top:6px;background:#00a884;border:none;padding:10px;border-radius:8px;font-weight:800;cursor:pointer">GENERAR LINK</button></div><div id="meBox" style="padding:10px;color:#e9edef"></div><div style="padding:10px;color:#00a884;font-size:12px">● Siempre activo - BRINP 5min</div></div>
<div class="chat"><div class="chat-header"><div style="display:flex;gap:10px;align-items:center"><div style="width:40px;height:40px;background:#00a884;border-radius:50%;display:flex;align-items:center;justify-content:center">V</div><div><b id="chatName">Sala Privada</b><p style="font-size:11px;color:#00a884;margin:0">● verde</p></div></div><div style="display:flex;gap:16px;font-size:20px;color:#aebac1"><i class="fa-solid fa-video" onclick="startCall(true)" style="cursor:pointer"></i><i class="fa-solid fa-phone" onclick="startCall(false)" style="cursor:pointer"></i><i class="fa-solid fa-user-plus" onclick="addPerson()" style="cursor:pointer"></i></div></div><div id="messages"></div><div class="type-box"><div class="icon" onclick="toggleEmoji()"><i class="fa-regular fa-face-smile"></i></div><div class="icon" onclick="document.getElementById('fileDoc').click()"><i class="fa-solid fa-paperclip"></i></div><div class="icon" onclick="document.getElementById('fileCam').click()"><i class="fa-solid fa-camera"></i></div><input id="msgInput" placeholder="Escribe" onkeydown="if(event.key==='Enter')sendMsg()"><div class="icon" id="micBtn" onmousedown="startVoice()" onmouseup="stopVoice()"><i class="fa-solid fa-microphone"></i></div><div class="send" onclick="sendMsg()"><i class="fa-solid fa-paper-plane"></i></div><div class="emoji-panel" id="emojiPanel"></div><input type="file" id="fileDoc" hidden><input type="file" id="fileCam" accept="image/*,video/*" hidden></div><div class="video-overlay" id="videoOverlay"><div class="vid-grid" id="videoGrid"></div><div class="call-controls"><div class="call-btn" style="background:#2a3942;color:#fff" onclick="addPerson()"><i class="fa-solid fa-user-plus"></i></div><div class="call-btn hang" onclick="endCall()"><i class="fa-solid fa-phone-slash"></i></div><div class="call-btn" style="background:#2a3942;color:#fff" onclick="toggleMute()"><i class="fa-solid fa-microphone" id="muteIcon"></i></div></div></div></div></div></div>
<script>
const socket=io();let myUsername=null,peers={},localStream=null,myRoom='privada',wakeLock=null;
let saved=localStorage.getItem('vobix_user_final');if(saved){try{myUsername=JSON.parse(saved).username;showChat();}catch(e){}}
async function keepAlive(){try{if('wakeLock' in navigator){wakeLock=await navigator.wakeLock.request('screen');}}catch(e){}setInterval(()=>{if(socket.disconnected)socket.connect();},10000);}keepAlive();
window.addEventListener('beforeunload',e=>{e.preventDefault();e.returnValue='Siempre activo ¿Seguro?';return e.returnValue;});
const ringtone=document.getElementById('ringtone');const msgSound=document.getElementById('msgSound');
function brinp(){try{let ctx=new(window.AudioContext||window.webkitAudioContext)();let o=ctx.createOscillator();let g=ctx.createGain();o.frequency.value=880;g.gain.value=0.2;o.connect(g);g.connect(ctx.destination);o.start();g.gain.exponentialRampToValueAtTime(0.0001,ctx.currentTime+0.5);setTimeout(()=>ctx.close(),600);}catch(e){}}setInterval(brinp,5*60*1000);
async function doLogin(){let u=document.getElementById('user').value.trim().replace('@','');let t=document.getElementById('tel').value.trim();if(!u||!t)return alert('Usuario y tel');let r=await fetch('/send-pin',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({phone:t,username:u})});let j=await r.json();document.getElementById('pinBox').style.display='block';document.getElementById('pinShow').innerText='PIN: '+j.pin;brinp();}
async function verifyLogin(){let t=document.getElementById('tel').value.trim();let pin=document.getElementById('pinInput').value.trim();let r=await fetch('/verify-pin',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({phone:t,pin})});let j=await r.json();if(!j.ok)return alert('PIN mal');myUsername=j.username;localStorage.setItem('vobix_user_final',JSON.stringify({username:myUsername,phone:t}));showChat();brinp();}
function showChat(){document.getElementById('loginView').style.display='none';document.getElementById('chatView').style.display='block';document.getElementById('meBox').innerHTML='@'+myUsername;document.getElementById('chatName').innerText='Sala Privada @'+myUsername;socket.emit('set-user',myUsername);genInvite();}
function logout(){if(!confirm('¿Cerrar sesión?'))return;localStorage.removeItem('vobix_user_final');location.reload();}
function genInvite(){if(!myUsername)return;let link=location.origin+'?invite='+myUsername;document.getElementById('inviteLink').value=link;return link;}
function copyInvite(){let i=document.getElementById('inviteLink');i.select();document.execCommand('copy');alert('Link copiado');}
function sendMsg(){let i=document.getElementById('msgInput');let txt=i.value.trim();if(!txt)return;socket.emit('chat',{from:myUsername,text:txt,room:myRoom});addMsg(myUsername+': '+txt,'me');i.value='';}
function addMsg(t,cls){let b=document.getElementById('messages');let d=document.createElement('div');d.className='msg '+cls;d.innerText=t;b.appendChild(d);b.scrollTop=b.scrollHeight;}
socket.on('chat',d=>{if(d.from!==myUsername){addMsg(d.from+': '+d.text,'other');try{msgSound.currentTime=0;msgSound.play();}catch(e){}brinp();}});
let emojis=['😀','😂','❤️','🔥','👍','😍','😢','🙏','😎','🥳','🤣'];function toggleEmoji(){let p=document.getElementById('emojiPanel');p.classList.toggle('active');if(p.innerHTML===''){emojis.forEach(e=>{let s=document.createElement('span');s.innerText=e;s.style.fontSize='22px';s.style.cursor='pointer';s.style.padding='4px';s.onclick=()=>{document.getElementById('msgInput').value+=e;};p.appendChild(s);});}}
let mediaRec,voiceChunks=[];async function startVoice(){try{let s=await navigator.mediaDevices.getUserMedia({audio:true});mediaRec=new MediaRecorder(s);voiceChunks=[];mediaRec.ondataavailable=e=>voiceChunks.push(e.data);mediaRec.onstop=()=>{let blob=new Blob(voiceChunks,{type:'audio/webm'});let url=URL.createObjectURL(blob);let a=document.createElement('audio');a.controls=true;a.src=url;a.style.maxWidth='250px';a.style.margin='6px 20px';document.getElementById('messages').appendChild(a);};mediaRec.start();}catch(e){}}function stopVoice(){if(mediaRec&&mediaRec.state==='recording')mediaRec.stop();}
async function startCall(video){try{localStream=await navigator.mediaDevices.getUserMedia({video:video,audio:true});document.getElementById('videoOverlay').classList.add('active');addVideo('yo-'+socket.id,localStream);socket.emit('meet-join',{room:myRoom,user:myUsername});try{ringtone.currentTime=0;ringtone.play();setTimeout(()=>ringtone.pause(),3000);}catch(e){}}catch(e){alert(e.message)}}
function addVideo(id,stream){if(document.getElementById(id))return;let g=document.getElementById('videoGrid');let d=document.createElement('div');d.className='vid';d.id=id;let v=document.createElement('video');v.autoplay=true;v.playsInline=true;v.muted=id.startsWith('yo-');v.srcObject=stream;d.appendChild(v);g.appendChild(d);}
socket.on('meet-users',users=>{users.forEach(u=>{let p=new SimplePeer({initiator:true,trickle:false,stream:localStream});p.on('signal',s=>socket.emit('meet-signal',{to:u.id,signal:s}));p.on('stream',s=>addVideo(u.id,s));peers[u.id]=p;});});
socket.on('meet-user-joined',({id})=>{let p=new SimplePeer({initiator:false,trickle:false,stream:localStream});p.on('signal',s=>socket.emit('meet-signal',{to:id,signal:s}));p.on('stream',s=>addVideo(id,s));peers[id]=p;});
socket.on('meet-user-left',id=>{if(peers[id])peers[id].destroy();delete peers[id];let el=document.getElementById(id);if(el)el.remove();});
function endCall(){try{ringtone.pause();}catch(e){}if(localStream)localStream.getTracks().forEach(t=>t.stop());Object.values(peers).forEach(p=>p.destroy());peers={};document.getElementById('videoGrid').innerHTML='';document.getElementById('videoOverlay').classList.remove('active');socket.emit('meet-leave',{room:myRoom});}
function addPerson(){let link=genInvite();prompt('Link videollamada:',link);}
let muted=false;function toggleMute(){muted=!muted;if(localStream)localStream.getAudioTracks().forEach(t=>t.enabled=!muted);document.getElementById('muteIcon').className=muted?'fa-solid fa-microphone-slash':'fa-solid fa-microphone';}
</script></body></html>
