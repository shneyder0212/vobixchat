<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VobixChat</title>
<style>
body{margin:0;font-family:sans-serif;background:#111;color:#fff}
#login,#chat{padding:20px}
input,button{width:100%;padding:12px;margin:8px 0;border-radius:8px;border:none}
button{background:#00ff88;font-weight:bold}
.bottom-menu{position:fixed;bottom:0;left:0;right:0;display:flex;background:#000;border-top:1px solid #333}
.bottom-menu div{flex:1;text-align:center;padding:14px 0;font-size:12px}
.bottom-menu div.active{color:#00ff88;border-top:2px solid #00ff88}
#messages div{background:#222;margin:5px 0;padding:10px;border-radius:8px}
</style>
</head>
<body>

<div id="login">
<h2>VobixChat</h2>
<input id="username" placeholder="@usuario">
<input id="phone" placeholder="+34 6XX XXX XXX">
<button onclick="sendPin()">Enviar PIN</button>
<input id="pin" placeholder="PIN">
<button onclick="verifyPin()">Verificar</button>
<p id="msg"></p>
</div>

<div id="chat" style="display:none">
<h3 id="myUser"></h3>
<div id="messages"></div>
<input id="text" placeholder="Escribe...">
<button onclick="sendChat()">Enviar</button>
</div>

<div class="bottom-menu">
<div class="active" onclick="showTab('chats')">💬<br>Chats</div>
<div onclick="showTab('llamadas')">📞<br>Llamadas</div>
<div onclick="showTab('perfil')">👤<br>Perfil</div>
<div onclick="location.href='/admin.html?key=sh6684'">🛡️<br>Admin</div>
</div>

<script src="/socket.io/socket.io.js"></script>
<script src="/app.js"></script>
<script>
function sendPin(){
  fetch('/send-pin',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:document.getElementById('username').value, phone:document.getElementById('phone').value})})
  .then(r=>r.json()).then(d=>{
    document.getElementById('msg').innerText = d.msg || (d.gratis ? 'PIN GRATIS - Mira Render Logs' : 'PIN enviado');
  });
}
function verifyPin(){
  fetch('/verify-pin',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({phone:document.getElementById('phone').value, pin:document.getElementById('pin').value})})
  .then(r=>r.json()).then(d=>{
    if(d.ok){
      guardarParaSiempre(document.getElementById('username').value, document.getElementById('phone').value);
      document.getElementById('login').style.display='none';
      document.getElementById('chat').style.display='block';
      document.getElementById('myUser').innerText = '@'+document.getElementById('username').value;
    } else { document.getElementById('msg').innerText='PIN incorrecto'; }
  });
}
function sendChat(){
  let t=document.getElementById('text').value;
  if(!t) return;
  let my=JSON.parse(localStorage.getItem('vobix_user'));
  socket.emit('chat',{username:my.username, text:t});
  document.getElementById('text').value='';
}
function showTab(t){
  if(t=='llamadas') alert('Llamadas - proximamente con timbre y vibrador');
  if(t=='perfil'){ let my=JSON.parse(localStorage.getItem('vobix_user')); alert('Perfil: @'+my.username+'\n'+my.phone+'\nRegistrado para siempre'); }
}
</script>
</body>
</html>
