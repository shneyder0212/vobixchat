<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>VobixChat</title>
<style>
*{box-sizing:border-box;font-family:Arial}body{margin:0;min-height:100vh;background:#080c09;display:flex;justify-content:center;align-items:center;background-image:radial-gradient(rgba(58,255,104,.22) 1.6px,transparent 1.6px);background-size:22px 22px}
.card{width:350px;background:#0a110b;border:2px solid #3aff68;border-radius:22px;padding:20px 18px;text-align:center;box-shadow:0 0 40px #3aff68aa}
.logo{width:70px;height:70px;background:#3aff68;border-radius:16px;margin:0 auto 12px;display:flex;align-items:center;justify-content:center;font-size:38px;font-weight:900;color:#000}
h1{margin:0;color:#fff;font-size:32px;font-weight:900} .g{color:#3aff68;font-size:16px;font-weight:900;margin:6px 0} .w{color:#fff;font-size:10px;letter-spacing:2px} .e{color:#8ac898;font-size:10px;margin:8px 0 16px}
input{width:100%;background:#0a150c;border:1.5px solid #234427;border-radius:12px;padding:13px;color:#fff;outline:none;margin-bottom:10px}
.row{display:flex;gap:8px} .row div:first-child{width:70px} .row div:last-child{flex:1}
.p{font-size:10px;color:#7ba882;text-align:left;margin-bottom:12px}
.btn{width:100%;background:#3aff68;border:none;padding:13px;border-radius:12px;font-weight:900;cursor:pointer}
#pinBox{display:none;margin-top:10px}
</style>
</head>
<body>
<div class="card">
<div class="logo">V</div>
<h1>VOBIXCHAT</h1>
<div class="g">TODO EN UNO</div>
<div class="w">SEGURO • RAPIDO • PRIVADO</div>
<div class="e">🔒 Cifrado de extremo a extremo</div>
<input id="username" placeholder="Nombre de usuario" value="SHNEYDER">
<div class="row"><div><input value="+34" readonly></div><div><input id="phone" placeholder="655766134" value="655766134"></div></div>
<div class="p">Pais detectado: ES - Prefijo +34</div>
<button class="btn" onclick="enviarPin()">ENVIARME PIN POR SMS</button>
<div id="pinBox"><input id="pin" placeholder="PIN 123456"><button class="btn" onclick="verificar()" style="margin-top:8px">VERIFICAR Y ENTRAR</button></div>
</div>
<script>
function enviarPin(){
 document.getElementById('pinBox').style.display='block';
 alert('Tu PIN es: 123456');
}
function verificar(){
 if(document.getElementById('pin').value.trim()==='123456'){
   localStorage.setItem('vobix_user',document.getElementById('username').value);
   localStorage.setItem('vobix_phone',document.getElementById('phone').value);
   location.href='chat.html';
 } else alert('Usa 123456');
}
</script>
</body>
</html>
