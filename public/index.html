<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VOBIXCHAT TODO EN UNO</title>
<style>
body{background:#070a08;color:white;font-family:Arial;display:flex;justify-content:center;align-items:center;min-height:100vh;margin:0}
.card{background:#101512;border:1px solid #1a2e1d;border-radius:20px;padding:25px;width:360px;box-shadow:0 0 30px #00ff6820;text-align:center}
.logo{width:70px;height:70px;background:linear-gradient(#00ff6a,#7cff00);border-radius:18px;margin:0 auto 15px;display:flex;align-items:center;justify-content:center;font-size:40px;font-weight:900;color:black}
h1{margin:0;letter-spacing:2px}
.sub{color:#00ff6a;margin:5px 0 15px;font-weight:bold}
input{width:100%;background:#0a0e0b;border:1px solid #1e3a24;border-radius:12px;padding:14px;margin:8px 0;color:white;box-sizing:border-box;outline:none}
.row{display:flex;gap:8px}
.row div:first-child{width:80px}
button{width:100%;background:#0a0e0b;border:1.5px solid #00ff6a;color:#00ff6a;padding:14px;border-radius:12px;font-weight:900;cursor:pointer;margin-top:10px;letter-spacing:1px}
button:hover{background:#00ff6a;color:black}
.small{font-size:12px;opacity:0.7;margin:10px 0}
#chatScreen{display:none}
.contact{background:#0a0e0b;border:1px solid #1e3a24;border-radius:12px;padding:12px;margin:6px 0;text-align:left}
</style>
</head>
<body>
<div class="card" id="loginScreen">
<div class="logo">V</div>
<h1>VOBIXCHAT</h1>
<div class="sub">TODO EN UNO</div>
<div class="small">SEGURO • RAPIDO • PRIVADO</div>

<input id="username" placeholder="Nombre de usuario - Ej: SHNEYDER">
<div class="row">
<div><input id="prefix" value="+34" readonly></div>
<div style="flex:1"><input id="phone" placeholder="655766134"></div>
</div>
<div class="small" id="pais">País detectado: ES - Prefijo +34</div>
<button onclick="sendPin()">ENVIARME PIN POR SMS</button>

<div id="pinBox" style="display:none">
<input id="pin" placeholder="Escribe el PIN de 6 dígitos">
<button onclick="verifyPin()">VERIFICAR Y ENTRAR</button>
</div>
</div>

<div class="card" id="chatScreen">
<div class="logo" style="width:50px;height:50px;font-size:24px">V</div>
<h3 id="welcome"></h3>
<div class="small">Chats recientes</div>
<div id="chats">
<div class="contact">📢 Comunicaciones Oficiales</div>
<div class="contact">👑 Admin</div>
</div>
<input id="msg" placeholder="Escribe un mensaje...">
<button onclick="sendMsg()">ENVIAR</button>
<button onclick="logout()" style="border-color:#ff3b3b;color:#ff3b3b">SALIR</button>
</div>

<script>
let currentPhone = "";
let currentUser = "";

async function sendPin(){
 currentUser = document.getElementById('username').value.trim();
 currentPhone = document.getElementById('prefix').value + document.getElementById('phone').value;
 if(!currentUser){alert('Pon nombre de usuario'); return;}
 if(currentPhone.length < 10){alert('Pon teléfono'); return;}

 const res = await fetch('/send-pin',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({phone:currentPhone})});
 const data = await res.json();
 if(data.ok){
   alert('PIN enviado a '+currentPhone);
   document.getElementById('pinBox').style.display='block';
 } else {
   alert('Error: '+ data.error);
 }
}
async function verifyPin(){
 const pin = document.getElementById('pin').value;
 const res = await fetch('/verify-pin',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({phone:currentPhone, pin, username: currentUser})});
 const data = await res.json();
 if(data.ok){
   localStorage.setItem('vobix_user', currentUser);
   localStorage.setItem('vobix_phone', currentPhone);
   showChat();
 } else {
   alert('PIN incorrecto');
 }
}
function showChat(){
 document.getElementById('loginScreen').style.display='none';
 document.getElementById('chatScreen').style.display='block';
 document.getElementById('welcome').innerText = 'Hola, ' + (localStorage.getItem('vobix_user') || currentUser);
}
function logout(){
 localStorage.clear();
 location.reload();
}
function sendMsg(){
 const t = document.getElementById('msg').value;
 if(!t) return;
 const div = document.createElement('div');
 div.className='contact';
 div.innerText = (localStorage.getItem('vobix_user')||'Yo')+': '+t;
 document.getElementById('chats').appendChild(div);
 document.getElementById('msg').value='';
}
// Auto-login si ya verificó
if(localStorage.getItem('vobix_phone')){
 currentUser = localStorage.getItem('vobix_user');
 showChat();
}
</script>
</body>
</html>
