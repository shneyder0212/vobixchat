<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>VobixChat</title>
<style>
*{box-sizing:border-box;font-family:Arial}body{margin:0;min-height:100vh;background:#080c09;display:flex;justify-content:center;align-items:center;background-image:radial-gradient(rgba(58,255,104,.18) 1.5px, transparent 1.5px);background-size:24px 24px}
.card{width:360px;background:#0a110b;border:2px solid #3aff68;border-radius:26px;padding:22px 18px;text-align:center;box-shadow:0 0 40px #3aff68aa}
.logo{width:76px;height:76px;background:#3aff68;border-radius:18px;margin:0 auto 14px;display:flex;align-items:center;justify-content:center;font-size:42px;font-weight:900}
h1{margin:0;color:#fff;font-size:38px;font-weight:900} .t1{color:#3aff68;font-size:20px;font-weight:900;margin:8px 0 6px} .t2{color:#fff;font-size:11px;letter-spacing:2px;font-weight:800} .e2e{margin:8px 0 18px;color:#8ac898;font-size:11px}
input{width:100%;background:#0a150c;border:1.5px solid #234427;border-radius:14px;padding:14px;color:#fff;outline:none} .row{display:flex;gap:8px;margin:12px 0} .pref{width:75px} .num{flex:1} .pais{font-size:11px;color:#7ba882;text-align:left;margin-bottom:14px}
.btn{width:100%;background:#3aff68;border:none;padding:15px;border-radius:14px;font-weight:900;cursor:pointer} #pinBox{display:none;margin-top:12px}
</style>
</head>
<body>
<div class="card">
<div class="logo">V</div>
<h1>VOBIXCHAT</h1>
<div class="t1">TODO EN UNO</div>
<div class="t2">SEGURO • RAPIDO • PRIVADO</div>
<div class="e2e">🔒 Cifrado de extremo a extremo</div>
<input id="username" value="SHNEYDER">
<div class="row"><div class="pref"><input value="+34" readonly></div><div class="num"><input id="phone" value="655766134"></div></div>
<div class="pais">País detectado: ES - Prefijo +34</div>
<button class="btn" onclick="enviarPin()">ENVIARME PIN POR SMS</button>
<div id="pinBox"><input id="pin" placeholder="PIN 123456"><br><br><button class="btn" onclick="verificar()">VERIFICAR Y ENTRAR</button></div>
</div>
<script>
function enviarPin(){
  document.getElementById('pinBox').style.display='block';
  alert('Tu PIN es: 123456');
}
function verificar(){
  let p=document.getElementById('pin').value;
  if(p==='123456'){ alert('Bienvenido SHNEYDER!'); } else { alert('Usa 123456'); }
}
</script>
</body>
</html>
