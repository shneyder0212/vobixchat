<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>VOBIX</title><style>body{margin:0;background:#02080e;color:#fff;font-family:sans-serif;display:flex;justify-content:center;padding:10px}.app{width:100%;max-width:480px;background:#0f1e2a;border-radius:20px;padding:16px}.card{background:#152535;padding:12px;border-radius:12px;margin-bottom:10px}button{width:100%;padding:12px;background:#25d366;border:none;border-radius:10px;color:#000;font-weight:800;margin-top:6px;cursor:pointer}input{width:100%;padding:12px;border-radius:10px;background:#0f1d28;color:#fff;border:1px solid #333;margin-bottom:6px}#remoteVideo{width:100%;height:300px;background:#000;border-radius:12px;display:none}</style></head><body><div class="app"><h2>VOBIX BOMBA MINI</h2><div class="card"><input id="regNombre" placeholder="Tu nombre"><input id="regTelefono" placeholder="Tu numero"><button onclick="entrar()">Entrar</button></div><div id="panel" style="display:none"><div class="card"><b>ID Remoto: <span id="myId">--</span></b><button onclick="compartir()">🖥️ Compartir mi PC - Gratis $0 P2P</button><div style="display:flex;gap:6px;margin-top:8px"><input id="inputRemoteId" placeholder="ID remoto 123-456-789" style="flex:1"><button onclick="conectar()" style="width:100px">Conectar</button></div></div><video id="remoteVideo" autoplay playsinline></video><div class="card"><input id="nuevoChatInput" placeholder="Numero para chatear"><input id="nuevoChatNombre" placeholder="Nombre"><button onclick="addChat()">Abrir Chat</button><div id="chatsList"></div></div><div id="chatBox" style="display:none"><div class="card"><div id="chatNombre"></div><div id="msgs" style="height:200px;overflow-y:auto;background:#0b141a;padding:8px;border-radius:8px;margin:8px 0"></div><div style="display:flex;gap:6px"><input id="inputMsg" placeholder="Mensaje..." style="flex:1"><button onclick="sendMsg()" style="width:60px">BOMBA</button></div></div></div></div></div><script src="/socket.io/socket.io.js"></script><script>
const socket=io();let myId=null,remotePeer=null,ident="",chats={},dir={};function entrar(){let n=document.getElementById('regNombre').value;let t=document.getElementById('regTelefono').value;if(!n||!t){alert('Completa');return}ident=t.replace(/[^0-9]/g,'');myId=Math.floor(100+Math.random()*900)+'-'+Math.floor(100+Math.random()*900)+'-'+Math.floor(100+Math.random()*900);document.getElementById('myId').innerText=myId;document.getElementById('panel').style.display='block';socket.emit('registrar-canal-llamada',{identificador_usuario:ident});socket.emit('registrar-remote',{id:myId,de:ident})}function compartir(){socket.emit('registrar-remote',{id:myId,de:ident});alert('ID compartido: '+myId+' - Esperando conexion P2P $0')}function conectar(){let id=document.getElementById('inputRemoteId').value.trim();if(!id) return;crearPeer(id,true);socket.emit('solicitar-remote',{id:id,de:ident})}function crearPeer(id,init){if(remotePeer) return;let pc=new RTCPeerConnection({iceServers:[{urls:'stun:stun.l.google.com:19302'}]});remotePeer=pc;pc.ontrack=(e)=>{let v=document.getElementById('remoteVideo');v.style.display='block';v.srcObject=e.streams[0]};pc.onicecandidate=(e)=>{if(e.candidate) socket.emit('senal-remote',{id:id,emisor:myId,dest:id,tipo:'ice',payload:e.candidate})};if(init){pc.createOffer().then(o=>pc.setLocalDescription(o)).then(()=>{socket.emit('senal-remote',{id:id,emisor:myId,dest:id,tipo:'offer',payload:pc.localDescription})})}}function addChat(){let num=document.getElementById('nuevoChatInput').value.replace(/[^0-9]/g,'');let nom=document.getElementById('nuevoChatNombre').value||num;if(!num) return;dir[num]=nom;let div=document.createElement('div');div.style.cssText='padding:10px;background:#1a2d3e;border-radius:10px;margin-top:6px;cursor:pointer';div.innerText=nom+' - '+num;div.onclick=()=>openChat(num);document.getElementById('chatsList').appendChild(div);openChat(num)}function openChat(num){window.chatActivo=num;document.getElementById('chatBox').style.display='block';document.getElementById('chatNombre').innerText=dir[num]||num;let m=document.getElementById('msgs');m.innerHTML='';if(chats[num]) chats[num].forEach(h=>m.innerHTML+=h)}function sendMsg(){let i=document.getElementById('inputMsg');let t=i.value.trim();if(!t||!window.chatActivo) return;let html=`<div style="background:#0a5d43;padding:8px;border-radius:10px;margin-bottom:4px;align-self:flex-end">${t}</div>`;document.getElementById('msgs').innerHTML+=html;if(!chats[window.chatActivo]) chats[window.chatActivo]=[];chats[window.chatActivo].push(html);socket.emit('mensaje-privado',{de:ident,para:window.chatActivo,texto:t});i.value=''}socket.on('mensaje-privado-recibido',d=>{let html=`<div style="background:#1e2f3e;padding:8px;border-radius:10px;margin-bottom:4px">${d.texto}</div>`;if(!chats[d.de]) chats[d.de]=[];chats[d.de].push(html);if(window.chatActivo==d.de) document.getElementById('msgs').innerHTML+=html});socket.on('senal-remote-recibida',async d=>{if(!remotePeer) crearPeer(d.emisor,false);if(d.tipo=='offer'){await remotePeer.setRemoteDescription(d.payload);let ans=await remotePeer.createAnswer();await remotePeer.setLocalDescription(ans);socket.emit('senal-remote',{id:d.id,emisor:myId,dest:d.emisor,tipo:'answer',payload:ans})}else if(d.tipo=='answer'){await remotePeer.setRemoteDescription(d.payload)}else if(d.tipo=='ice'){await remotePeer.addIceCandidate(d.payload)}});
</script></body></html>
