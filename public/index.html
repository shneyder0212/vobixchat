<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>VobixChat Elite - Familia Gratis Para Siempre</title>
<style>
:root{--bg-deep:#0f172a;--card-bg:#1e293b;--accent-green:#10b981;--text-main:#f8fafc;--text-muted:#94a3b8;--border-color:rgba(255,255,255,0.08)}
html,body{height:100%;height:100dvh;margin:0;padding:0;overflow:hidden;background:#0f172a;color:var(--text-main);font-family:Arial,sans-serif;font-size:12px}
.app-container{width:100%;max-width:480px;height:100%;height:100dvh;background:var(--card-bg);display:flex;flex-direction:column;margin:0 auto}
.screen{display:none;flex-direction:column;height:100%;padding:16px;justify-content:center;align-items:center;overflow-y:auto}.screen.active{display:flex}
.input-group{width:100%;margin-bottom:12px;text-align:left}.phone-input-wrapper{display:flex;gap:6px;width:100%}
select.prefix-select{width:95px;padding:10px;background:#0f172a;border:1px solid var(--border-color);border-radius:10px;color:white}
input{width:100%;padding:10px 12px;background:rgba(15,23,42,0.7);border:1px solid var(--border-color);border-radius:10px;color:white}
button.btn-imponente{width:100%;padding:12px;background:linear-gradient(135deg,#10b981 0%,#047857 100%);color:white;border:none;border-radius:10px;font-weight:700;cursor:pointer}
.app-header{background:#0f172a;padding:10px 14px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--border-color)}
.app-body{flex:1;padding:12px;overflow-y:auto;display:flex;flex-direction:column;gap:10px;background:#0b141a}
.chat-list-item{display:flex;align-items:center;background:rgba(15,23,42,0.8);padding:10px 12px;border-radius:10px;margin-bottom:6px}
.chat-avatar{width:40px;height:40px;background:#10b981;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:bold}
.video-call-stage{position:absolute;top:0;left:0;width:100%;height:100%;background:#000;z-index:750;display:none;flex-direction:column;padding:12px}.video-call-stage.active{display:flex}
.video-grid-container{flex:1;display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px}
.video-tile{position:relative;background:#111;border-radius:10px;overflow:hidden;aspect-ratio:4/3;border:2px solid #10b981}.video-tile video{width:100%;height:100%;object-fit:cover}
#privateChatRoom{position:absolute;top:0;left:0;width:100%;height:100%;background:#0b141a;z-index:800;display:none;flex-direction:column;padding:16px;color:white}#privateChatRoom.active{display:flex}
.private-chat-messages{flex:1;padding:10px;overflow-y:auto;display:flex;flex-direction:column;gap:6px;background:#0b141a}
.burbuja{max-width:80%;padding:6px 10px;border-radius:10px;font-size:12px}.burbuja.recibida{background:#202c33;align-self:flex-start}.burbuja.enviada{background:#005c4b;align-self:flex-end}
.card-panel{background:var(--card-bg);padding:10px 12px;border-radius:10px;border:1px solid var(--border-color)}
#incomingCallModal{position:absolute;top:0;left:0;width:100%;height:100%;background:rgba(11,20,26,0.96);z-index:1000;display:none;flex-direction:column;justify-content:space-between;align-items:center;padding:40px 16px;color:white;text-align:center}#incomingCallModal.active{display:flex}
</style>
</head>
<body>
<div class="app-container">
<div id="videoCallStage" class="video-call-stage"><div style="display:flex;justify-content:space-between"><h3 style="margin:0;color:#34d399">Videollamada</h3><button onclick="colgarTodo()" style="background:#ef4444;border:none;color:white;padding:8px 16px;border-radius:20px">Colgar</button></div><div class="video-grid-container" id="videoGridContainer"></div></div>
<div id="privateChatRoom"><div style="background:#1e293b;padding:10px;display:flex;justify-content:space-between"><button onclick="cerrarChatPrivado()" style="background:none;border:none;color:white;font-size:20px">←</button><h4 id="privateChatTitle" style="margin:0">Chat</h4><div><button onclick="toggleLlamarDesdeChatPrivado(false)" style="background:#3b82f6;border:none;color:white;width:32px;height:32px;border-radius:50%">📞</button><button onclick="toggleLlamarDesdeChatPrivado(true)" style="background:#10b981;border:none;color:white;width:32px;height:32px;border-radius:50%">📹</button></div></div><div class="private-chat-messages" id="privateChatMessagesContainer"><div class="burbuja recibida">Canal familiar seguro.</div></div><div style="background:#1e293b;padding:8px;display:flex;gap:6px"><input type="text" id="privateMessageInput" placeholder="Escribe..." style="flex:1" onkeypress="if(event.key==='Enter')enviarMensajePrivado()"><button onclick="enviarMensajePrivado()" style="background:#10b981;border:none;color:white;width:34px;height:34px;border-radius:50%">➤</button></div></div>
<div id="incomingCallModal"><h1 id="incomingCallerName">Familia</h1><div style="width:75px;height:75px;background:#10b981;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:28px">📹</div><div style="display:flex;gap:30px"><button onclick="rechazarLlamadaEntrante()" style="width:55px;height:55px;border-radius:50%;background:#ef4444;border:none;color:white">✕</button><button onclick="aceptarLlamadaEntrante()" style="width:55px;height:55px;border-radius:50%;background:#10b981;border:none;color:white">📹</button></div></div>
<div id="screen-registro" class="screen active"><h2>VobixChat Familia</h2><p style="color:#94a3b8;font-size:11px">8 Familia Gratis Para Siempre</p><div class="input-group"><label>Nombre</label><input type="text" id="regNombre"></div><div class="input-group"><label>Teléfono Real</label><div class="phone-input-wrapper"><select id="selectPrefijo" class="prefix-select"><option value="+34" selected>🇪🇸 +34</option><option value="+1">🇩🇴 +1</option></select><input type="tel" id="regTelefono" style="flex:1"></div></div><button class="btn-imponente" onclick="validarYContinuarRegistro()">Continuar</button><p style="font-size:10px;color:#fca5a5">VoIP prohibido - rechazo rotundo</p></div>
<div id="screen-pin" class="screen"><h2>PIN</h2><p id="lblPinInfo" style="color:#94a3b8"></p><input type="text" id="regPin" placeholder="PIN" style="text-align:center;letter-spacing:6px;font-size:18px;font-weight:bold"><button class="btn-imponente" onclick="verificarPinYEntrar()" style="margin-top:12px">Acceder</button></div>
<div id="screen-chat" class="screen" style="padding:0;text-align:left"><div class="app-header"><h3 id="lblUserSession" style="margin:0;font-size:12px;color:#34d399">VobixChat</h3><button onclick="copiarEnlaceInvitacion()" style="background:rgba(16,185,129,0.2);border:1px solid #10b981;color:#34d399;padding:4px 8px;border-radius:6px;font-size:10px">🔗 Invitar</button></div><div class="app-body"><div id="callStatusBanner" style="display:none"></div><div class="card-panel"><h3 style="color:#34d399">Familia Gratis Para Siempre</h3><div id="chatsListContainer"></div></div></div></div>
</div>
<audio id="remoteAudioElement" autoplay playsinline style="display:none"></audio>
<script src="/socket.io/socket.io.js"></script>
<script>
const socket=io({reconnection:true});
let identificadorUsuario="",nombreUsuarioGlobal="",chatActivoDestinatario="",localStream=null,ofertaPendienteGlobal=null,pinTemporalInfobip="",numeroEnVerificacion="",ringingInterval=null,audioCtx=null;
const peerConnections={};
const ICE_SERVERS={iceServers:[{urls:"stun:stun.l.google.com:19302"}]};
const NUMEROS_FAMILIA_GRATIS = [
  "34658616136",
  "34672953430",
  "18096025900",
  "18295159742",
  "34645711126",
  "18295229469",
  "34657956823",
  "34695746539"
];
const PIN_FAMILIA="1234";
function validarYContinuarRegistro(){
  const nombre=document.getElementById('regNombre').value.trim();
  const pref=document.getElementById('selectPrefijo').value.replace('+','');
  const tel=document.getElementById('regTelefono').value.replace(/[^0-9]/g,'');
  let numeroCompleto=pref+tel;
  if(tel.startsWith("34")&&tel.length>10) numeroCompleto=tel;
  if(tel.startsWith("1")&&tel.length>10) numeroCompleto=tel;
  if(!nombre||!tel){alert("Faltan datos");return;}
  identificadorUsuario=numeroCompleto; nombreUsuarioGlobal=nombre;
  const guardado=localStorage.getItem("vobix_user_"+numeroCompleto);
  if(guardado){entrarDefinitivo(JSON.parse(guardado));return;}
  document.getElementById('screen-registro').classList.remove('active');
  document.getElementById('screen-pin').classList.add('active');
  const esFamilia=NUMEROS_FAMILIA_GRATIS.some(n=>numeroCompleto.includes(n.slice(-9))||n.includes(tel.slice(-9))||numeroCompleto===n);
  if(esFamilia){
    document.getElementById('lblPinInfo').innerText="FAMILIA: "+nombre+" - PIN 1234 GRATIS PARA SIEMPRE";
  }else{
    document.getElementById('lblPinInfo').innerText="Invitado: PIN Infobip a +"+numeroCompleto;
    pinTemporalInfobip=Math.floor(100000+Math.random()*900000).toString();
    numeroEnVerificacion=numeroCompleto;
    alert("SIMULACION Infobip PIN: "+pinTemporalInfobip);
  }
}
function verificarPinYEntrar(){
  const pin=document.getElementById('regPin').value.trim();
  const num=identificadorUsuario;
  const esFamilia=NUMEROS_FAMILIA_GRATIS.some(n=>num.includes(n.slice(-9))||n.includes(num.slice(-9))||num===n);
  if(esFamilia&&pin===PIN_FAMILIA){
    const datos={numero:num,nombre:nombreUsuarioGlobal,verificado:true,esFamilia:true,fechaRegistro:new Date().toISOString(),amigos:NUMEROS_FAMILIA_GRATIS.filter(n=>n!==num)};
    localStorage.setItem("vobix_user_"+num,JSON.stringify(datos));
    localStorage.setItem("vobix_session_actual",num);
    guardarUsuarioEnListaGlobal(datos);
    alert("✅ "+nombreUsuarioGlobal+" REGISTRADO PARA SIEMPRE");
    entrarDefinitivo(datos);return;
  }
  if(pin===pinTemporalInfobip&&num===numeroEnVerificacion){
    const datos={numero:num,nombre:nombreUsuarioGlobal,verificado:true,esFamilia:false,fechaRegistro:new Date().toISOString(),amigos:[]};
    localStorage.setItem("vobix_user_"+num,JSON.stringify(datos));
    guardarUsuarioEnListaGlobal(datos);
    entrarDefinitivo(datos);
  }else{alert("PIN incorrecto");}
}
function guardarUsuarioEnListaGlobal(u){let l=JSON.parse(localStorage.getItem("vobix_usuarios_globales")||"[]");if(!l.find(x=>x.numero===u.numero)){l.push(u);localStorage.setItem("vobix_usuarios_globales",JSON.stringify(l));}}
function entrarDefinitivo(d){document.getElementById('screen-pin').classList.remove('active');document.getElementById('screen-chat').classList.add('active');document.getElementById('lblUserSession').innerText=d.nombre+" ("+d.numero+") - FAMILIA GRATIS";socket.emit("registrar-canal-llamada",{identificador_usuario:d.numero});cargarListaAmigos(d);}
function cargarListaAmigos(d){const lista=JSON.parse(localStorage.getItem("vobix_usuarios_globales")||"[]");const cont=document.getElementById('chatsListContainer');cont.innerHTML="";let amigos=d.esFamilia?NUMEROS_FAMILIA_GRATIS.filter(n=>n!==d.numero):d.amigos;amigos.forEach(nA=>{const a=lista.find(u=>u.numero===nA)||{numero:nA,nombre:nA};cont.innerHTML+=`<div class="chat-list-item" onclick="abrirChatPrivado('${a.numero}','${a.nombre}')"><div style="display:flex;gap:10px"><div class="chat-avatar">${a.nombre.charAt(0)}</div><div><h4 style="margin:0;color:white">${a.nombre}</h4><span style="font-size:10px;color:#34d399">${a.numero} - GRATIS ✓</span></div></div></div>`;});}
function abrirChatPrivado(num,nombre){chatActivoDestinatario=num;document.getElementById('privateChatTitle').innerText=nombre;document.getElementById('privateChatRoom').classList.add('active');}
function cerrarChatPrivado(){document.getElementById('privateChatRoom').classList.remove('active');}
function enviarMensajePrivado(){const inp=document.getElementById('privateMessageInput');const txt=inp.value.trim();if(!txt)return;const c=document.getElementById('privateChatMessagesContainer');c.innerHTML+=`<div class="burbuja enviada">${txt}</div>`;c.scrollTop=c.scrollHeight;socket.emit("enviar-mensaje-chat",{destinatario:chatActivoDestinatario,emisor:identificadorUsuario,aliasEmisor:nombreUsuarioGlobal,texto:txt});inp.value="";}
function getAudioContext(){if(!audioCtx)audioCtx=new(window.AudioContext||window.webkitAudioContext)();if(audioCtx.state==='suspended')audioCtx.resume();return audioCtx;}
function iniciarTimbreEntrante(){if(navigator.vibrate)navigator.vibrate([500,300,500]);ringingInterval=setInterval(()=>{try{const ctx=getAudioContext();const o=ctx.createOscillator();const g=ctx.createGain();o.frequency.setValueAtTime(520,ctx.currentTime);g.gain.setValueAtTime(0.3,ctx.currentTime);o.connect(g);g.connect(ctx.destination);o.start();o.stop(ctx.currentTime+0.4);}catch(e){}},1000);}
function detenerTimbre(){if(ringingInterval){clearInterval(ringingInterval);ringingInterval=null;}if(navigator.vibrate)navigator.vibrate(0);}
async function toggleLlamarDesdeChatPrivado(conVideo){const num=chatActivoDestinatario;if(!num)return;document.getElementById('videoCallStage').classList.add('active');try{localStream=await navigator.mediaDevices.getUserMedia({audio:true,video:conVideo});}catch(e){alert("Permite micro/camara");return;}const grid=document.getElementById('videoGridContainer');grid.innerHTML="";const tile=document.createElement('div');tile.className='video-tile';tile.innerHTML=`<video autoplay muted playsinline></video><span>Tu</span>`;grid.appendChild(tile);tile.querySelector('video').srcObject=localStream;const pc=new RTCPeerConnection(ICE_SERVERS);peerConnections[num]=pc;localStream.getTracks().forEach(t=>pc.addTrack(t,localStream));pc.ontrack=e=>{let t2=document.getElementById(`tile-${num}`);if(!t2){t2=document.createElement('div');t2.className='video-tile';t2.id=`tile-${num}`;t2.innerHTML=`<video autoplay playsinline></video><span>${num}</span>`;grid.appendChild(t2);}t2.querySelector('video').srcObject=e.streams[0];document.getElementById('remoteAudioElement').srcObject=e.streams[0];};pc.onicecandidate=e=>{if(e.candidate)socket.emit("senalizacion-grupal",{destinatario:num,emisor:identificadorUsuario,tipo:'candidato-ice',payload:e.candidate});};const off=await pc.createOffer();await pc.setLocalDescription(off);socket.emit("senalizacion-grupal",{destinatario:num,emisor:identificadorUsuario,tipo:'oferta',payload:pc.localDescription,conVideo});}
socket.on("senalizacion-grupal",async d=>{if(d.destinatario!==identificadorUsuario)return;if(d.tipo==='oferta'){ofertaPendienteGlobal=d;document.getElementById('incomingCallerName').innerText=d.emisor;document.getElementById('incomingCallModal').classList.add('active');iniciarTimbreEntrante();}if(d.tipo==='respuesta'){const pc=peerConnections[d.emisor];if(pc)await pc.setRemoteDescription(new RTCSessionDescription(d.payload));}if(d.tipo==='candidato-ice'){const pc=peerConnections[d.emisor];if(pc)await pc.addIceCandidate(new RTCIceCandidate(d.payload));}});
async function aceptarLlamadaEntrante(){detenerTimbre();document.getElementById('incomingCallModal').classList.remove('active');document.getElementById('videoCallStage').classList.add('active');const data=ofertaPendienteGlobal;const emisor=data.emisor;const conVideo=data.conVideo;try{localStream=await navigator.mediaDevices.getUserMedia({audio:true,video:conVideo});}catch(e){return;}const grid=document.getElementById('videoGridContainer');grid.innerHTML="";const t=document.createElement('div');t.className='video-tile';t.innerHTML=`<video autoplay muted playsinline></video><span>Tu</span>`;grid.appendChild(t);t.querySelector('video').srcObject=localStream;const pc=new RTCPeerConnection(ICE_SERVERS);peerConnections[emisor]=pc;localStream.getTracks().forEach(tr=>pc.addTrack(tr,localStream));pc.ontrack=e=>{let tile=document.getElementById(`tile-${emisor}`);if(!tile){tile=document.createElement('div');tile.className='video-tile';tile.id=`tile-${emisor}`;tile.innerHTML=`<video autoplay playsinline></video><span>${emisor}</span>`;grid.appendChild(tile);}tile.querySelector('video').srcObject=e.streams[0];document.getElementById('remoteAudioElement').srcObject=e.streams[0];};pc.onicecandidate=e=>{if(e.candidate)socket.emit("senalizacion-grupal",{destinatario:emisor,emisor:identificadorUsuario,tipo:'candidato-ice',payload:e.candidate});};await pc.setRemoteDescription(new RTCSessionDescription(data.payload));const ans=await pc.createAnswer();await pc.setLocalDescription(ans);socket.emit("senalizacion-grupal",{destinatario:emisor,emisor:identificadorUsuario,tipo:'respuesta',payload:pc.localDescription});}
function rechazarLlamadaEntrante(){detenerTimbre();document.getElementById('incomingCallModal').classList.remove('active');}
function colgarTodo(){detenerTimbre();if(localStream){localStream.getTracks().forEach(t=>t.stop());localStream=null;}Object.values(peerConnections).forEach(pc=>pc.close());for(let k in peerConnections)delete peerConnections[k];document.getElementById('videoCallStage').classList.remove('active');}
function copiarEnlaceInvitacion(){const enlace=`${location.origin}${location.pathname}?invitacion=${identificadorUsuario}`;navigator.clipboard.writeText(enlace).then(()=>alert("Enlace copiado: "+enlace));}
socket.on("nuevo-mensaje-chat",d=>{if(d.destinatario!==identificadorUsuario)return;const c=document.getElementById('privateChatMessagesContainer');if(chatActivoDestinatario===d.emisor){c.innerHTML+=`<div class="burbuja recibida">${d.texto}</div>`;c.scrollTop=c.scrollHeight;}});
</script>
</body>
</html>
