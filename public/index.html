<!DOCTYPE html>
<html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VobixChat</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Segoe UI',Arial;background:linear-gradient(135deg,#0a0a0a 0%,#1a1a1a 100%);color:white;min-height:100vh;display:flex;justify-content:center;align-items:center}
.lang{position:fixed;top:12px;right:12px;background:rgba(0,0,0,0.6);border:1px solid #00ff88;padding:8px 12px;border-radius:30px;backdrop-filter:blur(10px)}
.lang span{cursor:pointer;margin:0 3px;font-size:18px}
.card{background:rgba(28,28,28,0.9);border:1px solid #00ff88;border-radius:20px;padding:35px;width:92%;max-width:400px;text-align:center;box-shadow:0 0 30px rgba(0,255,136,0.3)}
.logo{width:80px;height:80px;background:#00ff88;border-radius:20px;margin:0 auto 15px;display:flex;align-items:center;justify-content:center;font-size:40px;box-shadow:0 0 20px #00ff88}
h2{color:#00ff88;letter-spacing:1px}
p{opacity:0.8;margin:10px 0 20px;font-size:14px}
input{width:100%;padding:14px;margin:10px 0;border-radius:12px;border:1px solid #333;background:#111;color:white;outline:none}
input:focus{border-color:#00ff88}
button{width:100%;padding:14px;background:#00ff88;color:black;border:none;border-radius:12px;font-weight:bold;cursor:pointer;font-size:15px;margin-top:10px;box-shadow:0 0 15px rgba(0,255,136,0.5)}
button:hover{background:#00e67a}
#msg{margin-top:15px;color:#00ff88;font-size:13px}
</style></head><body>
<div class="lang"><span onclick="setLang('es')">🇪🇸</span><span onclick="setLang('en')">🇺🇸</span><span onclick="setLang('fr')">🇫🇷</span><span onclick="setLang('pt')">🇧🇷</span><span onclick="setLang('de')">🇩🇪</span><span onclick="setLang('it')">🇮🇹</span></div>
<div class="card">
<div class="logo">V</div>
<h2 id="t-title">VobixChat</h2>
<p id="t-sub">Verifica tu número</p>
<input id="phone" placeholder="+34 600 000 000">
<button onclick="sendPin()" id="t-btn1">Enviar código</button>
<input id="pin" placeholder="123456" style="display:none">
<button onclick="verifyPin()" id="t-btn2" style="display:none">Verificar</button>
<p id="msg"></p>
</div>
<script>
const TRAD={es:{title:"VobixChat",sub:"Verifica tu número para continuar",b1:"Enviar código",b2:"Verificar",ph:"+34 600 000 000",sending:"Enviando..."},en:{title:"VobixChat",sub:"Verify your number to continue",b1:"Send code",b2:"Verify",ph:"+1 555 000 000",sending:"Sending..."},fr:{title:"VobixChat",sub:"Vérifiez votre numéro",b1:"Envoyer",b2:"Vérifier",ph:"+33 6 00 00 00 00",sending:"Envoi..."},pt:{title:"VobixChat",sub:"Verifique seu número",b1:"Enviar código",b2:"Verificar",ph:"+55 11 90000 0000",sending:"Enviando..."},de:{title:"VobixChat",sub:"Bestätige deine Nummer",b1:"Code senden",b2:"Bestätigen",ph:"+49 170 0000000",sending:"Senden..."},it:{title:"VobixChat",sub:"Verifica il tuo numero",b1:"Invia codice",b2:"Verifica",ph:"+39 300 0000000",sending:"Invio..."}};
function detect(){let n=(navigator.language||'es').substr(0,2);return TRAD[n]?n:'en';}
let cur=localStorage.getItem('vobix_lang')||detect();
function apply(){let t=TRAD[cur];document.getElementById('t-title').innerText=t.title;document.getElementById('t-sub').innerText=t.sub;document.getElementById('t-btn1').innerText=t.b1;document.getElementById('t-btn2').innerText=t.b2;document.getElementById('phone').placeholder=t.ph;}
function setLang(l){cur=l;localStorage.setItem('vobix_lang',l);apply();}apply();
async function sendPin(){let phone=document.getElementById('phone').value;if(!phone)return alert('Pon número');document.getElementById('msg').innerText=TRAD[cur].sending;let r=await fetch('/send-pin',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({phone,lang:cur})});let d=await r.json();if(d.ok){document.getElementById('pin').style.display='block';document.getElementById('t-btn2').style.display='block';document.getElementById('msg').innerText='✓ PIN enviado!';}else document.getElementById('msg').innerText='Error: '+(d.error||'');}
async function verifyPin(){let phone=document.getElementById('phone').value;let pin=document.getElementById('pin').value;let r=await fetch('/verify-pin',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({phone,pin,lang:cur})});let d=await r.json();document.getElementById('msg').innerText=d.ok?'¡Verificado! Bienvenido':'PIN incorrecto';}
</script></body></html>
