<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width,initial-scale=1"
>

<title>VobixChat</title>

<style>

*{
  box-sizing:border-box;
  font-family:Inter,system-ui;
}

body{
  margin:0;
  min-height:100vh;
  background:#070c09;
  display:flex;
  align-items:center;
  justify-content:center;
}

body::before{
  content:"";
  position:fixed;
  inset:0;
  background-image:
    radial-gradient(
      #7aff7a 1.5px,
      transparent 2px
    );
  background-size:32px 32px;
  opacity:.35;
}

.card{
  width:360px;
  background:
    linear-gradient(
      180deg,
      #132015,
      #0c1710
    );
  border:1.5px solid #6eff7a;
  border-radius:26px;
  padding:28px 22px;
  text-align:center;
  box-shadow:
    0 0 15px #6eff7a,
    0 0 60px rgba(110,255,122,.6);
  position:relative;
}

.logo{
  width:86px;
  height:86px;
  margin:0 auto 16px;
  background:#6eff7a;
  border-radius:20px;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:48px;
  font-weight:900;
  color:#0f2f17;
  box-shadow:
    0 0 20px #6eff7a;
}

h1{
  margin:0;
  color:#fff;
  font-size:30px;
  font-weight:900;
  letter-spacing:.5px;
}

.todo{
  color:#6eff7a;
  font-weight:900;
  margin:8px 0 2px;
  font-size:15px;
  letter-spacing:.3px;
}

.sub{
  color:#fff;
  font-size:10px;
  letter-spacing:2px;
  font-weight:800;
}

.e2e{
  color:#b8ffbe;
  font-size:11px;
  margin:14px 0 18px;
}

input{
  width:100%;
  background:#132015;
  border:1.2px solid #3a6b3f;
  border-radius:14px;
  padding:14px;
  color:#fff;
  outline:none;
}

.row{
  display:flex;
  gap:10px;
  margin:12px 0;
}

.pref{
  width:80px;
  background:#132015;
  border:1.2px solid #3a6b3f;
  border-radius:14px;
  display:flex;
  align-items:center;
  justify-content:center;
  color:#fff;
  font-weight:800;
}

.btn{
  width:100%;
  background:#6eff7a;
  border:none;
  padding:16px;
  border-radius:14px;
  font-weight:900;
  color:#123b1a;
  cursor:pointer;
  letter-spacing:.5px;
  box-shadow:
    0 0 20px rgba(110,255,122,.6);
}

</style>

</head>


<body>


<div class="card">


  <div class="logo">
    V
  </div>


  <h1>
    VOBIXCHAT
  </h1>


  <div
    class="todo"
    id="txtTodo"
  >
    TODO EN UNO
  </div>


  <div
    class="sub"
    id="txtSub"
  >
    SEGURO • RAPIDO • PRIVADO
  </div>


  <div
    class="e2e"
    id="txtE2E"
  >
    🔒 Cifrado de extremo a extremo
  </div>


  <input
    id="user"
    placeholder="Nombre de usuario"
  >


  <div class="row">

    <div
      class="pref"
      id="prefix"
    >
      +34
    </div>

    <input
      id="phone"
      placeholder="Teléfono"
      inputmode="tel"
      autocomplete="tel-national"
      style="margin:0;flex:1"
    >

  </div>


  <div
    id="countryInfo"
    style="
      text-align:left;
      color:#8fbf94;
      font-size:10px;
      margin:-6px 0 12px 4px
    "
  >
    País detectado: ES - Prefijo +34
  </div>


  <button
    class="btn"
    id="btn"
    onclick="send()"
  >
    ENVIARME PIN POR SMS
  </button>


</div>


<script>

/* ================================================
   VOBIXCHAT
   INTERNACIONALIZACIÓN
================================================ */

let COUNTRY_CODE = 'ES';
let COUNTRY_NAME = 'España';
let CALLING_CODE = '+34';


/* ================================================
   IDIOMAS
================================================ */

const translations = {

  es:{
    todo:'TODO EN UNO',
    sub:'SEGURO • RAPIDO • PRIVADO',
    e2e:'🔒 Cifrado de extremo a extremo',
    user:'Nombre de usuario',
    phone:'Teléfono',
    country:'País detectado',
    prefix:'Prefijo',
    button:'ENVIARME PIN POR SMS',
    sending:'ENVIANDO...',
    missing:'Pon nombre y teléfono',
    pin:'Escribe tu PIN para entrar:',
    wrong:'PIN incorrecto',
    error:'No se pudo completar el registro'
  },

  en:{
    todo:'ALL IN ONE',
    sub:'SECURE • FAST • PRIVATE',
    e2e:'🔒 End-to-end encryption',
    user:'Username',
    phone:'Phone',
    country:'Detected country',
    prefix:'Prefix',
    button:'SEND ME PIN BY SMS',
    sending:'SENDING...',
    missing:'Enter your name and phone number',
    pin:'Enter your PIN:',
    wrong:'Incorrect PIN',
    error:'Registration could not be completed'
  },

  fr:{
    todo:'TOUT EN UN',
    sub:'SÛR • RAPIDE • PRIVÉ',
    e2e:'🔒 Chiffrement de bout en bout',
    user:"Nom d'utilisateur",
    phone:'Téléphone',
    country:'Pays détecté',
    prefix:'Préfixe',
    button:'ENVOYER LE PIN PAR SMS',
    sending:'ENVOI...',
    missing:'Entrez votre nom et téléphone',
    pin:'Entrez votre PIN :',
    wrong:'PIN incorrect',
    error:"L'inscription n'a pas pu être terminée"
  },

  de:{
    todo:'ALLES IN EINEM',
    sub:'SICHER • SCHNELL • PRIVAT',
    e2e:'🔒 Ende-zu-Ende-Verschlüsselung',
    user:'Benutzername',
    phone:'Telefon',
    country:'Erkanntes Land',
    prefix:'Vorwahl',
    button:'PIN PER SMS SENDEN',
    sending:'WIRD GESENDET...',
    missing:'Name und Telefonnummer eingeben',
    pin:'PIN eingeben:',
    wrong:'Falsche PIN',
    error:'Registrierung konnte nicht abgeschlossen werden'
  },

  it:{
    todo:'TUTTO IN UNO',
    sub:'SICURO • VELOCE • PRIVATO',
    e2e:'🔒 Crittografia end-to-end',
    user:'Nome utente',
    phone:'Telefono',
    country:'Paese rilevato',
    prefix:'Prefisso',
    button:'INVIA PIN VIA SMS',
    sending:'INVIO...',
    missing:'Inserisci nome e telefono',
    pin:'Inserisci il PIN:',
    wrong:'PIN errato',
    error:'Registrazione non completata'
  },

  pt:{
    todo:'TUDO EM UM',
    sub:'SEGURO • RÁPIDO • PRIVADO',
    e2e:'🔒 Criptografia de ponta a ponta',
    user:'Nome de usuário',
    phone:'Telefone',
    country:'País detectado',
    prefix:'Prefixo',
    button:'ENVIAR PIN POR SMS',
    sending:'ENVIANDO...',
    missing:'Digite nome e telefone',
    pin:'Digite seu PIN:',
    wrong:'PIN incorreto',
    error:'Não foi possível concluir o registro'
  }

};


/* ================================================
   DETECTAR IDIOMA DEL MÓVIL / NAVEGADOR
================================================ */

function detectLanguage(){

  const browserLanguage =
    (
      navigator.languages &&
      navigator.languages.length
        ? navigator.languages[0]
        : navigator.language
    ) || 'es';

  const language =
    browserLanguage
      .toLowerCase()
      .split('-')[0];

  if(translations[language]){
    return language;
  }

  return 'en';
}


let LANG = detectLanguage();


function t(key){

  return (
    translations[LANG][key] ||
    translations.en[key] ||
    key
  );

}


/* ================================================
   APLICAR IDIOMA
================================================ */

function applyLanguage(){

  document.documentElement.lang = LANG;

  document.getElementById('txtTodo')
    .textContent = t('todo');

  document.getElementById('txtSub')
    .textContent = t('sub');

  document.getElementById('txtE2E')
    .textContent = t('e2e');

  document.getElementById('user')
    .placeholder = t('user');

  document.getElementById('phone')
    .placeholder = t('phone');

  document.getElementById('btn')
    .textContent = t('button');

  updateCountryText();

}


/* ================================================
   MOSTRAR PAÍS Y PREFIJO
================================================ */

function updateCountryText(){

  document.getElementById('prefix')
    .textContent = CALLING_CODE;

  document.getElementById('countryInfo')
    .textContent =
      t('country') +
      ': ' +
      COUNTRY_CODE +
      ' - ' +
      t('prefix') +
      ' ' +
      CALLING_CODE;

}


/* ================================================
   DETECTAR PAÍS APROXIMADO POR IP
================================================ */

async function detectCountry(){

  try{

    const response =
      await fetch(
        'https://ipapi.co/json/'
      );

    if(!response.ok){
      throw new Error('IP lookup failed');
    }

    const data =
      await response.json();

    if(data.error){
      throw new Error('IP lookup error');
    }

    if(data.country_code){

      COUNTRY_CODE =
        data.country_code
          .toUpperCase();

    }

    if(data.country_name){

      COUNTRY_NAME =
        data.country_name;

    }

    if(data.country_calling_code){

      CALLING_CODE =
        data.country_calling_code
          .split(',')[0]
          .trim();

    }

    updateCountryText();

  }catch(error){

    console.warn(
      'No se pudo detectar país por IP.',
      error
    );

    /*
      Si falla la detección IP,
      mantenemos España +34 como respaldo
      durante esta fase de pruebas.
    */

    updateCountryText();

  }

}


/* ================================================
   NORMALIZAR TELÉFONO
================================================ */

function normalizePhone(number){

  let phone =
    String(number || '')
      .trim();

  /*
    Quitamos espacios, guiones,
    paréntesis y caracteres que
    no sean números o +
  */

  phone =
    phone.replace(
      /[^\d+]/g,
      ''
    );


  /*
    00XXXXXXXX
    se transforma en
    +XXXXXXXX
  */

  if(phone.startsWith('00')){

    phone =
      '+' +
      phone.substring(2);

  }


  /*
    Si el usuario ya escribió
    +34..., +33..., etc.,
    respetamos ese formato.
  */

  if(phone.startsWith('+')){

    return phone;

  }


  /*
    Quitamos ceros iniciales
    del número nacional.
  */

  phone =
    phone.replace(
      /^0+/,
      ''
    );


  /*
    Añadimos el prefijo
    detectado.
  */

  return (
    CALLING_CODE +
    phone
  );

}


/* ================================================
   ENVIAR PIN
================================================ */

async function send(){

  const u =
    document
      .getElementById('user')
      .value
      .trim();

  const rawPhone =
    document
      .getElementById('phone')
      .value
      .trim();

  const btn =
    document.getElementById('btn');


  if(!u || !rawPhone){

    return alert(
      t('missing')
    );

  }


  const internationalPhone =
    normalizePhone(rawPhone);


  console.log(
    'Teléfono normalizado:',
    internationalPhone
  );


  btn.textContent =
    t('sending');

  btn.disabled = true;


  try{


    /* ============================================
       PEDIR PIN
    ============================================ */

    const r =
      await fetch(
        '/api/send-pin',
        {

          method:'POST',

          headers:{
            'Content-Type':
              'application/json'
          },

          body:JSON.stringify({

            user:u,

            phone:internationalPhone,

            country:COUNTRY_CODE,

            callingCode:CALLING_CODE,

            language:LANG

          })

        }
      );


    const d =
      await r.json();


    if(!d.ok){

      alert(
        d.msg ||
        t('error')
      );

      return;

    }


    /* ============================================
       PIN DE PRUEBAS
    ============================================ */

    const pin =
      prompt(
        (
          d.pin
            ? 'PIN: ' + d.pin + '\n\n'
            : ''
        ) +
        t('pin')
      );


    if(!pin){

      return;

    }


    /* ============================================
       VERIFICAR PIN EN SERVIDOR
    ============================================ */

    const vr =
      await fetch(
        '/verify-pin',
        {

          method:'POST',

          headers:{
            'Content-Type':
              'application/json'
          },

          body:JSON.stringify({

            phone:internationalPhone,

            pin:pin.trim(),

            country:COUNTRY_CODE,

            callingCode:CALLING_CODE,

            language:LANG

          })

        }
      );


    const verified =
      await vr.json();


    if(!verified.ok){

      alert(
        verified.msg ||
        t('wrong')
      );

      return;

    }


    /* ============================================
       GUARDAR DATOS TEMPORALES DE SESIÓN
    ============================================ */

    localStorage.setItem(
      'vobix_user',
      verified.user
        ? verified.user.username
        : u
    );


    localStorage.setItem(
      'vobix_phone',
      internationalPhone
    );


    localStorage.setItem(
      'vobix_country',
      COUNTRY_CODE
    );


    localStorage.setItem(
      'vobix_language',
      LANG
    );


    if(
      verified.user &&
      verified.user.id
    ){

      localStorage.setItem(
        'vobix_user_id',
        verified.user.id
      );

    }


    /* ============================================
       ENTRAR
    ============================================ */

    location.href =
      'chat.html';


  }catch(error){


    console.error(error);


    alert(
      t('error')
    );


  }finally{


    btn.textContent =
      t('button');


    btn.disabled = false;


  }

}


/* ================================================
   INICIAR
================================================ */

applyLanguage();
detectCountry();

</script>


</body>

</html>
