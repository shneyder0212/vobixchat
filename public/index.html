<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>VobixChat 🔒</title>
<script src="/socket.io/socket.io.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui,-apple-system}
body{background:#111b21;height:100vh;display:flex;flex-direction:column;overflow:hidden}
#login{position:fixed;inset:0;background:#111b21;z-index:100;display:flex;align-items:center;justify-content:center;padding:20px}
.login-box{background:#202c33;width:100%;max-width:360px;padding:28px;border-radius:16px;color:#fff}
.login-box h2{margin-bottom:18px;text-align:center;font-size:22px}
.login-box input{width:100%;padding:15px;margin:8px 0;border-radius:10px;border:none;background:#2a3942;color:#fff;font-size:16px;outline:none}
.login-box button{width:100%;padding:15px;margin-top:10px;border:none;border-radius:10px;background:#00a884;color:#fff;font-weight:700;font-size:16px}
#chat{flex:1;display:flex;flex-direction:column;display:none;height:100vh}
#top{background:#202c33;color:#fff;padding:10px 14px;display:flex;align-items:center;gap:10px}
#top.avatar{width:40px;height:40px;border-radius:50%;background:#00a884;display:flex;align-items:center;justify-content:center;font-weight:bold}
#messages{flex:1;overflow-y:auto;padding:12px;background:#0b141a}
.bubble{background:#202c33;color:#e9edef;padding:8px 10px 18px 10px;border-radius:8px 8px 8px 0;margin:6px 0;max-width:78%;position:relative;word-break:break-word;box-shadow:0 1px 1px rgba(0,0,0,.2)}
.bubble.me{background:#005c4b;margin-left:auto;border-radius:8px 8px 0 8px}
.bubble.user{font-size:12px;font-weight:700;color:#53bdeb;margin-bottom:2px}
.bubble.me.user{color:#a6f0d5}
.bubble.time{position:absolute;right:6px;bottom:2px;font-size:10px;color:#8696a0;display:flex;gap:3px}
#bar{background:#202c33;padding:8px 10px;display:flex;align-items:flex-end;gap:8px}
#text{flex:1;min-height:44px;max-height:110px;padding:12px 16px;border-radius:22px;border:none;background:#2a3942;color:#fff;resize:none;outline:none;font-size:16px;line-height:20px}
.iconBtn{width:44px;height:44px;border-radius:50%;border:none;display:flex;align-items:center;justify-content:center;font-size:22px;flex-shrink:0}
#emojiBtn{background:#2a3942}
#send{background:#00a884;color:#fff;font-size:20px}
#banAlert{position:fixed;top:15px;left:50%;transform:translateX(-50%);background:#f15c6d;color:#fff;padding:12px 18px;border-radius:10px;display:none;z-index:300;font-size:14px}
#emojiPanel{position:absolute;bottom:70px;left:10px;background:#202c33;padding:10px;border-radius:12px;display:none;grid-template-columns:repeat(6,1fr);gap:6px;z-index:50}
#emojiPanel span{font-size:22px;padding:4px;cursor:pointer}
</style>
</head>
<body>

<div id="banAlert"></div>

<div id="login">
  <div class="login-box">
    <h2>VobixChat 🔒 E2E</h2>
    <input id="username" placeholder="@tu_usuario">
    <input id="phone" placeholder="+34 6XX XXX XXX">
    <button onclick="sendPin()">Enviar PIN</button>
    <div id="pinBox" style="display:none;margin-top:16px">
      <input id="pin" placeholder="PIN 6 digitos (mira Render)">
      <button onclick="verifyPin()">Entrar al chat</button>
    </div>
    <p id="loginMsg" style="margin-top:12px;font-size:13px;color:#8696a0;text-align:center"></p>
  </div>
</div>

<div id="chat">
  <div id="top">
    <div class="avatar" id="avatarLetter">V</div>
    <div style="flex:1"><div id="myName" style="font-weight:600"></div><div style="font-size:11px;color:#00a884">cifrado de extremo a extremo 🔒</div></div>
  </div>
  <div id="messages"></div>
  <div style="position:relative">
    <div id="emojiPanel">
      <span onclick="addEmoji('😊')">😊</span><span onclick="addEmoji('😂')">😂</span><span onclick="addEmoji('❤️')">❤️</span><span onclick="addEmoji('🔥')">🔥</span><span onclick="addEmoji('👍')">👍</span><span onclick="addEmoji('😍')">😍</span>
      <span onclick="addEmoji('🥺')">🥺</span><span onclick="addEmoji('🙏')">🙏</span><span onclick="addEmoji('😎')">😎</span><span onclick="addEmoji('😭')">😭</span><span onclick="addEmoji('🤣')">🤣</span><span onclick="addEmoji('💀')">💀</span>
    </div>
    <div id="bar">
      <button class="iconBtn" id="emojiBtn" onclick="toggleEmoji()">😊</button>
      <textarea id="text" placeholder="Mensaje" rows="1" oninput="autoGrow()" onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();sendChat()}"></textarea>
      <button class="iconBtn" id="send" onclick="sendChat()">➤</button>
    </div>
  </div>
</div>

<script>
const socket = io();
let myKeyPair, myPublicJwk;
let usersKeys = {};

function showBan(msg){ let a=document.getElementById('banAlert'); a.innerText=msg; a.style.display='block'; setTimeout(()=>a.style.display='none',4000); }
function autoGrow(){ let t=document.getElementById('text'); t.style.height='44px'; t.style.height=Math.min(t.scrollHeight,110)+'px'; }
function addEmoji(e){ let t=document.getElementById('text'); t.value+=e; t.focus(); autoGrow(); }
function toggleEmoji(){ let p=document.getElementById('emojiPanel'); p.style.display=p.style.display==='grid'?'none':'grid'; }
function getTime(){ return new Date().toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'}); }

async function initKeys(){
  let saved = localStorage.getItem('vobix_keys');
  if(saved){
    let jwks = JSON.parse(saved);
    myKeyPair = {
      privateKey: await crypto.subtle.importKey("jwk", jwks.privateKey, {name:"ECDH", namedCurve:"P-256"}, false, ["deriveKey"]),
      publicKey: await crypto.subtle.importKey("jwk", jwks.publicKey, {name:"ECDH", namedCurve:"P-256"}, true, [])
    };
    myPublicJwk = jwks.publicKey;
  }else{
    let kp = await crypto.subtle.generateKey({name:"ECDH", namedCurve:"P-256"}, true, ["deriveKey"]);
    let pubJwk = await crypto.subtle.exportKey("jwk", kp.publicKey);
    let privJwk = await crypto.subtle.exportKey("jwk", kp.privateKey);
    localStorage.setItem('vobix_keys', JSON.stringify({privateKey:privJwk, publicKey:pubJwk}));
    myKeyPair = kp; myPublicJwk = pubJwk;
  }
  let me = JSON.parse(localStorage.getItem('vobix_user')||'{}');
  if(me.phone) fetch('/save-key',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({phone:me.phone, publicKey:myPublicJwk})});
  loadAllKeys();
}
async function loadAllKeys(){
  try{ let r=await fetch('/api/keys'); let arr=await r.json();
    for(let u of arr){ if(u.publicKey) usersKeys[u.username]=await crypto.subtle.importKey("jwk", u.publicKey, {name:"ECDH", namedCurve:"P-256"}, true, []); }
  }catch{}
}
async function getSharedSecret(theirPublicKey){ return await crypto.subtle.deriveKey({name:"ECDH", public:theirPublicKey}, myKeyPair.privateKey, {name:"AES-GCM", length:256}, false, ["encrypt","decrypt"]); }
async function encryptForAll(text){
  let enc=new TextEncoder(); let payloads=[]; let me=JSON.parse(localStorage.getItem('vobix_user'));
  for(let username in usersKeys){
    if(username===me.username) continue;
    let secret=await getSharedSecret(usersKeys[username]);
    let iv=crypto.getRandomValues(new Uint8Array(12));
    let cipher=await crypto.subtle.encrypt({name:"AES-GCM", iv}, secret, enc.encode(text));
    let b64=btoa(String.fromCharCode(...iv)+String.fromCharCode(...new Uint8Array(cipher)));
    payloads.push({to:username, data:b64});
  }
  let iv2=crypto.getRandomValues(new Uint8Array(12));
  let selfSecret=await crypto.subtle.deriveKey({name:"ECDH", public:myKeyPair.publicKey}, myKeyPair.privateKey, {name:"AES-GCM", length:256}, false, ["encrypt","decrypt"]);
  let cipher2=await crypto.subtle.encrypt({name:"AES-GCM", iv:iv2}, selfSecret, enc.encode(text));
  payloads.push({to:me.username, data:btoa(String.fromCharCode(...iv2)+String.fromCharCode(...new Uint8Array(cipher2)))});
  return payloads;
}
async function decryptOne(b64, fromUsername){
  try{
    let theirKey=usersKeys[fromUsername]; if(!theirKey) return null;
    let secret=await getSharedSecret(theirKey);
    let raw=atob(b64); let iv=new Uint8Array([...raw.slice(0,12)].map(c=>c.charCodeAt(0)));
    let data=new Uint8Array([...raw.slice(12)].map(c=>c.charCodeAt(0)));
    let plain=await crypto.subtle.decrypt({name:"AES-GCM", iv}, secret, data);
    return new TextDecoder().decode(plain);
  }catch{return null;}
}

async function sendPin(){
  let username=document.getElementById('username').value.trim();
  let phone=document.getElementById('phone').value.trim();
  if(!username||!phone) return alert("Rellena todo");
  let r=await fetch('/send-pin',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({phone,username})});
  let d=await r.json();
  document.getElementById('loginMsg').innerText=d.ok? (d.gratis?"VIP GRATIS - Mira LOGS en Render":"PIN generado - Mira LOGS en Render") : d.msg;
  if(d.ok) document.getElementById('pinBox').style.display='block';
}
async function verifyPin(){
  let phone=document.getElementById('phone').value.trim();
  let pin=document.getElementById('pin').value.trim();
  let r=await fetch('/verify-pin',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({phone,pin})});
  let d=await r.json();
  if(d.ok){
    let username=document.getElementById('username').value.trim();
    localStorage.setItem('vobix_user', JSON.stringify({username,phone}));
    document.getElementById('login').style.display='none';
    document.getElementById('chat').style.display='flex';
    document.getElementById('myName').innerText='@'+username;
    document.getElementById('avatarLetter').innerText=username[0].toUpperCase();
    initKeys();
  }else alert("PIN incorrecto");
}

window.sendChat=async function(){
  let t=document.getElementById('text'); let txt=t.value.trim(); if(!txt) return;
  let me=JSON.parse(localStorage.getItem('vobix_user'));
  let packs=await encryptForAll(txt);
  for(let p of packs) socket.emit('chat', {username:me.username, phone:me.phone, to:p.to, text:p.data, encrypted:true, from:me.username});
  t.value=''; autoGrow(); document.getElementById('emojiPanel').style.display='none';
}

function addMessage(d, realText){
  let me=JSON.parse(localStorage.getItem('vobix_user')||'{}');
  let div=document.createElement('div');
  div.className='bubble'+(d.username===me.username?' me':'');
  div.innerHTML=`<div class="user">@${d.username}</div>${realText}<div class="time">${getTime()} ${d.username===me.username?'✓✓':''} 🔒</div>`;
  document.getElementById('messages').appendChild(div);
  document.getElementById('messages').scrollTop=document.getElementById('messages').scrollHeight;
}

socket.on('history', async (arr)=>{ for(let d of arr){ let me=JSON.parse(localStorage.getItem('vobix_user')||'{}'); if(d.to&&d.to!==me.username) continue; let realText=d.encrypted? await decryptOne(d.text, d.from||d.username) : d.text; if(!realText) continue; addMessage(d, realText); } });
socket.on('chat', async d=>{ let me=JSON.parse(localStorage.getItem('vobix_user')||'{}'); if(d.to&&d.to!==me.username) return; let realText=d.encrypted? await decryptOne(d.text, d.from||d.username) : d.text; if(!realText) return; addMessage(d, realText); });
socket.on('banned', d=> showBan(d.msg));
socket.on('spam_warn', d=> showBan(d.msg));

let savedUser=localStorage.getItem('vobix_user');
if(savedUser){ let u=JSON.parse(savedUser); document.getElementById('username').value=u.username; document.getElementById('phone').value=u.phone; document.getElementById('login').style.display='none'; document.getElementById('chat').style.display='flex'; document.getElementById('myName').innerText='@'+u.username; document.getElementById('avatarLetter').innerText=u.username[0].toUpperCase(); initKeys(); }
setInterval(loadAllKeys,5000);
</script>
</body>
</html>
