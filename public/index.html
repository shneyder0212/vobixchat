<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>VobixChat</title>
<link rel="manifest" href="/manifest.json">
<link rel="icon" href="/icon.png">
<style>
*{box-sizing:border-box;font-family:Arial,sans-serif}
body{margin:0;min-height:100dvh;background:#080c09;display:flex;justify-content:center;align-items:center;background-image:radial-gradient(rgba(58,255,104,0.18) 1.5px, transparent 1.5px);background-size:24px 24px;padding:16px;padding-bottom:calc(16px + env(safe-area-inset-bottom))}
.card{width:100%;max-width:395px;background:#0a110b;border:2px solid #3aff68;border-radius:28px;padding:24px 16px 22px;text-align:center;box-shadow:0 0 40px #3aff6888;overflow:hidden}
.logo{width:84px;height:84px;background:#3aff68;border-radius:20px;margin:0 auto 18px;display:flex;align-items:center;justify-content:center;font-size:48px;font-weight:900;color:#000}
h1{margin:0;color:white;font-size:38px;font-weight:900;letter-spacing:0.5px;text-align:center;line-height:1}
.sub{color:#3aff68;font-size:22px;font-weight:900;margin:10px 0 8px;letter-spacing:0.5px}
.sub2{color:#e8f0e9;font-size:12.5px;letter-spacing:2.8px;font-weight:800;margin-bottom:10px}
.e2e{display:flex;align-items:center;justify-content:center;gap:6px;margin-bottom:22px;opacity:0.9}
.e2e span{color:#8ac898;font-size:11px;letter-spacing:0.6px;font-weight:500}
input{width:100%;background:#0a150c;border:1.5px solid #234427;border-radius:14px;padding:15px;color:white;outline:none;font-size:15px}
input::placeholder{color:#8da290}
.row{display:flex;gap:10px;margin:16px 0}.pref{width:80px}.num{flex:1}
.pais{font-size:11px;color:#7ba882;text-align:left;margin:0 0 18px}
.btn{width:100%;background:#3aff68;border:none;color:#000;padding:16px;border-radius:16px;font-weight:900;cursor:pointer;font-size:13px;letter-spacing:0.8px}
#pinBox{display:none;margin-top:14px}
</style>
</head>
<body>
<div class="card">
<div class="logo">V</div>
<h1>VOBIXCHAT</h1>
<div class="sub">TODO EN UNO</div>
<div class="sub2">SEGURO • RAPIDO • PRIVADO</div>
<div class="e2e">🔒 <span>Cifrado de extremo a extremo</span></div>
<input id="username" placeholder="Nombre de usuario">
<div class="row"><div class="pref"><input value="+34" readonly></div><div class="num"><input id="phone" placeholder=""></div></div>
<div class="pais">País detectado: ES - Prefijo +34</div>
<button class="btn" onclick="sendPin()">ENVIARME PIN POR SMS</button>
<div id="pinBox"><input id="pin" placeholder="PIN de 6 dígitos" style="margin-bottom:12px"><button class="btn" onclick="verifyPin()">VERIFICAR Y ENTRAR</button></div>
</div>
<script>
let curPhone="",curUser="";
async function sendPin(){
 curUser=document.getElementById('username').value.trim();
 let phone=document.getElementById('phone').value.trim().replace(/\s/g,'');
 if(!curUser||!phone){alert('Pon datos');return;}
 if(!phone.startsWith('+')) phone='+34'+phone.replace(/^34/,'');
 curPhone=phone;
 const r=await fetch('/send-pin',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({phone:curPhone})});
 const d=await r.json(); if(d.ok) document.getElementById('pinBox').style.display='block'; else alert(d.error);
}
async function verifyPin(){
 const pin=document.getElementById('pin').value.trim();
 const r=await fetch('/verify-pin',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({phone:curPhone,pin,username:curUser})});
 const d=await r.json(); if(d.ok){alert('Bienvenido '+curUser);} else alert('PIN mal');
}
</script>
</body>
</html>
