/* =======================================================
   IDIOMA
======================================================= */


function detectLanguage(){

  const browserLanguage =
    (
      navigator.languages &&
      navigator.languages.length

        ? navigator.languages[0]

        : navigator.language
    ) || 'es';


  const language =
    browserLanguage
      .toLowerCase()
      .split('-')[0];


  return translations[language]
    ? language
    : 'en';

}


let LANG =
  detectLanguage();


function t(key){

  return (
    translations[LANG][key] ||
    translations.en[key] ||
    key
  );

}


/* =======================================================
   BUSCAR PAÍS
======================================================= */


function getCountryByCode(code){

  const wanted =
    String(code || '')
      .trim()
      .toUpperCase();


  return COUNTRIES.find(
    country =>
      country[0] === wanted
  ) || null;

}


/* =======================================================
   CREAR SELECTOR
======================================================= */


function buildCountrySelect(){

  countrySelect.innerHTML = '';


  const countries =
    [...COUNTRIES].sort(
      (a,b) =>
        a[1].localeCompare(
          b[1],
          'es',
          {
            sensitivity:'base'
          }
        )
    );


  countries.forEach(
    country => {

      const option =
        document.createElement(
          'option'
        );


      option.value =
        country[0];


      option.textContent =
        country[1] +
        ' (' +
        country[2] +
        ')';


      countrySelect.appendChild(
        option
      );

    }
  );

}


/* =======================================================
   CAMBIAR PAÍS
======================================================= */


function setCountry(code){

  const country =
    getCountryByCode(code);


  if(!country){
    return false;
  }


  COUNTRY_CODE =
    country[0];


  COUNTRY_NAME =
    country[1];


  CALLING_CODE =
    country[2];


  countrySelect.value =
    COUNTRY_CODE;


  updateCountryText();


  return true;

}


/* =======================================================
   MOSTRAR PAÍS / PREFIJO
======================================================= */


function updateCountryText(){

  prefixElement.textContent =
    CALLING_CODE;


  countryInfo.textContent =
    t('country') +
    ': ' +
    COUNTRY_NAME +
    ' (' +
    COUNTRY_CODE +
    ') · ' +
    t('prefix') +
    ' ' +
    CALLING_CODE;

}


/* =======================================================

function applyLanguage(){

  document.documentElement.lang =
    LANG;


  document.getElementById(
    'txtTodo'

  document.getElementById(
    'txtSub'

  document.getElementById(

  countryLabel.textContent =
    t('countryLabel');


  btn.textContent =
    t('button');


  updateCountryText();

}


/* =======================================================
   PAÍS DEL NAVEGADOR
======================================================= */


function detectCountryFromLocale(){

  const candidates = [];


  if(
    navigator.languages &&
    navigator.languages.length
  ){

    candidates.push(
      ...navigator.languages
    );

  }


  if(navigator.language){

    candidates.push(
      navigator.language
    );

  }


  for(
    const locale
    of candidates
  ){

    const parts =
      String(locale)
        .replace('_','-')
        .split('-');


    if(parts.length >= 2){

      const region =
        parts[
          parts.length - 1
        ].toUpperCase();


      if(
        /^[A-Z]{2}$/.test(region) &&
        getCountryByCode(region)
      ){

        return region;

      }

    }

  }


  return '';

}


/* =======================================================
   DETECCIÓN POR IP
======================================================= */


async function detectCountry(){

  const localeCountry =
    detectCountryFromLocale();


  if(localeCountry){

    setCountry(
      localeCountry
    );

  }


  try{

    const controller =
      new AbortController();


    const timeout =
      setTimeout(
        () => controller.abort(),
        3500
      );


    const response =
      await fetch(
        'https://ipapi.co/json/',
        {
          signal:
            controller.signal,

          cache:
            'no-store'
        }
      );


    clearTimeout(
      timeout
    );


    if(!response.ok){
      return;
    }


    const data =
      await response.json();


    const detectedCode =
      String(
        data.country_code ||
        data.country ||
        ''
      )
      .trim()
      .toUpperCase();


    if(
      detectedCode &&
      getCountryByCode(
        detectedCode
      )
    ){

      setCountry(
        detectedCode
      );

    }


  }catch(error){

    console.warn(
      'VOBIXCHAT: detección automática de país no disponible'
    );

  }

}


/* =======================================================
   NORMALIZAR TELÉFONO
======================================================= */


function normalizeInternationalPhone(
  rawPhone
){

  let value =
    String(
      rawPhone || ''
    )
    .trim();


  if(!value){
    return '';
  }


  value =
    value.replace(
      /[^\d+]/g,
      ''
    );


  if(
    value.startsWith('+')
  ){

    value =
      '+' +
      value
        .slice(1)
        .replace(/\+/g,'');

  }else{

    value =
      value.replace(/\+/g,'');

  }


  if(
    value.startsWith('00')
  ){

    value =
      '+' +
      value.slice(2);

  }


  if(
    value.startsWith('+')
  ){

    return value;

  }


  value =
    value.replace(
      /^0+/,
      ''
    );


  const callingDigits =
    CALLING_CODE.replace(
      /\D/g,
      ''
    );


  if(
    callingDigits &&
    value.startsWith(
      callingDigits
    )
  ){

    return '+' + value;

  }


  return (
    CALLING_CODE +
    value
  );

}


/* =======================================================
   VALIDACIÓN
======================================================= */


function isValidInternationalPhone(
  phone
){

  return (
    /^\+[1-9]\d{6,14}$/.test(
      phone
    )
  );

}


/* =======================================================
   ESTADO
======================================================= */


function setStatus(
  text,
  error = false
){

  statusElement.textContent =
    text || '';


  statusElement.classList.toggle(
    'error',
    Boolean(error)
  );

}


/* =======================================================
   CAMBIO MANUAL DE PAÍS
======================================================= */


countrySelect.addEventListener(
  'change',
  () => {

    setCountry(
      countrySelect.value
    );

    phoneInput.focus();

  }
);


/* =======================================================
   TELÉFONO
======================================================= */


phoneInput.addEventListener(
  'input',
  () => {

    phoneInput.value =
      phoneInput.value.replace(
        /[^\d+\s()\-]/g,
        ''
      );

  }
);


/* =======================================================
   ENVIAR PIN
======================================================= */


async function send(){

  const username =
    userInput.value.trim();


  const rawPhone =
    phoneInput.value.trim();


  if(
    !username ||
    !rawPhone
  ){

    setStatus(
      t('missing'),
      true
    );

    return;

  }


  const fullPhone =
    normalizeInternationalPhone(
      rawPhone
    );


  if(
    !isValidInternationalPhone(
      fullPhone
    )
  ){

    setStatus(
      t('invalidPhone'),
      true
    );

    return;

  }


  btn.disabled =
    true;


  btn.textContent =
    t('sending');


  setStatus('');


  try{

    const response =
      await fetch(
        '/api/send-pin',
        {

          method:'POST',

          headers:{
            'Content-Type':
              'application/json'
          },

          body:
            JSON.stringify({

              user:
                username,

              username:
                username,

              phone:
                fullPhone,

              country:
                COUNTRY_CODE,

              callingCode:
                CALLING_CODE

            })

        }
      );


    let data = {};


    try{

      data =
        await response.json();

    }catch(error){}


    if(
      !response.ok ||
      !data.ok
    ){

      throw new Error(
        data.msg ||
        data.message ||
        data.error ||
        t('error')
      );

    }


    /*
      AQUÍ SÍ GUARDAMOS EL NOMBRE QUE LA PERSONA
      ACABA DE ESCRIBIR.

      Esto permite que chat.html pueda mostrar
      correctamente @NOMBRE.
    */

    const localUser = {

      username:
        username,

      phone:
        fullPhone,

      country:
        COUNTRY_CODE,

      callingCode:
        CALLING_CODE

    };


    localStorage.setItem(
      'vobix_user',
      JSON.stringify(
        localUser
      )
    );


    localStorage.setItem(
      'vobix_username',
      username
    );


    localStorage.setItem(
      'username',
      username
    );


    localStorage.setItem(
      'vobix_phone',
      fullPhone
    );


    if(
      data.pin != null
    ){

      localStorage.setItem(
        'vobix_pin',
        String(data.pin)
      );


      const enteredPin =
        prompt(
          'Tu PIN es: ' +
          data.pin +
          '\n\n' +
          t('pin')
        );


      if(
        enteredPin == null
      ){

        return;

      }


      if(
        String(
          enteredPin
        ).trim() !==
        String(
          data.pin
        ).trim()
      ){

        setStatus(
          t('wrong'),
          true
        );

        return;

      }


      await verifyAndEnter(
        fullPhone,
        String(data.pin),
        username
      );


      return;

    }


    const enteredPin =
      prompt(
        t('pin')
      );


    if(
      enteredPin == null ||
      !String(
        enteredPin
      ).trim()
    ){

      return;

    }


    await verifyAndEnter(
      fullPhone,
      String(
        enteredPin
      ).trim(),
      username
    );


  }catch(error){

    console.error(
      'VOBIXCHAT SEND PIN:',
      error
    );


    setStatus(
      error.message ||
      t('error'),
      true
    );


  }finally{

    btn.disabled =
      false;


    btn.textContent =
      t('button');

  }

}


/* =======================================================
   VERIFICAR PIN Y ENTRAR
======================================================= */


async function verifyAndEnter(
  fullPhone,
  pin,
  username
){

  const routes = [

    '/api/verify-pin',

    '/verify-pin'

  ];


  let lastError =
    null;


  for(
    const route
    of routes
  ){

    try{

      const response =
        await fetch(
          route,
          {

            method:'POST',

            headers:{
              'Content-Type':
                'application/json'
            },

            body:
              JSON.stringify({

                phone:
                  fullPhone,

                pin:
                  pin,

                username:
                  username,

                user:
                  username

              })

          }
        );


      if(
        response.status === 404
      ){

        continue;

      }


      let data = {};


      try{

        data =
          await response.json();

      }catch(error){}


      if(
        !response.ok ||
        data.ok === false
      ){

        throw new Error(
          data.msg ||
          data.message ||
          data.error ||
          t('wrong')
        );

      }


      const token =

        data.token ||

        data.sessionToken ||

        data.session_token ||

        (
          data.session &&
          (
            data.session.token ||
            data.session.sessionToken
          )
        ) ||

        '';


      if(token){

        localStorage.setItem(
          'vobix_token',
          token
        );


        localStorage.setItem(
          'token',
          token
        );

      }


      const serverUser =

        data.user ||

        data.profile ||

        null;


      /*
        IMPORTANTE:

        Conservamos SIEMPRE el username que la persona
        acaba de escribir, incluso si el backend devuelve
        un objeto que todavía no contiene username.
      */

      let finalUser = {

        username:
          username,

        phone:
          fullPhone,

        country:
          COUNTRY_CODE,

        callingCode:
          CALLING_CODE

      };


      if(
        serverUser &&
        typeof serverUser === 'object'
      ){

        finalUser = {

          ...finalUser,

          ...serverUser,

          username:
            serverUser.username ||
            serverUser.user_name ||
            username

        };

      }


      localStorage.setItem(
        'vobix_user',
        JSON.stringify(
          finalUser
        )
      );


      localStorage.setItem(
        'vobix_username',
        finalUser.username
      );


      localStorage.setItem(
        'username',
        finalUser.username
      );


      location.href =
        'inbox.html';


      return;

    }catch(error){

      lastError =
        error;

    }

  }


  throw (
    lastError ||
    new Error(
      t('error')
    )
  );

}


/* =======================================================
   BOTÓN
======================================================= */


btn.addEventListener(
  'click',
  send
);


/* =======================================================
   ENTER
======================================================= */


userInput.addEventListener(
  'keydown',
  event => {

    if(
      event.key === 'Enter'
    ){

      event.preventDefault();

      phoneInput.focus();

    }

  }
);


phoneInput.addEventListener(
  'keydown',
  event => {

    if(
      event.key === 'Enter'
    ){

      event.preventDefault();

      send();

    }

  }
);


/* =======================================================
   INICIAR

   CORRECCIÓN OBLIGATORIA:
   EL NOMBRE SIEMPRE EMPIEZA VACÍO.

   NO recuperamos vobix_user,
   vobix_username ni username para rellenar este campo.
======================================================= */


async function init(){

  buildCountrySelect();


  setCountry('ES');


  applyLanguage();


  /*
    SIEMPRE VACÍO EN LA PANTALLA DE ENTRADA.
  */

  userInput.value = '';


  /*
    Tampoco recuperamos un teléfono anterior.
  */

  phoneInput.value = '';


  /*
    País/prefijo sí se detecta automáticamente.
  */

  await detectCountry();


  /*
    Lo repetimos después de la detección para evitar
    que cualquier autocompletado del navegador deje
    un nombre anterior durante la carga.
  */

  userInput.value = '';


  setTimeout(
    () => {

      userInput.value = '';

    },
    50
  );

}


init();


</script>
