<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>VobixChat</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: #111b21;
      color: #e9edef;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    #vobixchat-terminal {
      position: fixed;
      inset: 0;
      background: #111b21;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
      z-index: 200;
    }
    .login-card {
      background: #202c33;
      padding: 30px;
      border-radius: 12px;
      width: 100%;
      max-width: 360px;
      display: flex;
      flex-direction: column;
      gap: 15px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.5);
    }
    .login-card h2 {
      color: #00a884;
      font-size: 22px;
      text-align: center;
      margin-bottom: 5px;
    }
    .login-card input, .login-card select {
      background: #2a3942;
      border: 1px solid #374248;
      color: #fff;
      padding: 12px;
      border-radius: 8px;
      font-size: 15px;
      outline: none;
      width: 100%;
    }
    .btn-whatsapp {
      background: #00a884;
      color: #fff;
      border: none;
      padding: 12px;
      border-radius: 8px;
      font-weight: bold;
      font-size: 15px;
      cursor: pointer;
      transition: background 0.2s;
    }
    .btn-whatsapp:hover { background: #008f72; }
    
    #error-login-msg {
      color: #f15c6d;
      font-size: 12px;
      text-align: center;
      display: none;
    }

    #vobixchat-hud {
      flex: 1;
      display: flex;
      flex-direction: column;
      background: #0b141a;
      position: relative;
      overflow-y: auto;
      padding-bottom: 80px;
    }
    .header-chat {
      background: #202c33;
      padding: 12px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #2a3942;
    }
    .paneles-video-cuantico {
      display: grid;
      grid-template-columns: 1fr;
      gap: 10px;
      padding: 15px;
    }
    @media (min-width: 768px) {
      .paneles-video-cuantico { grid-template-columns: 1fr 1fr; }
    }
    .pantalla-media {
      background: #202c33;
      border-radius: 10px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }
    .tag-video {
      font-size: 12px;
      color: #8696a0;
      padding: 8px 12px;
      background: rgba(0,0,0,0.2);
    }
    video {
      width: 100%;
      height: 220px;
      object-fit: cover;
      background: #000;
    }
    .call-box {
      background: #202c33;
      margin: 15px;
      padding: 15px;
      border-radius: 10px;
      display: flex;
      gap: 10px;
      align-items: center;
    }
    .call-box input {
      flex: 1;
      background: #2a3942;
      border: none;
      color: #fff;
      padding: 10px 14px;
      border-radius: 8px;
      font-size: 14px;
      outline: none;
    }
    .wa-footer-moderno {
      position: fixed;
      bottom: 0;
      left: 0;
      width: 100%;
      background: #202c33;
      padding: 10px 16px;
      padding-bottom: max(12px, env(safe-area-inset-bottom));
      display: flex;
      align-items: center;
      gap: 10px;
      z-index: 100;
    }
    .wa-action-btn {
      background: transparent;
      border: none;
      color: #8696a0;
      font-size: 22px;
      cursor: pointer;
      padding: 4px;
    }
    .wa-input-capsule {
      flex: 1;
      background: #2a3942;
      border-radius: 24px;
      padding: 10px 16px;
      display: flex;
      align-items: center;
    }
    .wa-input-capsule input {
      flex: 1;
      background: transparent;
      border: none;
      color: #fff;
      font-size: 15px;
      outline: none;
    }
  </style>
  <script src="/socket.io/socket.io.js"></script>
</head>
<body>

  <div id="vobixchat-terminal">
    <div class="login-card">
      <h2>VobixChat</h2>
      <p style="font-size: 13px; color: #8696a0; text-align: center;">Introduce tu número de teléfono móvil</p>
      
      <div style="display: flex; gap: 8px;">
        <select id="country-code" style="width: 110px;">
          <option value="ES" selected>ES +34</option>
          <option value="US">US +1</option>
          <option value="MX">MX +52</option>
          <option value="CO">CO +57</option>
          <option value="AR">AR +54</option>
        </select>
        <input type="tel" id="phone-number" placeholder="Número móvil">
      </div>
      
      <div id="error-login-msg"></div>
      <button class="btn-whatsapp" onclick="entrarAlSistema()">Comenzar</button>
    </div>
  </div>

  <div id="vobixchat-hud" style="display: none;">
    <div class="header-chat">
      <span id="user-display-tag" style="font-weight: bold; color: #00a884;">VobixChat Online</span>
      <span id="sys-status" style="font-size: 12px; color: #8696a0;">Conectado</span>
    </div>

    <div class="call-box">
      <input type="tel" id="numero-destino-input" placeholder="Número de destino para llamar">
      <button class="btn-whatsapp" style="padding: 10px 20px;" onclick="ejecutarMarcadoFromHUD()">Llamar</button>
    </div>

    <div class="paneles-video-cuantico">
      <div class="pantalla-media">
        <div class="tag-video">Cámara Local</div>
        <video id="local-video-preview" autoplay playsinline muted></video>
      </div>
      <div class="pantalla-media">
        <div class="tag-video">Cámara Remota</div>
        <video id="remote-video-display" autoplay playsinline></video>
      </div>
    </div>
  </div>

  <div class="wa-footer-moderno" id="barra-mensajeria-inferior" style="display: none;">
    <button class="wa-action-btn">📎</button>
    <div class="wa-input-capsule">
      <input type="text" id="mensajeChatInput" placeholder="Escribe un mensaje...">
    </div>
    <button class="wa-action-btn" style="color: #00a884;">➤</button>
  </div>

  <script>
    async function entrarAlSistema() {
      const codigoPais = document.getElementById('country-code').value;
      const numeroCrudo = document.getElementById('phone-number').value.trim();
      const errorMsg = document.getElementById('error-login-msg');

      errorMsg.style.display = 'none';

      if (!numeroCrudo) {
        errorMsg.innerText = "Por favor introduce un número válido.";
        errorMsg.style.display = 'block';
        return;
      }

      try {
        const respuesta = await fetch('/api/seguridad/verificar-usuario', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ numeroCrudo, codigoPais })
        });
        const resultado = await respuesta.json();

        if (resultado.success) {
          document.getElementById('vobixchat-terminal').style.display = 'none';
          document.getElementById('vobixchat-hud').style.display = 'flex';
          document.getElementById('barra-mensajeria-inferior').style.display = 'flex';
          
          const telefonoFinal = codigoPais + " " + numeroCrudo;
          document.getElementById('user-display-tag').innerText = "VobixChat // " + telefonoFinal;
          
          if (window.conectarClienteSignaling) {
            window.conectarClienteSignaling(telefonoFinal);
          }
        } else {
          errorMsg.innerText = resultado.error;
          errorMsg.style.display = 'block';
        }
      } catch (err) {
        errorMsg.innerText = "Error de conexión con el servidor.";
        errorMsg.style.display = 'block';
      }
    }
  </script>
  <script src="cliente-comunicaciones.js"></script>
</body>
</html>
