<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VobixChat - Videollamada</title>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; background: #f4f4f9; margin: 0; padding: 20px; }
        .video-container { display: flex; justify-content: center; gap: 20px; margin-top: 20px; flex-wrap: wrap; }
        video { width: 400px; max-width: 100%; height: 300px; background: #000; border-radius: 8px; border: 2px solid #ccc; }
        .controls { margin-top: 20px; }
        input, button { padding: 10px; font-size: 16px; margin: 5px; border-radius: 5px; border: 1px solid #ccc; }
        button { background: #007bff; color: white; cursor: pointer; border: none; }
        button:hover { background: #0056b3; }
        button.danger { background: #dc3545; }
        button.danger:hover { background: #a71d2a; }
    </style>
</head>
<body>

    <h1>VobixChat - Sistema de Llamadas</h1>
    <div id="estado-usuario" style="font-weight: bold; color: #555;">No registrado</div>

    <div class="controls">
        <input type="text" id="miIdInput" placeholder="Tu ID o número de usuario">
        <button onclick="registrarUsuario()">Conectar ID</button>
    </div>

    <div class="controls" style="margin-top: 30px;">
        <input type="text" id="destinatarioInput" placeholder="ID a quien llamar">
        <button onclick="llamarUsuario()">Iniciar Llamada</button>
        <button class="danger" onclick="colgar()">Colgar</button>
    </div>

    <div class="video-container">
        <div>
            <p>Tu Cámara</p>
            <video id="localVideo" autoplay muted playsinline></video>
        </div>
        <div>
            <p>Videollamada Remota</p>
            <video id="remoteVideo" autoplay playsinline></video>
        </div>
    </div>

    <!-- Script de Socket.io -->
    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();
        let identificadorUsuario = "";
        let destinatarioActual = "";
        let peerConnection = null;
        let localStream = null;
        let remoteStream = null;

        const rtcConfig = {
            iceServers: [
                { urls: 'stun:stun.l.google.com:19302' },
                { urls: 'stun:stun1.l.google.com:19302' }
            ]
        };

        function registrarUsuario() {
            const input = document.getElementById('miIdInput').value.trim();
            if (!input) return alert("Introduce un identificador válido.");
            
            identificadorUsuario = input;
            socket.emit("registrar-canal-llamada", { identificador_usuario: identificadorUsuario });
            document.getElementById('estado-usuario').innerText = `Conectado como: ${identificadorUsuario}`;
            alert("¡Registrado correctamente en el servidor!");
        }

        socket.on("error-llamada", (data) => {
            alert(`Aviso: ${data.error}`);
            resetearLlamada();
        });

        socket.on("recibir-oferta-webrtc", async (data) => {
            const aceptar = confirm(`Llamada entrante de: ${data.emisor}. ¿Deseas contestar?`);
            if (!aceptar) {
                socket.emit("finalizar-llamada", { destinatario: data.emisor });
                return;
            }

            destinatarioActual = data.emisor;

            try {
                await inicializarMediaLocal();
                crearPeerConnection(destinatarioActual);

                await peerConnection.setRemoteDescription(new RTCSessionDescription(data.sdp));
                const respuesta = await peerConnection.createAnswer();
                await peerConnection.setLocalDescription(respuesta);

                socket.emit("enviar-respuesta-webrtc", {
                    destinatario: destinatarioActual,
                    emisor: identificadorUsuario,
                    sdp: peerConnection.localDescription
                });
            } catch (error) {
                console.error("Error al aceptar la llamada:", error);
            }
        });

        socket.on("recibir-respuesta-webrtc", async (data) => {
            try {
                if (peerConnection) {
                    await peerConnection.setRemoteDescription(new RTCSessionDescription(data.sdp));
                }
            } catch (error) {
                console.error("Error al procesar la respuesta remota:", error);
            }
        });

        socket.on("recibir-candidato-ice", async (data) => {
            try {
                if (peerConnection && data.candidato) {
                    await peerConnection.addIceCandidate(new RTCIceCandidate(data.candidato));
                }
            } catch (error) {
                console.error("Error al añadir candidato ICE:", error);
            }
        });

        socket.on("llamada-finalizada", () => {
            alert("La llamada ha finalizado por el otro usuario.");
            resetearLlamada();
        });

        async function llamarUsuario() {
            const destinatario = document.getElementById('destinatarioInput').value.trim();
            if (!destinatario) return alert("Introduce el ID del destinatario.");
            if (!identificadorUsuario) return alert("Primero debes registrar tu propio ID arriba.");

            destinatarioActual = destinatario;

            try {
                await inicializarMediaLocal();
                crearPeerConnection(destinatarioActual);

                const oferta = await peerConnection.createOffer();
                await peerConnection.setLocalDescription(oferta);

                socket.emit("enviar-oferta-webrtc", {
                    emisor: identificadorUsuario,
                    destinatario: destinatarioActual,
                    sdp: peerConnection.localDescription
                });
            } catch (error) {
                console.error("Error al iniciar la llamada:", error);
            }
        }

        async function inicializarMediaLocal() {
            if (localStream) return; // Ya inicializado
            try {
                localStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
                document.getElementById('localVideo').srcObject = localStream;
            } catch (error) {
                alert("No se pudieron obtener permisos de cámara y micrófono.");
                throw error;
            }
        }

        function crearPeerConnection(destinatarioId) {
            peerConnection = new RTCPeerConnection(rtcConfig);

            localStream.getTracks().forEach(track => {
                peerConnection.addTrack(track, localStream);
            });

            peerConnection.ontrack = (event) => {
                remoteStream = event.streams[0];
                document.getElementById('remoteVideo').srcObject = remoteStream;
            };

            peerConnection.onicecandidate = (event) => {
                if (event.candidate) {
                    socket.emit("enviar-candidato-ice", {
                        destinatario: destinatarioId,
                        emisor: identificadorUsuario,
                        candidato: event.candidate
                    });
                }
            };
        }

        function colgar() {
            if (destinatarioActual) {
                socket.emit("finalizar-llamada", { destinatario: destinatarioActual });
            }
            resetearLlamada();
        }

        function resetearLlamada() {
            if (peerConnection) {
                peerConnection.close();
                peerConnection = null;
            }
            if (localStream) {
                localStream.getTracks().forEach(track => track.stop());
                localStream = null;
            }
            document.getElementById('localVideo').srcObject = null;
            document.getElementById('remoteVideo').srcObject = null;
            destinatarioActual = "";
        }
    </script>
</body>
</html>
