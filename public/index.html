<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>VobixChat Core - Canal Seguro</title>
    <style>
        :root {
            --vobix-bg-primary: #121b22;
            --vobix-bg-secondary: #1f2c34;
            --vobix-text-main: #e9edef;
            --vobix-accent: #00a884;
            --vobix-font-size: 16px;
            --vobix-button-height: 44px;
        }

        /* CAPA C1.4: Estilos Adaptativos para Modo Vobix Senior */
        .vobix-high-contrast {
            --vobix-bg-primary: #000000;
            --vobix-bg-secondary: #1a1a1a;
            --vobix-text-main: #ffffff;
            --vobix-accent: #ffff00; /* Amarillo de alta visibilidad */
        }

        body {
            margin: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--vobix-bg-primary);
            color: var(--vobix-text-main);
            font-size: var(--vobix-font-size);
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }

        /* Contenedor Maestro Multimedia de Llamadas */
        #vobix-video-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 10px;
            padding: 10px;
            background-color: #000;
            flex-grow: 1;
            max-height: 40vh;
            overflow-y: auto;
        }

        #vobix-video-grid video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 8px;
            background-color: #2a2a2a;
        }

        /* Zona de Chat y Mensajería */
        #chat-interface {
            flex-grow: 2;
            display: flex;
            flex-direction: column;
            background-color: var(--vobix-bg-primary);
            border-top: 1px solid var(--vobix-bg-secondary);
        }

        #message-log {
            flex-grow: 1;
            padding: 15px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        /* CAPA C1.2: Banner Educativo de Advertencia de la IA Anti-Estafas */
        #vobix-safety-nudge-banner {
            display: none;
            padding: 12px;
            margin: 10px;
            border-radius: 8px;
            font-weight: 500;
            animation: slideIn 0.3s ease-out;
            box-shadow: 0 4px 6px rgba(0,0,0,0.2);
        }

        @keyframes slideIn {
            from { transform: translateY(20px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }

        /* Controles de Entrada y Teclado */
        .input-bar {
            display: flex;
            padding: 10px;
            background-color: var(--vobix-bg-secondary);
            gap: 10px;
            align-items: center;
        }

        .input-bar input {
            flex-grow: 1;
            height: var(--vobix-button-height);
            border: none;
            border-radius: 8px;
            padding: 0 12px;
            background-color: var(--vobix-bg-primary);
            color: var(--vobix-text-main);
            font-size: var(--vobix-font-size);
        }

        .input-bar button {
            height: var(--vobix-button-height);
            min-width: 60px;
            border: none;
            border-radius: 8px;
            background-color: var(--vobix-accent);
            color: #fff;
            font-weight: bold;
            cursor: pointer;
        }

        /* Ocultar elementos avanzados en modo simplificado */
        .vobix-simplified-mode .advanced-feature {
            display: none !important;
        }
    </style>
</head>
<body>

    <!-- Rejilla Inteligente de Videollamadas Grupales (WebRTC) -->
    <div id="vobix-video-grid"></div>

    <!-- Interfaz de Conversación Segura -->
    <div id="chat-interface">
        <div id="message-log">
            <!-- Los paquetes de mensajes e historiales se inyectan aquí dinámicamente -->
        </div>

        <!-- CAPA C1.2: Espacio reservado para avisos automáticos de la IA sobre el teclado -->
        <div id="vobix-safety-nudge-banner"></div>

        <!-- Barra de acciones y caja de entrada de texto -->
        <div class="input-bar">
            <input type="text" id="chat-input-box" placeholder="Escribe un mensaje seguro...">
            <button id="btn-send-message">Enviar</button>
            <button id="btn-panic-sos" class="advanced-feature" style="background-color: #d32f2f;">SOS</button>
        </div>
    </div>

    <!-- Dependencias Estructurales del Cliente mediante CDN Oficiales -->
    <script src="/socket.io/socket.io.js"></script>
    <script src="https://cloudflare.com"></script>

    <!-- Inyección de la Arquitectura de Capas Lógicas VobixChat -->
    <script src="/js/c1-antifraud.js"></script> <!-- Fallback para message-intent.js local -->
    <script src="/js/client.js"></script>
</body>
</html>
