<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VobixChat</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Segoe UI',Arial;background:linear-gradient(135deg,#0a0a0a 0%,#1a1a1a 100%);color:white;min-height:100vh;display:flex;justify-content:center;align-items:center}
.card{background:#1c1c1c;border:1px solid #00ff88;border-radius:20px;padding:32px;width:92%;max-width:380px;text-align:center;box-shadow:0 0 30px rgba(0,255,136,0.2)}
.logo{width:70px;height:70px;background:#00ff88;border-radius:18px;margin:0 auto 15px;display:flex;align-items:center;justify-content:center;font-size:32px;color:black;font-weight:bold}
h2{color:#00ff88;margin-bottom:5px}
label{display:block;text-align:left;margin:16px 0 6px;font-size:13px;opacity:0.9}
input{width:100%;padding:13px;border-radius:12px;border:1px solid #333;background:#111;color:white;outline:none}
input:focus{border-color:#00ff88}
button{width:100%;padding:14px;background:#00ff88;color:black;border:none;border-radius:12px;font-weight:bold;cursor:pointer;margin-top:18px;font-size:15px}
small{opacity:0.5;font-size:11px;display:block;margin-top:12px;line-height:1.3}
#msg{margin-top:12px;color:#00ff88;font-size:13px;min-height:18px}
</style>
</head>
<body>
<div class="card">
<div class="logo">V</div>
<h2>VobixChat</h2>
<label>Nombre de usuario:</label>
<input id="username" placeholder="Ej: usuario123">
<label>Número de teléfono:</label>
<input id="phone" placeholder="+34 600 000 000">
<small>Tu número es 100% privado. Nunca será visible para otros usuarios.</small>
<button onclick="sendPin()" id="b1">Enviar código</button>
<input id="pin" placeholder="123456" style="display:none;margin-top:12px">
<button onclick="verifyPin()" id="b2" style="display:none">Verificar</button>
<p id="msg"></p>
</div>
<script>
async function sendPin(){
 let u=document.getElementById('username').value.trim();
 let p=document.getElementById('phone').value.trim();
 if(!u) return alert('Pon nombre de usuario');
 if(!p) return alert('Pon tu número');
 document.getElementById('msg').innerText='Enviando...';
 let r=await fetch('/send-pin',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({phone:p, username:u})});
 let d=await r.json();
 if(d.ok){
   document.getElementById('pin').style.display='block';
   document.getElementById('b2').style.display='block';
   document.getElementById('msg').innerText='✓ Código enviado. Revisa consola del servidor.';
 } else document.getElementById('msg').innerText='Error';
}
async function verifyPin(){
 let u=document.getElementById('username').value.trim();
 let p=document.getElementById('phone').value.trim();
 let pin=document.getElementById('pin').value.trim();
 let r=await fetch('/verify-pin',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({phone:p, username:u, pin:pin})});
 let d=await r.json();
 if(d.ok){
   document.getElementById('msg').innerText='¡Verificado! Bienvenido ' + u;
   setTimeout(()=>{window.location.href='/comunicaciones.html?u='+encodeURIComponent(u)},1000);
 } else document.getElementById('msg').innerText='PIN incorrecto';
}
</script>
</body>
</html>
