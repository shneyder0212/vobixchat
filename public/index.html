<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>VobixChat</title>
<style>
*{box-sizing:border-box;font-family:Arial,sans-serif}
html,body{margin:0;padding:0;min-height:100dvh;background:#080c09}
body{display:flex;justify-content:center;align-items:center;background-image:radial-gradient(rgba(58,255,104,0.18) 1.5px, transparent 1.5px);background-size:24px 24px;padding:20px;padding-bottom:calc(20px + env(safe-area-inset-bottom))}
.card{width:100%;max-width:360px;background:#101610;border:2px solid #3aff68;border-radius:26px;padding:26px 18px;text-align:center;box-shadow:0 0 35px #3aff6866;overflow:hidden}
.logo{width:76px;height:76px;background:#3aff68;border-radius:18px;margin:0 auto 16px;display:flex;align-items:center;justify-content:center;font-size:42px;font-weight:900;color:#000}
h1{margin:0;color:white;font-size:clamp(26px, 7.5vw, 33px);letter-spacing:0.5px;font-weight:900;white-space:nowrap;width:100%;text-align:center}
.sub{color:#3aff68;font-size:18px;font-weight:900;margin:6px 0}
.sub2{color:#e8f0e9;font-size:11px;letter-spacing:2px;margin-bottom:22px;font-weight:700;line-height:1.4}
input{width:100%;background:#0a150c;border:1.5px solid #2d4a30;border-radius:14px;padding:14px;color:white;outline:none}
input::placeholder{color:#8da290}
.row{display:flex;gap:8px;margin:14px 0}.pref{width:75px}.num{flex:1}
.pais{font-size:11px;color:#8db891;text-align:left;margin:0 0 16px}
.btn{width:100%;background:#3aff68;border:none;color:#000;padding:15px;border-radius:14px;font-weight:900;cursor:pointer;font-size:12px;letter-spacing:0.8px}
#pinBox{display:none;margin-top:14px}
</style>
</head>
<body>
<div class="card">
<div class="logo">V</div>
<h1>VOBIXCHAT</h1>
<div class="sub">TODO EN UNO</div>
<div class="sub2">SEGURO • RAPIDO • PRIVADO</div>
<input id="username" placeholder="Nombre de usuario">
<div class="row"><div class="pref"><input value="+34" readonly></div><div class="num"><input id="phone" placeholder=""></div></div>
<div class="pais">País detectado: ES - Prefijo +34</div>
<button class="btn" onclick="sendPin()">ENVIARME PIN POR SMS</button>
<div id="pinBox"><input id="pin" placeholder="PIN de 6 dígitos" style="margin-bottom:10px"><button class="btn" onclick="verifyPin()">VERIFICAR Y ENTRAR</button></div>
</div>
<script>
let curPhone="", curUser="";
async function sendPin(){
 curUser=document.getElementById('username').value.trim();
 let phone=document.getElementById('phone').value.trim().replace(/\s/g,'');
 if(!curUser||!phone){alert('Pon datos');return;}
 if(!phone.startsWith('+')) phone='+34'+phone.replace(/^34/,'');
 curPhone=phone;
 const r=await fetch('/send-pin',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({phone:curPhone})});
 const d=await r.json(); if(d.ok) document.getElementById('pinBox').style.display='block'; else alert(d.error);
}
async function verifyPin(){
 const pin=document.getElementById('pin').value.trim();
 const r=await fetch('/verify-pin',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({phone:curPhone,pin,username:curUser})});
 const d=await r.json(); if(d.ok){alert('Bienvenido '+curUser); localStorage.setItem('vobix_user',curUser);} else alert('PIN mal');
}
</script>
</body>
</html>
