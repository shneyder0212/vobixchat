<!DOCTYPE html>

<html lang="es">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>VOBIXCHAT</title>

<style>

*{
  box-sizing:border-box;
}

body{

  margin:0;

  min-height:100vh;

  display:flex;

  align-items:center;

  justify-content:center;

  font-family:Arial,sans-serif;

  color:white;

  background-color:#080808;

  background-image:
    radial-gradient(
      #292929 1px,
      transparent 1px
    );

  background-size:20px 20px;

}

.card{

  width:90%;

  max-width:430px;

  background:#162d25;

  border-radius:24px;

  padding:34px 26px;

  box-shadow:
    0 20px 60px
    rgba(0,0,0,.55);

  text-align:center;

}

.logo{

  width:82px;

  height:82px;

  margin:0 auto 14px;

  border-radius:50%;

  display:flex;

  align-items:center;

  justify-content:center;

  background:#00e676;

  color:white;

  font-size:48px;

  font-weight:bold;

}

h1{

  margin:0;

  font-size:38px;

  letter-spacing:1px;

}

.subtitle{

  margin-top:5px;

  margin-bottom:26px;

  color:#d0d0d0;

}

input{

  width:100%;

  padding:15px;

  margin-bottom:13px;

  border:0;

  border-radius:10px;

  outline:none;

  font-size:16px;

}

button{

  width:100%;

  padding:15px;

  border:0;

  border-radius:10px;

  background:#00e676;

  color:#04150d;

  font-size:16px;

  font-weight:bold;

  cursor:pointer;

}

button:disabled{

  opacity:.7;

  cursor:not-allowed;

}

.security{

  margin-top:18px;

  color:#cfcfcf;

  font-size:14px;

}

</style>

</head>


<body>


<div class="card">

  <div class="logo">
    V
  </div>


  <h1>
    VOBIXCHAT
  </h1>


  <div class="subtitle">
    TODO EN UNO
  </div>


  <input
    id="user"
    type="text"
    placeholder="Tu nombre"
    autocomplete="name"
  >


  <input
    id="phone"
    type="tel"
    placeholder="+34 600 000 000"
    autocomplete="tel"
  >


  <button
    id="btn"
    type="button"
  >
    ENVIARME PIN POR SMS
  </button>


  <div class="security">
    🔒 Cifrado de extremo a extremo
  </div>

</div>


<script>

'use strict';


const userInput =
  document.getElementById('user');

const phoneInput =
  document.getElementById('phone');

const btn =
  document.getElementById('btn');


// ======================================================
// REGISTRO VOBIXCHAT
// ======================================================

async function send(){

  const username =
    userInput.value.trim();

  const phone =
    phoneInput.value.trim();


  if (!username || !phone) {

    alert(
      'Pon nombre y teléfono'
    );

    return;

  }


  btn.disabled = true;

  btn.innerText =
    'ENVIANDO...';


  try {

    // --------------------------------------------------
    // SOLICITAR PIN
    // --------------------------------------------------

    const response =
      await fetch(
        '/api/send-pin',
        {

          method:'POST',

          headers:{
            'Content-Type':
              'application/json'
          },

          body:JSON.stringify({

            user:username,

            phone:phone

          })

        }
      );


    const data =
      await response.json();


    if (!data.ok) {

      alert(
        data.msg ||
        'No se pudo generar el PIN'
      );

      return;

    }


    // --------------------------------------------------
    // PIN DE PRUEBAS
    // --------------------------------------------------

    const enteredPin =
      prompt(
        'Tu PIN es: ' +
        data.pin +
        '\n\nEscríbelo para entrar:'
      );


    if (!enteredPin) {
      return;
    }


    // --------------------------------------------------
    // VERIFICACIÓN EN EL SERVIDOR
    // --------------------------------------------------

    const verifyResponse =
      await fetch(
        '/verify-pin',
        {

          method:'POST',

          headers:{
            'Content-Type':
              'application/json'
          },

          body:JSON.stringify({

            phone:phone,

            pin:
              enteredPin.trim()

          })

        }
      );


    const verification =
      await verifyResponse.json();


    if (!verification.ok) {

      alert(
        verification.msg ||
        'PIN incorrecto'
      );

      return;

    }


    // --------------------------------------------------
    // GUARDAR SESIÓN LOCAL
    // --------------------------------------------------

    localStorage.setItem(
      'vobix_user',
      verification.user.username
    );


    localStorage.setItem(
      'vobix_phone',
      phone
    );


    localStorage.setItem(
      'vobix_user_id',
      verification.user.id
    );


    // --------------------------------------------------
    // ENTRAR
    // --------------------------------------------------

    window.location.href =
      'chat.html';


  } catch (error) {

    console.error(
      'VOBIXCHAT REGISTER ERROR:',
      error
    );


    alert(
      'No se pudo completar el registro'
    );


  } finally {

    btn.disabled = false;

    btn.innerText =
      'ENVIARME PIN POR SMS';

  }

}


btn.addEventListener(
  'click',
  send
);


phoneInput.addEventListener(
  'keydown',
  event => {

    if (event.key === 'Enter') {
      send();
    }

  }
);


userInput.addEventListener(
  'keydown',
  event => {

    if (event.key === 'Enter') {
      phoneInput.focus();
    }

  }
);

</script>


</body>

</html>
