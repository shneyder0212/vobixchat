async function requestNotificationPermission() {

  if (
    !('Notification' in window)
  ) {

    return false;

  }


  if (
    Notification.permission ===
    'granted'
  ) {

    return true;

  }


  if (
    Notification.permission ===
    'denied'
  ) {

    return false;

  }


  try {

    const permission =
      await Notification
        .requestPermission();


    return (
      permission ===
      'granted'
    );


  } catch (error) {

    return false;

  }

}


// ========================================================
// MOSTRAR NOTIFICACIÓN LOCAL
// ========================================================

function showMessageNotification(
  title,
  body
) {

  if (
    !('Notification' in window) ||
    Notification.permission !==
      'granted'
  ) {

    return;

  }


  /*
    Si VOBIXCHAT está visible no necesitamos
    llenar el sistema de notificaciones.
  */

  if (
    document.visibilityState ===
      'visible'
  ) {

    return;

  }


  try {

    const notification =
      new Notification(
        title || 'VOBIXCHAT',
        {

          body:
            body || 'Nuevo mensaje',

          tag:
            'vobix-message',

          renotify:
            true

        }
      );


    notification.onclick =
      () => {

        window.focus();


        try {

          notification.close();

        } catch (error) {}

      };


  } catch (error) {

    console.warn(
      'VOBIXCHAT NOTIFICATION:',
      error
    );

  }

}


// ========================================================
// SONIDO DE MENSAJE
//
// Se genera con Web Audio.
// No necesitamos descargar ningún archivo de sonido.
// ========================================================

let notificationAudioContext =
  null;


function playMessageSound() {

  try {

    const AudioContextClass =
      window.AudioContext ||
      window.webkitAudioContext;


    if (!AudioContextClass) {
      return;
    }


    if (!notificationAudioContext) {

      notificationAudioContext =
        new AudioContextClass();

    }


    if (
      notificationAudioContext.state ===
      'suspended'
    ) {

      notificationAudioContext
        .resume()
        .catch(
          () => {}
        );

    }


    const oscillator =
      notificationAudioContext
        .createOscillator();


    const gain =
      notificationAudioContext
        .createGain();


    oscillator.type =
      'sine';


    oscillator.frequency
      .setValueAtTime(
        720,
        notificationAudioContext.currentTime
      );


    oscillator.frequency
      .exponentialRampToValueAtTime(
        980,
        notificationAudioContext.currentTime +
        0.11
      );


    gain.gain
      .setValueAtTime(
        0.0001,
        notificationAudioContext.currentTime
      );


    gain.gain
      .exponentialRampToValueAtTime(
        0.12,
        notificationAudioContext.currentTime +
        0.015
      );


    gain.gain
      .exponentialRampToValueAtTime(
        0.0001,
        notificationAudioContext.currentTime +
        0.18
      );


    oscillator.connect(
      gain
    );


    gain.connect(
      notificationAudioContext.destination
    );


    oscillator.start();


    oscillator.stop(
      notificationAudioContext.currentTime +
      0.19
    );


  } catch (error) {}

}


// ========================================================
// TIMBRE DE LLAMADA
// ========================================================

let ringtoneContext =
  null;

let ringtoneInterval =
  null;


function playRingtonePulse() {

  try {

    const AudioContextClass =
      window.AudioContext ||
      window.webkitAudioContext;


    if (!AudioContextClass) {
      return;
    }


    if (!ringtoneContext) {

      ringtoneContext =
        new AudioContextClass();

    }


    if (
      ringtoneContext.state ===
      'suspended'
    ) {

      ringtoneContext
        .resume()
        .catch(
          () => {}
        );

    }


    const oscillator1 =
      ringtoneContext
        .createOscillator();


    const oscillator2 =
      ringtoneContext
        .createOscillator();


    const gain =
      ringtoneContext
        .createGain();


    oscillator1.type =
      'sine';

    oscillator2.type =
      'sine';


    oscillator1.frequency.value =
      440;

    oscillator2.frequency.value =
      520;


    gain.gain
      .setValueAtTime(
        0.0001,
        ringtoneContext.currentTime
      );


    gain.gain
      .exponentialRampToValueAtTime(
        0.13,
        ringtoneContext.currentTime +
        0.03
      );


    gain.gain
      .setValueAtTime(
        0.13,
        ringtoneContext.currentTime +
        0.42
      );


    gain.gain
      .exponentialRampToValueAtTime(
        0.0001,
        ringtoneContext.currentTime +
        0.55
      );


    oscillator1.connect(
      gain
    );


    oscillator2.connect(
      gain
    );


    gain.connect(
      ringtoneContext.destination
    );


    oscillator1.start();

    oscillator2.start();


    oscillator1.stop(
      ringtoneContext.currentTime +
      0.56
    );


    oscillator2.stop(
      ringtoneContext.currentTime +
      0.56
    );


  } catch (error) {}

}


function startRingtone() {

  stopRingtone();


  playRingtonePulse();


  ringtoneInterval =
    setInterval(
      playRingtonePulse,
      1600
    );

}


function stopRingtone() {

  if (ringtoneInterval) {

    clearInterval(
      ringtoneInterval
    );

  }


  ringtoneInterval =
    null;

}

}

    showToast(
      'Sin conexión a Internet'
    );


    if (currentConversation) {

      roomStatus.textContent =
        'Sin conexión';

    }


    if (currentCall) {

      callTopStatus.textContent =
        'Sin conexión';

      audioCallStatus.textContent =
        'Sin conexión';

    }

  }
);


// ========================================================
// ESC
// ========================================================

document.addEventListener(
  'keydown',
  event => {

    if (
      event.key !==
      'Escape'
    ) {

      return;

    }


    emojiPanel.classList.remove(
      'open'
    );


    attachMenu.classList.remove(
      'open'
    );

  }
);


// ========================================================
// LIMPIEZA ANTES DE SALIR
// ========================================================

window.addEventListener(
  'beforeunload',
  () => {

    stopRingtone();


    if (
      currentCall &&
      socket.connected
    ) {

      try {

        socket.emit(
          'call:end',
          {

            callId:
              currentCall.callId,

            conversationId:
              currentCall.conversationId,

            conversation_id:
              currentCall.conversationId,

            reason:
              'page-closed'

          }
        );

      } catch (error) {}

    }


    if (recordingStream) {

      recordingStream
        .getTracks()
        .forEach(
          track => {

            try {

              track.stop();

            } catch (error) {}

          }
        );

    }


    stopLocalCallStream();

    stopRemoteCallStream();

    closePeerConnection();

  }
);


// ========================================================
// ARRANQUE GENERAL DE VOBIXCHAT
// ========================================================

async function initVobixChat() {

  renderMyProfile();


  if (!VOBIX_TOKEN) {

    console.warn(
      'VOBIXCHAT: no se encontró token de sesión'
    );


    showToast(
      'No encontramos una sesión válida'
    );


    return;

  }


  try {

    await loadMyProfile();

  } catch (error) {

    console.warn(
      'VOBIXCHAT PROFILE:',
      error
    );

  }


  try {

    await loadConversations();

  } catch (error) {

    console.error(
      'VOBIXCHAT INIT CONVERSATIONS:',
      error
    );

  }

}


// ========================================================
// INICIAR
// ========================================================

initVobixChat();


</script>

</html>
