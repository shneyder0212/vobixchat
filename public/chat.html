<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content"
  >

  <meta
    name="theme-color"
    content="#0b160d"
  >

  <!-- VOBIXCHAT CHAT V3 2026-08-29 -->
  <title>VOBIXCHAT</title>

  <style>

    /* =====================================================
       VOBIXCHAT
       PUBLIC/chat.html
       V2 CORREGIDO
       BLOQUE 1 DE 6

       IMPORTANTE:
       - ESTE BLOQUE EMPIEZA EL ARCHIVO
       - NO PEGAR NADA ANTES
       - NO CERRAR STYLE TODAVÍA
       ===================================================== */


    /* =====================================================
       VARIABLES
       ===================================================== */

    :root {
      --green: #68ff72;
      --green-dark: #17341d;
      --bg: #071009;
      --panel: #0b160d;
      --panel-2: #122016;
      --panel-3: #15251a;

      --text: #ffffff;
      --muted: rgba(255,255,255,.62);

      --line: rgba(104,255,114,.18);
      --line-strong: rgba(104,255,114,.35);

      --danger: #ff6666;

      --topbar-height: 72px;
      --composer-height: 78px;
      --vobix-safe-top: env(safe-area-inset-top);
      --vobix-safe-bottom: env(safe-area-inset-bottom);
    }

    html.vobixInstalled {
      --vobix-safe-top: max(env(safe-area-inset-top), 28px);
      --vobix-safe-bottom: max(env(safe-area-inset-bottom), 32px);
    }
    /* =====================================================
       RESET
       ===================================================== */

    * {
      box-sizing: border-box;
    }


    html,
    body {
      width: 100%;
      height: 100%;
      min-height: 100%;
      margin: 0;
      padding: 0;
    }


    html {
      background: var(--bg);
    }


    body {
      overflow: hidden;

      background:
        radial-gradient(
          circle at 50% 30%,
          rgba(48,115,57,.18),
          transparent 42%
        ),
        var(--bg);

      color: var(--text);

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        Helvetica,
        Arial,
        sans-serif;

      overscroll-behavior: none;

      -webkit-text-size-adjust: 100%;
    }


    button,
    input,
    textarea {
      font: inherit;
    }


    button {
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
    }


    input,
    textarea {
      font-size: 16px;
    }


    img,
    video,
    audio {
      max-width: 100%;
    }


    button:focus-visible,
    input:focus-visible,
    textarea:focus-visible {
      outline:
        2px solid
        rgba(104,255,114,.75);

      outline-offset: 2px;
    }


    /* =====================================================
       APP PRINCIPAL
       ===================================================== */

    .vobixApp {
      position: fixed;

      top: calc(var(--vobix-viewport-top, 0px) + var(--vobix-safe-top));
      right: env(safe-area-inset-right);
      bottom: auto;
      left: env(safe-area-inset-left);

      height: calc(
        var(--vobix-viewport-height, 100dvh) -
        var(--vobix-safe-top) -
        var(--vobix-safe-bottom)
      );

      display: flex;
      flex-direction: column;

      overflow: hidden;

      background:
        linear-gradient(
          180deg,
          rgba(14,30,18,.96),
          rgba(5,12,7,.99)
        );
    }


    /* =====================================================
       CABECERA
       ===================================================== */

    .vobixTopbar {
      position: relative;
      z-index: 100;

      min-height: var(--topbar-height);

      display: flex;
      align-items: center;

      gap: 12px;

      padding: 10px 14px;

      border-bottom:
        1px solid
        rgba(104,255,114,.14);

      background:
        rgba(10,20,12,.96);

      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
    }

    .vobixBackButton {
      width: 42px;
      height: 42px;
      min-width: 42px;
      display: grid;
      place-items: center;
      border: 1px solid rgba(104,255,114,.18);
      border-radius: 50%;
      color: white;
      text-decoration: none;
      font-size: 30px;
      line-height: 1;
      background: rgba(18,32,22,.95);
    }


    /* =====================================================
       AVATAR
       ===================================================== */

    .avatar {
      position: relative;

      width: 52px;
      height: 52px;
      min-width: 52px;

      display: grid;
      place-items: center;

      overflow: hidden;

      border:
        2px solid
        rgba(104,255,114,.55);

      border-radius: 50%;

      background:
        #17341d;

      background-position: center;
      background-repeat: no-repeat;
      background-size: cover;

      color: var(--green);

      font-size: 25px;
      font-weight: 1000;

      user-select: none;
      -webkit-user-select: none;
    }


    #myAvatar {
      cursor: pointer;
      touch-action: manipulation;
    }


    .avatar.hasPhoto {
      color: transparent;
    }


    /* =====================================================
       IDENTIDAD
       ===================================================== */

    .vobixIdentity {
      flex: 1;
      min-width: 0;

      display: flex;
      flex-direction: column;

      gap: 2px;
    }


    .vobixIdentity strong {
      overflow: hidden;

      color: white;

      font-size: 20px;
      font-weight: 1000;

      letter-spacing: .3px;

      white-space: nowrap;
      text-overflow: ellipsis;
    }


    .vobixIdentity span {
      overflow: hidden;

      color:
        rgba(255,255,255,.70);

      font-size: 12px;

      white-space: nowrap;
      text-overflow: ellipsis;
    }

    .vobixIdentity .networkIndicator {
      display: inline-flex;
      align-items: center;
      width: fit-content;
      max-width: 100%;
      gap: 5px;
      color: #b9f7c0;
      font-size: 10px;
      font-weight: 900;
    }

    .networkIndicator::before {
      content: '';
      width: 7px;
      height: 7px;
      flex: 0 0 7px;
      border-radius: 50%;
      background: #69ff78;
      box-shadow: 0 0 8px rgba(105,255,120,.55);
    }

    .networkIndicator.limited { color: #ffd27a; }
    .networkIndicator.limited::before { background: #ffb43b; box-shadow: 0 0 8px rgba(255,180,59,.5); }
    .networkIndicator.offline { color: #ff9a9a; }
    .networkIndicator.offline::before { background: #ff6363; box-shadow: none; }


    /* =====================================================
       BOTONES DE CABECERA
       ===================================================== */

    .vobixIconButton {
      width: 44px;
      height: 44px;
      min-width: 44px;

      display: grid;
      place-items: center;

      padding: 0;

      border:
        1px solid
        rgba(104,255,114,.18);

      border-radius: 50%;

      background:
        rgba(18,32,22,.95);

      color: white;

      font-size: 20px;

      cursor: pointer;

      transition:
        transform .12s,
        background .12s;
    }


    .vobixIconButton:active {
      transform: scale(.93);

      background:
        rgba(104,255,114,.14);
    }


    /* =====================================================
       ÁREA CENTRAL
       ===================================================== */

    .vobixMain {
      flex: 1;
      min-height: 0;

      position: relative;

      overflow: hidden;
    }


    .messages {
      width: 100%;
      height: 100%;

      display: flex;
      flex-direction: column;

      gap: 8px;

      overflow-y: auto;
      overflow-x: hidden;

      padding:
        18px
        14px
        22px;

      scroll-behavior: smooth;

      -webkit-overflow-scrolling: touch;

      scroll-padding-bottom:
        calc(
          var(--composer-height) +
          25px
        );
    }

    .latestMessagesButton {
      position: absolute;
      right: 18px;
      bottom: 16px;
      z-index: 8;
      display: none;
      min-width: 44px;
      height: 44px;
      padding: 0 12px;
      border: 1px solid rgba(104,255,114,.28);
      border-radius: 999px;
      background: #102016;
      color: white;
      font-weight: 900;
      box-shadow: 0 8px 24px rgba(0,0,0,.38);
      cursor: pointer;
    }

    .latestMessagesButton.open { display: block; }

    .newMessagesDivider {
      display: flex;
      align-items: center;
      gap: 9px;
      width: 100%;
      margin: 5px 0;
      color: var(--green);
      font-size: 11px;
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: .4px;
    }

    .newMessagesDivider::before,
    .newMessagesDivider::after {
      content: '';
      flex: 1;
      height: 1px;
      background: rgba(104,255,114,.32);
    }

    .photoViewer {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      height: 100dvh;
      z-index: 12000;
      display: none;
      flex-direction: column;
      background: rgba(0,0,0,.96);
      overflow: hidden;
      overscroll-behavior: contain;
      contain: layout paint size;
    }

    .photoViewer.open { display: flex; }
    .photoViewerToolbar {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
      padding: max(12px, env(safe-area-inset-top)) 12px 10px;
    }
    .photoViewerToolbar button,
    .photoViewerToolbar a {
      display: grid;
      min-width: 42px;
      height: 42px;
      place-items: center;
      border: 1px solid rgba(255,255,255,.18);
      border-radius: 50%;
      background: rgba(255,255,255,.09);
      color: white;
      text-decoration: none;
      font-size: 20px;
      cursor: pointer;
    }
    .photoViewerStage {
      flex: 1;
      width: 100%;
      min-height: 0;
      display: grid;
      place-items: center;
      overflow: hidden;
      touch-action: none;
    }
    .photoViewerImage {
      display: block;
      width: auto;
      height: auto;
      max-width: calc(100vw - 16px);
      max-height: calc(100dvh - 82px - env(safe-area-inset-top));
      object-fit: contain;
      transform: scale(1);
      transform-origin: center;
      transition: transform .16s ease;
      user-select: none;
      -webkit-user-drag: none;
    }


    /* =====================================================
       PANTALLA DE BIENVENIDA INTERIOR
       ===================================================== */

    .vobixWelcome {
      width:
        min(
          760px,
          calc(100% - 20px)
        );

      margin: auto;

      padding:
        48px
        25px;

      border:
        1px solid
        rgba(104,255,114,.22);

      border-radius: 28px;

      background:
        radial-gradient(
          circle at 50% 35%,
          rgba(44,117,54,.35),
          rgba(10,25,14,.82)
        );

      text-align: center;

      box-shadow:
        0 22px 70px
        rgba(0,0,0,.35);
    }


    .vobixWelcomeLogo {
      width: 108px;
      height: 108px;

      margin:
        0 auto
        22px;

      display: grid;
      place-items: center;

      border-radius: 28px;

      background:
        linear-gradient(
          145deg,
          #4ea85a,
          #285e31
        );

      color: var(--green);

      font-size: 55px;
      font-weight: 1000;

      box-shadow:
        0 0 50px
        rgba(104,255,114,.13);
    }


    .vobixWelcome h1 {
      margin:
        0
        0
        16px;

      font-size:
        clamp(
          30px,
          5vw,
          48px
        );

      line-height: 1;

      font-weight: 1000;
    }


    .vobixWelcome p {
      max-width: 650px;

      margin: 0 auto;

      color:
        rgba(255,255,255,.82);

      font-size:
        clamp(
          16px,
          2.2vw,
          23px
        );

      line-height: 1.45;
    }


    /* =====================================================
       MENSAJES
       ===================================================== */

    .messageRow {
      width: 100%;

      display: flex;
    }


    .messageRow.mine {
      justify-content: flex-end;
    }


    .messageRow.theirs {
      justify-content: flex-start;
    }


    .messageBubble {
      position: relative;

      max-width:
        min(
          78%,
          620px
        );

      padding:
        10px
        13px;

      border:
        1px solid
        rgba(104,255,114,.10);

      border-radius:
        17px;

      background:
        var(--panel-3);

      color: white;

      line-height: 1.4;

      white-space: pre-wrap;
      word-break: break-word;
      transition: transform .16s ease;
    }

    .messageBubble.swiping { transition: none; }
    .messageBubble.swipeReady::before {
      content: '↩';
      position: absolute;
      left: -36px;
      top: 50%;
      transform: translateY(-50%);
      display: grid;
      width: 28px;
      height: 28px;
      place-items: center;
      border-radius: 50%;
      background: var(--green);
      color: #071008;
      font-weight: 950;
      box-shadow: 0 5px 16px rgba(0,0,0,.35);
    }

    body.vobixFontSmall .messageBubble { font-size: 13px; }
    body.vobixFontNormal .messageBubble { font-size: 15px; }
    body.vobixFontLarge .messageBubble { font-size: 18px; }
    body.vobixFontSmall #messageInput { font-size: 15px; }
    body.vobixFontNormal #messageInput { font-size: 16px; }
    body.vobixFontLarge #messageInput { font-size: 18px; }

    /* Safari amplía toda la página cuando un campo enfocado baja de 16 px. */
    @supports (-webkit-touch-callout: none) {
      body.vobixFontSmall #messageInput { font-size: 16px; }
    }

    .fontSizeChoices {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin-top: 16px;
    }

    .fontSizeChoice {
      min-height: 48px;
      border: 1px solid rgba(104,255,114,.18);
      border-radius: 13px;
      background: #122016;
      color: white;
      font-weight: 900;
      cursor: pointer;
    }

    .fontSizeChoice.active {
      border-color: var(--green);
      background: var(--green);
      color: #061008;
    }


    .messageRow.mine
    .messageBubble {
      background:
        #173b20;

      border-color:
        rgba(104,255,114,.22);
    }


    .messageTime {
      display: block;

      margin-top: 5px;

      color:
        rgba(255,255,255,.50);

      font-size: 9px;

      text-align: right;
    }

    .messageStatus {
      display: block;
      margin-top: 3px;
      color: rgba(255,255,255,.56);
      font-size: 11px;
      font-weight: 900;
      text-align: right;
      letter-spacing: -1px;
    }

    .messageStatus.read {
      color: #54b9ff;
    }

    .messageStatus.failed { color: #ff7777; letter-spacing: 0; }
    .messageRow.failed .messageBubble { border-color: rgba(255,90,90,.48); }

    .messageOriginSeal {
      display: inline-flex;
      margin-top: 8px;
      padding: 5px 8px;
      border: 1px solid rgba(104,255,114,.35);
      border-radius: 999px;
      background: rgba(104,255,114,.09);
      color: var(--green);
      font: inherit;
      font-size: 10px;
      font-weight: 900;
      cursor: pointer;
    }
    .messageOriginSeal.isModified { border-color: #ff7777; color: #ff9a9a; background: rgba(255,90,90,.1); }
    .messageOriginSeal:disabled { opacity: .65; cursor: wait; }
    .messageOriginDetails { margin-top:6px; font-size:10px; line-height:1.55; color:rgba(255,255,255,.76); white-space:pre-line; }

    .voiceMessage > .messageOriginSeal,
    .voiceMessage > .messageOriginDetails,
    .voiceMessage > .viewOnceSenderBadge {
      grid-column: 1 / -1;
      justify-self: start;
      max-width: 100%;
    }

    .messageOriginDetails {
      width: 100%;
      min-width: 0;
      box-sizing: border-box;
      overflow-wrap: anywhere;
    }

    .messageTranslationAction {
      display: inline-flex;
      margin-top: 7px;
      padding: 0;
      border: 0;
      background: transparent;
      color: var(--green);
      font: inherit;
      font-size: 11px;
      font-weight: 900;
      cursor: pointer;
    }

    .messageTranslationAction:disabled { opacity: .55; cursor: wait; }

    .messageTranslation {
      margin-top: 7px;
      padding-top: 7px;
      border-top: 1px solid rgba(104,255,114,.16);
      color: rgba(255,255,255,.88);
      font-size: .94em;
      white-space: pre-wrap;
    }

    .messageTranslationLabel {
      display: block;
      margin-bottom: 3px;
      color: var(--green);
      font-size: 9px;
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: .04em;
    }

    .fraudWarning {
      margin-top: 8px;
      padding: 8px 10px;
      border: 1px solid rgba(255,180,59,.42);
      border-radius: 10px;
      background: rgba(92,55,0,.32);
      color: #ffe1a6;
      font-size: 11px;
      line-height: 1.35;
      white-space: normal;
    }

    .fraudWarning strong {
      display: block;
      margin-bottom: 3px;
      color: #ffc45c;
      font-size: 12px;
    }

    .messageLink.suspiciousLink {
      color: #ffce72;
      text-decoration: underline wavy rgba(255,180,59,.9);
      text-underline-offset: 3px;
    }

    .messageReplyQuote {
      margin-bottom: 7px;
      padding: 7px 9px;
      border-left: 3px solid var(--green);
      border-radius: 8px;
      background: rgba(0,0,0,.22);
      color: rgba(255,255,255,.70);
      font-size: 11px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .messageReplyQuote.actionable { cursor: pointer; }
    .messageReplyQuote.actionable:focus-visible {
      outline: 2px solid var(--green);
      outline-offset: 2px;
    }

    .messageRow.replyTargetHighlight .messageBubble {
      animation: vobixReplyTarget 1.4s ease;
    }

    @keyframes vobixReplyTarget {
      0%, 100% { box-shadow: none; }
      30%, 70% { box-shadow: 0 0 0 5px rgba(104,255,114,.35); }
    }

    .replyMessageButton {
      margin-top: 5px;
      padding: 2px 6px;
      border: 0;
      background: transparent;
      color: rgba(255,255,255,.60);
      cursor: pointer;
    }

    .messageActions {
      display: none;
      flex-wrap: wrap;
      justify-content: flex-end;
      gap: 4px;
      margin-top: 4px;
    }

    .messageActions.mobileOpen {
      position: absolute;
      top: 36px;
      right: 5px;
      z-index: 20;
      width: min(235px, 76vw);
      display: flex;
      flex-direction: column;
      align-items: stretch;
      padding: 8px;
      border: 1px solid rgba(104,255,114,.22);
      border-radius: 15px;
      background: #102016;
      box-shadow: 0 16px 42px rgba(0,0,0,.55);
    }

    .messageRow.theirs .messageActions.mobileOpen { left: 5px; right: auto; }
    .messageActions.mobileOpen .replyMessageButton {
      min-height: 38px;
      margin: 0;
      padding: 7px 9px;
      text-align: left;
    }
    .messageActions.mobileOpen .messageReactionPicker { flex-direction: row; }

    .messageMenuButton {
      position: absolute;
      top: 4px;
      right: 5px;
      width: 30px;
      height: 30px;
      display: grid;
      place-items: center;
      border: 0;
      border-radius: 50%;
      background: rgba(0,0,0,.24);
      color: rgba(255,255,255,.82);
      font-size: 20px;
      line-height: 1;
      cursor: pointer;
    }

    .messageBubble.hasMessageMenu { padding-right: 39px; }
    .messageRow.theirs .messageMenuButton { left: 5px; right: auto; }
    .messageRow.theirs .messageBubble.hasMessageMenu { padding-left: 39px; padding-right: 13px; }

    .messageBubble.longPressActive {
      outline: 2px solid rgba(104,255,114,.45);
      box-shadow: 0 6px 24px rgba(0,0,0,.30);
    }

    @media (max-width: 760px), (pointer: coarse) {
      .messageActions { padding-top: 4px; }
    }

    .messageReactions {
      display: flex;
      flex-wrap: wrap;
      gap: 4px;
      margin-top: 5px;
    }

    .messageReactionBadge {
      padding: 2px 7px;
      border: 1px solid rgba(255,255,255,.15);
      border-radius: 999px;
      background: rgba(0,0,0,.20);
      color: white;
      font-size: 12px;
    }

    .messageReactionBadge.mine { border-color: var(--green); background: rgba(104,255,114,.13); }
    .messageReactionPicker { display: none; width: 100%; justify-content: flex-end; gap: 3px; }
    .messageReactionPicker.open { display: flex; }
    .messageReactionPicker button { border: 0; background: transparent; padding: 3px; font-size: 18px; cursor: pointer; }

    .replyComposerBar {
      position: absolute;
      left: 10px;
      right: 10px;
      bottom: calc(100% + 6px);
      display: none;
      align-items: center;
      gap: 10px;
      padding: 9px 11px;
      border-left: 4px solid var(--green);
      border-radius: 12px;
      background: #102016;
      box-shadow: 0 8px 25px rgba(0,0,0,.38);
    }

    .replyComposerBar.open { display: flex; }
    .replyComposerText { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .cancelReplyButton { border: 0; background: transparent; color: white; font-size: 18px; cursor: pointer; }

    .editComposerBar { border-left-color: #ffd35a; }
    .messageEdited {
      margin-left: 5px;
      color: rgba(255,255,255,.52);
      font-size: 10px;
      font-style: italic;
    }

    .messageDeleted {
      color: rgba(255,255,255,.58);
      font-style: italic;
    }

    .messageLink {
      color: #79c7ff;
      text-decoration: underline;
      text-decoration-thickness: 1px;
      overflow-wrap: anywhere;
    }

    .messageCharacterCounter {
      position: absolute;
      right: 68px;
      bottom: calc(100% + 5px);
      display: none;
      padding: 4px 8px;
      border-radius: 999px;
      background: #101810;
      color: rgba(255,255,255,.65);
      font-size: 10px;
      font-weight: 850;
    }

    .messageCharacterCounter.open { display: block; }
    .messageCharacterCounter.limit { color: #ff7777; }

    .messageRow.searchMatch .messageBubble {
      outline: 2px solid rgba(255,214,64,.85);
      box-shadow: 0 0 0 5px rgba(255,214,64,.12);
    }

    .messageRow.searchCurrent .messageBubble {
      outline-color: var(--green);
      box-shadow: 0 0 0 6px rgba(104,255,114,.18);
    }

    .chatSearchActions {
      display: grid;
      grid-template-columns: 1fr auto auto;
      gap: 8px;
      align-items: center;
      margin-top: 12px;
    }

    .starredMessageItem {
      width: 100%;
      margin-top: 8px;
      padding: 11px 12px;
      border: 1px solid rgba(255,214,64,.18);
      border-radius: 13px;
      background: rgba(255,214,64,.05);
      color: white;
      text-align: left;
      overflow-wrap: anywhere;
    }

    .chatDateSeparator {
      width: fit-content;
      margin: 14px auto 10px;
      padding: 6px 11px;
      border: 1px solid rgba(255,255,255,.09);
      border-radius: 999px;
      background: rgba(0,0,0,.34);
      color: rgba(255,255,255,.70);
      font-size: 11px;
      font-weight: 850;
      text-align: center;
    }


    /* =====================================================
       COMPOSITOR
       ===================================================== */

    .vobixComposer {
      position: relative;
      z-index: 110;

      min-height:
        var(--composer-height);

      display: flex;
      align-items: center;

      gap: 10px;

      padding:
        10px
        14px;

      border-top:
        1px solid
        rgba(104,255,114,.14);

      background:
        rgba(10,20,12,.98);

      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
    }

    .vobixMessageField {
      flex: 1;
      min-width: 0;
      min-height: 52px;
      display: flex;
      align-items: flex-end;
      gap: 2px;
      padding: 4px;
      border: 1px solid rgba(104,255,114,.18);
      border-radius: 27px;
      background: rgba(255,255,255,.055);
    }

    .vobixMessageField:focus-within {
      border-color: rgba(104,255,114,.42);
      box-shadow: 0 0 0 3px rgba(104,255,114,.05);
    }

    .vobixMessageField .vobixComposerTool {
      flex: 0 0 auto;
      background: transparent;
    }



    .vobixComposerTool {
      width: 42px;
      height: 42px;
      min-width: 42px;
      border: 0;
      border-radius: 50%;
      display: grid;
      place-items: center;
      background: rgba(255,255,255,.06);
      color: #fff;
      font-size: 20px;
      cursor: pointer;
    }

    .vobixComposerTool:active {
      transform: scale(.94);
    }


    #sendPhotoButton {
      display: none;
    }

    .vobixEmojiTray {
      position: absolute;
      left: 12px;
      right: 12px;
      bottom: calc(100% + 8px);
      z-index: 500;
      display: none;
      flex-wrap: wrap;
      gap: 8px;
      padding: 12px;
      border: 1px solid rgba(104,255,114,.22);
      border-radius: 18px;
      background: rgba(8,18,10,.98);
      box-shadow: 0 14px 40px rgba(0,0,0,.42);
    }

    .vobixEmojiTray.open {
      display: flex;
    }

    .vobixEmojiChoice {
      border: 0;
      background: transparent;
      font-size: 24px;
      cursor: pointer;
      padding: 4px;
    }

    #messageInput {
      flex: 1;
      min-width: 0;

      max-height: 120px;

      resize: none;

      overflow-y: auto;

      padding:
        13px
        16px;

      border:
        1px solid
        rgba(104,255,114,.18);

      border-radius: 24px;

      background:
        rgba(255,255,255,.055);

      color: white;

      font-family: inherit;
      font-size: 16px;
      line-height: 1.3;

      outline: none;
    }

    .vobixMessageField #messageInput {
      min-height: 42px;
      margin: 0;
      padding: 11px 8px 8px;
      border: 0;
      border-radius: 0;
      background: transparent;
      box-shadow: none;
    }


    #messageInput::placeholder {
      color:
        rgba(255,255,255,.52);
    }


    #messageInput:focus {
      border-color:
        rgba(104,255,114,.42);

      box-shadow:
        0 0 0 3px
        rgba(104,255,114,.05);
    }

    .vobixMessageField #messageInput:focus {
      border: 0;
      box-shadow: none;
    }

    .mediaPermissionPanel {
      position: fixed;
      inset: 0;
      z-index: 9200;
      display: none;
      place-items: center;
      padding: 20px;
      background: rgba(0,0,0,.78);
      backdrop-filter: blur(12px);
    }
    .mediaPermissionPanel.open { display: grid; }
    .mediaPermissionCard {
      width: min(100%, 390px);
      padding: 26px 22px;
      border: 1px solid rgba(104,255,114,.28);
      border-radius: 25px;
      background: #0b180e;
      color: #fff;
      text-align: center;
      box-shadow: 0 24px 80px rgba(0,0,0,.62);
    }
    .mediaPermissionIcon { font-size: 48px; margin-bottom: 10px; }
    .mediaPermissionCard h2 { margin: 0 0 9px; font-size: 23px; }
    .mediaPermissionCard p { margin: 0 0 18px; color: rgba(255,255,255,.76); line-height: 1.45; }
    .mediaPermissionStatus { min-height: 22px; color: #ffb1b1 !important; font-weight: 800; }
    .mediaPermissionActions { display: grid; gap: 10px; }
    .mediaPermissionPrimary,
    .mediaPermissionLater {
      min-height: 48px;
      border-radius: 999px;
      font: inherit;
      font-weight: 900;
      cursor: pointer;
    }
    .mediaPermissionPrimary { border: 0; background: var(--green); color: #061008; }
    .mediaPermissionLater { border: 1px solid rgba(255,255,255,.18); background: transparent; color: #fff; }
    .mediaPermissionSettings { display:none; border:1px solid var(--green); background:transparent; color:var(--green); }
    .mediaPermissionSettings.open { display:block; }

    html.vobixKeyboardOpen .vobixApp {
      top: var(--vobix-visual-top, 0px);
      height: var(--vobix-visual-height, 100dvh);
    }

    html.vobixKeyboardOpen .vobixComposer {
      flex: 0 0 auto;
      padding-bottom: max(7px, env(safe-area-inset-bottom));
    }

    .cameraChoiceActions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-top: 8px;
    }
    .cameraChoiceButton {
      min-height: 88px;
      border: 1px solid rgba(104,255,114,.28);
      border-radius: 20px;
      background: rgba(104,255,114,.08);
      color: #fff;
      font: inherit;
      font-weight: 900;
      cursor: pointer;
    }
    .cameraChoiceButton span { display: block; margin-bottom: 5px; font-size: 28px; }
    .cameraChoiceCancel { margin-top: 12px; width: 100%; }
    @media (max-width: 360px) {
      .cameraChoiceActions { grid-template-columns: 1fr; }
      .cameraChoiceButton { min-height: 64px; }
    }

    .integratedCamera {
      position: fixed; inset: 0; z-index: 12500; display: none;
      grid-template-rows: auto 1fr auto; background: #000; color: #fff;
    }
    .integratedCamera.open { display: grid; }
    .integratedCameraTop {
      display: flex; align-items: center; justify-content: space-between;
      padding: max(12px, env(safe-area-inset-top)) 16px 10px;
      background: linear-gradient(180deg, rgba(0,0,0,.78), transparent);
    }
    .integratedCameraTop button, .integratedCameraControls button {
      min-width: 48px; min-height: 48px; border: 0; border-radius: 999px;
      background: rgba(28,28,28,.82); color: #fff; font-size: 22px;
    }
    .integratedCameraStage { min-height: 0; display: grid; place-items: center; overflow: hidden; }
    .integratedCameraPreview { width: 100%; height: 100%; object-fit: cover; background: #050505; }
    .integratedCameraControls {
      padding: 10px 16px max(16px, env(safe-area-inset-bottom)); background: #090909;
    }
    .integratedCameraModes { display: flex; justify-content: center; gap: 22px; margin-bottom: 12px; }
    .integratedCameraMode {
      border: 0; background: transparent; color: #aaa; font-weight: 900; padding: 7px 10px;
    }
    .integratedCameraMode.active { color: #68ff72; }
    .integratedCameraActions { display: grid; grid-template-columns: 1fr 1fr 1fr; align-items: center; }
    .integratedCameraActions button { justify-self: center; }
    #integratedCameraShutter {
      width: 72px; height: 72px; border: 5px solid #fff; background: #fff;
      box-shadow: inset 0 0 0 4px #111;
    }
    #integratedCameraShutter.recording { background: #ef3c3c; border-radius: 18px; }
    .integratedCameraStatus { min-height: 20px; text-align: center; color: #ddd; font-size: 13px; }


    /* =====================================================
       SLOT MICRO / ENVIAR

       SOLO UNO SE VE A LA VEZ.
       ===================================================== */

    .vobixActionSlot {
      position: relative;

      width: 52px;
      height: 52px;
      min-width: 52px;
    }


    .vobixComposerAction {
      position: absolute;

      inset: 0;

      width: 52px;
      height: 52px;

      display: grid;
      place-items: center;

      opacity: 0;

      visibility: hidden;

      pointer-events: none;

      transform: scale(.82);

      transition:
        opacity .12s,
        transform .12s,
        visibility .12s;
    }


    .vobixComposerAction.isVisible {
      opacity: 1;

      visibility: visible;

      pointer-events: auto;

      transform: scale(1);
    }


    #voiceButton {
      font-size: 22px;
    }


    #voiceButton.isRecording {
      background:
        var(--green);

      color:
        #071009;

      box-shadow:
        0 0 0 6px
        rgba(104,255,114,.13);

      animation:
        vobixMicPulse
        1s infinite;
    }

    .voiceRecordingStatus {
      display: none;
      align-items: center;
      gap: 8px;
      position: absolute;
      left: 12px;
      right: 12px;
      bottom: calc(100% + 8px);
      z-index: 520;
      min-height: 54px;
      padding: 9px 12px;
      border: 1px solid rgba(255,119,119,.35);
      border-radius: 18px;
      background: rgba(8,18,10,.98);
      box-shadow: 0 12px 34px rgba(0,0,0,.38);
      color: #ff7777;
      font-size: 13px;
      font-weight: 900;
      white-space: nowrap;
    }

    .voiceRecordingStatus.open {
      display: flex;
    }

    .cancelVoiceButton,
    .stopVoiceButton {
      min-height: 38px;
      padding: 0 12px;
      border: 1px solid currentColor;
      border-radius: 999px;
      background: rgba(255,255,255,.04);
      color: #ff7777;
      font-weight: 900;
      cursor: pointer;
      touch-action: manipulation;
    }

    .stopVoiceButton {
      margin-left: auto;
      border-color: var(--green);
      background: var(--green);
      color: #061008;
    }


    @keyframes vobixMicPulse {

      50% {
        transform:
          scale(.92);
      }

    }
