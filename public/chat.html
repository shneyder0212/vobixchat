<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  >

  <meta name="theme-color" content="#071109">

  <title>VOBIXCHAT</title>

  <script src="/socket.io/socket.io.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    :root {
      --green: #68ff72;
      --green2: #33d85b;
      --bg: #071009;
      --panel: #0b160d;
      --panel2: #101d13;
      --border: rgba(104,255,114,.18);
      --text: #f1fff3;
      --muted: #8da891;
      --bubble: #15251a;
      --bubbleMe: #155d35;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: var(--bg);
      color: var(--text);
      font-family:
        Inter,
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
    }

    button,
    input {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    .app {
      display: flex;
      width: 100%;
      height: 100dvh;
      background:
        radial-gradient(
          circle at 25% 10%,
          rgba(67,255,99,.08),
          transparent 30%
        ),
        var(--bg);
    }

    /* =====================================================
       SIDEBAR
    ===================================================== */

    .sidebar {
      width: 350px;
      min-width: 350px;
      display: flex;
      flex-direction: column;
      border-right: 1px solid var(--border);
      background: rgba(6,20,9,.94);
    }

    .profile {
      height: 78px;
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 14px 16px;
      border-bottom: 1px solid var(--border);
    }

    .logo {
      width: 48px;
      height: 48px;
      border-radius: 15px;
      display: grid;
      place-items: center;
      background: var(--green);
      color: #061008;
      font-size: 25px;
      font-weight: 1000;
      box-shadow: 0 0 25px rgba(104,255,114,.22);
    }

    .profileInfo {
      min-width: 0;
      flex: 1;
    }

    .brand {
      font-size: 16px;
      font-weight: 1000;
    }

    .username {
      margin-top: 2px;
      color: var(--green);
      font-size: 12px;
    }

    .avatar {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      background: #14291a;
      color: var(--green);
      border: 1px solid var(--border);
      font-weight: 900;
    }

    .searchArea {
      padding: 14px;
      border-bottom: 1px solid var(--border);
    }

    .searchBox {
      display: flex;
      gap: 8px;
    }

    .searchBox input {
      width: 100%;
      min-width: 0;
      padding: 13px 14px;
      border-radius: 14px;
      border: 1px solid var(--border);
      outline: none;
      color: white;
      background: #0e1a11;
    }

    .searchBox input:focus {
      border-color: var(--green);
    }

    .searchButton {
      width: 50px;
      min-width: 50px;
      border: 0;
      border-radius: 14px;
      background: var(--green);
      color: #071009;
      font-size: 19px;
      font-weight: 900;
    }

    .searchHelp {
      margin-top: 8px;
      color: var(--muted);
      font-size: 11px;
    }

    .searchResults {
      border-bottom: 1px solid var(--border);
    }

    .sectionTitle {
      padding: 14px 16px 8px;
      display: flex;
      justify-content: space-between;
      color: #d7ffda;
      font-size: 12px;
      font-weight: 900;
      letter-spacing: 1px;
    }

    .conversations {
      flex: 1;
      overflow-y: auto;
    }

    .conversation {
      display: flex;
      align-items: center;
      gap: 11px;
      padding: 12px 14px;
      cursor: pointer;
      border-bottom: 1px solid rgba(104,255,114,.07);
    }

    .conversation:hover {
      background: rgba(104,255,114,.05);
    }

    .conversation.active {
      background: rgba(104,255,114,.09);
    }

    .conversationName {
      font-weight: 800;
      font-size: 14px;
    }

    .conversationPreview {
      margin-top: 3px;
      color: var(--muted);
      font-size: 11px;
    }

    /* =====================================================
       CHAT
    ===================================================== */

    .chat {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
      position: relative;
    }

    .empty {
      flex: 1;
      display: grid;
      place-items: center;
      text-align: center;
      padding: 30px;
    }

    .emptyLogo {
      width: 86px;
      height: 86px;
      margin: auto;
      border-radius: 25px;
      display: grid;
      place-items: center;
      background: var(--green);
      color: #071009;
      font-size: 46px;
      font-weight: 1000;
      box-shadow: 0 0 40px rgba(104,255,114,.18);
    }

    .empty h1 {
      margin: 18px 0 8px;
      font-size: 27px;
    }

    .empty p {
      color: var(--muted);
    }

    .chatRoom {
      display: none;
      flex: 1;
      min-height: 0;
      flex-direction: column;
    }

    /* =====================================================
       CABECERA
    ===================================================== */

    .chatHeader {
      height: 72px;
      min-height: 72px;
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px 16px;
      border-bottom: 1px solid var(--border);
      background: rgba(8,19,10,.97);
    }

    .backButton {
      display: none;
    }

    .chatUser {
      flex: 1;
      min-width: 0;
    }

    .chatName {
      font-weight: 900;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .chatStatus {
      margin-top: 2px;
      font-size: 11px;
      color: var(--green);
    }

    .headerActions {
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .iconButton {
      width: 42px;
      height: 42px;
      display: grid;
      place-items: center;
      border: 0;
      border-radius: 50%;
      background: transparent;
      color: #dfffe2;
      font-size: 19px;
    }

    .iconButton:hover {
      background: rgba(104,255,114,.1);
      color: var(--green);
    }

    /* =====================================================
       MENSAJES
    ===================================================== */

    .messages {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      padding: 18px;
      background:
        radial-gradient(
          circle at 70% 10%,
          rgba(104,255,114,.04),
          transparent 30%
        );
    }

    .messageRow {
      display: flex;
      margin: 5px 0;
    }

    .messageRow.me {
      justify-content: flex-end;
    }

    .bubble {
      max-width: min(72%, 650px);
      padding: 8px 11px 6px;
      border-radius: 12px;
      background: var(--bubble);
      border: 1px solid rgba(255,255,255,.04);
      word-break: break-word;
    }

    .messageRow.me .bubble {
      background: var(--bubbleMe);
    }

    .messageText {
      font-size: 14px;
      line-height: 1.4;
    }

    .messageMeta {
      margin-top: 3px;
      display: flex;
      justify-content: flex-end;
      gap: 5px;
      color: rgba(255,255,255,.62);
      font-size: 9px;
    }

    .ticks {
      color: #76dfff;
    }

    /* =====================================================
       WRITING INDICATOR
    ===================================================== */

    .typing {
      min-height: 20px;
      padding: 2px 18px;
      color: var(--green);
      font-size: 11px;
      background: #08130a;
    }

    /* =====================================================
       COMPOSER
    ===================================================== */

    .composer {
      position: relative;
      display: flex;
      align-items: flex-end;
      gap: 7px;
      padding:
        10px
        12px
        calc(10px + env(safe-area-inset-bottom));
      border-top: 1px solid var(--border);
      background: #08130a;
    }

    .composerInput {
      flex: 1;
      min-width: 0;
      min-height: 46px;
      max-height: 120px;
      padding: 13px 15px;
      border-radius: 23px;
      border: 1px solid var(--border);
      outline: none;
      background: #122016;
      color: white;
    }

    .composerInput:focus {
      border-color: rgba(104,255,114,.55);
    }

    .composerButton {
      width: 44px;
      height: 44px;
      min-width: 44px;
      display: grid;
      place-items: center;
      border: 0;
      border-radius: 50%;
      background: transparent;
      color: #d8ffdc;
      font-size: 20px;
    }

    .composerButton:hover {
      background: rgba(104,255,114,.09);
      color: var(--green);
    }

    .sendButton {
      background: var(--green);
      color: #071009;
      font-weight: 1000;
    }

    .sendButton:hover {
      background: #80ff89;
      color: #071009;
    }

    /* =====================================================
       EMOJIS
    ===================================================== */

    .emojiPanel {
      position: absolute;
      display: none;
      left: 12px;
      bottom: 67px;
      width: 280px;
      padding: 12px;
      grid-template-columns: repeat(7, 1fr);
      gap: 6px;
      border: 1px solid var(--border);
      border-radius: 16px;
      background: #101c13;
      box-shadow: 0 15px 50px rgba(0,0,0,.45);
      z-index: 50;
    }

    .emojiPanel.open {
      display: grid;
    }

    .emoji {
      border: 0;
      padding: 5px;
      border-radius: 8px;
      background: transparent;
      font-size: 21px;
    }

    .emoji:hover {
      background: rgba(104,255,114,.1);
    }

    /* =====================================================
       ATTACHMENTS
    ===================================================== */

    .attachMenu {
      position: absolute;
      display: none;
      left: 58px;
      bottom: 67px;
      width: 205px;
      padding: 8px;
      border-radius: 16px;
      border: 1px solid var(--border);
      background: #101c13;
      box-shadow: 0 15px 50px rgba(0,0,0,.45);
      z-index: 51;
    }

    .attachMenu.open {
      display: block;
    }

    .attachOption {
      width: 100%;
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 11px;
      border: 0;
      border-radius: 10px;
      background: transparent;
      color: white;
      text-align: left;
    }

    .attachOption:hover {
      background: rgba(104,255,114,.08);
    }

    /* =====================================================
       TOAST
    ===================================================== */

    .toast {
      position: fixed;
      left: 50%;
      bottom: 90px;
      transform: translateX(-50%) translateY(20px);
      padding: 11px 17px;
      border: 1px solid var(--border);
      border-radius: 30px;
      background: #122016;
      color: white;
      opacity: 0;
      pointer-events: none;
      transition: .2s;
      z-index: 1000;
    }

    .toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    /* =====================================================
       MOBILE
    ===================================================== */

    @media (max-width: 720px) {

      .sidebar {
        width: 100%;
        min-width: 100%;
      }

      .chat {
        display: none;
        width: 100%;
      }

      .app.roomOpen .sidebar {
        display: none;
      }

      .app.roomOpen .chat {
        display: flex;
      }

      .backButton {
        display: grid;
      }

      .bubble {
        max-width: 84%;
      }

      .messages {
        padding: 12px 9px;
      }

      .chatHeader {
        padding-left: 7px;
        padding-right: 7px;
      }

      .iconButton {
        width: 38px;
        height: 38px;
      }

      .composer {
        gap: 3px;
        padding-left: 5px;
        padding-right: 5px;
      }

      .composerButton {
        width: 40px;
        min-width: 40px;
      }

      .emojiPanel {
        left: 7px;
        width: calc(100% - 14px);
      }

    }

  </style>
</head>

<body>

<div class="app" id="app">

  <!-- ===================================================
       SIDEBAR
  ==================================================== -->

  <aside class="sidebar">

    <div class="profile">

      <div class="logo">
        V
      </div>

      <div class="profileInfo">

        <div class="brand">
          VOBIXCHAT
        </div>

        <div class="username" id="myUsername">
          @usuario
        </div>

      </div>

      <div class="avatar" id="myAvatar">
        V
      </div>

    </div>


    <div class="searchArea">

      <div class="searchBox">

        <input
          id="searchInput"
          autocomplete="off"

        >

        <button
          class="searchButton"
          id="searchButton"
          type="button"
        >
          ⌕
        </button>

      </div>

      <div class="searchHelp">
        Encuentra personas y abre una conversación privada.
      </div>

    </div>


    <div
      class="searchResults"
      id="searchResults"
    ></div>


    <div class="sectionTitle">

      <span>
        CONVERSACIONES
      </span>

      <span id="conversationCount">
        0
      </span>

    </div>


    <div
      class="conversations"
      id="conversationList"
    >

      <div
        style="
          color:#7f9984;
          text-align:center;
          padding:35px 15px;
          font-size:13px;
        "
      >
        Todavía no tienes conversaciones.
      </div>

    </div>

  </aside>


  <!-- ===================================================
       CHAT
  ==================================================== -->

  <main class="chat">

    <section
      class="empty"
      id="emptyState"
    >

      <div>

        <div class="emptyLogo">
          V
        </div>

        <h1>
          VOBIXCHAT
        </h1>

        <p>
          Selecciona una conversación o busca una persona para comenzar.
        </p>

        <p>
          Tus conversaciones se mantienen separadas en salas privadas.
        </p>

      </div>

    </section>


    <section
      class="chatRoom"
      id="chatRoom"
    >

      <!-- CABECERA -->

      <header class="chatHeader">

        <button
          class="iconButton backButton"
          id="backButton"
          type="button"
        >
          ←
        </button>


        <div
          class="avatar"
          id="roomAvatar"
        >
          F
        </div>


        <div class="chatUser">

          <div
            class="chatName"
            id="roomName"
          >
            Usuario
          </div>

          <div
            class="chatStatus"
            id="roomStatus"
          >
            Conversación privada
          </div>

        </div>


        <div class="headerActions">

          <button
            class="iconButton"

          >

          </button>

          <button

          <button
            class="iconButton"

          >
            ⋮
          </button>

        </div>

      </header>


      <!-- MENSAJES -->

      <div
        class="messages"
        id="messages"
      ></div>


      <div
        class="typing"
        id="typing"
      ></div>


      <!-- COMPOSER -->

      <div class="composer">

        <button
          class="composerButton"
          id="emojiButton"
          title="Emojis"
          type="button"
        >
          😊
        </button>


        <button
          class="composerButton"
          id="attachButton"
          title="Adjuntar"
          type="button"
        >
          📎
        </button>


        <input
          class="composerInput"
          id="messageInput"
          autocomplete="off"
          placeholder="Escribe un mensaje"
        >


        <button
          class="composerButton"
          id="cameraButton"
          title="Cámara"
          type="button"
        >
          📷
        </button>


        <button
          class="composerButton"
          id="audioButton"
          title="Nota de voz"
          type="button"
        >
          🎤
        </button>


        <button
          class="composerButton sendButton"
          id="sendButton"
          title="Enviar"
          type="button"
        >
          ➤
        </button>


        <!-- EMOJIS -->

        <div
          class="emojiPanel"
          id="emojiPanel"
        >

          <button class="emoji">😀</button>
          <button class="emoji">😂</button>
          <button class="emoji">😍</button>
          <button class="emoji">🥰</button>
          <button class="emoji">😎</button>
          <button class="emoji">🤔</button>
          <button class="emoji">😢</button>

          <button class="emoji">😭</button>
          <button class="emoji">😡</button>
          <button class="emoji">👍</button>
          <button class="emoji">👎</button>

          <button class="emoji">💪</button>

          <button class="emoji">❤️</button>
          <button class="emoji">💚</button>
          <button class="emoji">🔥</button>
          <button class="emoji">🎉</button>
          <button class="emoji">✅</button>
          <button class="emoji">💯</button>

        <!-- ADJUNTOS -->

        <div
          class="attachMenu"
          id="attachMenu"
        >

          <button

            id="documentOption"
            type="button"

            id="cameraOption"

          </button>

      <!-- INPUTS OCULTOS -->

      <input
        type="file"
        id="mediaInput"

        type="file"
        id="documentInput"
        hidden

      <input
        type="file"
        id="cameraInput"
        accept="image/*,video/*"
        capture="environment"
        hidden
      >

    </section>

  </main>

</div>


<div
  class="toast"
  id="toast"
></div>


<script>

'use strict';


// ========================================================
// SOCKET
// ========================================================

const socket = io();


// ========================================================
// ELEMENTOS
// ========================================================

const app =
  document.getElementById('app');

const myUsername =
  document.getElementById('myUsername');

const myAvatar =
  document.getElementById('myAvatar');

const searchInput =
  document.getElementById('searchInput');

const searchButton =
  document.getElementById('searchButton');

const searchResults =
  document.getElementById('searchResults');

const conversationList =
  document.getElementById('conversationList');

const conversationCount =
  document.getElementById('conversationCount');

const emptyState =
  document.getElementById('emptyState');

const chatRoom =
  document.getElementById('chatRoom');

const roomAvatar =
  document.getElementById('roomAvatar');

const roomName =
  document.getElementById('roomName');

const roomStatus =
  document.getElementById('roomStatus');

const messages =
  document.getElementById('messages');

const typing =
  document.getElementById('typing');

const messageInput =
  document.getElementById('messageInput');

const sendButton =
  document.getElementById('sendButton');

const backButton =
  document.getElementById('backButton');

const emojiButton =
  document.getElementById('emojiButton');

const emojiPanel =
  document.getElementById('emojiPanel');

const attachButton =
  document.getElementById('attachButton');

const attachMenu =
  document.getElementById('attachMenu');

const cameraButton =
  document.getElementById('cameraButton');

const audioButton =
  document.getElementById('audioButton');

const voiceCallButton =
  document.getElementById('voiceCallButton');

const videoCallButton =
  document.getElementById('videoCallButton');

const moreButton =
  document.getElementById('moreButton');

const mediaInput =
  document.getElementById('mediaInput');

const documentInput =
  document.getElementById('documentInput');

const cameraInput =
  document.getElementById('cameraInput');

const toast =
  document.getElementById('toast');


// ========================================================
// ESTADO
// ========================================================

let currentConversation = null;

let conversations = [];

let typingTimer = null;


// ========================================================
// USUARIO LOCAL
// ========================================================

function getLocalUser() {

  try {

    const raw =
      localStorage.getItem('vobix_user');

    if (!raw) {
      return null;
    }

    const parsed =
      JSON.parse(raw);

    return parsed;

  } catch (error) {

    return null;

  }

}


const me =
  getLocalUser();


if (me) {

  const username =
    me.username ||
    me.name ||
    'Usuario';

  myUsername.textContent =
    '@' + username;

  myAvatar.textContent =
    username
      .charAt(0)
      .toUpperCase();

}


// ========================================================
// TOAST
// ========================================================

function showToast(text) {

  toast.textContent = text;

  toast.classList.add('show');

  setTimeout(() => {

    toast.classList.remove('show');

  }, 2500);

}


// ========================================================
// ESCAPAR HTML
// ========================================================

function escapeHTML(value) {

  const div =
    document.createElement('div');

  div.textContent =
    value == null
      ? ''
      : String(value);

  return div.innerHTML;

}


// ========================================================
// REQUEST JSON
// ========================================================

async function requestJSON(
  url,
  options = {}
) {

  const response =
    await fetch(
      url,
      options
    );

  let data = {};

  try {

    data =
      await response.json();

  } catch (error) {}

  if (!response.ok) {

    throw new Error(
      data.message ||
      data.msg ||
      'Error del servidor'
    );

  }

  return data;

}


// ========================================================
// BUSCAR USUARIOS
// ========================================================

async function searchUsers() {

  const value =
    searchInput.value.trim();

  if (!value) {

    searchResults.innerHTML = '';

    return;

  }

  try {

    const data =
      await requestJSON(
        '/api/chat/users/search?q=' +
        encodeURIComponent(value)
      );

    const users =
      Array.isArray(data)
        ? data
        : (
            data.users ||
            data.results ||
            []
          );

    renderSearchResults(users);

  } catch (error) {

    console.error(error);

    showToast(
      'No se pudo realizar la búsqueda'
    );

  }

}


function renderSearchResults(users) {

  searchResults.innerHTML = '';

  if (!users.length) {

    searchResults.innerHTML =
      '<div style="padding:14px;color:#819486;font-size:12px;">No encontramos usuarios.</div>';

    return;

  }

  users.forEach(user => {

    const name =
      user.username ||
      user.name ||
      'Usuario';

    const phone =
      user.phone ||
      '';

    const item =
      document.createElement('div');

    item.className =
      'conversation';

    item.innerHTML = `

      <div class="avatar">
        ${escapeHTML(
          name.charAt(0).toUpperCase()
        )}
      </div>

      <div>

        <div class="conversationName">
          ${escapeHTML(name)}
        </div>

        <div class="conversationPreview">
          ${escapeHTML(phone)}
        </div>

      </div>

    `;

    item.addEventListener(
      'click',
      () => createConversation(user)
    );

    searchResults.appendChild(item);

  });

}


// ========================================================
// CREAR / ABRIR CONVERSACIÓN
// ========================================================

async function createConversation(user) {

  try {

    const targetUserId =
      user.id ||
      user.user_id;

    if (!targetUserId) {

      showToast(
        'Usuario sin identificador'
      );

      return;

    }

    const data =
      await requestJSON(
        '/api/chat/conversations/private',
        {
          method: 'POST',

          headers: {
            'Content-Type':
              'application/json'
          },

          body: JSON.stringify({
            userId: targetUserId
          })
        }
      );

    const conversation =
      data.conversation ||
      data;

    conversation.other_user =
      conversation.other_user ||
      user;

    await loadConversations();

    await openConversation(
      conversation
    );

    searchResults.innerHTML = '';

    searchInput.value = '';

  } catch (error) {

    console.error(error);

    showToast(
      error.message ||
      'No se pudo abrir la conversación'
    );

  }

}


// ========================================================
// CARGAR CONVERSACIONES
// ========================================================

async function loadConversations() {

  try {

    const data =
      await requestJSON(
        '/api/chat/conversations'
      );

    conversations =
      Array.isArray(data)
        ? data
        : (
            data.conversations ||
            []
          );

    renderConversations();

  } catch (error) {

    console.error(error);

  }

}


function renderConversations() {

  conversationList.innerHTML = '';

  conversationCount.textContent =
    conversations.length;

  if (!conversations.length) {

    conversationList.innerHTML = `

      <div
        style="
          color:#7f9984;
          text-align:center;
          padding:35px 15px;
          font-size:13px;
        "
      >
        Todavía no tienes conversaciones.
      </div>

    `;

    return;

  }

  conversations.forEach(conversation => {

    const other =
      conversation.other_user ||
      conversation.user ||
      {};

    const name =
      other.username ||
      other.name ||
      conversation.title ||
      'Conversación';

    const item =
      document.createElement('div');

    item.className =
      'conversation';

    if (
      currentConversation &&
      String(currentConversation.id) ===
      String(conversation.id)
    ) {

      item.classList.add('active');

    }

    item.innerHTML = `

      <div class="avatar">
        ${escapeHTML(
          name.charAt(0).toUpperCase()
        )}
      </div>

      <div style="min-width:0;">

        <div class="conversationName">
          ${escapeHTML(name)}
        </div>

        <div class="conversationPreview">
          ${escapeHTML(
            conversation.last_message ||
            'Conversación privada'
          )}
        </div>

      </div>

    `;

    item.addEventListener(
      'click',
      () => openConversation(conversation)
    );

    conversationList.appendChild(item);

  });

}


// ========================================================
// ABRIR SALA
// ========================================================

async function openConversation(
  conversation
) {

  currentConversation =
    conversation;

  emptyState.style.display =
    'none';

  chatRoom.style.display =
    'flex';

  app.classList.add(
    'roomOpen'
  );


  const other =
    conversation.other_user ||
    conversation.user ||
    {};

  const name =
    other.username ||
    other.name ||
    conversation.title ||
    'Usuario';

  roomName.textContent =
    name;

  roomAvatar.textContent =
    name
      .charAt(0)
      .toUpperCase();

  roomStatus.textContent =
    other.online
      ? 'En línea'
      : 'Conversación privada';


  socket.emit(
    'join-conversation',
    {
      conversationId:
        conversation.id
    }
  );


  await loadMessages();

  renderConversations();

  setTimeout(() => {

    messageInput.focus();

  }, 100);

}


// ========================================================
// CARGAR MENSAJES
// ========================================================

async function loadMessages() {

  if (!currentConversation) {
    return;
  }

  try {

    const data =
      await requestJSON(
        '/api/chat/conversations/' +
        encodeURIComponent(
          currentConversation.id
        ) +
        '/messages'
      );

    const list =
      Array.isArray(data)
        ? data
        : (
            data.messages ||
            []
          );

    messages.innerHTML = '';

    list.forEach(
      message => renderMessage(message)
    );

    scrollBottom();

  } catch (error) {

    console.error(error);

    showToast(
      'No se pudieron cargar los mensajes'
    );

  }

}


// ========================================================
// RENDER MENSAJE
// ========================================================

function renderMessage(message) {

  if (!message) {
    return;
  }

  const senderId =
    message.sender_user_id ||
    message.sender_id ||
    message.user_id;

  const myId =
    me
      ? (
          me.id ||
          me.user_id
        )
      : null;

  const isMine =
    message.mine === true ||
    message.is_mine === true ||
    (
      senderId &&
      myId &&
      String(senderId) ===
      String(myId)
    );

  const row =
    document.createElement('div');

  row.className =
    'messageRow' +
    (
      isMine
        ? ' me'
        : ''
    );

  const content =
    message.content ??
    message.text ??
    '';

  const created =
    message.created_at
      ? new Date(
          message.created_at
        )
      : new Date();

  const time =
    created.toLocaleTimeString(
      [],
      {
        hour: '2-digit',
        minute: '2-digit'
      }
    );

  row.innerHTML = `

    <div class="bubble">

      <div class="messageText">
        ${escapeHTML(content)}
      </div>

      <div class="messageMeta">

        <span>
          ${escapeHTML(time)}
        </span>

        ${
          isMine
            ? '<span class="ticks">✓✓</span>'
            : ''
        }

      </div>

    </div>

  `;

  messages.appendChild(row);

}


// ========================================================
// ENVIAR MENSAJE
// ========================================================

async function sendMessage() {

  if (!currentConversation) {

    showToast(
      'Abre una conversación primero'
    );

    return;

  }

  const text =
    messageInput.value.trim();

  if (!text) {
    return;
  }

  sendButton.disabled = true;

  try {

    const data =
      await requestJSON(
        '/api/chat/conversations/' +
        encodeURIComponent(
          currentConversation.id
        ) +
        '/messages',
        {
          method: 'POST',

          headers: {
            'Content-Type':
              'application/json'
          },

          body: JSON.stringify({
            content: text,
            text: text,
            message_type: 'text'
          })
        }
      );

    messageInput.value = '';

    const message =
      data.message ||
      data;

    /*
      Algunos servidores devuelven el mensaje
      inmediatamente.

      Otros lo devuelven por Socket.IO.

      Solo lo dibujamos aquí cuando tenemos ID
      y el servidor no indica que será enviado
      mediante socket.
    */

    if (
      message &&
      message.id &&
      !data.broadcast_only
    ) {

      renderMessage({
        ...message,
        mine: true
      });

      scrollBottom();

    }

  } catch (error) {

    console.error(error);

    showToast(
      error.message ||
      'No se pudo enviar el mensaje'
    );

  } finally {

    sendButton.disabled = false;

    messageInput.focus();

  }

}


// ========================================================
// SOCKET MENSAJES
// ========================================================

socket.on(
  'chat-message',
  data => {

    if (!currentConversation) {
      return;
    }

    const conversationId =
      data.conversation_id ||
      data.conversationId;

    if (
      String(conversationId) !==
      String(currentConversation.id)
    ) {
      return;
    }

    renderMessage(data);

    scrollBottom();

  }
);


socket.on(
  'message',
  data => {

    if (!currentConversation) {
      return;
    }

    const conversationId =
      data.conversation_id ||
      data.conversationId;

    if (
      conversationId &&
      String(conversationId) !==
      String(currentConversation.id)
    ) {
      return;
    }

    renderMessage(data);

    scrollBottom();

  }
);


// ========================================================
// TYPING
// ========================================================

messageInput.addEventListener(
  'input',
  () => {

    if (!currentConversation) {
      return;
    }

    socket.emit(
      'typing',
      {
        conversationId:
          currentConversation.id
      }
    );

  }
);


socket.on(
  'typing',
  data => {

    if (!currentConversation) {
      return;
    }

    if (
      String(data.conversationId) !==
      String(currentConversation.id)
    ) {
      return;
    }

    typing.textContent =
      (
        data.username ||
        'Usuario'
      ) +
      ' está escribiendo…';

    clearTimeout(
      typingTimer
    );

    typingTimer =
      setTimeout(
        () => {

          typing.textContent = '';

        },
        1500
      );

  }
);


// ========================================================
// SCROLL
// ========================================================

function scrollBottom() {

  messages.scrollTop =
    messages.scrollHeight;

}


// ========================================================
// EMOJIS
// ========================================================

emojiButton.addEventListener(
  'click',
  () => {

    emojiPanel.classList.toggle(
      'open'
    );

    attachMenu.classList.remove(
      'open'
    );

  }
);


document
  .querySelectorAll('.emoji')
  .forEach(button => {

    button.addEventListener(
      'click',
      () => {

        messageInput.value +=
          button.textContent;

        emojiPanel.classList.remove(
          'open'
        );

        messageInput.focus();

      }
    );

  });


// ========================================================
// ADJUNTOS
// ========================================================

attachButton.addEventListener(
  'click',
  () => {

    attachMenu.classList.toggle(
      'open'
    );

    emojiPanel.classList.remove(
      'open'
    );

  }
);


document
  .getElementById('photoOption')
  .addEventListener(
    'click',
    () => {

      attachMenu.classList.remove(
        'open'
      );

      mediaInput.click();

    }
  );


document
  .getElementById('documentOption')
  .addEventListener(
    'click',
    () => {

      attachMenu.classList.remove(
        'open'
      );

      documentInput.click();

    }
  );


document
  .getElementById('cameraOption')
  .addEventListener(
    'click',
    () => {

      attachMenu.classList.remove(
        'open'
      );

      cameraInput.click();

    }
  );


cameraButton.addEventListener(
  'click',
  () => {

    cameraInput.click();

  }
);


// ========================================================
// ARCHIVOS
//
// En esta fase comprobamos selección.
// La subida real necesita endpoint backend.
// ========================================================

function selectedFile(input) {

  const file =
    input.files &&
    input.files[0];

  if (!file) {
    return;
  }

  showToast(
    'Seleccionado: ' +
    file.name
  );

  /*
    Próxima fase:
    POST multipart/form-data al backend
    y guardar metadata del archivo en messages.
  */

}


mediaInput.addEventListener(
  'change',
  () => selectedFile(mediaInput)
);

documentInput.addEventListener(
  'change',
  () => selectedFile(documentInput)
);

cameraInput.addEventListener(
  'change',
  () => selectedFile(cameraInput)
);


// ========================================================
// AUDIO
//
// El botón queda preparado.
// No fingimos que una grabación fue enviada.
// ========================================================

audioButton.addEventListener(
  'click',
  async () => {

    if (
      !navigator.mediaDevices ||
      !navigator.mediaDevices.getUserMedia
    ) {

      showToast(
        'Este dispositivo no permite grabación desde el navegador'
      );

      return;

    }

    try {

      const stream =
        await navigator.mediaDevices
          .getUserMedia({
            audio: true
          });

      stream
        .getTracks()
        .forEach(
          track => track.stop()
        );

      showToast(
        'Micrófono autorizado. Grabación será el siguiente módulo.'
      );

    } catch (error) {

      showToast(
        'No se concedió acceso al micrófono'
      );

    }

  }
);


// ========================================================
// LLAMADAS
//
// Controles preparados para WebRTC.
// No mostramos una llamada falsa.
// ========================================================

voiceCallButton.addEventListener(
  'click',
  () => {

    if (!currentConversation) {
      return;
    }

    showToast(
      'Llamada de voz: módulo WebRTC preparado para integrar'
    );

  }
);


videoCallButton.addEventListener(
  'click',
  () => {

    if (!currentConversation) {
      return;
    }

    showToast(
      'Videollamada: módulo WebRTC preparado para integrar'
    );

  }
);


moreButton.addEventListener(
  'click',
  () => {

    showToast(
      'Opciones de conversación'
    );

  }
);


// ========================================================
// ENVIAR
// ========================================================

sendButton.addEventListener(
  'click',
  sendMessage
);


messageInput.addEventListener(
  'keydown',
  event => {

    if (
      event.key === 'Enter' &&
      !event.shiftKey
    ) {

      event.preventDefault();

      sendMessage();

    }

  }
);


// ========================================================
// BUSCADOR
// ========================================================

searchButton.addEventListener(
  'click',
  searchUsers
);


searchInput.addEventListener(
  'keydown',
  event => {

    if (event.key === 'Enter') {

      searchUsers();

    }

  }
);


// ========================================================
// VOLVER EN MÓVIL
// ========================================================

backButton.addEventListener(
  'click',
  () => {

    app.classList.remove(
      'roomOpen'
    );

  }
);


// ========================================================
// CERRAR MENÚS
// ========================================================

document.addEventListener(
  'click',
  event => {

    if (
      !emojiPanel.contains(event.target) &&
      !emojiButton.contains(event.target)
    ) {

      emojiPanel.classList.remove(
        'open'
      );

    }

    if (
      !attachMenu.contains(event.target) &&
      !attachButton.contains(event.target)
    ) {

      attachMenu.classList.remove(
        'open'
      );

    }

  }
);


// ========================================================
// SOCKET CONECTADO
// ========================================================

socket.on(
  'connect',
  () => {

    console.log(
      'VOBIXCHAT SOCKET:',
      socket.id
    );

    if (me) {

      socket.emit(
        'set-user',
        me.username
      );

    }

  }
);


// ========================================================
// INICIO
// ========================================================

loadConversations();

</script>
