<!DOCTYPE html>
<html lang="es">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  >

  <meta
    name="theme-color"
    content="#031108"
  >

  <title>VobixChat</title>

  <script src="/socket.io/socket.io.js"></script>

  <style>

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family:
        Arial,
        Helvetica,
        sans-serif;
      background: #020d06;
      color: #ffffff;
    }

    button,
    input,
    textarea {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    #app {
      width: 100%;
      height: 100dvh;
      display: flex;
      background:
        radial-gradient(
          circle at 40% 30%,
          rgba(75, 255, 92, 0.06),
          transparent 32%
        ),
        #020d06;
    }


    /* =====================================================
       SIDEBAR
    ===================================================== */

    #sidebar {
      width: 350px;
      min-width: 350px;
      height: 100%;
      display: flex;
      flex-direction: column;
      border-right:
        1px solid rgba(93, 255, 112, 0.18);
      background:
        rgba(2, 20, 9, 0.97);
      overflow: hidden;
    }

    .sidebarTop {
      padding:
        18px
        16px
        15px;
      border-bottom:
        1px solid rgba(93, 255, 112, 0.15);
    }

    .brandRow {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .logo {
      width: 45px;
      height: 45px;
      min-width: 45px;
      border-radius: 13px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #5dff70;
      color: #071108;
      font-weight: 900;
      font-size: 24px;
      box-shadow:
        0 0 25px rgba(93, 255, 112, 0.30);
    }

    .brandInfo {
      min-width: 0;
      flex: 1;
    }

    .brandName {
      font-size: 17px;
      font-weight: 900;
      letter-spacing: 0.4px;
    }

    #myUsername {
      margin-top: 2px;
      color: #9db5a2;
      font-size: 12px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    #myAvatar {
      width: 39px;
      height: 39px;
      min-width: 39px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      border:
        1px solid rgba(93, 255, 112, 0.22);
      background:
        rgba(93, 255, 112, 0.07);
      color: #5dff70;
      font-weight: 900;
    }


    /* =====================================================
       BUSCADOR
    ===================================================== */

    .searchArea {
      padding:
        14px
        14px
        12px;
      border-bottom:
        1px solid rgba(93, 255, 112, 0.12);
    }

    .searchRow {
      display: flex;
      gap: 8px;
    }

    #searchInput {
      width: 100%;
      min-width: 0;
      height: 45px;
      padding:
        0
        13px;
      border-radius: 12px;
      border:
        1px solid rgba(142, 181, 150, 0.26);
      outline: none;
      background:
        rgba(7, 29, 14, 0.88);
      color: #ffffff;
    }

    #searchInput::placeholder {
      color: #93a898;
    }

    #searchInput:focus {
      border-color:
        rgba(93, 255, 112, 0.65);
      box-shadow:
        0 0 0 2px rgba(93, 255, 112, 0.06);
    }

    #searchButton {
      width: 46px;
      min-width: 46px;
      height: 45px;
      border: 0;
      border-radius: 12px;
      background: #5dff70;
      color: #061108;
      font-size: 18px;
      font-weight: 900;
    }

    .searchHelp {
      margin-top: 9px;
      color: #78917d;
      font-size: 11px;
      line-height: 1.35;
    }

    #searchResults {
      max-height: 230px;
      overflow-y: auto;
    }


    /* =====================================================
       CONVERSACIONES
    ===================================================== */

    .conversationHeader {
      padding:
        14px
        15px
        8px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      color: #d4e8d7;
      font-size: 12px;
      font-weight: 900;
      letter-spacing: 0.7px;
    }

    #conversationCount {
      color: #9db5a2;
    }

    #conversationList {
      flex: 1;
      overflow-y: auto;
      padding-bottom: 15px;
    }

    .conversation {
      position: relative;
      min-height: 68px;
      display: flex;
      align-items: center;
      gap: 11px;
      padding:
        10px
        13px;
      border-left:
        3px solid transparent;
      cursor: pointer;
      transition:
        background 0.15s ease,
        border-color 0.15s ease;
    }

    .conversation:hover {
      background:
        rgba(93, 255, 112, 0.045);
    }

    .conversation.active {
      background:
        rgba(93, 255, 112, 0.075);
      border-left-color: #5dff70;
    }

    .avatar {
      width: 43px;
      height: 43px;
      min-width: 43px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #5dff70;
      color: #071108;
      font-weight: 900;
      font-size: 17px;
    }

    .conversationBody {
      flex: 1;
      min-width: 0;
    }

    .conversationName {
      color: #f2fff4;
      font-size: 14px;
      font-weight: 800;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .conversationPreview {
      margin-top: 5px;
      color: #78917d;
      font-size: 12px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .unreadBadge {
      display: none;
      min-width: 20px;
      height: 20px;
      padding:
        0
        6px;
      border-radius: 999px;
      align-items: center;
      justify-content: center;
      background: #5dff70;
      color: #071108;
      font-size: 10px;
      font-weight: 900;
    }

    .unreadBadge.show {
      display: flex;
    }


    /* =====================================================
       PANEL DERECHO
    ===================================================== */

    #main {
      flex: 1;
      min-width: 0;
      height: 100%;
      position: relative;
      overflow: hidden;
    }

    #emptyState {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 30px;
    }

    .emptyContent {
      max-width: 520px;
    }

    .emptyLogo {
      width: 72px;
      height: 72px;
      margin:
        0
        auto
        17px;
      border-radius: 19px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #5dff70;
      color: #071108;
      font-size: 36px;
      font-weight: 900;
      box-shadow:
        0 0 40px rgba(93, 255, 112, 0.25);
    }

    .emptyTitle {
      font-size: 28px;
      font-weight: 900;
    }

    .emptyText {
      margin-top: 12px;
      color: #9ab29f;
      font-size: 13px;
      line-height: 1.6;
    }


    /* =====================================================
       SALA
    ===================================================== */

    #chatRoom {
      position: absolute;
      inset: 0;
      display: none;
      flex-direction: column;
      background:
        radial-gradient(
          circle at 50% 25%,
          rgba(93, 255, 112, 0.045),
          transparent 35%
        ),
        #020d06;
    }

    .roomHeader {
      height: 70px;
      min-height: 70px;
      display: flex;
      align-items: center;
      gap: 11px;
      padding:
        0
        16px;
      border-bottom:
        1px solid rgba(93, 255, 112, 0.15);
      background:
        rgba(2, 18, 8, 0.96);
    }

    #backButton {
      display: none;
      width: 38px;
      height: 38px;
      border: 0;
      border-radius: 50%;
      background: transparent;
      color: #ffffff;
      font-size: 25px;
    }

    #roomAvatar {
      width: 43px;
      height: 43px;
      min-width: 43px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #5dff70;
      color: #071108;
      font-weight: 900;
      font-size: 17px;
    }

    .roomIdentity {
      min-width: 0;
      flex: 1;
    }

    #roomName {
      font-size: 15px;
      font-weight: 900;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    #roomStatus {
      margin-top: 3px;
      color: #7f9984;
      font-size: 11px;
    }

    .roomActions {
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .roomAction {
      width: 39px;
      height: 39px;
      border: 0;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      background: transparent;
      color: #b9cfbd;
      font-size: 19px;
    }

    .roomAction:hover {
      background:
        rgba(93, 255, 112, 0.07);
      color: #5dff70;
    }


    /* =====================================================
       MENSAJES
    ===================================================== */

    #messages {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      padding:
        20px
        18px
        12px;
      scroll-behavior: smooth;
    }

    .messageRow {
      width: 100%;
      display: flex;
      justify-content: flex-start;
      margin:
        4px
        0;
    }

    .messageRow.me {
      justify-content: flex-end;
    }

    .bubble {
      max-width: min(72%, 620px);
      padding:
        9px
        11px
        7px;
      border-radius:
        4px
        14px
        14px
        14px;
      background:
        #102519;
      border:
        1px solid rgba(255, 255, 255, 0.035);
      box-shadow:
        0 3px 12px rgba(0, 0, 0, 0.10);
      overflow-wrap: anywhere;
    }

    .messageRow.me .bubble {
      background:
        #164522;
      border-radius:
        14px
        4px
        14px
        14px;
    }

    .messageSender {
      margin-bottom: 4px;
      color: #5dff70;
      font-size: 11px;
      font-weight: 800;
    }

    .messageText {
      color: #f1fff3;
      font-size: 14px;
      line-height: 1.4;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .messageMeta {
      margin-top: 4px;
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 5px;
      color: #8ba391;
      font-size: 9px;
      line-height: 1;
    }

    .ticks {
      color: #7fe98b;
      font-weight: 900;
    }

    #typing {
      min-height: 20px;
      padding:
        2px
        18px
        4px;
      color: #74d980;
      font-size: 11px;
    }


    /* =====================================================
       COMPOSER
    ===================================================== */

    .composerWrap {
      position: relative;
      padding:
        9px
        12px
        calc(9px + env(safe-area-inset-bottom));
      border-top:
        1px solid rgba(93, 255, 112, 0.12);
      background:
        rgba(2, 17, 8, 0.97);
    }

    .composer {
      min-height: 48px;
      display: flex;
      align-items: flex-end;
      gap: 5px;
      padding:
        5px
        6px;
      border-radius: 16px;
      background:
        #0b2112;
      border:
        1px solid rgba(93, 255, 112, 0.13);
    }

    .composerButton {
      width: 38px;
      height: 38px;
      min-width: 38px;
      border: 0;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      background: transparent;
      color: #a8c0ad;
      font-size: 18px;
    }

    .composerButton:hover {
      background:
        rgba(93, 255, 112, 0.07);
      color: #5dff70;
    }

    #messageInput {
      flex: 1;
      min-width: 0;
      min-height: 38px;
      max-height: 130px;
      resize: none;
      border: 0;
      outline: 0;
      padding:
        9px
        7px;
      background: transparent;
      color: #ffffff;
      line-height: 20px;
      overflow-y: auto;
    }

    #messageInput::placeholder {
      color: #718877;
    }

    #sendButton {
      width: 40px;
      height: 40px;
      min-width: 40px;
      border: 0;
      border-radius: 50%;
      background: #5dff70;
      color: #061108;
      font-size: 17px;
      font-weight: 900;
    }

    #sendButton:disabled {
      opacity: 0.55;
      cursor: default;
    }


    /* =====================================================
       EMOJIS
    ===================================================== */

    #emojiPanel {
      position: absolute;
      left: 12px;
      bottom: 68px;
      width: 280px;
      max-width:
        calc(100vw - 24px);
      padding: 10px;
      display: none;
      grid-template-columns:
        repeat(7, 1fr);
      gap: 5px;
      border-radius: 14px;
      border:
        1px solid rgba(93, 255, 112, 0.18);
      background: #092010;
      box-shadow:
        0 15px 40px rgba(0, 0, 0, 0.42);
      z-index: 20;
    }

    #emojiPanel.open {
      display: grid;
    }

    .emoji {
      height: 34px;
      border: 0;
      border-radius: 8px;
      background: transparent;
      font-size: 21px;
    }

    .emoji:hover {
      background:
        rgba(93, 255, 112, 0.09);
    }


    /* =====================================================
       ADJUNTOS
    ===================================================== */

    #attachMenu {
      position: absolute;
      left: 52px;
      bottom: 68px;
      width: 190px;
      display: none;
      padding: 7px;
      border-radius: 13px;
      border:
        1px solid rgba(93, 255, 112, 0.18);
      background: #092010;
      box-shadow:
        0 15px 40px rgba(0, 0, 0, 0.42);
      z-index: 20;
    }

    #attachMenu.open {
      display: block;
    }

    .attachOption {
      width: 100%;
      height: 42px;
      border: 0;
      border-radius: 9px;
      display: flex;
      align-items: center;
      gap: 10px;
      padding:
        0
        10px;
      background: transparent;
      color: #e9ffed;
      text-align: left;
    }

    .attachOption:hover {
      background:
        rgba(93, 255, 112, 0.08);
    }


    /* =====================================================
       TOAST
    ===================================================== */

    #toast {
      position: fixed;
      left: 50%;
      bottom: 82px;
      transform:
        translate(-50%, 15px);
      max-width:
        calc(100vw - 30px);
      padding:
        10px
        15px;
      border-radius: 999px;
      background:
        rgba(19, 43, 25, 0.97);
      border:
        1px solid rgba(93, 255, 112, 0.22);
      color: #effff1;
      font-size: 12px;
      opacity: 0;
      pointer-events: none;
      transition:
        opacity 0.18s ease,
        transform 0.18s ease;
      z-index: 100;
    }

    #toast.show {
      opacity: 1;
      transform:
        translate(-50%, 0);
    }


    /* =====================================================
       INPUTS DE ARCHIVOS OCULTOS
    ===================================================== */

    .hiddenInput {
      display: none;
    }


    /* =====================================================
       RESPONSIVE
    ===================================================== */

    @media (
      max-width: 760px
    ) {

      #sidebar {
        width: 100%;
        min-width: 100%;
        border-right: 0;
      }

      #main {
        position: fixed;
        inset: 0;
        z-index: 30;
        pointer-events: none;
        visibility: hidden;
        transform:
          translateX(100%);
        transition:
          transform 0.20s ease;
      }

      #app.roomOpen #main {
        pointer-events: auto;
        visibility: visible;
        transform:
          translateX(0);
      }

      #backButton {
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .roomHeader {
        padding:
          0
          9px;
      }

      .roomActions {
        gap: 0;
      }

      .roomAction {
        width: 35px;
        height: 35px;
      }

      #messages {
        padding:
          15px
          10px
          10px;
      }

      .bubble {
        max-width: 84%;
      }

      .composerWrap {
        padding-left: 7px;
        padding-right: 7px;
      }

      .composer {
        gap: 1px;
        padding-left: 2px;
        padding-right: 3px;
      }

      .composerButton {
        width: 34px;
        min-width: 34px;
      }

    }

  </style>

</head>


<body>

<div id="app">

  <!-- ===================================================
       COLUMNA IZQUIERDA
  ==================================================== -->

  <aside id="sidebar">

    <div class="sidebarTop">

      <div class="brandRow">

        <div class="logo">
          V
        </div>

        <div class="brandInfo">

          <div class="brandName">
            VOBIXCHAT
          </div>

          <div id="myUsername">
            @usuario
          </div>

        </div>

        <div id="myAvatar">
          V
        </div>

      </div>

    </div>


    <div class="searchArea">

      <div class="searchRow">

        <input
          id="searchInput"
          type="text"
          autocomplete="off"
          placeholder="Buscar usuario o teléfono"
        >

        <button
          id="searchButton"
          type="button"
          aria-label="Buscar"
        >
          ⌕
        </button>

      </div>

      <div class="searchHelp">
        Encuentra personas y abre una conversación privada.
      </div>

      <div id="searchResults"></div>

    </div>


    <div class="conversationHeader">

      <span>
        CONVERSACIONES
      </span>

      <span id="conversationCount">
        0
      </span>

    </div>


    <div id="conversationList">

      <div
        style="
          color:#7f9984;
          text-align:center;
          padding:35px 15px;
          font-size:13px;
        "
      >
        Todavía no tienes conversaciones.
      </div>

    </div>

  </aside>


  <!-- ===================================================
       PANEL DERECHO
  ==================================================== -->

  <main id="main">

    <section id="emptyState">

      <div class="emptyContent">

        <div class="emptyLogo">
          V
        </div>

        <div class="emptyTitle">
          VOBIXCHAT
        </div>

        <div class="emptyText">
          Selecciona una conversación o busca una persona para comenzar.
          <br>
          Tus conversaciones se mantienen separadas en salas privadas.
        </div>

      </div>

    </section>


    <!-- =================================================
         SALA PRIVADA
    ================================================== -->

    <section id="chatRoom">

      <header class="roomHeader">

        <button
          id="backButton"
          type="button"
          aria-label="Volver"
        >
          ‹
        </button>

        <div id="roomAvatar">
          V
        </div>

        <div class="roomIdentity">

          <div id="roomName">
            Conversación
          </div>

          <div id="roomStatus">
            Conversación privada
          </div>

        </div>


        <div class="roomActions">

          <button
            id="voiceCallButton"
            class="roomAction"
            type="button"
            title="Llamada"
            aria-label="Llamada"
          >
            ☎
          </button>

          <button
            id="videoCallButton"
            class="roomAction"
            type="button"
            title="Videollamada"
            aria-label="Videollamada"
          >
            ▣
          </button>

          <button
            id="moreButton"
            class="roomAction"
            type="button"
            title="Más opciones"
            aria-label="Más opciones"
          >
            ⋮
          </button>

        </div>

      </header>


      <div id="messages"></div>

      <div id="typing"></div>


      <!-- ===============================================
           COMPOSITOR
      ================================================ -->

      <div class="composerWrap">

        <div id="emojiPanel">

          <button class="emoji" type="button">😀</button>
          <button class="emoji" type="button">😂</button>
          <button class="emoji" type="button">😍</button>
          <button class="emoji" type="button">🥰</button>
          <button class="emoji" type="button">😎</button>
          <button class="emoji" type="button">😢</button>
          <button class="emoji" type="button">😭</button>

          <button class="emoji" type="button">😡</button>
          <button class="emoji" type="button">👍</button>
          <button class="emoji" type="button">👎</button>
          <button class="emoji" type="button">👏</button>
          <button class="emoji" type="button">🙏</button>
          <button class="emoji" type="button">❤️</button>
          <button class="emoji" type="button">💚</button>

          <button class="emoji" type="button">🔥</button>
          <button class="emoji" type="button">🎉</button>
          <button class="emoji" type="button">✨</button>
          <button class="emoji" type="button">💯</button>
          <button class="emoji" type="button">😘</button>
          <button class="emoji" type="button">🤔</button>
          <button class="emoji" type="button">😉</button>

        </div>


        <div id="attachMenu">

          <button
            id="photoOption"
            class="attachOption"
            type="button"
          >
            🖼️ Foto o vídeo
          </button>

          <button
            id="documentOption"
            class="attachOption"
            type="button"
          >
            📄 Documento
          </button>

          <button
            id="cameraOption"
            class="attachOption"
            type="button"
          >
            📷 Cámara
          </button>

        </div>


        <div class="composer">

          <button
            id="emojiButton"
            class="composerButton"
            type="button"
            title="Emoji"
            aria-label="Emoji"
          >
            ☺
          </button>

          <button
            id="attachButton"
            class="composerButton"
            type="button"
            title="Adjuntar"
            aria-label="Adjuntar"
          >
            📎
          </button>

          <button
            id="cameraButton"
            class="composerButton"
            type="button"
            title="Cámara"
            aria-label="Cámara"
          >
            📷
          </button>

          <textarea
            id="messageInput"
            rows="1"
            maxlength="5000"
            autocomplete="off"
            placeholder="Escribe un mensaje"
          ></textarea>

          <button
            id="audioButton"
            class="composerButton"
            type="button"
            title="Micrófono"

// ========================================================

// ========================================================

function getLocalUser() {

  const possibleKeys = [
    'vobix_user',
    'vobixUser',
    'user'
  ];

  for (
    const key
    of possibleKeys
  ) {

    try {

      const value =
        localStorage.getItem(
          key
        );

      if (!value) {
        continue;
      }

      const parsed =
        JSON.parse(
          value
        );

      if (
        parsed &&
        typeof parsed ===
          'object'
      ) {

        return parsed;

      }

    } catch (error) {

      console.warn(
        'VOBIXCHAT LOCAL USER:',
        error
      );

    }

  }

  return null;

}


me =
  getLocalUser();


if (me) {

    me.username ||

    me.name ||

    me.user ||

    'Usuario';

  myUsername.textContent =
    '@' + name;

  myAvatar.textContent =
    String(name)
      .charAt(0)
      .toUpperCase();

}


// ========================================================

function getToken() {

    ) ||

      'token'
    ) ||
    ''
  );

}


// ========================================================
// PETICIÓN JSON
// ========================================================

async function requestJSON(
  url,
  options = {}
) {

  const headers = {
    ...(options.headers || {})
  };

  const token =
    getToken();

  if (token) {

    headers.Authorization =
      'Bearer ' + token;

  }

  const response =
    await fetch(
      url,
      {
        ...options,
        headers
      }
    );

  let data =
    null;

  try {

    data =
      await response.json();

  } catch {

    data = {};

  }

  if (!response.ok) {

    const error =
      new Error(

        data.msg ||

        data.message ||

        data.error ||

        'Error de conexión'

      );

    error.status =
      response.status;

    throw error;

  }

  return data;

}


// ========================================================
// NORMALIZACIÓN DE ID
//
// Esta función será importante para reparar el problema
// observado: el ID puede venir directamente en el mensaje
// o dentro del payload del socket.
// ========================================================

function normalizeId(
  value
) {

  if (
    value === null ||
    value === undefined
  ) {

    return '';

  }

  return String(value).trim();

}


function getConversationId(
  value
) {

  if (!value) {
    return '';
  }

  /*
    Conversación directa.
  */
  const direct =

    value.conversation_id ??

    value.conversationId ??

    value.id;

  if (
    direct !== null &&
    direct !== undefined &&
    String(direct).trim()
  ) {

    return normalizeId(
      direct
    );

  }

  /*
    Payload:
    { message: {...} }
  */
  if (
    value.message &&
    typeof value.message ===
      'object'
  ) {

    const nested =
      getConversationIdFromMessage(
        value.message
      );

    if (nested) {
      return nested;
    }

  }

  /*
    Payload:
    { conversation: {...} }
  */
  if (
    value.conversation &&
    typeof value.conversation ===
      'object'
  ) {

    const nested =

      value.conversation.id ??

      value.conversation.conversation_id ??

      value.conversation.conversationId;

    if (
      nested !== null &&
      nested !== undefined
    ) {

      return normalizeId(
        nested
      );

    }

  }

  return '';

}


function getConversationIdFromMessage(
  message
) {

  if (!message) {
    return '';
  }

  return normalizeId(

    message.conversation_id ??

    message.conversationId ??

    (
      message.conversation &&
      (
        message.conversation.id ??

        message.conversation.conversation_id ??

        message.conversation.conversationId
      )
    ) ??

    ''

  );

}


// ========================================================
// ID DEL MENSAJE
// ========================================================

function getMessageId(
  message
) {

  if (!message) {
    return '';
  }

  return normalizeId(

    message.id ??

    message.message_id ??

    message.messageId ??

    message.uuid ??

    ''

  );

}

// ========================================================

function escapeHTML(
  value
) {

  return String(
    value ?? ''
  )
    .replaceAll(
      '&',
      '&amp;'
    )
    .replaceAll(
      '<',
      '&lt;'
    )
    .replaceAll(
      '>',
      '&gt;'
    )
    .replaceAll(
      '"',
      '&quot;'
    )
    .replaceAll(
      "'",
      '&#039;'
    );

}

  if (!conversation) {

  const other =

  if (
    String(
      directName

    return String(
      directName

  }

  const phone =

    getPhone(other) ||

    conversation.other_phone ||

// ========================================================

function showMessageNotification(
  message
) {

  if (
    !message ||
    !('Notification' in window) ||
    Notification.permission !==
      'granted'
  ) {

    return;

  }

  /*
    Si VOBIXCHAT está visible y además estamos
    dentro de esa misma conversación, no necesitamos
    una notificación del sistema.

    La burbuja ya debe aparecer directamente.
  */
  const incomingConversationId =
    getConversationIdFromMessage(
      message
    );

  const currentId =
    currentConversation
      ? getConversationId(
          currentConversation
        )
      : '';

  if (
    document.visibilityState ===
      'visible' &&
    incomingConversationId &&
    currentId &&
    incomingConversationId ===
      currentId
  ) {

    return;

  }

  const senderName =

    message.sender_username ||

    message.senderUsername ||

    getUsername(
      message.sender
    ) ||

    getUsername(
      message.user
    ) ||

    'Nuevo mensaje';

  const text =

    message.content ??

    message.text ??

    message.message ??

    '';

  try {

    const notification =
      new Notification(
        senderName,
        {
          body:
            String(text)
              .slice(
                0,
                180
              ),

          tag:
            incomingConversationId
              ? 'vobix-' +
                incomingConversationId
              : 'vobix-message'
        }
      );

    notification.onclick =
      () => {

        window.focus();

        if (
          incomingConversationId
        ) {

          const conversation =
            conversations.find(
              item =>

                getConversationId(
                  item
                ) ===
                incomingConversationId
            );

          if (conversation) {

            openConversation(
              conversation
            );

          }

        }

        notification.close();

      };

  } catch (error) {

    console.warn(
      'VOBIXCHAT NOTIFICATION:',
      error
    );

  }

}


// ========================================================
// SONIDO DE NOTIFICACIÓN
// ========================================================

let notificationAudioContext =
  null;


function activateNotificationAudio() {

  try {

    const AudioContextClass =

      window.AudioContext ||

      window.webkitAudioContext;

    if (!AudioContextClass) {
      return;
    }

    if (
      !notificationAudioContext
    ) {

      notificationAudioContext =
        new AudioContextClass();

    }

    if (
      notificationAudioContext.state ===
      'suspended'
    ) {

      notificationAudioContext
        .resume()
        .catch(
          () => {}
        );

    }

  } catch (error) {

    console.warn(
      'VOBIXCHAT AUDIO INIT:',
      error
    );

  }

}


function playNotificationSound() {

  try {

    activateNotificationAudio();

    if (
      !notificationAudioContext
    ) {
      return;
    }

    const context =
      notificationAudioContext;

    const oscillator =
      context.createOscillator();

    const gain =
      context.createGain();

    oscillator.connect(
      gain
    );

    gain.connect(
      context.destination
    );

    oscillator.frequency
      .setValueAtTime(
        740,
        context.currentTime
      );

    gain.gain
      .setValueAtTime(
        0.0001,
        context.currentTime
      );

    gain.gain
      .exponentialRampToValueAtTime(
        0.07,
        context.currentTime + 0.01
      );

    gain.gain
      .exponentialRampToValueAtTime(
        0.0001,
        context.currentTime + 0.14
      );

    oscillator.start(
      context.currentTime
    );

    oscillator.stop(
      context.currentTime + 0.15
    );

  } catch (error) {

    console.warn(
      'VOBIXCHAT SOUND:',
      error
    );

  }

}

// ========================================================
// NORMALIZAR MENSAJE RECIBIDO
//
// ESTE ES UNO DE LOS PUNTOS PRINCIPALES DE LA REPARACIÓN.
//
// El backend puede entregar:
//
// 1.
// {
//   id,
//   conversation_id,
//   content,
//   ...
// }
//
// o:
//
// 2.
// {
//   conversationId,
//   message: {
//      id,
//      conversation_id,
//      content
//   }
// }
//
// Antes estábamos tratando esas formas por separado.
// Ahora convertimos TODO a una sola estructura.
// ========================================================

function normalizeIncomingMessage(
  payload
) {

  if (!payload) {
    return null;
  }

  let message =
    null;

  if (
    payload.message &&
    typeof payload.message ===
      'object'
  ) {

    message = {
      ...payload.message
    };

  } else if (
    typeof payload ===
      'object'
  ) {

    message = {
      ...payload
    };

  } else {

    return null;

  }


  /*
    Primero buscamos el ID dentro del propio mensaje.
  */
  let conversationId =
    getConversationIdFromMessage(
      message
    );


  /*
    Si no vino dentro del mensaje, lo buscamos
    en el envoltorio del evento Socket.IO.
  */
  if (!conversationId) {

    conversationId =
      normalizeId(

        payload.conversation_id ??

        payload.conversationId ??

        (
          payload.conversation &&
          (
            payload.conversation.id ??

            payload.conversation
              .conversation_id ??

            payload.conversation
              .conversationId
          )
        ) ??

        ''

      );

  }


  /*
    Una vez encontrado, lo escribimos siempre
    en las dos variantes.

    Desde este punto el resto del frontend
    no tiene que adivinar dónde venía.
  */
  if (conversationId) {

    message.conversation_id =
      conversationId;

    message.conversationId =
      conversationId;

  }


  /*
    Conservamos datos externos del emisor
    si el backend los puso en el payload.
  */
  if (
    !message.sender_username &&
    payload.sender_username
  ) {

    message.sender_username =
      payload.sender_username;

  }

  if (
    !message.senderUsername &&
    payload.senderUsername
  ) {

    message.senderUsername =
      payload.senderUsername;

  }


  return message;

}


// ========================================================
// SABER SI EL MENSAJE ES MÍO
// ========================================================

function isMyMessage(
  message
) {

  if (
    !message ||
    !me
  ) {

    return false;

  }

  if (
    message.mine === true ||
    message.is_mine === true ||
    message.isMine === true
  ) {

    return true;

  }

  const senderId =
    normalizeId(

      message.sender_user_id ??

      message.sender_id ??

      message.senderUserId ??

      (
        message.sender &&
        (
          message.sender.id ??

          message.sender.user_id ??

          message.sender.userId
        )
      ) ??

      ''

    );

  const myId =
    normalizeId(

      me.id ??

      me.user_id ??

      me.userId ??

      ''

    );

  if (
    senderId &&
    myId &&
    senderId === myId
  ) {

    return true;

  }

  const senderName =

    message.sender_username ||

    message.senderUsername ||

    getUsername(
      message.sender
    ) ||

    getUsername(
      message.user
    ) ||

    '';

  const myName =
    getUsername(
      me
    );

  return Boolean(

    senderName &&
    myName &&
    senderName
      .toLowerCase() ===
    myName
      .toLowerCase()

  );

}


// ========================================================
// EXTRAER TEXTO DEL MENSAJE
// ========================================================

function getMessageText(
  message
) {

  if (!message) {
    return '';
  }

  return String(

    message.content ??

    message.text ??

    message.message ??

    ''

  );

}


// ========================================================
// EXTRAER FECHA
// ========================================================

function getMessageDate(
  message
) {

  const value =

    message.created_at ??

    message.createdAt ??

    message.timestamp ??

    Date.now();

  const date =
    new Date(
      value
    );

  if (
    Number.isNaN(
      date.getTime()
    )
  ) {

    return new Date();

  }

  return date;

}


// ========================================================
// RENDERIZAR MENSAJE
// ========================================================

function renderMessage(
  rawMessage
) {

  const message =
    normalizeIncomingMessage(
      rawMessage
    );

  if (!message) {
    return false;
  }

  const messageId =
    getMessageId(
      message
    );


  /*
    routes/chat.js puede emitir el mismo mensaje
    mediante chat:message y message:new.

    El primer evento dibuja la burbuja.
    El segundo encuentra el mismo ID y termina aquí.
  */
  if (
    messageId &&
    renderedMessageIds.has(
      messageId
    )
  ) {

    return false;

  }


  if (messageId) {

    renderedMessageIds.add(
      messageId
    );

  }


  const mine =
    isMyMessage(
      message
    );

  const senderName =

    message.sender_username ||

    message.senderUsername ||

    getUsername(
      message.sender
    ) ||

    getUsername(
      message.user
    ) ||

    '';

  const text =
    getMessageText(
      message
    );

  const date =
    getMessageDate(
      message
    );

  const time =
    date.toLocaleTimeString(
      [],
      {
        hour:
          '2-digit',

        minute:
          '2-digit'
      }
    );


  const row =
    document.createElement(
      'div'
    );

  row.className =
    mine
      ? 'messageRow me'
      : 'messageRow';


  if (messageId) {

    row.dataset.messageId =
      messageId;

  }


  row.innerHTML = `

    <div class="bubble">

      ${
        !mine &&
        senderName

          ? `

            <div class="messageSender">

              ${escapeHTML(
                senderName
              )}

            </div>

          `

          : ''
      }

      <div class="messageText">

        ${escapeHTML(
          text
        )}

      </div>

      <div class="messageMeta">

        <span>

          ${escapeHTML(
            time
          )}

        </span>

        ${
          mine

            ? `
              <span class="ticks">
                ✓✓
              </span>
            `

            : ''
        }

      </div>

    </div>

  `;


  messages.appendChild(
    row
  );

  return true;

}

// ========================================================
// ¿ESTÁ ABIERTA ESTA CONVERSACIÓN?
//
// NO comprobamos nombres.
// NO comprobamos el preview.
// NO esperamos loadConversations().
//
// Únicamente comparamos el ID real de la sala.
// ========================================================

function isConversationOpen(
  conversationId
) {

  if (
    !currentConversation ||
    !conversationId
  ) {

    return false;

  }

  const currentId =
    getConversationId(
      currentConversation
    );

  return Boolean(

    currentId &&
    normalizeId(
      currentId
    ) ===
    normalizeId(
      conversationId
    )

  );

}


// ========================================================
// ACTUALIZAR PREVIEW LOCAL
//
// Esto NO controla la entrega del mensaje.
//
// La burbuja se procesa independientemente.
// El preview es solamente una representación
// secundaria de la conversación en la izquierda.
// ========================================================

function updateConversationPreview(
  rawMessage
) {

  const message =
    normalizeIncomingMessage(
      rawMessage
    );

  if (!message) {
    return;
  }

  const conversationId =
    getConversationIdFromMessage(
      message
    );

  if (!conversationId) {
    return;
  }

  const index =
    conversations.findIndex(
      item =>

        getConversationId(
          item
        ) ===
        conversationId
    );

  if (index < 0) {

    /*
      Si todavía no tenemos esa conversación
      en memoria, pediremos después una
      actualización al servidor.

      IMPORTANTE:
      esto NO bloquea la burbuja.
    */
    scheduleConversationRefresh();

    return;

  }

  const conversation =
    conversations[index];

  const text =
    getMessageText(
      message
    );

  conversation.last_message =
    text;

  conversation.lastMessage =
    text;

  conversation.updated_at =

    message.created_at ??

    message.createdAt ??

    new Date()
      .toISOString();


  /*
    La conversación con actividad reciente
    sube a la primera posición.
  */
  if (index > 0) {

    conversations.splice(
      index,
      1
    );

    conversations.unshift(
      conversation
    );

  }


  renderConversations();

}


// ========================================================
// CONTADOR SIN LEER
// ========================================================

function addUnreadMessage(
  rawMessage
) {

  const message =
    normalizeIncomingMessage(
      rawMessage
    );

  if (!message) {
    return;
  }

  const conversationId =
    getConversationIdFromMessage(
      message
    );

  if (!conversationId) {
    return;
  }


  /*
    JAMÁS mostramos unread si esa sala
    está abierta en este momento.
  */
  if (
    isConversationOpen(
      conversationId
    )
  ) {

    unreadConversations.delete(
      conversationId
    );

    return;

  }


  const current =
    Number(

      unreadConversations.get(
        conversationId
      ) || 0

    );


  unreadConversations.set(
    conversationId,
    current + 1
  );


  renderConversations();

}


// ========================================================
// LIMPIAR NO LEÍDOS
// ========================================================

function clearUnread(
  conversationId
) {

  const id =
    normalizeId(
      conversationId
    );

  if (!id) {
    return;
  }

  unreadConversations.delete(
    id
  );

}


// ========================================================
// REFRESCO DE CONVERSACIONES CON DEBOUNCE
//
// Solo se utiliza cuando necesitamos información
// que todavía no existe en memoria.
//
// NO participa en la entrega normal de mensajes.
// ========================================================

let conversationRefreshTimer =
  null;


function scheduleConversationRefresh() {

  clearTimeout(
    conversationRefreshTimer
  );

  conversationRefreshTimer =
    setTimeout(
      () => {

        loadConversations()
          .catch(
            error => {

              console.warn(
                'VOBIXCHAT CONVERSATION REFRESH:',
                error
              );

            }
          );

      },
      250
    );

}


// ========================================================
// MENSAJE SOCKET — RUTA PRINCIPAL DE RECEPCIÓN
//
// ESTE ES EL CAMBIO CENTRAL.
//
// ANTES:
//
// socket
//   ↓
// preview izquierdo
//   ↓
// no reconoce bien la sala
//   ↓
// unread
//   ↓
// mucho después loadMessages()
//   ↓
// burbuja
//
// AHORA:
//
// socket
//   ↓
// normalizar conversation_id
//   ↓
// ¿esa sala está abierta?
//   ↓ SÍ
// renderMessage()
//   ↓
// burbuja INMEDIATA
//
// El preview se actualiza DESPUÉS.
// ========================================================

function receiveSocketMessage(
  payload
) {

  const message =
    normalizeIncomingMessage(
      payload
    );

  if (!message) {
    return;
  }


  const conversationId =
    getConversationIdFromMessage(
      message
    );


  if (!conversationId) {

    console.warn(
      'VOBIXCHAT: mensaje recibido sin conversation_id',
      payload
    );

    /*
      No podemos asignar con seguridad el mensaje
      a una sala.

      Actualizamos conversaciones como respaldo,
      pero no inventamos una conversación.
    */
    scheduleConversationRefresh();

    return;

  }


  const mine =
    isMyMessage(
      message
    );


  const roomIsOpen =
    isConversationOpen(
      conversationId
    );


  /*
    =====================================================
    PRIORIDAD ABSOLUTA: SALA ABIERTA
    =====================================================

    Si el usuario ya está mirando esa conversación,
    pintamos primero la burbuja.

    No esperamos:
    - loadConversations()
    - PostgreSQL otra vez
    - polling
    - focus
    - safety sync
    - contador de no leídos
  */
  if (roomIsOpen) {

    clearUnread(
      conversationId
    );

    const inserted =
      renderMessage(
        message
      );

    if (inserted) {

      scrollBottom(
        true
      );

      if (!mine) {

        playNotificationSound();

      }

    }

  } else {

    /*
      Solo las conversaciones NO abiertas
      producen contador de no leídos.
    */
    if (!mine) {

      addUnreadMessage(
        message
      );

      playNotificationSound();

      showMessageNotification(
        message
      );

    }

  }


  /*
    El preview se actualiza DESPUÉS de haber
    procesado la sala.

    Por tanto nunca puede impedir que el mensaje
    aparezca dentro del chat abierto.
  */
  updateConversationPreview(
    message
  );

}


// ========================================================
// EVENTOS DE MENSAJE DEL BACKEND
//
// routes/chat.js emite:
// - chat:message
// - message:new
//
// Ambos pasan por UNA SOLA función.
//
// renderMessage() evita duplicados por message.id.
// ========================================================

socket.on(
  'chat:message',
  receiveSocketMessage
);


socket.on(
  'message:new',
  receiveSocketMessage
);


// ========================================================
// COMPATIBILIDAD TEMPORAL
//
// server.js contiene conversation-message.
//
// Lo podemos ESCUCHAR por compatibilidad con eventos
// existentes, pero ESTE CLIENTE NO lo utilizará para
// volver a enviar el mensaje.
//
// Si llega el mismo mensaje por aquí, el control por ID
// impide una segunda burbuja.
// ========================================================

socket.on(
  'conversation-message',
  receiveSocketMessage
);


// ========================================================
// ENTRAR EN SALA PRIVADA
// ========================================================

function joinConversationRoom(
  conversation
) {

  const conversationId =
    getConversationId(
      conversation
    );

  if (!conversationId) {

    console.warn(
      'VOBIXCHAT JOIN: conversación sin ID'
    );

    return;

  }


  /*
    Guardamos la intención incluso si el socket
    está reconectando.

    Cuando vuelva connect, entraremos nuevamente.
  */
  joinedConversationId =
    conversationId;


  if (!socket.connected) {

    return;

  }


  socket.emit(

    'conversation-join',

    {
      conversationId:
        conversationId,

      conversation_id:
        conversationId
    },

    response => {

      if (
        response &&
        response.ok === false
      ) {

        console.warn(
          'VOBIXCHAT JOIN ERROR:',
          response
        );

        return;

      }


      /*
        El ACK confirma que el servidor procesó
        nuestra entrada a la sala.
      */
      joinedConversationId =
        conversationId;

    }

  );

}


// ========================================================
// REENTRAR DESPUÉS DE RECONECTAR
// ========================================================

function rejoinCurrentConversation() {

  if (!currentConversation) {
    return;
  }

  joinConversationRoom(
    currentConversation
  );

}


// ========================================================
// CARGAR MENSAJES DESDE POSTGRESQL
//
// Se utiliza:
//
// - al abrir una conversación;
// - al regresar después de una desconexión;
// - como recuperación.
//
// NO se ejecuta para cada mensaje Socket.IO.
// ========================================================

async function loadMessages(
  conversation = currentConversation
) {

  if (!conversation) {
    return;
  }

  const conversationId =
    getConversationId(
      conversation
    );

  if (!conversationId) {

    throw new Error(
      'Conversación sin ID'
    );

  }


  const data =
    await requestJSON(

      '/api/chat/conversations/' +

      encodeURIComponent(
        conversationId
      ) +

      '/messages'

    );


  const list =
    Array.isArray(
      data
    )

      ? data

      : (
          data.messages ||
          data.results ||
          data.data ||
          []
        );


  /*
    Si mientras esperábamos esta petición el usuario
    abrió OTRA conversación, no debemos pintar aquí
    el historial de la sala anterior.
  */
  if (
    !currentConversation ||
    getConversationId(
      currentConversation
    ) !==
    conversationId
  ) {

    return;

  }


  messages.innerHTML =
    '';

  renderedMessageIds.clear();


  list.forEach(
    message => {

      renderMessage(
        message
      );

    }
  );


  scrollBottom(
    true
  );

}


// ========================================================
// ABRIR CONVERSACIÓN
// ========================================================

async function openConversation(
  conversation
) {

  if (!conversation) {
    return;
  }

  const conversationId =
    getConversationId(
      conversation
    );

  if (!conversationId) {

    showToast(
      'La conversación no tiene un ID válido'
    );

    return;

  }


  /*
    Evita que dos toques rápidos disparen dos cargas
    simultáneas del mismo historial.
  */
  if (
    openingConversationId ===
      conversationId
  ) {

    return;

  }


  openingConversationId =
    conversationId;


  /*
    PRIMERO declaramos la sala como actual.

    Esto es deliberado.

    Si un mensaje Socket.IO llega mientras estamos
    descargando el historial, receiveSocketMessage()
    ya sabrá que ESTA es la sala abierta.
  */
  currentConversation =
    conversation;


  clearUnread(
    conversationId
  );


  emptyState.style.display =
    'none';

  chatRoom.style.display =
    'flex';

  app.classList.add(
    'roomOpen'
  );


  const name =
    getConversationName(
      conversation
    );


  roomName.textContent =
    name;

  roomAvatar.textContent =
    String(name)
      .charAt(0)
      .toUpperCase();


  const other =

    conversation.other_user ||

    conversation.otherUser ||

    conversation.contact ||

    conversation.user ||

    {};


  roomStatus.textContent =
    other.online === true
      ? 'En línea'
      : 'Conversación privada';


  /*
    SEGUNDO: entrar en Socket.IO inmediatamente.

    No esperamos a descargar los mensajes antiguos
    para unirnos a la sala.
  */
  joinConversationRoom(
    conversation
  );


  /*
    Actualizamos visualmente el sidebar.
  */
  renderConversations();


  try {

    /*
      TERCERO: historial.

      Mientras esta petición está viajando,
      el socket ya está preparado para recibir
      mensajes nuevos.
    */
    await loadMessages(
      conversation
    );

  } catch (error) {

    console.error(
      'VOBIXCHAT LOAD MESSAGES:',
      error
    );

    showToast(
      'No se pudieron cargar los mensajes'
    );

  } finally {

    if (
      openingConversationId ===
        conversationId
    ) {

      openingConversationId =
        null;

    }

  }


  setTimeout(
    () => {

      if (
        currentConversation &&
        getConversationId(
          currentConversation
        ) ===
        conversationId
      ) {

        messageInput.focus();

      }

    },
    50
  );

}
// ========================================================
// CARGAR CONVERSACIONES
// ========================================================

async function loadConversations() {

  const data =
    await requestJSON(
      '/api/chat/conversations'
    );

  const incoming =
    Array.isArray(data)

      ? data

      : (
          data.conversations ||
          data.results ||
          data.data ||
          []
        );


  /*
    Conservamos información útil que ya tenemos
    localmente cuando la respuesta del servidor
    viene más reducida.

    Esto evita volver a mostrar "Contacto" cuando
    ya conocemos el nombre real del usuario.
  */
  const previousById =
    new Map();

  conversations.forEach(
    item => {

      const id =
        getConversationId(
          item
        );

      if (id) {

        previousById.set(
          id,
          item
        );

      }

    }
  );


  conversations =
    incoming.map(
      item => {

        const id =
          getConversationId(
            item
          );

        const previous =
          id
            ? previousById.get(id)
            : null;


        if (!previous) {
          return item;
        }


        const incomingName =
          getConversationName(
            item
          );

        const previousName =
          getConversationName(
            previous
          );


        /*
          Si la respuesta nueva no trae los datos
          completos del contacto, conservamos los
          que ya conocíamos.
        */
        if (
          (
            !incomingName ||
            incomingName === 'Contacto'
          ) &&
          previousName &&
          previousName !== 'Contacto'
        ) {

          if (
            previous.other_user
          ) {

            item.other_user =
              previous.other_user;

          }

          if (
            previous.otherUser
          ) {

            item.otherUser =
              previous.otherUser;

          }

          if (
            previous.contact
          ) {

            item.contact =
              previous.contact;

          }

          if (
            previous.other_username
          ) {

            item.other_username =
              previous.other_username;

          }

          if (
            previous.otherUsername
          ) {

            item.otherUsername =
              previous.otherUsername;

          }

        }


        return item;

      }
    );


  /*
    Si la conversación abierta recibió una versión
    nueva desde PostgreSQL, actualizamos sus datos
    SIN cerrar la sala.
  */
  if (
    currentConversation
  ) {

    const currentId =
      getConversationId(
        currentConversation
      );

    const refreshed =
      conversations.find(
        item =>

          getConversationId(
            item
          ) ===
          currentId
      );


    if (refreshed) {

      const oldName =
        getConversationName(
          currentConversation
        );

      const newName =
        getConversationName(
          refreshed
        );


      /*
        Si la versión nueva perdió el nombre,
        conservamos la información que ya teníamos.
      */
      if (
        (
          !newName ||
          newName === 'Contacto'
        ) &&
        oldName &&
        oldName !== 'Contacto'
      ) {

        if (
          currentConversation.other_user
        ) {

          refreshed.other_user =
            currentConversation.other_user;

        }

        if (
          currentConversation.otherUser
        ) {

          refreshed.otherUser =
            currentConversation.otherUser;

        }

        if (
          currentConversation.contact
        ) {

          refreshed.contact =
            currentConversation.contact;

        }

      }


      currentConversation =
        refreshed;

    }

  }


  renderConversations();

}


// ========================================================
// MOSTRAR CONVERSACIONES
// ========================================================

function renderConversations() {

  conversationList.innerHTML =
    '';

  conversationCount.textContent =
    String(
      conversations.length
    );


  if (
    conversations.length === 0
  ) {

    conversationList.innerHTML = `

      <div
        style="
          color:#7f9984;
          text-align:center;
          padding:35px 15px;
          font-size:13px;
        "
      >
        Todavía no tienes conversaciones.
      </div>

    `;

    return;

  }


  const currentId =
    currentConversation
      ? getConversationId(
          currentConversation
        )
      : '';


  conversations.forEach(
    conversation => {

      const conversationId =
        getConversationId(
          conversation
        );

      const name =
        getConversationName(
          conversation
        );


      const previewRaw =

        conversation.last_message ??

        conversation.lastMessage ??

        conversation.preview ??

        'Conversación privada';


      /*
        Algunos backends devuelven last_message
        como objeto completo.
      */
      const preview =

        typeof previewRaw ===
          'object'

          ? getMessageText(
              previewRaw
            )

          : String(
              previewRaw || ''
            );


      const unread =
        Number(

          unreadConversations.get(
            conversationId
          ) || 0

        );


      const item =
        document.createElement(
          'div'
        );

      item.className =
        'conversation';


      if (
        currentId &&
        conversationId ===
          currentId
      ) {

        item.classList.add(
          'active'
        );

      }


      item.dataset.conversationId =
        conversationId;


      item.innerHTML = `

        <div class="avatar">

          ${escapeHTML(
            String(name)
              .charAt(0)
              .toUpperCase()
          )}

        </div>

        <div class="conversationBody">

          <div class="conversationName">

            ${escapeHTML(
              name
            )}

          </div>

          <div class="conversationPreview">

            ${escapeHTML(
              preview
            )}

          </div>

        </div>

        <div
          class="unreadBadge ${
            unread > 0
              ? 'show'
              : ''
          }"
        >

          ${
            unread > 99
              ? '99+'
              : unread
          }

        </div>

      `;


      item.addEventListener(
        'click',
        () => {

          openConversation(
            conversation
          );

        }
      );


      conversationList.appendChild(
        item
      );

    }
  );

}


// ========================================================
// BUSCAR USUARIOS

    searchInput.value.trim();


  if (!value) {

    searchResults.innerHTML =
      '';

    return;

  }


  searchButton.disabled =
    true;


  try {

    const data =
      await requestJSON(

        '/api/chat/users/search?q=' +

        encodeURIComponent(
          value
        )

      );


    const users =
      Array.isArray(data)

        ? data

        : (
            data.users ||
            data.results ||
            data.data ||
            []
          );


    renderSearchResults(
      users
    );

  } catch (error) {

    console.error(
      'VOBIXCHAT SEARCH:',
      error
    );


    searchResults.innerHTML =
      '';


    showToast(

      error.message ||

      'No se pudo realizar la búsqueda'

    );

  } finally {

    searchButton.disabled =
      false;

  }

}


// ========================================================
// MOSTRAR RESULTADOS DE BÚSQUEDA

function renderSearchResults(

) {

// ========================================================
// CREAR / ABRIR CONVERSACIÓN PRIVADA
// ========================================================

async function createConversation(
  user
) {

  const targetUserId =
    getUserId(
      user
    );


  if (!targetUserId) {

    showToast(
      'No encontramos el ID de este contacto'
    );

    return;

  }


  try {

    const data =
      await requestJSON(

        '/api/chat/conversations/private',

        {

          method:
            'POST',

          headers: {

            'Content-Type':
              'application/json'

          },

          body:
            JSON.stringify({

              userId:
                targetUserId,

              targetUserId:
                targetUserId

            })

        }

      );


    const returnedConversation =

      data.conversation ||

      data.data ||

      data;


    const conversation = {

      ...returnedConversation

    };


    /*
      El usuario acaba de pulsar sobre un resultado
      real de búsqueda.

      Por tanto conocemos con certeza quién es
      el contacto de esta conversación.

      Conservamos esos datos para que el nombre
      no termine convertido en "Contacto".
    */
    if (
      !conversation.other_user &&
      !conversation.otherUser &&
      !conversation.contact
    ) {

      conversation.other_user =
        user;

    }


    let conversationId =
      getConversationId(
        conversation
      );


    /*
      Si la respuesta de creación tiene una forma
      distinta, refrescamos la lista y localizamos
      la conversación por el usuario.
    */
    if (!conversationId) {

      await loadConversations();


      const found =
        conversations.find(
          item => {

            const other =

              item.other_user ||

              item.otherUser ||

              item.contact ||

              item.user ||

              {};


            return (
              getUserId(
                other
              ) ===
              targetUserId
            );

          }
        );


      if (!found) {

        throw new Error(
          'No se pudo identificar la conversación creada'
        );

      }


      await openConversation(
        found
      );


      searchResults.innerHTML =
        '';

      searchInput.value =
        '';

      return;

    }


    /*
      La añadimos localmente de inmediato si todavía
      no existe.

      No necesitamos esperar otra petición para
      poder entrar en la sala Socket.IO.
    */
    const existingIndex =
      conversations.findIndex(
        item =>

          getConversationId(
            item
          ) ===
          conversationId
      );


    if (
      existingIndex >= 0
    ) {

      const existing =
        conversations[
          existingIndex
        ];


      /*
        Conservamos los datos reales del contacto.
      */
      if (
        getConversationName(
          existing
        ) === 'Contacto'
      ) {

        existing.other_user =
          user;

      }


      await openConversation(
        existing
      );

    } else {

      conversations.unshift(
        conversation
      );


      renderConversations();


      await openConversation(

    showToast(

}


// ========================================================
// ENVIAR MENSAJE
//
// IMPORTANTE:
//
// NO hacemos:
// socket.emit('conversation-message')
//
// routes/chat.js ya hace:
//
// PostgreSQL
//    ↓
// io.to(conversation:${id})
//    ↓
// chat:message
// message:new
//
// El receptor obtiene el mensaje desde esos eventos.
// ========================================================

async function sendMessage() {

  if (
    sendingMessage
  ) {

    return;

  }


  if (
    !currentConversation
  ) {

    showToast(
      'Abre una conversación primero'
    );

    return;

  }


  const text =
    messageInput.value.trim();


  if (!text) {
    return;
  }


  const conversationId =
    getConversationId(
      currentConversation
    );


  if (!conversationId) {

    showToast(
      'La conversación no tiene un ID válido'
    );

    return;

  }


  sendingMessage =
    true;

  sendButton.disabled =
    true;


  /*
    Guardamos el texto por si el POST falla.

    Solo vaciamos el textarea cuando el servidor
    confirma correctamente el guardado.
  */
  const originalText =
    text;


  try {

    const data =
      await requestJSON(

        '/api/chat/conversations/' +

        encodeURIComponent(
          conversationId
        ) +

        '/messages',

        {

          method:
            'POST',

          headers: {

            'Content-Type':
              'application/json'

          },

          body:
            JSON.stringify({

              content:
                originalText,

              text:
                originalText,

              message_type:
                'text',

              type:
                'text'

            })

        }

      );


    /*
      POST correcto:
      PostgreSQL ya confirmó el mensaje.
    */
    messageInput.value =
      '';


    const returnedMessage =

      data.message ||

      data.data ||

      (
        data &&
        (
          data.id ||
          data.message_id
        )
          ? data
          : null
      );


    /*
      =====================================================
      RESPUESTA INMEDIATA DEL EMISOR
      =====================================================

      El usuario que envía NO debe esperar a recibir
      de vuelta su propio evento Socket.IO para ver
      la burbuja.

      El POST ya confirmó que PostgreSQL lo guardó.

      Por tanto pintamos inmediatamente el objeto
      devuelto por la API.

      Cuando chat:message / message:new llegue después,
      renderedMessageIds detectará el mismo ID.
    */
    if (
      returnedMessage &&
      typeof returnedMessage ===
        'object'
    ) {

      const message = {

        ...returnedMessage,

        conversation_id:

          getConversationIdFromMessage(
            returnedMessage
          ) ||

          conversationId,

        conversationId:
          conversationId,

        content:

          returnedMessage.content ??

          returnedMessage.text ??

          originalText,

        mine:
          true,

        sender_username:

          returnedMessage.sender_username ||

          returnedMessage.senderUsername ||

          getUsername(me)

      };


      const inserted =
        renderMessage(
          message
        );


      if (inserted) {

        scrollBottom(
          true
        );

      }


      updateConversationPreview(
        message
      );

    } else {

      /*
        Si el endpoint devuelve solamente {ok:true},
        NO inventamos un ID de mensaje.

        El evento Socket.IO será quien lo dibuje.
      */
      console.log(
        'VOBIXCHAT: mensaje guardado; esperando evento Socket.IO'
      );

    }


    /*
      Dejamos preparado el campo inmediatamente
      para el siguiente mensaje.
    */
    messageInput.focus();


  } catch (error) {

    console.error(
      'VOBIXCHAT SEND MESSAGE:',
      error
    );


    /*
      Si el usuario no escribió otra cosa mientras
      esperaba, restauramos el mensaje.
    */
    if (
      !messageInput.value.trim()
    ) {

      messageInput.value =
        originalText;

    }


    showToast(

      error.message ||

      'No se pudo enviar el mensaje'

    );

  } finally {

    sendingMessage =
      false;

    sendButton.disabled =
      false;

  }

}

    /*

      conversación que está abierta.
    */
    if (
      !incomingId ||
      incomingId !==
        currentId
    ) {

      return;

    }


    const name =

      data.username ||

      data.sender_username ||

      getUsername(
        data.user
      ) ||

      'Contacto';


    const myName =
      getUsername(
        me
      );


    /*
      No mostramos nuestro propio indicador.
    */
    if (
      name &&
      myName &&
      String(name)
        .toLowerCase() ===
      String(myName)
        .toLowerCase()
    ) {

      return;

    }


    typing.textContent =
      name +
      ' está escribiendo…';


    clearTimeout(
      typingTimer
    );


    typingTimer =
      setTimeout(
        () => {

          typing.textContent =

        },

      );

socket.on(
  'conversation-updated',
  data => {

    if (
      data &&
      typeof data === 'object'
    ) {

      const conversationId =
        getConversationId(
          data
        );

      if (conversationId) {

        const index =
          conversations.findIndex(
            item =>

              getConversationId(
                item
              ) ===
              conversationId
          );


        if (
          index >= 0
        ) {

          conversations[index] = {

            ...conversations[index],
            ...data

          };


          /*
            Si es la conversación abierta,
            actualizamos sus metadatos sin
            tocar las burbujas.
          */
          if (
            currentConversation &&
            getConversationId(
              currentConversation
            ) ===
            conversationId
          ) {

            currentConversation =
              conversations[index];

          }


          renderConversations();

          return;

        }

    }


    scheduleConversationRefresh();

);
