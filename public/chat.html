<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>VobixChat</title>
<style>*{box-sizing:border-box;font-family:Inter,system-ui}body{margin:0;height:100vh;background:#070a08;color:#fff;display:flex}
.side{width:360px;background:#0e1511;border-right:1px solid #1a2e20;display:flex;flex-direction:column}
.head{padding:16px;display:flex;gap:10px;align-items:center}.search{flex:1;background:#131e16;border:1px solid #1e3a26;border-radius:12px;padding:10px 14px;color:#fff;outline:none}
.tabs{display:flex;gap:8px;padding:0 16px 12px}.tab{padding:6px 12px;border-radius:20px;background:#131e16;border:1px solid #1e3a26;font-size:12px;cursor:pointer}.tab.active{background:#1e3a26;border-color:#2ee89e;color:#6effa8}
.list{flex:1;overflow:auto}.item{padding:12px 16px;display:flex;gap:12px;align-items:center;cursor:pointer;border-bottom:1px solid #101a12}.item:hover{background:#111d14}
.ava{width:44px;height:44px;border-radius:50%;background:linear-gradient(135deg,#34d399,#10b981);display:flex;align-items:center;justify-content:center;font-weight:800;color:#052e16}
.main{flex:1;display:flex;flex-direction:column;background:#080c09}.top{height:64px;background:#0e1511;border-bottom:1px solid #1a2e20;display:flex;align-items:center;justify-content:space-between;padding:0 20px}
.msgs{flex:1;overflow:auto;padding:24px;display:flex;flex-direction:column;gap:12px;background:radial-gradient(ellipse at top, #101a12 0%, transparent 60%)}
.bub{max-width:62%;padding:12px 16px;border-radius:18px;font-size:14px;line-height:1.4}.me{align-self:flex-end;background:linear-gradient(135deg,#6effa8,#34d399);color:#04210f;border-bottom-right-radius:6px}.other{align-self:flex-start;background:#161f19;border:1px solid #1e3a26;border-bottom-left-radius:6px}
.bottom{padding:14px 18px;background:#0e1511;border-top:1px solid #1a2e20;display:flex;gap:10px;align-items:center}.input{flex:1;background:#131e16;border:1px solid #1e3a26;border-radius:24px;padding:12px 18px;color:#fff;outline:none}
.icon{width:40px;height:40px;border-radius:50%;background:#131e16;border:1px solid #1e3a26;display:flex;align-items:center;justify-content:center;cursor:pointer}
.send{background:#6effa8;border:none;color:#052e16;font-weight:900}
</style></head><body>
<div class="side"><div class="head"><input class="search" placeholder="Buscar chat..."></div>
<div class="tabs"><div class="tab active">Todos</div><div class="tab">No leídos</div><div class="tab">Grupos</div></div>
<div class="list" id="list"></div></div>
<div class="main"><div class="top"><div style="display:flex;gap:12px;align-items:center"><div class="ava" id="topAva">V</div><div><b id="topName">Selecciona un chat</b><div style="font-size:11px;color:#7abf8a">En línea • Cifrado</div></div></div><div style="display:flex;gap:8px"><div class="icon">📞</div><div class="icon">🎥</div></div></div>
<div class="msgs" id="msgs"><div style="text-align:center;color:#5a7a60;margin-top:40%">✨ Bienvenido a VobixChat<br><small style="color:#3a5a40">Más bonito, más rápido, más privado que todos</small></div></div>
<div class="bottom"><div class="icon">📎</div><div class="icon">😊</div><input class="input" id="msgInput" placeholder="Escribe un mensaje..."><button class="icon send" onclick="send()">➤</button></div></div>
<script>
if(!localStorage.getItem('vobix_user'))location.href='index.html';
const chats=[{n:'Sofia',m:'El diseño quedó brutal 💚'},{n:'Alex Team',m:'¿Revisamos antes?'},{n:'Mamá',m:'¿Llegaste bien?'},{n:'Vobix Soporte',m:'Bienvenido a tu nueva app'}];
const list=document.getElementById('list'); chats.forEach((c,i)=>{const d=document.createElement('div');d.className='item';d.innerHTML=`<div class=ava>${c.n[0]}</div><div style=flex:1><b style=font-size:14px>${c.n}</b><div style=font-size:12px;color:#8abf95>${c.m}</div></div><small style=color:#4a6a50>10:42</small>`;d.onclick=()=>{document.getElementById('topName').innerText=c.n;document.getElementById('topAva').innerText=c.n[0];document.getElementById('msgs').innerHTML=''};list.appendChild(d)});
function send(){const v=document.getElementById('msgInput').value.trim();if(!v)return;const b=document.createElement('div');b.className='bub me';b.innerText=v;document.getElementById('msgs').appendChild(b);document.getElementById('msgInput').value='';document.getElementById('msgs').scrollTop=9999;}
document.getElementById('msgInput').addEventListener('keydown',e=>{if(e.key==='Enter')send()});
</script></body></html>
