// ========================================================
// SOCKET CONECTADO / RECONECTADO
// ========================================================

socket.on(
  'connect',
  () => {

    console.log(
      'VOBIXCHAT SOCKET CONECTADO:',
      socket.id
    );


    if (
      currentUser?.username
    ) {

      socket.emit(
        'set-user',
        currentUser.username
      );

    }


    /*
      Al reconectar volvemos a entrar en
      la conversación abierta.
    */

    if (
      currentConversationId
    ) {

      socket.emit(
        'conversation-join',
        {

          conversationId:
            currentConversationId

        }
      );

    }

  }
);


socket.on(
  'connect_error',
  error => {

    console.error(
      'VOBIXCHAT SOCKET ERROR:',
      error
    );

  }
);


// ========================================================
// FIN DEL BLOQUE 4/5
// ========================================================
// ========================================================
// BOTÓN MÁS OPCIONES
// ========================================================

moreButton.addEventListener(
  'click',
  () => {

    showToast(
      'Más opciones próximamente'
    );

  }
);


// ========================================================
// VISIBILIDAD DE LA APP
// ========================================================

document.addEventListener(
  'visibilitychange',
  () => {

    /*
      Cuando Safari/iPhone vuelve desde segundo plano,
      comprobamos que Socket.IO siga conectado.

      Si iOS suspendió el socket, solicitamos
      reconexión.
    */

    if (
      document.visibilityState ===
      'visible'
    ) {

      if (
        !socket.connected
      ) {

        try {

          socket.connect();

        } catch (error) {

          console.error(
            'VOBIXCHAT SOCKET RECONNECT:',
            error
          );

        }

      }


      /*
        Safari puede haber pausado audio/video.
        Si existe una llamada activa intentamos
        reanudar la reproducción.
      */

      if (currentCall) {

        if (
          remoteAudio.srcObject
        ) {

          remoteAudio
            .play()
            .catch(
              () => {}
            );

        }


        if (
          currentCall.type ===
            'video'
        ) {

          if (
            remoteVideo.srcObject
          ) {

            remoteVideo
              .play()
              .catch(
                () => {}
              );

          }


          if (
            localVideo.srcObject
          ) {

            localVideo
              .play()
              .catch(
                () => {}
              );

          }

        }

      }

    }

  }
);


// ========================================================
// PAGESHOW - IMPORTANTE EN SAFARI / IPHONE
// ========================================================

window.addEventListener(
  'pageshow',
  event => {

    /*
      Safari puede restaurar chat.html desde
      Back/Forward Cache.

      El HTML aparece instantáneamente, pero
      el socket anterior puede estar muerto.
    */

    if (
      event.persisted &&
      !socket.connected
    ) {

      try {

        socket.connect();

      } catch (_) {}

    }

  }
);


// ========================================================
// CAMBIO DE RED
// ========================================================

window.addEventListener(
  'online',
  () => {

    if (
      !socket.connected
    ) {

      try {

        socket.connect();

      } catch (_) {}

    }


    showToast(
      'Conexión recuperada'
    );

  }
);


window.addEventListener(
  'offline',
  () => {

    showToast(
      'Sin conexión a Internet'
    );

  }
);


// ========================================================
// CERRAR MENÚS CON ESCAPE
// ========================================================

document.addEventListener(
  'keydown',
  event => {

    if (
      event.key !==
      'Escape'
    ) {

      return;

    }


    emojiPanel.classList.remove(
      'open'
    );


    attachMenu.classList.remove(
      'open'
    );

  }
);


// ========================================================
// LIMPIEZA ANTES DE SALIR
// ========================================================

window.addEventListener(
  'pagehide',
  () => {

    /*
      NO desconectamos Socket.IO manualmente.

      Safari puede estar enviando la página al
      Back/Forward Cache y posteriormente volver.

      Sí detenemos una grabación de nota de voz
      que haya quedado abierta.
    */

    if (
      mediaRecorder &&
      mediaRecorder.state !==
        'inactive'
    ) {

      try {

        mediaRecorder.stop();

      } catch (_) {}

    }

  }
);


// ========================================================
// PROTECCIÓN CONTRA DOBLE CLIC EN LLAMADAS
// ========================================================

let lastCallButtonPress =
  0;


function canPressCallButton() {

  const now =
    Date.now();


  if (
    now -
    lastCallButtonPress <
    700
  ) {

    return false;

  }


  lastCallButtonPress =
    now;


  return true;

}


// ========================================================
// PERMISOS - INFORMACIÓN ÚTIL
// ========================================================

async function inspectMediaPermissions() {

  /*
    permissions.query no está implementado
    igual en todos los Safari.

    Por eso esta función es solamente informativa.
    La autorización real siempre se solicita
    mediante getUserMedia().
  */

  if (
    !navigator.permissions ||
    !navigator.permissions.query
  ) {

    return;

  }


  try {

    const microphone =
      await navigator.permissions.query({
        name:
          'microphone'
      });


    console.log(
      'VOBIXCHAT MICROPHONE PERMISSION:',
      microphone.state
    );


  } catch (_) {}


  try {

    const camera =
      await navigator.permissions.query({
        name:
          'camera'
      });


    console.log(
      'VOBIXCHAT CAMERA PERMISSION:',
      camera.state
    );


  } catch (_) {}

}


// ========================================================
// COMPROBAR CONTEXTO SEGURO
// ========================================================

function checkSecureContext() {

  /*
    Cámara y micrófono requieren HTTPS
    salvo localhost.

    En producción VOBIXCHAT debe cargarse
    siempre mediante HTTPS.
  */

  if (
    window.isSecureContext
  ) {

    return true;

  }


  const hostname =
    window.location.hostname;


  if (
    hostname ===
      'localhost' ||
    hostname ===
      '127.0.0.1'
  ) {

    return true;

  }


  console.warn(
    'VOBIXCHAT: cámara y micrófono requieren HTTPS'
  );


  return false;

}


// ========================================================
// REVISAR SOPORTE MULTIMEDIA
// ========================================================

function inspectMediaSupport() {

  const secure =
    checkSecureContext();


  if (!secure) {

    console.warn(
      'VOBIXCHAT MEDIA: contexto no seguro'
    );

  }


  if (
    !navigator.mediaDevices
  ) {

    console.warn(
      'VOBIXCHAT MEDIA: navigator.mediaDevices no disponible'
    );

  }


  if (
    !navigator.mediaDevices?.getUserMedia
  ) {

    console.warn(
      'VOBIXCHAT MEDIA: getUserMedia no disponible'
    );

  }


  if (
    typeof MediaRecorder ===
      'undefined'
  ) {

    console.warn(
      'VOBIXCHAT MEDIA: MediaRecorder no disponible'
    );

  }


  if (
    typeof RTCPeerConnection ===
      'undefined'
  ) {

    console.warn(
      'VOBIXCHAT MEDIA: RTCPeerConnection no disponible'
    );

  }

}


// ========================================================
// REPRODUCIR AUDIO DESPUÉS DE INTERACCIÓN
// ========================================================

function unlockMediaPlayback() {

  /*
    En iPhone Safari la reproducción automática
    puede requerir una interacción.

    Intentamos desbloquear los elementos de audio
    después del primer toque.
  */

  if (
    remoteAudio.srcObject
  ) {

    remoteAudio
      .play()
      .catch(
        () => {}
      );

  }


  if (
    remoteVideo.srcObject
  ) {

    remoteVideo
      .play()
      .catch(
        () => {}
      );

  }


  document.removeEventListener(
    'touchstart',
    unlockMediaPlayback
  );


  document.removeEventListener(
    'click',
    unlockMediaPlayback
  );

}


document.addEventListener(
  'touchstart',
  unlockMediaPlayback,
  {
    once:
      true,

    passive:
      true
  }
);


document.addEventListener(
  'click',
  unlockMediaPlayback,
  {
    once:
      true
  }
);


// ========================================================
// RECUPERAR CONVERSACIÓN ACTUAL AL RECONECTAR
// ========================================================

socket.io.on(
  'reconnect',
  () => {

    console.log(
      'VOBIXCHAT SOCKET RECONECTADO'
    );


    if (
      currentUser?.username
    ) {

      socket.emit(
        'set-user',
        currentUser.username
      );

    }


    if (
      currentConversationId
    ) {

      socket.emit(
        'conversation-join',
        {

          conversationId:
            currentConversationId

        },
        result => {

          if (
            result &&
            result.ok === false
          ) {

            console.error(
              'VOBIXCHAT REJOIN:',
              result.msg
            );

          }

        }
      );

    }

  }
);


// ========================================================
// SOCKET DESCONECTADO
// ========================================================

socket.on(
  'disconnect',
  reason => {

    console.log(
      'VOBIXCHAT SOCKET DESCONECTADO:',
      reason
    );


    /*
      No destruimos una llamada inmediatamente.

      En móvil una suspensión momentánea del socket
      no significa necesariamente que WebRTC haya
      terminado.
    */

  }
);


// ========================================================
// ERROR GENERAL DE SOCKET
// ========================================================

socket.on(
  'error',
  error => {

    console.error(
      'VOBIXCHAT SOCKET:',
      error
    );

  }
);


// ========================================================
// ACTUALIZAR CONVERSACIONES PERIÓDICAMENTE
// ========================================================

let conversationRefreshTimer =
  null;


function startConversationRefresh() {

  clearInterval(
    conversationRefreshTimer
  );


  conversationRefreshTimer =
    setInterval(
      () => {

        if (
          document.visibilityState ===
          'visible'
        ) {

          loadConversations();

        }

      },
      30000
    );

}


// ========================================================
// INICIALIZACIÓN
// ========================================================

async function initializeVobixChat() {

  inspectMediaSupport();


  /*
    No pedimos cámara ni micrófono al arrancar.

    Esto es importante especialmente en iPhone:
    los permisos deben solicitarse cuando el usuario
    pulsa Cámara, Micrófono, Llamar o Videollamar.
  */


  const authenticated =
    await loadSession();


  if (!authenticated) {

    return;

  }


  await loadConversations();


  startConversationRefresh();


  /*
    Comprobación informativa.
    No bloquea el arranque.
  */

  inspectMediaPermissions();


  console.log(
    'VOBIXCHAT CHAT PREPARADO'
  );


  console.log(
    'VOBIXCHAT CÁMARA PREPARADA'
  );


  console.log(
    'VOBIXCHAT NOTAS DE VOZ PREPARADAS'
  );


  console.log(
    'VOBIXCHAT WEBRTC PREPARADO'
  );

}


// ========================================================
// ARRANCAR VOBIXCHAT
// ========================================================

initializeVobixChat();

</script>
