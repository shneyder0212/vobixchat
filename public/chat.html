// ========================================================
// BUSCAR USUARIOS
// ========================================================

function normalizeSearchResults(
  data
) {

  if (
    Array.isArray(
      data
    )
  ) {

    return data;

  }


  if (
    data &&
    Array.isArray(
      data.users
    )
  ) {

    return data.users;

  }


  if (
    data &&
    Array.isArray(
      data.results
    )
  ) {

    return data.results;

  }


  if (
    data &&
    Array.isArray(
      data.data
    )
  ) {

    return data.data;

  }


  return [];

}


// ========================================================
// RENDERIZAR RESULTADOS DE BÚSQUEDA
// ========================================================

function renderSearchResults(
  users
) {

  searchResults.innerHTML =
    '';


  if (
    !Array.isArray(
      users
    ) ||
    users.length === 0
  ) {

    const empty =
      document.createElement(
        'div'
      );


    empty.style.padding =
      '14px 4px 4px';

    empty.style.color =
      '#7f9984';

    empty.style.fontSize =
      '12px';


    empty.textContent =
      'No se encontraron usuarios.';


    searchResults.appendChild(
      empty
    );


    return;

  }


  for (
    const user
    of users
  ) {

    /*
      No mostramos nuestra propia cuenta.
    */
    const myId =
      getUserId(
        me
      );


    const userId =
      getUserId(
        user
      );


    if (
      myId &&
      userId &&
      normalizeId(
        myId
      ) ===
      normalizeId(
        userId
      )
    ) {

      continue;

    }


    const username =

      getUsername(
        user
      ) ||

      getPhone(
        user
      ) ||

      'Usuario';


    const phone =
      getPhone(
        user
      );


    const row =
      document.createElement(
        'div'
      );


    row.className =
      'conversation';


    const avatar =
      document.createElement(
        'div'
      );


    avatar.className =
      'avatar';


    avatar.textContent =
      String(username)
        .charAt(0)
        .toUpperCase();


    const body =
      document.createElement(
        'div'
      );


    body.className =
      'conversationBody';


    const name =
      document.createElement(
        'div'
      );


    name.className =
      'conversationName';


    name.textContent =
      username;


    const preview =
      document.createElement(
        'div'
      );


    preview.className =
      'conversationPreview';


    preview.textContent =
      phone;


    body.appendChild(
      name
    );


    body.appendChild(
      preview
    );


    row.appendChild(
      avatar
    );


    row.appendChild(
      body
    );


    row.addEventListener(
      'click',
      async () => {

        searchResults.innerHTML =
          '';


        searchInput.value =
          '';


        try {

          await startConversationWithUser(
            user
          );

        } catch (error) {

          console.error(
            'VOBIXCHAT START CONVERSATION:',
            error
          );


          showToast(
            error.message ||
            'No se pudo abrir la conversación'
          );

        }

      }
    );


    searchResults.appendChild(
      row
    );

  }

}


// ========================================================
// EJECUTAR BÚSQUEDA
// ========================================================

async function searchUsers() {

  const query =
    searchInput.value.trim();


  if (!query) {

    searchResults.innerHTML =
      '';

    return;

  }


  searchButton.disabled =
    true;


  try {

    const data =
      await requestJSON(

        '/api/chat/search?q=' +

        encodeURIComponent(
          query
        )

      );


    const users =
      normalizeSearchResults(
        data
      );


    renderSearchResults(
      users
    );

  } catch (error) {

    console.error(
      'VOBIXCHAT SEARCH:',
      error
    );


    showToast(
      error.message ||
      'No se pudo realizar la búsqueda'
    );

  } finally {

    searchButton.disabled =
      false;

  }

}


// ========================================================
// BOTÓN BUSCAR
// ========================================================

searchButton.addEventListener(
  'click',
  searchUsers
);


// ========================================================
// ENTER EN BUSCADOR
// ========================================================

searchInput.addEventListener(
  'keydown',
  event => {

    if (
      event.key ===
      'Enter'
    ) {

      event.preventDefault();

      searchUsers();

    }

  }
);


// ========================================================
// LIMPIAR RESULTADOS AL VACIAR BÚSQUEDA
// ========================================================

searchInput.addEventListener(
  'input',
  () => {

    if (
      !searchInput.value.trim()
    ) {

      searchResults.innerHTML =
        '';

    }

  }
);


// ========================================================
// ENCONTRAR CONVERSACIÓN EXISTENTE CON UN USUARIO
// ========================================================

function findConversationForUser(
  user
) {

  const targetUserId =
    getUserId(
      user
    );


  const targetUsername =
    getUsername(
      user
    );


  const targetPhone =
    getPhone(
      user
    );


  return conversations.find(
    conversation => {

      const other =

        conversation.other_user ||

        conversation.otherUser ||

        conversation.contact ||

        conversation.user ||

        null;


      const otherId =

        getUserId(
          other
        ) ||

        normalizeId(

          conversation.other_user_id ??

          conversation.otherUserId ??

          conversation.contact_id ??

          conversation.contactId ??

          ''

        );


      if (
        targetUserId &&
        otherId &&
        normalizeId(
          targetUserId
        ) ===
        normalizeId(
          otherId
        )
      ) {

        return true;

      }


      const otherUsername =

        getUsername(
          other
        ) ||

        String(

          conversation.other_username ??

          conversation.otherUsername ??

          conversation.contact_username ??

          conversation.contactUsername ??

          ''

        ).trim();


      if (
        targetUsername &&
        otherUsername &&
        targetUsername
          .toLowerCase() ===
        otherUsername
          .toLowerCase()
      ) {

        return true;

      }


      const otherPhone =

        getPhone(
          other
        ) ||

        String(

          conversation.other_phone ??

          conversation.otherPhone ??

          ''

        ).trim();


      if (
        targetPhone &&
        otherPhone &&
        targetPhone ===
        otherPhone
      ) {

        return true;

      }


      return false;

    }
  );

}


// ========================================================
// CREAR / ABRIR CONVERSACIÓN DESDE BÚSQUEDA
// ========================================================

async function startConversationWithUser(
  user
) {

  /*
    Primero comprobamos si ya existe.

    Así evitamos crear conversaciones duplicadas.
  */
  const existing =
    findConversationForUser(
      user
    );


  if (existing) {

    await openConversation(
      existing
    );

    return;

  }


  const userId =
    getUserId(
      user
    );


  if (!userId) {

    throw new Error(
      'El usuario seleccionado no tiene un ID válido'
    );

  }


  /*
    Creamos la conversación.
  */
  const data =
    await requestJSON(
      '/api/chat/conversations',
      {
        method:
          'POST',

        headers: {
          'Content-Type':
            'application/json'
        },

        body:
          JSON.stringify(
            {
              userId:
                userId,

              user_id:
                userId
            }
          )
      }
    );


  const conversation =

    data.conversation ??

    data.data ??

    data;


  const conversationId =
    getConversationId(
      conversation
    );


  if (!conversationId) {

    /*
      Si el servidor creó la conversación pero
      respondió con otro formato, recargamos la lista
      y buscamos nuevamente al usuario.
    */
    await loadConversations();


    const recovered =
      findConversationForUser(
        user
      );


    if (!recovered) {

      throw new Error(
        'La conversación fue creada pero no se pudo identificar'
      );

    }


    await openConversation(
      recovered
    );


    return;

  }


  /*
    Añadimos la conversación a memoria si todavía
    no existe.
  */
  const alreadyExists =
    conversations.some(
      item =>

        normalizeId(
          getConversationId(
            item
          )
        ) ===
        normalizeId(
          conversationId
        )
    );


  if (!alreadyExists) {

    conversations.unshift(
      conversation
    );

  }


  renderConversations();


  await openConversation(
    conversation
  );

}


// ========================================================
// OBTENER CONTENIDO PARA ENVIAR
// ========================================================

function getComposerText() {

  return messageInput
    .value
    .trim();

}


// ========================================================
// GENERAR ID TEMPORAL DEL CLIENTE
// ========================================================

function createClientMessageId() {

  if (
    window.crypto &&
    typeof window.crypto.randomUUID ===
      'function'
  ) {

    return window.crypto
      .randomUUID();

  }


  return (

    'client-' +
    Date.now() +
    '-' +
    Math.random()
      .toString(36)
      .slice(2)

  );

}


// ========================================================
// ENVIAR MENSAJE
//
// REGLA:
//
// El conversationId sale DIRECTAMENTE de
// activeConversationId.
//
// No se obtiene del nombre Emilio.
// No se obtiene del historial lateral.
// No se obtiene de message.id.
// ========================================================

async function sendMessage() {

  if (
    sendingMessage
  ) {

    return;

  }


  const text =
    getComposerText();


  if (!text) {
    return;
  }


  const conversationId =
    normalizeId(
      activeConversationId
    );


  if (!conversationId) {

    showToast(
      'Abre una conversación primero'
    );

    return;

  }


  /*
    Guardamos una copia por si el usuario escribe
    rápidamente otro mensaje.
  */
  const outgoingText =
    text;


  const clientMessageId =
    createClientMessageId();


  sendingMessage =
    true;


  sendButton.disabled =
    true;


  /*
    Limpiamos inmediatamente el compositor.
  */
  messageInput.value =
    '';


  messageInput.style.height =
    '38px';


  messageInput.focus();


  try {

    /*
      ======================================================
      ENVÍO PERSISTENTE
      ======================================================

      El backend guarda el mensaje y después lo publica
      mediante Socket.IO.

      No necesitamos recargar la sala después del POST.
    */
    const data =
      await requestJSON(

        '/api/chat/conversations/' +

        encodeURIComponent(
          conversationId
        ) +

        '/messages',

        {
          method:
            'POST',

          headers: {
            'Content-Type':
              'application/json'
          },

          body:
            JSON.stringify(
              {
                content:
                  outgoingText,

                text:
                  outgoingText,

                client_message_id:
                  clientMessageId,

                clientMessageId:
                  clientMessageId
              }
            )
        }

      );


    /*
      Si el backend devuelve el mensaje creado,
      podemos pintarlo inmediatamente.

      Si Socket.IO también lo devuelve después,
      message.id impedirá duplicarlo.
    */
    const created =

      data.message ??

      (
        data.data &&
        typeof data.data ===
          'object'
          ? data.data
          : null
      );


    if (
      created &&
      typeof created ===
        'object'
    ) {

      const normalized = {
        ...created
      };


      /*
        El POST se realizó explícitamente contra
        ESTA conversación, por lo que podemos asignar
        conversation_id con seguridad si la respuesta
        no lo repite.
      */
      if (
        !getMessageConversationId(
          normalized
        )
      ) {

        normalized.conversation_id =
          conversationId;

        normalized.conversationId =
          conversationId;

      }


      /*
        Solo pintamos si el usuario continúa viendo
        la misma conversación.
      */
      if (
        normalizeId(
          activeConversationId
        ) ===
        conversationId
      ) {

        renderMessage(
          normalized,
          {
            scroll:
              true
          }
        );

      }


      updateConversationPreview(
        normalized
      );

    }


    /*
      IMPORTANTE:

      NO hacemos:

      await loadMessages(...)

      después de enviar.

      Eso introduciría otra espera HTTP innecesaria.
    */

  } catch (error) {

    console.error(
      'VOBIXCHAT SEND:',
      error
    );


    /*
      Restauramos el texto para que el usuario
      no pierda lo que escribió.
    */
    if (
      !messageInput.value.trim()
    ) {

      messageInput.value =
        outgoingText;

    }


    showToast(
      error.message ||
      'No se pudo enviar el mensaje'
    );

  } finally {

    sendingMessage =
      false;


    sendButton.disabled =
      false;


    messageInput.focus();

  }

}


// ========================================================
// BOTÓN ENVIAR
// ========================================================

sendButton.addEventListener(
  'click',
  sendMessage
);


// ========================================================
// ENTER PARA ENVIAR
//
// Shift + Enter = nueva línea.
// ========================================================

messageInput.addEventListener(
  'keydown',
  event => {

    if (
      event.key ===
        'Enter' &&
      !event.shiftKey
    ) {

      event.preventDefault();

      sendMessage();

    }

  }
);


// ========================================================
// TYPING
// ========================================================

function emitTyping() {

  const conversationId =
    normalizeId(
      activeConversationId
    );


  if (
    !conversationId ||
    !socket.connected
  ) {

    return;

  }


  const now =
    Date.now();


  /*
    Evitamos inundar Socket.IO con un evento
    por cada tecla.
  */
  if (
    now -
      lastTypingSentAt <
    700
  ) {

    return;

  }


  lastTypingSentAt =
    now;


  socket.emit(
    'typing',
    {
      conversationId:
        conversationId,

      conversation_id:
        conversationId,

      username:
        getUsername(
          me
        )
    }
  );

}


// ========================================================
// DETECTAR ESCRITURA
// ========================================================

messageInput.addEventListener(
  'input',
  () => {

    emitTyping();

  }
);


// ========================================================
// RECIBIR TYPING
// ========================================================

socket.on(
  'typing',
  data => {

    if (!data) {
      return;
    }


    /*
      Igual que con los mensajes:
      typing debe pertenecer a la sala abierta.
    */
    const conversationId =
      normalizeId(

        data.conversation_id ??

        data.conversationId ??

        data.room_id ??

        data.roomId ??

        ''

      );


    if (
      !conversationId ||
      !activeConversationId ||
      conversationId !==
        normalizeId(
          activeConversationId
        )
    ) {

      return;

    }


    const username =

      data.username ||

      data.user_name ||

      '';


    /*
      No mostramos nuestro propio typing.
    */
    if (
      username &&
      getUsername(me) &&
      String(username)
        .toLowerCase() ===
      String(
        getUsername(me)
      ).toLowerCase()
    ) {

      return;

    }


    typing.textContent =
      username
        ? username + ' está escribiendo...'
        : 'Escribiendo...';


    clearTimeout(
      typingTimer
    );


    typingTimer =
      setTimeout(
        () => {

          typing.textContent =
            '';

        },
        1600
      );

  }
);


// ========================================================
// SOCKET CONECTADO
// ========================================================

socket.on(
  'connect',
  () => {

    console.log(
      'VOBIXCHAT SOCKET CONNECTED:',
      socket.id
    );


    /*
      En el bloque final identificaremos también
      la cuenta completa.

      Aquí lo importante es entrar inmediatamente
      en la conversación que ya estaba abierta.
    */
    if (
      activeConversationId
    ) {

      rejoinCurrentConversation();

    }


    if (
      activeConversationId
    ) {

      roomStatus.textContent =
        'Conversación privada';

    }

  }
);


// ========================================================
// SOCKET DESCONECTADO
// ========================================================

socket.on(
  'disconnect',
  reason => {

    console.warn(
      'VOBIXCHAT SOCKET DISCONNECTED:',
      reason
    );


    if (
      activeConversationId
    ) {

      roomStatus.textContent =
        'Reconectando…';

    }

  }
);


// ========================================================
// ERROR DE CONEXIÓN SOCKET
// ========================================================

socket.io.on(
  'reconnect_error',
  error => {

    console.warn(
      'VOBIXCHAT RECONNECT ERROR:',
      error
    );

  }
);


// ========================================================
// RECONEXIÓN SOCKET
// ========================================================

socket.io.on(
  'reconnect',
  attempt => {

    console.log(
      'VOBIXCHAT SOCKET RECONNECTED:',
      attempt
    );


    /*
      Recuperamos la MISMA sala mediante
      activeConversationId.
    */
    rejoinCurrentConversation();

  }
);


// ========================================================
// FIN BLOQUE 3
//
// PUNTO IMPORTANTE:
//
// sendMessage() también utiliza exclusivamente:
//
// activeConversationId
//
// Por tanto, tanto ENVÍO como RECEPCIÓN comparten
// la misma identidad de sala.
//
// BLOQUE 4:
// - estados online/offline;
// - delivered/read;
// - emojis;
// - adjuntos;
// - cámara/micrófono;
// - llamadas;
// - recuperación de conexión.
// ========================================================
// ========================================================
// ESTADO ONLINE DEL CONTACTO
// ========================================================

function socketUserMatchesCurrentContact(
  data
) {

  if (
    !data ||
    !currentConversation ||
    !activeConversationId
  ) {

    return false;

  }


  const other =

    currentConversation.other_user ||

    currentConversation.otherUser ||

    currentConversation.contact ||

    currentConversation.user ||

    null;


  const currentUserId =

    getUserId(
      other
    ) ||

    normalizeId(

      currentConversation.other_user_id ??

      currentConversation.otherUserId ??

      currentConversation.contact_id ??

      currentConversation.contactId ??

      ''

    );


  const incomingUserId =
    normalizeId(

      data.user_id ??

      data.userId ??

      (
        data.user
          ? getUserId(
              data.user
            )
          : ''
      )

    );


  /*
    La comparación por ID tiene prioridad.
  */
  if (
    currentUserId &&
    incomingUserId
  ) {

    return (
      normalizeId(
        currentUserId
      ) ===
      normalizeId(
        incomingUserId
      )
    );

  }


  /*
    Username queda únicamente como respaldo
    para el estado online.

    NO se utiliza para decidir dónde entra
    un mensaje.
  */
  const currentUsername =

    getUsername(
      other
    ) ||

    String(

      currentConversation.other_username ??

      currentConversation.otherUsername ??

      currentConversation.contact_username ??

      currentConversation.contactUsername ??

      ''

    ).trim();


  const incomingUsername =

    String(

      data.username ??

      data.user_name ??

      (
        data.user
          ? getUsername(
              data.user
            )
          : ''
      ) ??

      ''

    ).trim();


  if (
    currentUsername &&
    incomingUsername
  ) {

    return (
      currentUsername
        .toLowerCase() ===
      incomingUsername
        .toLowerCase()
    );

  }


  return false;

}

// USUARIO ONLINE

socket.on(

// ========================================================
// BUSCAR FILA DE MENSAJE POR ID
// ========================================================

function findRenderedMessage(
  messageId
) {

  const id =
    normalizeId(
      messageId
    );


  if (!id) {
    return null;
  }


  const rows =
    messages.querySelectorAll(
      '[data-message-id]'
    );


  for (
    const row
    of rows
  ) {

    if (
      normalizeId(
        row.dataset.messageId
      ) ===
      id
    ) {

      return row;

    }

  }


  return null;

}


// ========================================================
// MENSAJE ENTREGADO
// ========================================================

function markMessageDelivered(
  data
) {

  if (!data) {
    return;
  }


  const messageId =
    normalizeId(

      data.message_id ??

      data.messageId ??

      data.id ??

      ''

    );


  if (!messageId) {
    return;
  }


  const row =
    findRenderedMessage(
      messageId
    );


  if (!row) {
    return;
  }


  const ticks =
    row.querySelector(
      '.ticks'
    );


  if (ticks) {

    ticks.textContent =
      '✓✓';

  }

}


socket.on(
  'message:delivered',
  markMessageDelivered
);


socket.on(
  'message-delivered',
  markMessageDelivered
);

// ========================================================
// RECUPERACIÓN AL VOLVER INTERNET
//
// IMPORTANTE:
//
// PRIMERO recuperamos Socket.IO.
//
// Después sincronizamos PostgreSQL.
//
// El usuario no debe depender del GET para recibir
// los próximos mensajes.
// ========================================================

let onlineRecoveryRunning =
  false;


window.addEventListener(
  'online',
  async () => {

    if (
      onlineRecoveryRunning
    ) {

      return;

    }


    onlineRecoveryRunning =
      true;


    try {

      showToast(
        'Conexión recuperada'
      );


      /*
        Si Socket.IO no se reconectó todavía,
        solicitamos conexión.
      */
      if (
        !socket.connected
      ) {

        socket.connect();

      }


      /*
        La identidad de sala ya existe localmente.
      */
      rejoinCurrentConversation();


      /*
        Recuperamos conversaciones persistidas.
      */
      await loadConversations();


      /*
        Si continúa abierta una conversación,
        recuperamos cualquier mensaje producido
        durante la desconexión.
      */
      if (
        currentConversation &&
        activeConversationId
      ) {

        await loadMessages(
          currentConversation
        );

      }

    } catch (error) {

      console.warn(
        'VOBIXCHAT ONLINE RECOVERY:',
        error
      );

    } finally {

      onlineRecoveryRunning =
        false;

    }

  }
);

// ========================================================
// RECUPERACIÓN AL VOLVER DEL SEGUNDO PLANO
//
// Los navegadores móviles pueden suspender sockets
// cuando la aplicación queda en background.
// ========================================================

let pageHiddenAt =
  0;


let visibilityRecoveryRunning =
  false;


document.addEventListener(
  'visibilitychange',
  async () => {

    if (
      document.visibilityState ===
        'hidden'
    ) {

      pageHiddenAt =
        Date.now();

      return;

    }


    if (
      document.visibilityState !==
        'visible'
    ) {

      return;

    }


    if (
      visibilityRecoveryRunning
    ) {

      return;

    }


    /*
      Si apenas hubo un cambio instantáneo de
      visibilidad no necesitamos reconstruir nada.
    */
    const hiddenDuration =
      pageHiddenAt
        ? Date.now() -
          pageHiddenAt
        : 0;


    pageHiddenAt =
      0;


    /*
      SIEMPRE aseguramos primero la sala Socket.
    */
    if (
      socket.connected
    ) {

      rejoinCurrentConversation();

    }


    /*
      Solo hacemos sincronización HTTP si realmente
      estuvo fuera de primer plano.
    */
    if (
      hiddenDuration <
      1000
    ) {

      return;

    }


    visibilityRecoveryRunning =
      true;


    try {

      await loadConversations();


      if (
        currentConversation &&
        activeConversationId
      ) {

        await loadMessages(
          currentConversation
        );

      }

    } catch (error) {

      console.warn(
        'VOBIXCHAT VISIBILITY RECOVERY:',
        error
      );

    } finally {

      visibilityRecoveryRunning =
        false;

    }

  }
);

// ========================================================
// EVENTO DE ACTUALIZACIÓN DE CONVERSACIÓN
//
// Puede actualizar el historial lateral.
//
// NUNCA controla la aparición de una burbuja.
//
// Las burbujas entran por receiveSocketMessage().
// ========================================================

function handleConversationUpdate(
  data
) {

  if (
    !data ||
    typeof data !==
      'object'
  ) {

    scheduleConversationRefresh();

    return;

  }


  /*
    Aquí el objeto representa explícitamente
    una CONVERSACIÓN, por lo que getConversationId()
    sí puede utilizar data.id.
  */
  const conversationId =
    getConversationId(
      data
    );


  if (!conversationId) {

    scheduleConversationRefresh();

    return;

  }


  const id =
    normalizeId(
      conversationId
    );


  const index =
    conversations.findIndex(
      conversation =>

        normalizeId(
          getConversationId(
            conversation
          )
        ) ===
        id
    );


  if (
    index < 0
  ) {

    scheduleConversationRefresh();

    return;

  }


  const oldConversation =
    conversations[
      index
    ];


  conversations[
    index
  ] = {

    ...oldConversation,
    ...data

  };


  /*
    Si esta es la conversación abierta,
    actualizamos el objeto pero NO cambiamos
    activeConversationId.
  */
  if (
    id ===
    normalizeId(
      activeConversationId
    )
  ) {

    currentConversation =
      conversations[
        index
      ];


    const name =
      getConversationName(
        currentConversation
      );


    roomName.textContent =
      name;


    roomAvatar.textContent =
      String(
        name || 'V'
      )
        .charAt(0)
        .toUpperCase();

  }


  renderConversations();

}


socket.on(
  'conversation-updated',
  handleConversationUpdate
);


socket.on(
  'conversation:update',
  handleConversationUpdate
);

// ========================================================
// IDENTIFICAR USUARIO EN SOCKET.IO
// ========================================================

function identifySocketUser() {

  if (
    !socket.connected ||
    !me
  ) {

    return;

  }


  const userId =
    getUserId(
      me
    );


  const username =
    getUsername(
      me
    );


  const phone =
    getPhone(
      me
    );


  /*
    Mantenemos compatibilidad con el backend.

    La identificación del usuario NO determina
    activeConversationId.

    Son dos cosas diferentes:

    usuario conectado
        ≠
    conversación abierta
  */

  if (username) {

    socket.emit(
      'set-user',
      username
    );

  }


  socket.emit(
    'user-online',
    {

      userId:
        userId || null,

      user_id:
        userId || null,

      username:
        username || '',

      phone:
        phone || '',

      token:
        getToken()

    }
  );


  socket.emit(
    'user:online',
    {

      userId:
        userId || null,

      user_id:
        userId || null,

      username:
        username || '',

      phone:
        phone || '',

      token:
        getToken()

    }
  );

}

  if (!me) {

    myUsername.textContent =
      '@usuario';


    myAvatar.textContent =
      'V';


    return;

  }


  const username =

    getUsername(
      me

    getPhone(

  myUsername.textContent =

      .charAt(0)
      .toUpperCase() || 'V';

// ========================================================

// NO cambia activeConversationId basándose en
// mensajes recibidos.
// ========================================================

function synchronizeCurrentConversationObject() {

  if (!activeConversationId) {

    return;

  }


  const id =
    normalizeId(
      activeConversationId
    );


  const conversation =
    conversations.find(
      item =>

        normalizeId(
          getConversationId(
            item
          )
        ) ===
        id
    );


  if (!conversation) {

    return;

  }


  currentConversation =
    conversation;


  const name =
    getConversationName(
      conversation
    );


  roomName.textContent =
    name;


  roomAvatar.textContent =
    String(
      name || 'V'
    )
      .charAt(0)
      .toUpperCase();

}


// ========================================================
// RECUPERAR SALA DESPUÉS DE RECONEXIÓN
// ========================================================

let socketRecoveryRunning =
  false;


async function recoverSocketState() {

  if (
    socketRecoveryRunning
  ) {

    return;

  }


  socketRecoveryRunning =
    true;


  try {

    /*
      PRIMERO:
      identidad del usuario.
    */
    identifySocketUser();


    /*
      SEGUNDO:
      sala Socket.IO.

      No esperamos HTTP.
    */
    rejoinCurrentConversation();


    /*
      TERCERO:
      sincronización persistente.

      Esto solamente se utiliza como recuperación.
    */
    await loadConversations();


    synchronizeCurrentConversationObject();


    if (
      currentConversation &&
      activeConversationId
    ) {

      await loadMessages(
        currentConversation
      );

    }

  } catch (error) {

    console.warn(
      'VOBIXCHAT SOCKET RECOVERY:',
      error
    );

  } finally {

    socketRecoveryRunning =
      false;

  }

}


// ========================================================
// RECONEXIÓN REAL DE SOCKET.IO
// ========================================================

socket.io.on(
  'reconnect',
  () => {

    /*
      El navegador pudo perder mensajes mientras
      estuvo realmente desconectado.

      En este caso sí hacemos recuperación.
    */
    recoverSocketState();

  }
);


// ========================================================
// ACTUALIZAR ESTADO DE CONEXIÓN
// ========================================================

socket.on(
  'connect',
  () => {

    if (
      activeConversationId
    ) {

      roomStatus.textContent =
        'Conversación privada';

    }

  }
);


// ========================================================
// CONTROL DE MENSAJE ABIERTO
//
// Esta función se usa como verificación adicional.
//
// Si por cualquier evento el mensaje pertenece a
// activeConversationId, la prioridad es siempre
// mantenerlo dentro de #messages.
// ========================================================

function ensureRealtimeMessageVisible(
  rawMessage
) {

  const message =
    normalizeSocketMessage(
      rawMessage
    );


  if (!message) {

    return;

  }


  const conversationId =
    getMessageConversationId(
      message
    );


  if (
    !conversationId ||
    !activeConversationId
  ) {

    return;

  }


  if (
    normalizeId(
      conversationId
    ) !==
    normalizeId(
      activeConversationId
    )
  ) {

    return;

  }


  /*
    renderMessage() posee deduplicación.

    Por tanto esta comprobación adicional no puede
    producir dos burbujas del mismo message.id.
  */
  renderMessage(
    message,
    {
      scroll:
        true
    }
  );

}


// ========================================================
// RESPALDO DE VISIBILIDAD REALTIME
//
// receiveSocketMessage() continúa siendo el receptor
// principal.
//
// Estos listeners NO hacen HTTP.
//
// Su única misión es garantizar que si el backend
// emite cualquiera de estos eventos y pertenece a
// activeConversationId, la burbuja esté presente.
//
// La deduplicación evita repetirla.
// ========================================================

socket.on(
  'chat:message',
  ensureRealtimeMessageVisible
);


socket.on(
  'message:new',
  ensureRealtimeMessageVisible
);


socket.on(
  'conversation-message',
  ensureRealtimeMessageVisible
);


socket.on(
  'new-message',
  ensureRealtimeMessageVisible
);


socket.on(
  'new_message',
  ensureRealtimeMessageVisible
);


// ========================================================
// DIAGNÓSTICO REALTIME
//
// Si necesitamos revisar consola después de probar,
// este listener deja información suficiente para
// comparar:
//
// MESSAGE ROOM
//
// contra:
//
// ACTIVE ROOM
//
// SIN modificar la aplicación.
// ========================================================

function realtimeDiagnostic(
  payload,
  eventName
) {

  const message =
    normalizeSocketMessage(
      payload
    );


  if (!message) {
    return;
  }


  const messageConversationId =
    getMessageConversationId(
      message
    );


  console.log(
    'VOBIXCHAT REALTIME:',
    {

      event:
        eventName,

      messageId:
        getMessageId(
          message
        ),

      messageRoom:
        messageConversationId,

      activeRoom:
        normalizeId(
          activeConversationId
        ),

      sameRoom:
        (
          Boolean(
            messageConversationId
          ) &&
          normalizeId(
            messageConversationId
          ) ===
          normalizeId(
            activeConversationId
          )
        )

    }
  );

}


// ========================================================
// LOG CHAT:MESSAGE
// ========================================================

socket.on(
  'chat:message',
  payload => {

    realtimeDiagnostic(
      payload,
      'chat:message'
    );

  }
);


// ========================================================
// LOG MESSAGE:NEW
// ========================================================

socket.on(
  'message:new',
  payload => {

    realtimeDiagnostic(
      payload,
      'message:new'
    );

  }
);


// ========================================================
// LOG CONVERSATION-MESSAGE
// ========================================================

socket.on(
  'conversation-message',
  payload => {

    realtimeDiagnostic(
      payload,
      'conversation-message'
    );

  }
);


// ========================================================
// NO POLLING
//
// MUY IMPORTANTE:
//
// NO AGREGAR:
//
// setInterval(loadMessages, ...)
//
// La entrega normal debe ser:
//
// POST del remitente
//      ↓
// PostgreSQL
//      ↓
// Socket.IO del servidor
//      ↓
// navegador receptor
//      ↓
// receiveSocketMessage()
//      ↓
// conversation_id
//      ↓
// activeConversationId
//      ↓
// renderMessage()
//      ↓
// BURBUJA
//
// El GET del historial queda reservado para:
//
// - abrir conversación;
// - recuperar desconexión;
// - volver del segundo plano.
// ========================================================


// ========================================================
// ESTADO INICIAL DEL COMPOSITOR
// ========================================================

function initializeComposer() {

  messageInput.value =
    '';


  messageInput.style.height =
    '38px';


  sendButton.disabled =
    false;

}


// ========================================================
// ESTADO INICIAL DE LA SALA
// ========================================================

function initializeRoom() {

  activeConversationId =
    '';


  joinedConversationId =
    '';


  openingConversationId =
    '';


  currentConversation =
    null;


  emptyState.style.display =
    'flex';


  chatRoom.style.display =
    'none';


  app.classList.remove(
    'roomOpen'
  );


  messages.innerHTML =
    '';


  typing.textContent =
    '';

}


// ========================================================
// ESTADO INICIAL DE MENÚS
// ========================================================

function initializeMenus() {

  emojiPanel.classList.remove(
    'open'
  );


  attachMenu.classList.remove(
    'open'
  );

}


// ========================================================
// CARGA INICIAL
// ========================================================

async function initialLoad() {

  try {

    await loadConversations();

  } catch (error) {

    console.error(
      'VOBIXCHAT INITIAL LOAD:',
      error
    );


    showToast(
      error.message ||
      'No se pudieron cargar las conversaciones'
    );

  }

}


// ========================================================
// INICIAR VOBIXCHAT
// ========================================================

async function initVobixChat() {

  console.log(
    '======================================'
  );


  console.log(
    'VOBIXCHAT INICIANDO'
  );


  console.log(
    'Realtime room routing enabled'
  );


  console.log(
    '======================================'
  );


  initializeRoom();


  initializeComposer();


  initializeMenus();


  renderLocalProfile();


  checkSession();


  /*
    Cargamos el historial lateral inicial.

    Esto NO abre ninguna sala automáticamente.
  */
  await initialLoad();


  /*
    Si Socket.IO ya estaba conectado cuando terminó
    la petición HTTP, identificamos al usuario.
  */
  if (
    socket.connected
  ) {

    identifySocketUser();

  }


  if (
    !navigator.onLine
  ) {

    showToast(
      'Sin conexión a Internet'
    );

  }


  console.log(
    'VOBIXCHAT LISTO'
  );

}


// ========================================================
// LIMPIEZA AL SALIR
// ========================================================

window.addEventListener(
  'beforeunload',
  () => {

    clearTimeout(
      typingTimer
    );


    clearTimeout(
      toastTimer
    );


    clearTimeout(
      conversationRefreshTimer
    );

  }
);


// ========================================================
// ARRANQUE ÚNICO
// ========================================================

initVobixChat();


// ========================================================
// RESUMEN DE LA REPARACIÓN
//
// EXISTEN DOS IDs DIFERENTES:
//
// 1.
//
// message.id
//
// Es exclusivamente:
// ID DEL MENSAJE.
//
// Sirve para:
// - evitar duplicados;
// - ticks;
// - delivered;
// - read.
//
// JAMÁS decide la sala.
//
// --------------------------------------------------------
//
// 2.
//
// message.conversation_id
//
// Es exclusivamente:
// ID DE LA CONVERSACIÓN.
//
// Se compara contra:
//
// activeConversationId
//
// --------------------------------------------------------
//
// EJEMPLO:
//
// Emilio abierto:
//
// activeConversationId = "42"
//
// llega:
//
// {
//   id: 901,
//   conversation_id: 42,
//   content: "Hola"
// }
//
// comparación:
//
// "42" === "42"
//
// resultado:
//
// renderMessage(message)
//
// INMEDIATAMENTE.
//
// --------------------------------------------------------
//
// DESPUÉS:
//
// updateConversationPreview(message)
//
// De esta manera el preview "Hola" puede aparecer
// debajo de Emilio, PERO no puede quedarse atrapado
// allí esperando otro click.
//
// --------------------------------------------------------
//
// EL CLICK SOBRE EMILIO YA NO ES EL MECANISMO
// QUE LIBERA UN MENSAJE.
//
// El click solamente:
//
// - abre la conversación;
// - establece activeConversationId;
// - entra en la sala Socket.IO;
// - descarga historial inicial.
//
// Después de eso:
//
// TODOS LOS MENSAJES NUEVOS DE ESA CONVERSACIÓN
// DEBEN ENTRAR DIRECTAMENTE POR SOCKET.IO.
// ========================================================

</script>
