<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width,initial-scale=1,viewport-fit=cover"
  >

  <meta name="theme-color" content="#071009">

  <title>VOBIXCHAT</title>

  <script src="/socket.io/socket.io.js"></script>

  <style>

    * {
      box-sizing: border-box;
    }

    :root {
      --green: #68ff72;
      --green2: #39db5b;
      --bg: #071009;
      --panel: #0b160d;
      --panel2: #101d13;
      --border: rgba(104,255,114,.18);
      --text: #f1fff3;
      --muted: #8da891;
      --bubble: #15251a;
      --bubbleMe: #155d35;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: var(--bg);
      color: var(--text);
      font-family:
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
    }

    button,
    input {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    .app {
      display: flex;
      width: 100%;
      height: 100dvh;

      background:
        radial-gradient(
          circle at 25% 10%,
          rgba(67,255,99,.08),
          transparent 30%
        ),
        var(--bg);
    }


    /* =====================================================
       SIDEBAR
    ===================================================== */

    .sidebar {
      width: 350px;
      min-width: 350px;

      display: flex;
      flex-direction: column;

      border-right:
        1px solid var(--border);

      background:
        rgba(6,20,9,.96);
    }

    .profile {
      min-height: 78px;

      display: flex;
      align-items: center;

      gap: 12px;

      padding: 14px 16px;

      border-bottom:
        1px solid var(--border);
    }

    .logo {
      width: 48px;
      height: 48px;

      border-radius: 15px;

      display: grid;
      place-items: center;

      background: var(--green);
      color: #061008;

      font-size: 25px;
      font-weight: 1000;

      box-shadow:
        0 0 25px
        rgba(104,255,114,.22);
    }

    .profileInfo {
      flex: 1;
      min-width: 0;
    }

    .brand {
      font-size: 16px;
      font-weight: 1000;
    }

    .username {
      margin-top: 3px;

      color: var(--green);

      font-size: 12px;

      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .avatar {
      width: 42px;
      height: 42px;

      min-width: 42px;

      border-radius: 50%;

      display: grid;
      place-items: center;

      background: #14291a;

      color: var(--green);

      border:
        1px solid var(--border);

      font-weight: 900;
    }


    /* =====================================================
       BUSCADOR
    ===================================================== */

    .searchArea {
      padding: 14px;

      border-bottom:
        1px solid var(--border);
    }

    .searchBox {
      display: flex;
      gap: 8px;
    }

    .searchBox input {
      width: 100%;
      min-width: 0;

      padding: 13px 14px;

      border-radius: 14px;

      border:
        1px solid var(--border);

      outline: none;

      color: white;

      background: #0e1a11;
    }

    .searchBox input:focus {
      border-color: var(--green);
    }

    .searchButton {
      width: 50px;
      min-width: 50px;

      border: 0;

      border-radius: 14px;

      background: var(--green);

      color: #071009;

      font-size: 20px;
      font-weight: 900;
    }

    .searchHelp {
      margin-top: 8px;

      color: var(--muted);

      font-size: 11px;
    }

    .searchResults {
      border-bottom:
        1px solid var(--border);
    }


    /* =====================================================
       CONVERSACIONES
    ===================================================== */

    .sectionTitle {
      padding: 14px 16px 8px;

      display: flex;

      justify-content:
        space-between;

      color: #d7ffda;

      font-size: 12px;

      font-weight: 900;

      letter-spacing: 1px;
    }

    .conversations {
      flex: 1;

      overflow-y: auto;
    }

    .conversation {
      display: flex;

      align-items: center;

      gap: 11px;

      padding: 12px 14px;

      cursor: pointer;

      border-bottom:
        1px solid
        rgba(104,255,114,.07);
    }

    .conversation:hover {
      background:
        rgba(104,255,114,.05);
    }

    .conversation.active {
      background:
        rgba(104,255,114,.10);
    }

    .conversationBody {
      flex: 1;
      min-width: 0;
    }

    .conversationName {
      font-weight: 800;
      font-size: 14px;

      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .conversationPreview {
      margin-top: 3px;

      color: var(--muted);

      font-size: 11px;

      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }


    /* =====================================================
       CHAT
    ===================================================== */

    .chat {
      flex: 1;

      min-width: 0;

      display: flex;

      flex-direction: column;

      position: relative;
    }

    .empty {
      flex: 1;

      display: grid;

      place-items: center;

      text-align: center;

      padding: 30px;
    }

    .emptyLogo {
      width: 86px;
      height: 86px;

      margin: auto;

      border-radius: 25px;

      display: grid;
      place-items: center;

      background: var(--green);

      color: #071009;

      font-size: 46px;

      font-weight: 1000;

      box-shadow:
        0 0 40px
        rgba(104,255,114,.18);
    }

    .empty h1 {
      margin:
        18px 0 8px;

      font-size: 27px;
    }

    .empty p {
      color: var(--muted);
    }

    .chatRoom {
      display: none;

      flex: 1;

      min-height: 0;

      flex-direction: column;
    }


    /* =====================================================
       CABECERA SALA
    ===================================================== */

    .chatHeader {
      min-height: 72px;

      display: flex;

      align-items: center;

      gap: 12px;

      padding: 10px 16px;

      border-bottom:
        1px solid var(--border);

      background:
        rgba(8,19,10,.98);
    }

    .backButton {
      display: none;
    }

    .chatUser {
      flex: 1;
      min-width: 0;
    }

    .chatName {
      font-weight: 900;

      overflow: hidden;

      text-overflow: ellipsis;

      white-space: nowrap;
    }

    .chatStatus {
      margin-top: 2px;

      color: var(--green);

      font-size: 11px;
    }

    .headerActions {
      display: flex;

      align-items: center;

      gap: 4px;
    }

    .iconButton {
      width: 42px;
      height: 42px;

      display: grid;

      place-items: center;

      border: 0;

      border-radius: 50%;

      background: transparent;

      color: #dfffe2;

      font-size: 19px;
    }

    .iconButton:hover {
      background:
        rgba(104,255,114,.10);

      color: var(--green);
    }


    /* =====================================================
       MENSAJES
    ===================================================== */

    .messages {
      flex: 1;

      min-height: 0;

      overflow-y: auto;

      padding: 18px;

      background:
        radial-gradient(
          circle at 70% 10%,
          rgba(104,255,114,.04),
          transparent 30%
        );
    }

    .messageRow {
      display: flex;

      margin: 5px 0;
    }

    .messageRow.me {
      justify-content: flex-end;
    }

    .bubble {
      max-width:
        min(72%,650px);

      padding:
        8px 11px 6px;

      border-radius: 12px;

      background:
        var(--bubble);

      border:
        1px solid
        rgba(255,255,255,.04);

      word-break: break-word;
    }

    .messageRow.me .bubble {
      background:
        var(--bubbleMe);
    }

    .messageSender {
      margin-bottom: 3px;

      color: var(--green);

      font-size: 10px;

      font-weight: 800;
    }

    .messageText {
      font-size: 14px;

      line-height: 1.4;
    }

    .messageMeta {
      margin-top: 3px;

      display: flex;

      justify-content: flex-end;

      gap: 5px;

      color:
        rgba(255,255,255,.62);

      font-size: 9px;
    }

    .ticks {
      color: #76dfff;
    }


    /* =====================================================
       ESCRIBIENDO
    ===================================================== */

    .typing {
      min-height: 20px;

      padding: 2px 18px;

      color: var(--green);

      font-size: 11px;

      background: #08130a;
    }


    /* =====================================================
       COMPOSER
    ===================================================== */

    .composer {
      position: relative;

      display: flex;

      align-items: center;

      gap: 5px;

      padding:
        9px
        10px
        calc(9px + env(safe-area-inset-bottom));

      border-top:
        1px solid var(--border);

      background: #08130a;
    }

    .composerInput {
      flex: 1;

      min-width: 0;

      height: 46px;

      padding: 0 15px;

      border-radius: 23px;

      border:
        1px solid var(--border);

      outline: none;

      background: #122016;

      color: white;
    }

    .composerInput:focus {
      border-color:
        rgba(104,255,114,.55);
    }

    .composerButton {
      width: 44px;
      height: 44px;

      min-width: 44px;

      display: grid;

      place-items: center;

      border: 0;

      border-radius: 50%;

      background: transparent;

      color: #d8ffdc;

      font-size: 20px;
    }

    .composerButton:hover {
      background:
        rgba(104,255,114,.09);

      color: var(--green);
    }

    .sendButton {
      background: var(--green);

      color: #071009;

      font-weight: 1000;
    }


    /* =====================================================
       EMOJIS
    ===================================================== */

    .emojiPanel {
      position: absolute;

      display: none;

      left: 10px;

      bottom: 68px;

      width: 285px;

      padding: 12px;

      grid-template-columns:
        repeat(7,1fr);

      gap: 6px;

      border:
        1px solid var(--border);

      border-radius: 16px;

      background: #101c13;

      box-shadow:
        0 15px 50px
        rgba(0,0,0,.45);

      z-index: 50;
    }

    .emojiPanel.open {
      display: grid;
    }

    .emoji {
      border: 0;

      padding: 5px;

      border-radius: 8px;

      background: transparent;

      font-size: 21px;
    }


    /* =====================================================
       ADJUNTOS
    ===================================================== */

    .attachMenu {
      position: absolute;

      display: none;

      left: 58px;

      bottom: 68px;

      width: 210px;

      padding: 8px;

      border-radius: 16px;

      border:
        1px solid var(--border);

      background: #101c13;

      box-shadow:
        0 15px 50px
        rgba(0,0,0,.45);

      z-index: 51;
    }

    .attachMenu.open {
      display: block;
    }

    .attachOption {
      width: 100%;

      display: flex;

      align-items: center;

      gap: 10px;

      padding: 11px;

      border: 0;

      border-radius: 10px;

      background: transparent;

      color: white;

      text-align: left;
    }

    .attachOption:hover {
      background:
        rgba(104,255,114,.08);
    }


    /* =====================================================
       TOAST
    ===================================================== */

    .toast {
      position: fixed;

      left: 50%;

      bottom: 90px;

      transform:
        translateX(-50%)
        translateY(20px);

      padding: 11px 17px;

      border:
        1px solid var(--border);

      border-radius: 30px;

      background: #122016;

      color: white;

      opacity: 0;

      pointer-events: none;

      transition: .2s;

      z-index: 1000;
    }

    .toast.show {
      opacity: 1;

      transform:
        translateX(-50%)
        translateY(0);
    }


    /* =====================================================
       MÓVIL
    ===================================================== */

    @media(max-width:720px) {

      .sidebar {
        width: 100%;
        min-width: 100%;
      }

      .chat {
        display: none;
        width: 100%;
      }

      .app.roomOpen .sidebar {
        display: none;
      }

      .app.roomOpen .chat {
        display: flex;
      }

      .backButton {
        display: grid;
      }

      .bubble {
        max-width: 84%;
      }

      .messages {
        padding: 12px 9px;
      }

      .chatHeader {
        padding:
          8px 6px;
      }

      .iconButton {
        width: 38px;
        height: 38px;
      }

      .composer {
        gap: 2px;

        padding-left: 4px;
        padding-right: 4px;
      }

      .composerButton {
        width: 39px;
        min-width: 39px;
      }

      .emojiPanel {
        left: 7px;

        width:
          calc(100% - 14px);
      }

    }

  </style>
</head>


<body>


<div
  class="app"
  id="app"
>


  <!-- ===================================================
       SIDEBAR
  ==================================================== -->

  <aside class="sidebar">


    <div class="profile">


      <div class="logo">
        V
      </div>


      <div class="profileInfo">

        <div class="brand">
          VOBIXCHAT
        </div>

        <div
          class="username"
          id="myUsername"
        >
          @
        </div>

      </div>


      <div
        class="avatar"
        id="myAvatar"
      >
        V
      </div>

    </div>


    <!-- BUSCADOR -->

    <div class="searchArea">


      <div class="searchBox">


        <input
          id="searchInput"
          autocomplete="off"
          placeholder="Buscar usuario o teléfono"
        >


        <button
          class="searchButton"
          id="searchButton"
          type="button"
        >
          ⌕
        </button>


      </div>


      <div class="searchHelp">
        Busca por nombre o número de teléfono.
      </div>


    </div>


    <div
      class="searchResults"
      id="searchResults"
    ></div>


    <div class="sectionTitle">

      <span>
        CONVERSACIONES
      </span>

      <span
        id="conversationCount"
      >
        0
      </span>

    </div>


    <div
      class="conversations"
      id="conversationList"
    ></div>


  </aside>


  <!-- ===================================================
       CHAT
  ==================================================== -->

  <main class="chat">


    <section
      class="empty"
      id="emptyState"
    >

      <div>

        <div class="emptyLogo">
          V
        </div>

        <h1>
          VOBIXCHAT
        </h1>

        <p>
          Selecciona una conversación o busca una persona.
        </p>

        <p>
          Tus conversaciones se mantienen en salas privadas.
        </p>

      </div>

    </section>


    <!-- =================================================
         SALA
    ================================================== -->

    <section
      class="chatRoom"
      id="chatRoom"
    >


      <header class="chatHeader">


        <button
          class="iconButton backButton"
          id="backButton"
          type="button"
        >
          ←
        </button>


        <div
          class="avatar"
          id="roomAvatar"
        >
          V
        </div>


        <div class="chatUser">

          <div
            class="chatName"
            id="roomName"
          ></div>

          <div
            class="chatStatus"
            id="roomStatus"
          >
            Conversación privada
          </div>

        </div>


        <div class="headerActions">


          <button
            class="iconButton"
            id="voiceCallButton"
            title="Llamada de voz"
            type="button"
          >
            ☎
          </button>


          <button
            class="iconButton"
            id="videoCallButton"
            title="Videollamada"
            type="button"
          >
            🎥
          </button>


          <button
            class="iconButton"
            id="moreButton"
            title="Opciones"
            type="button"
          >
            ⋮
          </button>


        </div>


      </header>


      <div
        class="messages"
        id="messages"
      ></div>


      <div
        class="typing"
        id="typing"
      ></div>


      <!-- ===============================================
           ESCRITURA
      ================================================ -->

      <div class="composer">


        <button
          class="composerButton"
          id="emojiButton"
          type="button"
          title="Emojis"
        >
          😊
        </button>


        <button
          class="composerButton"
          id="attachButton"
          type="button"
          title="Adjuntar"
        >
          📎
        </button>


        <input
          class="composerInput"
          id="messageInput"
          autocomplete="off"
          placeholder="Escribe un mensaje..."
        >


        <button
          class="composerButton"
          id="cameraButton"
          type="button"
          title="Cámara"
        >
          📷
        </button>


        <button
          class="composerButton"
          id="audioButton"
          type="button"
          title="Nota de voz"
        >
          🎤
        </button>


        <button
          class="composerButton sendButton"
          id="sendButton"
          type="button"
          title="Enviar"
        >
          ➤
        </button>


        <!-- EMOJIS -->

        <div
          class="emojiPanel"
          id="emojiPanel"
        >

          <button class="emoji">😀</button>
          <button class="emoji">😂</button>
          <button class="emoji">😍</button>
          <button class="emoji">🥰</button>
          <button class="emoji">😎</button>
          <button class="emoji">🤔</button>
          <button class="emoji">😢</button>

          <button class="emoji">😭</button>
          <button class="emoji">😡</button>
          <button class="emoji">👍</button>
          <button class="emoji">👎</button>
          <button class="emoji">👏</button>
          <button class="emoji">🙏</button>
          <button class="emoji">💪</button>

          <button class="emoji">❤️</button>
          <button class="emoji">💚</button>
          <button class="emoji">🔥</button>
          <button class="emoji">🎉</button>
          <button class="emoji">✅</button>
          <button class="emoji">💯</button>
          <button class="emoji">🚀</button>

        </div>


        <!-- ADJUNTOS -->

        <div
          class="attachMenu"
          id="attachMenu"
        >

          <button
            class="attachOption"
            id="photoOption"
            type="button"
          >
            🖼️ Foto o vídeo
          </button>


          <button
            class="attachOption"
            id="documentOption"
            type="button"
          >
            📄 Documento
          </button>


          <button
            class="attachOption"
            id="cameraOption"
            type="button"
          >
            📷 Cámara
          </button>


        </div>


      </div>


      <input
        type="file"
        id="mediaInput"
        accept="image/*,video/*"
        hidden
      >


      <input
        type="file"
        id="documentInput"
        hidden
      >


      <input
        type="file"
        id="cameraInput"
        accept="image/*,video/*"
        capture="environment"
        hidden
      >


    </section>


  </main>


</div>


<div
  class="toast"
  id="toast"
></div>


<script>

'use strict';


// ========================================================
// SOCKET — AUTENTICADO DESDE EL HANDSHAKE
// ========================================================

const VOBIX_TOKEN =
  localStorage.getItem('vobix_token') ||
  localStorage.getItem('token') ||
  '';

const socket = io({
  auth: {
    token: VOBIX_TOKEN
  },
  transports: ['websocket', 'polling'],
  reconnection: true,
  reconnectionAttempts: Infinity
});


// ========================================================
// ELEMENTOS
// ========================================================

const app =
  document.getElementById('app');

const myUsername =
  document.getElementById('myUsername');

const myAvatar =
  document.getElementById('myAvatar');

const searchInput =
  document.getElementById('searchInput');

const searchButton =
  document.getElementById('searchButton');

const searchResults =
  document.getElementById('searchResults');

const conversationList =
  document.getElementById('conversationList');

const conversationCount =
  document.getElementById('conversationCount');

const emptyState =
  document.getElementById('emptyState');

const chatRoom =
  document.getElementById('chatRoom');

const roomAvatar =
  document.getElementById('roomAvatar');

const roomName =
  document.getElementById('roomName');

const roomStatus =
  document.getElementById('roomStatus');

const messages =
  document.getElementById('messages');

const typing =
  document.getElementById('typing');

const messageInput =
  document.getElementById('messageInput');

const sendButton =
  document.getElementById('sendButton');

const backButton =
  document.getElementById('backButton');

const emojiButton =
  document.getElementById('emojiButton');

const emojiPanel =
  document.getElementById('emojiPanel');

const attachButton =
  document.getElementById('attachButton');

const attachMenu =
  document.getElementById('attachMenu');

const cameraButton =
  document.getElementById('cameraButton');

const audioButton =
  document.getElementById('audioButton');

const voiceCallButton =
  document.getElementById('voiceCallButton');

const videoCallButton =
  document.getElementById('videoCallButton');

const moreButton =
  document.getElementById('moreButton');

const mediaInput =
  document.getElementById('mediaInput');

const documentInput =
  document.getElementById('documentInput');

const cameraInput =
  document.getElementById('cameraInput');

const toast =
  document.getElementById('toast');


// ========================================================
// ESTADO
// ========================================================

let currentConversation = null;

let conversations = [];

let typingTimer = null;

// Cache local de nombres reales por ID de conversación/usuario.
// Evita que una recarga convierta contactos conocidos en "Usuario"/"Contacto"
// cuando el backend devuelve temporalmente una respuesta incompleta.
const contactNameCache = (() => {
  try { return JSON.parse(localStorage.getItem('vobix_contact_names') || '{}') || {}; }
  catch (_) { return {}; }
})();

function saveContactName(key, name) {
  if (key == null || !name || String(name).trim().toLowerCase() === 'usuario') return;
  contactNameCache[String(key)] = String(name).trim();
  try { localStorage.setItem('vobix_contact_names', JSON.stringify(contactNameCache)); } catch (_) {}
}

function cachedContactName(key) {
  return key == null ? '' : (contactNameCache[String(key)] || '');
}



// ========================================================
// USUARIO LOCAL
// ========================================================

function getLocalUser() {

  try {

    const raw =
      localStorage.getItem(
        'vobix_user'
      );

    if (!raw) {
      return null;
    }


    /*
    --------------------------------------------------------
    Compatibilidad:

    Algunas versiones antiguas guardaron:

    vobix_user = "SHNEYDER"

    Otras:

    {
      username:"SHNEYDER",
      phone:"+..."
    }

    --------------------------------------------------------
    */

    try {

      const parsed =
        JSON.parse(raw);

      if (
        parsed &&
        typeof parsed === 'object'
              ) {

        return parsed;

      }

      if (
        typeof parsed === 'string'
      ) {

        return {
          username: parsed
        };

      }

    } catch (error) {

      return {
        username: raw
      };

// ========================================================
// NOMBRE REAL
//
// Esta función corrige el problema "Usuario".
//
// Busca el nombre en todos los formatos que puede estar
// devolviendo VOBIXCHAT actualmente.
// ========================================================

function getUsername(data) {

  if (!data) {
    return '';
  }


  if (
    typeof data === 'string'
  ) {

    const value =
      data.trim();

    if (
      value &&
      value.toLowerCase() !==
      'usuario'
    ) {

      return value;

    }

    return '';

  }


  const directCandidates = [

    data.username,

    data.user_name,

    data.name,

    data.display_name,

    data.displayName,

    data.other_username,

    data.otherUsername,

    data.contact_username,

    data.contactUsername,

    data.participant_username,

    data.participantUsername,

    data.target_username,

    data.targetUsername

  ];


  for (
    const candidate
    of directCandidates
  ) {

    if (
      typeof candidate === 'string'
    ) {

      const value =
        candidate.trim();

      if (
        value &&
        value.toLowerCase() !==
        'usuario'
      ) {

        return value;

      }

    }

  }


  const nestedCandidates = [

    data.other_user,

    data.otherUser,

    data.user,

    data.contact,

    data.participant,

    data.target,

    data.profile

  ];


  for (
    const nested
    of nestedCandidates
  ) {

    const value =
      getUsername(nested);

    if (value) {
      return value;
    }

  }


  return '';

}


// ========================================================
// TELÉFONO
// ========================================================

function getPhone(data) {

  if (!data) {
    return '';
  }

  return (

    data.phone ||

    data.phone_number ||

    data.phoneNumber ||

    data.other_phone ||

    data.otherPhone ||

    (
      data.other_user &&
      getPhone(data.other_user)
    ) ||

    (
      data.otherUser &&
      getPhone(data.otherUser)
    ) ||

    (
      data.user &&
      getPhone(data.user)
    ) ||

    ''

  );

}


// ========================================================
// ID USUARIO
// ========================================================

function getUserId(data) {

  if (!data) {
    return null;
  }


  return (

    data.user_id ||

    data.userId ||

    data.other_user_id ||

    data.otherUserId ||

    data.contact_user_id ||

    data.contactUserId ||

    (
      data.other_user &&
      getUserId(data.other_user)
    ) ||

    (
      data.otherUser &&
      getUserId(data.otherUser)
    ) ||

    data.id ||

    null

  );

}


// ========================================================
// NOMBRE DE CONVERSACIÓN
// ========================================================

function getConversationName(
  conversation
) {

  if (!conversation) {
    return '';
  }


  /*
    Primero buscamos específicamente
    el otro participante.
  */

  const nested = [

    conversation.other_user,

    conversation.otherUser,

    conversation.contact,

    conversation.participant,

    conversation.user

  ];


  for (
    const item
    of nested
  ) {

    const name =
      getUsername(item);

    if (name) {
      return name;
    }

  }


  /*
    Después campos directos devueltos
    por SQL/API.
  */

  const direct = [

    conversation.other_username,

    conversation.otherUsername,

    conversation.contact_username,

    conversation.contactUsername,

    conversation.participant_username,

    conversation.participantUsername,

    conversation.username,

    conversation.user_name,

    conversation.name

  ];


  for (
    const value
    of direct
  ) {

    if (
      typeof value === 'string' &&
      value.trim() &&
      value.trim().toLowerCase()
        !== 'usuario'
    ) {

      return value.trim();

    }

  }


  /*
    En grupos sí puede usarse title.
  */

  if (
    conversation.type === 'group' &&
    conversation.title
  ) {

    return conversation.title;

  }


  /*
    IMPORTANTE:

    No ponemos "Usuario".

    Si el backend no envía el username,
    mostramos el teléfono o "Contacto"
    para poder detectar el problema real.
  */

  const conversationId =
    conversation.id ||
    conversation.conversation_id ||
    conversation.conversationId;

  const otherUserId = getUserId(
    conversation.other_user ||
    conversation.otherUser ||
    conversation.contact ||
    conversation.participant ||
    null
  );

  const cached =
    cachedContactName('c:' + conversationId) ||
    cachedContactName('u:' + otherUserId);

  if (cached) {
    return cached;
  }

  const phone =
    getPhone(conversation);

  if (phone) {
    return phone;
  }

  return 'Contacto';

}

// ========================================================
// REQUEST
// ========================================================

async function requestJSON(
  url,
  options = {}
) {

  const response =
    await fetch(
      url,
      options
    );


  let data = {};


  try {

    data =
      await response.json();

  } catch (error) {}


  if (!response.ok) {

    throw new Error(

      data.message ||

      data.msg ||

      data.error ||

      'Error del servidor'

    );

  }


  return data;

}

// ========================================================
// CREAR CONVERSACIÓN
// ========================================================

async function createConversation(
  user
) {

  try {

    const targetUserId =
      getUserId(user);


    if (!targetUserId) {

      showToast(
        'No encontramos el ID de este contacto'
      );

      return;

    }


    const data =
      await requestJSON(

        '/api/chat/conversations/private',

        {

          method: 'POST',

          headers: {

            'Content-Type':
              'application/json'

          },

          body:
            JSON.stringify({

              userId:
                targetUserId,

              targetUserId:
                targetUserId

            })

        }

      );


    const conversation =
      data.conversation ||
      data;


    /*
    --------------------------------------------------------
    MUY IMPORTANTE

    Conservamos el usuario real encontrado.

    Así aunque la respuesta de creación de conversación
    todavía no incluya username, NO perdemos "Flor".
    --------------------------------------------------------
    */

    if (
      !conversation.other_user &&
      !conversation.otherUser
    ) {

      conversation.other_user =
        user;

    }


    await loadConversations();


    /*
    --------------------------------------------------------
    Buscamos la conversación recargada.

    Si el backend ya devuelve el nombre correctamente,
    usamos esa.

    Si no, mantenemos el usuario encontrado.
    --------------------------------------------------------
    */

    const conversationId =
      conversation.id ||
      conversation.conversation_id ||
      conversation.conversationId;

    const realTargetName =
      getUsername(user) ||
      getPhone(user);

    if (realTargetName) {

      saveContactName(
        'c:' + conversationId,
        realTargetName
      );

      saveContactName(
        'u:' + targetUserId,
        realTargetName
      );

    }


    const refreshed =
      conversations.find(
        item => {

          const id =
            item.id ||
            item.conversation_id ||
            item.conversationId;

          return (
            String(id) ===
            String(conversationId)
          );

        }
      );


    if (refreshed) {

      const refreshedName =
        getConversationName(
          refreshed
        );


      if (
        refreshedName ===
        'Contacto'
      ) {

        refreshed.other_user =
          user;

      }


      await openConversation(
        refreshed
      );

    } else {

      await openConversation(
        conversation
      );

    }


    searchResults.innerHTML = '';

    searchInput.value = '';


  } catch (error) {

    console.error(
      'VOBIXCHAT CREATE CONVERSATION:',
      error
    );


    showToast(

      error.message ||

      'No se pudo abrir la conversación'

    );

  }

}

// ========================================================
// SABER SI EL MENSAJE ES MÍO
// ========================================================

function isMyMessage(
  message
) {

  if (!message) {
    return false;
  }


  if (
    message.mine === true ||
    message.is_mine === true ||
    message.isMine === true
  ) {

    return true;

  }


  const senderId =
    getMessageSenderId(
      message
    );


  const myId =
    getUserId(me);


  if (
    senderId != null &&
    myId != null
  ) {

    return (
      String(senderId) ===
      String(myId)
    );

  }


  const senderName =
    getUsername(
      message.sender ||
      message.user ||
      message
    );


  const myName =
    getUsername(me);


  if (
    senderName &&
    myName
  ) {

    return (
      senderName.toLowerCase() ===
      myName.toLowerCase()
    );

  }


  return false;

}


// ========================================================
// HORA DEL MENSAJE
// ========================================================

function getMessageTime(
  message
) {

  const raw =

    message.created_at ||

    message.createdAt ||

    message.timestamp ||

    message.sent_at ||

    message.sentAt ||

    null;


  if (!raw) {
    return '';
  }


  const date =
    new Date(raw);


  if (
    Number.isNaN(
      date.getTime()
    )
  ) {

    return '';

  }


  return date.toLocaleTimeString(
    [],
    {

      hour:
        '2-digit',

      minute:
        '2-digit'

    }
  );

}


// ========================================================
// RENDERIZAR MENSAJE
// ========================================================

function renderMessage(
  message
) {

  if (!message) {
    return;
  }


  const text =
    getMessageText(
      message
    );


  if (!text) {
    return;
  }


  /*
    Evitamos pintar dos veces el mismo mensaje
    cuando el servidor emite simultáneamente:

      chat:message
      message:new

    Ambos eventos pueden contener el mismo ID.
  */

  const messageId =
    message.id ||
    message.message_id ||
    message.messageId ||
    null;


  if (messageId != null) {

    const existing =
      messages.querySelector(
        '[data-message-id="' +
        CSS.escape(
          String(messageId)
        ) +
        '"]'
      );


    if (existing) {
      return;
    }

  }


  const mine =
    isMyMessage(
      message
    );


  const row =
    document.createElement(
      'div'
    );


  row.className =
    mine
      ? 'messageRow me'
      : 'messageRow';


  if (messageId != null) {

    row.dataset.messageId =
      String(messageId);

  }


  const bubble =
    document.createElement(
      'div'
    );


  bubble.className =
    'bubble';


  /*
    Mostramos el nombre real del remitente
    solamente en mensajes recibidos.
  */

  if (!mine) {

    const senderName =

      getUsername(
        message.sender ||
        message.user ||
        message
      ) ||

      getConversationName(
        currentConversation
      );


    if (senderName) {

      const sender =
        document.createElement(
          'div'
        );


      sender.className =
        'messageSender';


      sender.textContent =
        senderName;


      bubble.appendChild(
        sender
      );

    }

  }


  const textElement =
    document.createElement(
      'div'
    );


  textElement.className =
    'messageText';


  textElement.textContent =
    text;


  bubble.appendChild(
    textElement
  );


  const meta =
    document.createElement(
      'div'
    );


  meta.className =
    'messageMeta';


  const time =
    document.createElement(
      'span'
    );


  time.textContent =
    getMessageTime(
      message
    );


  meta.appendChild(
    time
  );


  if (mine) {

    const ticks =
      document.createElement(
        'span'
      );


    ticks.className =
      'ticks';


    ticks.textContent =
      message.read_at ||
      message.readAt
        ? '✓✓'
        : '✓';


    meta.appendChild(
      ticks
    );

  }


  bubble.appendChild(
    meta
  );


  row.appendChild(
    bubble
  );


  messages.appendChild(
    row
  );


  scrollMessagesToBottom();

}

// ========================================================
// MENSAJE REALTIME
//
// ESTA ES LA CORRECCIÓN IMPORTANTE:
//
// EL MENSAJE QUE LLEGA POR SOCKET SE COMPARA
// DIRECTAMENTE CON LA CONVERSACIÓN QUE ESTÁ ABIERTA.
//
// SI ES LA MISMA:
// SE PINTA AHORA MISMO.
//
// NO ESPERA:
// - CLICK EN EL NOMBRE
// - loadMessages()
// - OTRA PETICIÓN HTTP
// ========================================================

function socketMessage(
  rawMessage
) {

  if (!rawMessage) {
    return;
  }


  /*
    Compatibilidad con distintos formatos:

    message
    { message: {...} }
    { data: {...} }
  */

  const message =

    rawMessage.message ||

    rawMessage.data ||

    rawMessage;


  if (
    !message ||
    typeof message !== 'object'
  ) {

    return;

  }


  const messageConversationId =
    getMessageConversationId(
      message
    );


  if (!messageConversationId) {

    console.warn(
      'VOBIXCHAT: mensaje realtime sin conversation_id',
      message
    );

    return;

  }


  const currentConversationId =

    currentConversation

      ? (

          currentConversation.id ||

          currentConversation.conversation_id ||

          currentConversation.conversationId

        )

      : null;


  console.log(
    '[VOBIXCHAT REALTIME]',
    {

      messageId:
        message.id,

      messageConversationId:
        String(
          messageConversationId
        ),

      currentConversationId:
        currentConversationId != null
          ? String(
              currentConversationId
            )
          : null,

      sameRoom:
        (
          currentConversationId != null &&
          String(
            messageConversationId
          ) ===
          String(
            currentConversationId
          )
        )

    }
  );


  // ======================================================
  // LA CONVERSACIÓN ESTÁ ABIERTA
  //
  // BURBUJA DIRECTA.
  // ======================================================

  if (
    currentConversationId != null &&
    String(
      messageConversationId
    ) ===
    String(
      currentConversationId
    )
  ) {

    renderMessage(
      message
    );


    return;

  }


  /*
    Si pertenece a otra conversación,
    actualizamos únicamente el historial lateral.

    NO abrimos automáticamente otra sala.
  */

  updateConversationFromMessage(
    message
  );

}


// ========================================================
// ACTUALIZAR PREVIEW DESDE MENSAJE
// ========================================================

function updateConversationFromMessage(
  message
) {

  const conversationId =
    getMessageConversationId(
      message
    );


  if (!conversationId) {
    return;
  }


  const index =
    conversations.findIndex(
      conversation => {

        const id =

          conversation.id ||

          conversation.conversation_id ||

          conversation.conversationId;


        return (
          String(id) ===
          String(conversationId)
        );

      }
    );


  /*
    Si todavía no tenemos esa conversación
    en memoria, refrescamos el historial.
  */

  if (index === -1) {

    loadConversations();

    return;

  }


  const conversation =
    conversations[index];


  const text =
    getMessageText(
      message
    );


  conversation.last_message =
    text;


  conversation.lastMessage =
    text;


  /*
    La conversación que acaba de recibir mensaje
    pasa arriba del historial.
  */

  if (index > 0) {

    conversations.splice(
      index,
      1
    );


    conversations.unshift(
      conversation
    );

  }


  renderConversations();

}

// ENVIAR MENSAJE

async function sendMessage() {

  const text =
    messageInput.value.trim();


  if (!text) {
    return;
  }


  if (!currentConversation) {

    showToast(
      'Selecciona una conversación'
    );

    return;

  }


  const conversationId =

    currentConversation.id ||

    currentConversation.conversation_id ||

    currentConversation.conversationId;


  if (!conversationId) {

    showToast(
      'Conversación no válida'
    );

    return;

  }


  /*
    Guardamos el texto antes de limpiar
    el campo de escritura.
  */

  const outgoingText =
    text;


  /*
    Limpiamos inmediatamente para que
    el chat se sienta rápido.
  */

  messageInput.value = '';


  sendButton.disabled =
    true;


  try {

    const data =
      await requestJSON(

        '/api/chat/conversations/' +

        encodeURIComponent(
          conversationId
        ) +

        '/messages',

        {

          method:
            'POST',

          headers: {

            'Content-Type':
              'application/json'

          },

          body:
            JSON.stringify({

              content:
                outgoingText,

              text:
                outgoingText,

              message:
                outgoingText

            })

        }

      );


    /*
    --------------------------------------------------------
    Si el backend devuelve el mensaje creado,
    lo pintamos inmediatamente.

    Después Socket.IO puede devolver:

      chat:message
      message:new

    renderMessage() evita duplicados por ID.
    --------------------------------------------------------
    */

    const createdMessage =

      data.message ||

      data.data ||

      (
        data.id
          ? data
          : null
      );


    if (
      createdMessage &&
      typeof createdMessage === 'object'
    ) {

      /*
        El POST se hizo directamente contra
        esta conversación.

        Si la respuesta no incluye conversation_id,
        lo añadimos localmente.
      */

      if (
        !getMessageConversationId(
          createdMessage
        )
      ) {

        createdMessage.conversation_id =
          conversationId;

      }


      renderMessage(
        createdMessage
      );

    }


    /*
      Actualizamos el preview sin descargar
      nuevamente todo el historial.
    */

    const conversationIndex =
      conversations.findIndex(
        conversation => {

          const id =

            conversation.id ||

            conversation.conversation_id ||

            conversation.conversationId;


          return (
            String(id) ===
            String(conversationId)
          );

        }
      );


    if (
      conversationIndex !== -1
    ) {

      conversations[
        conversationIndex
      ].last_message =
        outgoingText;


      conversations[
        conversationIndex
      ].lastMessage =
        outgoingText;


      if (
        conversationIndex > 0
      ) {

        const [
          conversation
        ] =
          conversations.splice(
            conversationIndex,
            1
          );


        conversations.unshift(
          conversation
        );

      }


      renderConversations();

    }


  } catch (error) {

    console.error(
      'VOBIXCHAT SEND:',
      error
    );


    /*
      Si falla el envío restauramos
      el mensaje para no perderlo.
    */

    if (
      !messageInput.value.trim()
    ) {

      messageInput.value =
        outgoingText;

    }


    showToast(

      error.message ||

      'No se pudo enviar el mensaje'

    );


  } finally {

    sendButton.disabled =
      false;


    messageInput.focus();

  }

}

      now;

      currentConversation.id ||

      currentConversation.conversation_id ||

      !data ||
      !currentConversation

      return;

    const incomingConversationId =

      data.conversation_id ||

      data.conversationId ||

      null;


    const currentConversationId =

      currentConversation.id ||

      currentConversation.conversation_id ||

      currentConversation.conversationId;


    if (
      incomingConversationId != null &&
      String(
        incomingConversationId
      ) !==
      String(
        currentConversationId
      )
    ) {

      return;

    }


    const username =

      data.username ||

      data.user_name ||

      '';


    /*
      No mostramos nuestro propio typing.
    */

    if (
      username &&
      getUsername(me) &&
      username.toLowerCase() ===
      getUsername(me).toLowerCase()
    ) {

      return;

    }


    typing.textContent =

      username

        ? username +
          ' está escribiendo...'

        : 'Escribiendo...';


    clearTimeout(
      typingTimer
    );

function currentContactMatches(

  }


  const other =

    currentConversation.other_user ||

    currentConversation.otherUser ||

    currentConversation.user ||

  const currentUserId =
    getUserId(
      other
    );


  const incomingUserId =

    data.user_id ||

    data.userId ||

    (
      data.user &&
      getUserId(
        data.user
      )
    ) ||

    null;


  if (
    currentUserId != null &&
    incomingUserId != null
  ) {

    return (
      String(currentUserId) ===
      String(incomingUserId)
    );

  }


  const currentName =
    getUsername(
      other
    );


  const incomingName =

    data.username ||

    data.user_name ||

    (
      data.user &&
      getUsername(
        data.user
      )
    ) ||

    '';


  if (
    currentName &&
    incomingName
  ) {

    return (
      currentName.toLowerCase() ===
      String(
        incomingName
      ).toLowerCase()
    );

  }


  return false;

}

let recoveringConnection =

window.addEventListener(
  'online',
  async () => {

    if (recoveringConnection) {
      return;
    }


    recoveringConnection =
      true;


    try {

      showToast(
        'Conexión recuperada'
      );


      /*
        Primero recuperamos Socket.IO.

        El realtime tiene prioridad.
      */

      if (!socket.connected) {

        socket.connect();

      }


      /*
        Si hay una conversación abierta,
        entramos nuevamente en esa misma sala.
      */

      if (currentConversation) {

        const conversationId =

          currentConversation.id ||

          currentConversation.conversation_id ||

          currentConversation.conversationId;


        if (conversationId) {

          socket.emit(

            'conversation-join',

            {

              conversationId:
                conversationId

            }

          );

        }

      }


      /*
        Ahora sí recuperamos cualquier dato
        persistido mientras no había Internet.
      */

      await loadConversations();


      if (currentConversation) {

        const currentId =

          currentConversation.id ||

          currentConversation.conversation_id ||

          currentConversation.conversationId;


        /*
          Después de loadConversations(),
          buscamos nuevamente el objeto correspondiente
          a la sala que estaba abierta.

          NO abrimos otra conversación.
        */

        const refreshed =
          conversations.find(
            conversation => {

              const id =

                conversation.id ||

                conversation.conversation_id ||

                conversation.conversationId;


              return (
                String(id) ===
                String(currentId)
              );

            }
          );


        if (refreshed) {

          currentConversation =
            refreshed;

        }


        await loadMessages();

      }


    } catch (error) {

      console.warn(
        'VOBIXCHAT RECOVERY:',
        error
      );


    } finally {

      recoveringConnection =
        false;

    }

  }
);


// ========================================================
// SIN INTERNET
// ========================================================

window.addEventListener(
  'offline',
  () => {

    if (currentConversation) {

      roomStatus.textContent =
        'Sin conexión';

    }


    showToast(
      'Sin conexión a Internet'
    );

  }
);


// ========================================================
// RECUPERAR AL VOLVER DEL SEGUNDO PLANO
//
// En teléfonos móviles el navegador puede suspender
// temporalmente Socket.IO.
//
// Cuando la página vuelve a ser visible:
//
// 1. recuperamos conexión;
// 2. volvemos a entrar en conversation-join;
// 3. recuperamos mensajes que pudieran llegar mientras
//    el navegador estaba suspendido.
//
// Durante funcionamiento normal NO hacemos polling.
// ========================================================

let pageHiddenAt =
  0;


let visibilityRecovery =
  false;


document.addEventListener(
  'visibilitychange',
  async () => {

    if (
      document.visibilityState ===
      'hidden'
    ) {

      pageHiddenAt =
        Date.now();

      return;

    }


    if (
      document.visibilityState !==
      'visible'
    ) {

      return;

    }


    const hiddenTime =
      pageHiddenAt
        ? Date.now() -
          pageHiddenAt
        : 0;


    pageHiddenAt =
      0;


    /*
      Siempre aseguramos primero el socket.
    */

    if (!socket.connected) {

      socket.connect();

    }


    /*
      Volvemos a entrar en la conversación abierta.
    */

    if (currentConversation) {

      const conversationId =

        currentConversation.id ||

        currentConversation.conversation_id ||

        currentConversation.conversationId;


      if (conversationId) {

        socket.emit(

          'conversation-join',

          {

            conversationId:
              conversationId

          }

        );

      }

    }


    /*
      Si prácticamente no estuvo oculto,
      no necesitamos descargar nada.
    */

    if (hiddenTime < 1000) {
      return;
    }


    if (visibilityRecovery) {
      return;
    }


    visibilityRecovery =
      true;


    try {

      await loadConversations();


      if (currentConversation) {

        const currentId =

          currentConversation.id ||

          currentConversation.conversation_id ||

          currentConversation.conversationId;


        const refreshed =
          conversations.find(
            conversation => {

              const id =

                conversation.id ||

                conversation.conversation_id ||

                conversation.conversationId;


              return (
                String(id) ===
                String(currentId)
              );

            }
          );


        if (refreshed) {

          currentConversation =
            refreshed;

        }


        await loadMessages();

      }


    } catch (error) {

      console.warn(
        'VOBIXCHAT VISIBILITY RECOVERY:',
        error
      );


    } finally {

      visibilityRecovery =
        false;

    }

  }
);


// ========================================================
// FOCO DE VENTANA
//
// NO hacemos loadMessages() cada vez que el usuario
// toca la ventana.
//
// Solamente comprobamos que continúe dentro de la
// sala Socket.IO correcta.
// ========================================================

window.addEventListener(
  'focus',
  () => {

    if (
      !currentConversation ||
      !socket.connected
    ) {

      return;

    }


    const conversationId =

      currentConversation.id ||

      currentConversation.conversation_id ||

      currentConversation.conversationId;


    if (!conversationId) {
      return;
    }


    socket.emit(

      'conversation-join',

      {

        conversationId:
          conversationId

      }

    );

  }
);


// ========================================================
// MENSAJES ENTREGADOS
// ========================================================

function findMessageElement(
  messageId
) {

  if (messageId == null) {
    return null;
  }


  const rows =
    messages.querySelectorAll(
      '[data-message-id]'
    );


  for (
    const row
    of rows
  ) {

    if (
      String(
        row.dataset.messageId
      ) ===
      String(
        messageId
      )
    ) {

      return row;

    }

  }


  return null;

}


function markDelivered(
  data
) {

  if (!data) {
    return;
  }


  const messageId =

    data.message_id ||

    data.messageId ||

    data.id ||

    null;


  const row =
    findMessageElement(
      messageId
    );


  if (!row) {
    return;
  }


  const ticks =
    row.querySelector(
      '.ticks'
    );


  if (ticks) {

    ticks.textContent =
      '✓✓';

  }

}


socket.on(
  'message:delivered',
  markDelivered
);


socket.on(
  'message-delivered',
  markDelivered
);


// ========================================================
// MENSAJES LEÍDOS
// ========================================================

function markRead(
  data
) {

  if (!data) {
    return;
  }


  const messageId =

    data.message_id ||

    data.messageId ||

    data.id ||

    null;


  const row =
    findMessageElement(
      messageId
    );


  if (!row) {
    return;
  }


  const ticks =
    row.querySelector(
      '.ticks'
    );


  if (ticks) {

    ticks.textContent =
      '✓✓';

  }

}


socket.on(
  'message:read',
  markRead
);


socket.on(
  'message-read',
  markRead
);


// ========================================================
// ERROR DE MENSAJE
// ========================================================

socket.on(
  'message:error',
  data => {

    console.error(
      'VOBIXCHAT MESSAGE ERROR:',
      data
    );


    showToast(

      (
        data &&
        (
          data.message ||
          data.error
        )
      ) ||

      'No se pudo procesar el mensaje'

    );

  }
);


// ========================================================
// DIAGNÓSTICO REALTIME
//
// Este diagnóstico NO cambia la interfaz.
//
// Si quieres comprobar qué está ocurriendo,
// abre la consola del navegador.
//
// Cuando llegue un mensaje debe aparecer:
//
// [VOBIXCHAT REALTIME]
//
// messageConversationId
// currentConversationId
// sameRoom: true
//
// Cuando sameRoom es true,
// renderMessage() se ejecuta directamente.
// ========================================================


// ========================================================
// ACTUALIZACIÓN DEL HISTORIAL DESDE SOCKET
//
// Algunos backends envían un evento separado para
// actualizar el último mensaje.
//
// IMPORTANTE:
//
// Este evento SOLO actualiza la lista.
//
// NO controla la burbuja.
//
// La burbuja entra mediante:
//
// chat:message
//
// o
//
// message:new
//
// que ya están registrados en el BLOQUE 3.
// ========================================================

function conversationUpdated(
  data
) {

  if (!data) {
    return;
  }


  const conversation =

    data.conversation ||

    data.data ||

    data;


  const conversationId =

    conversation.id ||

    conversation.conversation_id ||

    conversation.conversationId;


  if (!conversationId) {
    return;
  }


  const index =
    conversations.findIndex(
      item => {

        const id =

          item.id ||

          item.conversation_id ||

          item.conversationId;


        return (
          String(id) ===
          String(conversationId)
        );

      }
    );


  /*
    Si todavía no existe localmente,
    descargamos la lista.

    Esto NO descarga los mensajes de la sala.
  */

  if (index === -1) {

    loadConversations();

    return;

  }


  const previous =
    conversations[index];


  conversations[index] = {

    ...previous,

    ...conversation

  };


  /*
    Si corresponde a la conversación abierta,
    actualizamos únicamente el objeto y sus
    metadatos.

    NO hacemos loadMessages().
  */

  if (currentConversation) {

    const currentId =

      currentConversation.id ||

      currentConversation.conversation_id ||

      currentConversation.conversationId;


    if (
      String(currentId) ===
      String(conversationId)
    ) {

      currentConversation =
        conversations[index];


      const name =
        getConversationName(
          currentConversation
        );


      roomName.textContent =
        name;


      roomAvatar.textContent =
        name
          .charAt(0)
          .toUpperCase();

    }

  }


  /*
    Movemos conversación actualizada arriba.
  */

  if (index > 0) {

    const [
      updated
    ] =
      conversations.splice(
        index,
        1
      );


    conversations.unshift(
      updated
    );

  }


  renderConversations();

}


socket.on(
  'conversation-updated',
  conversationUpdated
);


socket.on(
  'conversation:update',
  conversationUpdated
);


// ========================================================
// CONVERSACIÓN NUEVA
// ========================================================

socket.on(
  'conversation-created',
  () => {

    loadConversations();

  }
);


socket.on(
  'conversation:new',
  () => {

    loadConversations();

  }
);


// ========================================================
// NO POLLING
//
// IMPORTANTE:
//
// NO EXISTE:
//
// setInterval(loadMessages, ...)
//
// NO dependemos de pulsar el nombre.
//
// FUNCIONAMIENTO NORMAL:
//
// USUARIO A
//    ↓
// POST /messages
//    ↓
// PostgreSQL
//    ↓
// backend
//    ↓
// io.to("conversation:ID")
//    ↓
// chat:message
// message:new
//    ↓
// socketMessage()
//    ↓
// compara conversation_id
//    ↓
// conversación abierta
//    ↓
// renderMessage()
//    ↓
// BURBUJA INMEDIATA
//
// El historial lateral NO es el mecanismo
// que libera el mensaje.
// ========================================================


// ========================================================
// ARRANQUE
// ========================================================

async function initializeVobixChat() {

  console.log(
    '=========================================='
  );


  console.log(
    'VOBIXCHAT INICIANDO'
  );


  console.log(
    'TOKEN SOCKET:',
    VOBIX_TOKEN
      ? 'PRESENTE'
      : 'NO ENCONTRADO'
  );


  console.log(
    'REALTIME EVENTS:',
    'chat:message + message:new'
  );


  console.log(
    '=========================================='
  );


  /*
    Estado inicial.
  */

  currentConversation =
    null;


  messages.innerHTML =
    '';


  typing.textContent =
    '';


  searchResults.innerHTML =
    '';


  emptyState.style.display =
    'grid';


  chatRoom.style.display =
    'none';


  app.classList.remove(
    'roomOpen'
  );


  /*
    Cargamos conversaciones.

    NO abrimos ninguna automáticamente.
  */

  await loadConversations();


  /*
    Si no hay Internet lo indicamos.
  */

  if (!navigator.onLine) {

    showToast(
      'Sin conexión a Internet'
    );

  }


  console.log(
    'VOBIXCHAT LISTO'
  );

}


// ========================================================
// LIMPIEZA
// ========================================================

window.addEventListener(
  'beforeunload',
  () => {

    clearTimeout(
      typingTimer
    );

  }
);


// ========================================================
// INICIO ÚNICO
// ========================================================

initializeVobixChat();


// ========================================================
// REPARACIÓN REALTIME APLICADA
//
// 1.
//
// Socket.IO se crea DESDE EL PRINCIPIO con:
//
// auth: {
//   token: VOBIX_TOKEN
// }
//
// --------------------------------------------------------
//
// 2.
//
// Al abrir Emilio:
//
// socket.emit(
//   'conversation-join',
//   { conversationId: ID }
// )
//
// --------------------------------------------------------
//
// 3.
//
// El navegador escucha los eventos que utiliza
// el backend:
//
// socket.on(
//   'chat:message',
//   socketMessage
// )
//
// socket.on(
//   'message:new',
//   socketMessage
// )
//
// --------------------------------------------------------
//
// 4.
//
// Cuando llega:
//
// {
//   id: 500,
//   conversation_id: 20,
//   content: "Hola"
// }
//
// y la conversación abierta es:
//
// currentConversation.id = 20
//
// socketMessage() compara:
//
// "20" === "20"
//
// y ejecuta:
//
// renderMessage(message)
//
// DIRECTAMENTE.
//
// --------------------------------------------------------
//
// 5.
//
// NO hace falta:
//
// - pulsar Emilio;
// - volver a abrir la conversación;
// - esperar loadMessages();
// - esperar una recarga;
// - usar el historial como mecanismo de entrega.
//
// --------------------------------------------------------
//
// 6.
//
// Si Socket.IO se desconecta y vuelve:
//
// vuelve automáticamente a:
//
// conversation-join
//
// para la conversación que ya estaba abierta.
//
// --------------------------------------------------------
//
// 7.
//
// Los eventos antiguos:
//
// chat-message
// new-message
// message
// conversation-message
//
// permanecen como compatibilidad.
//
// Pero los fundamentales del backend son:
//
// chat:message
// message:new
//
// ========================================================

</script>
