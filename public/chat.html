<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width,initial-scale=1,viewport-fit=cover"
  >

  <meta name="theme-color" content="#071009">

  <title>VOBIXCHAT</title>

  <script src="/socket.io/socket.io.js"></script>

  <style>

    * {
      box-sizing: border-box;
    }

    :root {
      --green: #68ff72;
      --green2: #39db5b;
      --bg: #071009;
      --panel: #0b160d;
      --panel2: #101d13;
      --border: rgba(104,255,114,.18);
      --text: #f1fff3;
      --muted: #8da891;
      --bubble: #15251a;
      --bubbleMe: #155d35;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: var(--bg);
      color: var(--text);
      font-family:
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
    }

    button,
    input {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    .app {
      display: flex;
      width: 100%;
      height: 100dvh;

      background:
        radial-gradient(
          circle at 25% 10%,
          rgba(67,255,99,.08),
          transparent 30%
        ),
        var(--bg);
    }


    /* =====================================================
       SIDEBAR
    ===================================================== */

    .sidebar {
      width: 350px;
      min-width: 350px;

      display: flex;
      flex-direction: column;

      border-right:
        1px solid var(--border);

      background:
        rgba(6,20,9,.96);
    }

    .profile {
      min-height: 78px;

      display: flex;
      align-items: center;

      gap: 12px;

      padding: 14px 16px;

      border-bottom:
        1px solid var(--border);
    }

    .logo {
      width: 48px;
      height: 48px;

      border-radius: 15px;

      display: grid;
      place-items: center;

      background: var(--green);
      color: #061008;

      font-size: 25px;
      font-weight: 1000;

      box-shadow:
        0 0 25px
        rgba(104,255,114,.22);
    }

    .profileInfo {
      flex: 1;
      min-width: 0;
    }

    .brand {
      font-size: 16px;
      font-weight: 1000;
    }

    .username {
      margin-top: 3px;

      color: var(--green);

      font-size: 12px;

      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .avatar {
      width: 42px;
      height: 42px;

      min-width: 42px;

      border-radius: 50%;

      display: grid;
      place-items: center;

      background: #14291a;

      color: var(--green);

      border:
        1px solid var(--border);

      font-weight: 900;
    }


    /* =====================================================
       BUSCADOR
    ===================================================== */

    .searchArea {
      padding: 14px;

      border-bottom:
        1px solid var(--border);
    }

    .searchBox {
      display: flex;
      gap: 8px;
    }

    .searchBox input {
      width: 100%;
      min-width: 0;

      padding: 13px 14px;

      border-radius: 14px;

      border:
        1px solid var(--border);

      outline: none;

      color: white;

      background: #0e1a11;
    }

    .searchBox input:focus {
      border-color: var(--green);
    }

    .searchButton {
      width: 50px;
      min-width: 50px;

      border: 0;

      border-radius: 14px;

      background: var(--green);

      color: #071009;

      font-size: 20px;
      font-weight: 900;
    }

    .searchHelp {
      margin-top: 8px;

      color: var(--muted);

      font-size: 11px;
    }

    .searchResults {
      border-bottom:
        1px solid var(--border);
    }


    /* =====================================================
       CONVERSACIONES
    ===================================================== */

    .sectionTitle {
      padding: 14px 16px 8px;

      display: flex;

      justify-content:
        space-between;

      color: #d7ffda;

      font-size: 12px;

      font-weight: 900;

      letter-spacing: 1px;
    }

    .conversations {
      flex: 1;

      overflow-y: auto;
    }

    .conversation {
      display: flex;

      align-items: center;

      gap: 11px;

      padding: 12px 14px;

      cursor: pointer;

      border-bottom:
        1px solid
        rgba(104,255,114,.07);
    }

    .conversation:hover {
      background:
        rgba(104,255,114,.05);
    }

    .conversation.active {
      background:
        rgba(104,255,114,.10);
    }

    .conversationBody {
      flex: 1;
      min-width: 0;
    }

    .conversationName {
      font-weight: 800;
      font-size: 14px;

      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .conversationPreview {
      margin-top: 3px;

      color: var(--muted);

      font-size: 11px;

      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }


    /* =====================================================
       CHAT
    ===================================================== */

    .chat {
      flex: 1;

      min-width: 0;

      display: flex;

      flex-direction: column;

      position: relative;
    }

    .empty {
      flex: 1;

      display: grid;

      place-items: center;

      text-align: center;

      padding: 30px;
    }

    .emptyLogo {
      width: 86px;
      height: 86px;

      margin: auto;

      border-radius: 25px;

      display: grid;
      place-items: center;

      background: var(--green);

      color: #071009;

      font-size: 46px;

      font-weight: 1000;

      box-shadow:
        0 0 40px
        rgba(104,255,114,.18);
    }

    .empty h1 {
      margin:
        18px 0 8px;

      font-size: 27px;
    }

    .empty p {
      color: var(--muted);
    }

    .chatRoom {
      display: none;

      flex: 1;

      min-height: 0;

      flex-direction: column;
    }


    /* =====================================================
       CABECERA SALA
    ===================================================== */

    .chatHeader {
      min-height: 72px;

      display: flex;

      align-items: center;

      gap: 12px;

      padding: 10px 16px;

      border-bottom:
        1px solid var(--border);

      background:
        rgba(8,19,10,.98);
    }

    .backButton {
      display: none;
    }

    .chatUser {
      flex: 1;
      min-width: 0;
    }

    .chatName {
      font-weight: 900;

      overflow: hidden;

      text-overflow: ellipsis;

      white-space: nowrap;
    }

    .chatStatus {
      margin-top: 2px;

      color: var(--green);

      font-size: 11px;
    }

    .headerActions {
      display: flex;

      align-items: center;

      gap: 4px;
    }

    .iconButton {
      width: 42px;
      height: 42px;

      display: grid;

      place-items: center;

      border: 0;

      border-radius: 50%;

      background: transparent;

      color: #dfffe2;

      font-size: 19px;
    }

    .iconButton:hover {
      background:
        rgba(104,255,114,.10);

      color: var(--green);
    }


    /* =====================================================
       MENSAJES
    ===================================================== */

    .messages {
      flex: 1;

      min-height: 0;

      overflow-y: auto;

      padding: 18px;

      background:
        radial-gradient(
          circle at 70% 10%,
          rgba(104,255,114,.04),
          transparent 30%
        );
    }

    .messageRow {
      display: flex;

      margin: 5px 0;
    }

    .messageRow.me {
      justify-content: flex-end;
    }

    .bubble {
      max-width:
        min(72%,650px);

      padding:
        8px 11px 6px;

      border-radius: 12px;

      background:
        var(--bubble);

      border:
        1px solid
        rgba(255,255,255,.04);

      word-break: break-word;
    }

    .messageRow.me .bubble {
      background:
        var(--bubbleMe);
    }

    .messageSender {
      margin-bottom: 3px;

      color: var(--green);

      font-size: 10px;

      font-weight: 800;
    }

    .messageText {
      font-size: 14px;

      line-height: 1.4;
    }

    .messageMeta {
      margin-top: 3px;

      display: flex;

      justify-content: flex-end;

      gap: 5px;

      color:
        rgba(255,255,255,.62);

      font-size: 9px;
    }

    .ticks {
      color: #76dfff;
    }


    /* =====================================================
       ESCRIBIENDO
    ===================================================== */

    .typing {
      min-height: 20px;

      padding: 2px 18px;

      color: var(--green);

      font-size: 11px;

      background: #08130a;
    }


    /* =====================================================
       COMPOSER
    ===================================================== */

    .composer {
      position: relative;

      display: flex;

      align-items: center;

      gap: 5px;

      padding:
        9px
        10px
        calc(9px + env(safe-area-inset-bottom));

      border-top:
        1px solid var(--border);

      background: #08130a;
    }

    .composerInput {
      flex: 1;

      min-width: 0;

      height: 46px;

      padding: 0 15px;

      border-radius: 23px;

      border:
        1px solid var(--border);

      outline: none;

      background: #122016;

      color: white;
    }

    .composerInput:focus {
      border-color:
        rgba(104,255,114,.55);
    }

    .composerButton {
      width: 44px;
      height: 44px;

      min-width: 44px;

      display: grid;

      place-items: center;

      border: 0;

      border-radius: 50%;

      background: transparent;

      color: #d8ffdc;

      font-size: 20px;
    }

    .composerButton:hover {
      background:
        rgba(104,255,114,.09);

      color: var(--green);
    }

    .sendButton {
      background: var(--green);

      color: #071009;

      font-weight: 1000;
    }


    /* =====================================================
       EMOJIS
    ===================================================== */

    .emojiPanel {
      position: absolute;

      display: none;

      left: 10px;

      bottom: 68px;

      width: 285px;

      padding: 12px;

      grid-template-columns:
        repeat(7,1fr);

      gap: 6px;

      border:
        1px solid var(--border);

      border-radius: 16px;

      background: #101c13;

      box-shadow:
        0 15px 50px
        rgba(0,0,0,.45);

      z-index: 50;
    }

    .emojiPanel.open {
      display: grid;
    }

    .emoji {
      border: 0;

      padding: 5px;

      border-radius: 8px;

      background: transparent;

      font-size: 21px;
    }


    /* =====================================================
       ADJUNTOS
    ===================================================== */

    .attachMenu {
      position: absolute;

      display: none;

      left: 58px;

      bottom: 68px;

      width: 210px;

      padding: 8px;

      border-radius: 16px;

      border:
        1px solid var(--border);

      background: #101c13;

      box-shadow:
        0 15px 50px
        rgba(0,0,0,.45);

      z-index: 51;
    }

    .attachMenu.open {
      display: block;
    }

    .attachOption {
      width: 100%;

      display: flex;

      align-items: center;

      gap: 10px;

      padding: 11px;

      border: 0;

      border-radius: 10px;

      background: transparent;

      color: white;

      text-align: left;
    }

    .attachOption:hover {
      background:
        rgba(104,255,114,.08);
    }


    /* =====================================================
       TOAST
    ===================================================== */

    .toast {
      position: fixed;

      left: 50%;

      bottom: 90px;

      transform:
        translateX(-50%)
        translateY(20px);

      padding: 11px 17px;

      border:
        1px solid var(--border);

      border-radius: 30px;

      background: #122016;

      color: white;

      opacity: 0;

      pointer-events: none;

      transition: .2s;

      z-index: 1000;
    }

    .toast.show {
      opacity: 1;

      transform:
        translateX(-50%)
        translateY(0);
    }


    /* =====================================================
       MÓVIL
    ===================================================== */

    @media(max-width:720px) {

      .sidebar {
        width: 100%;
        min-width: 100%;
      }

      .chat {
        display: none;
        width: 100%;
      }

      .app.roomOpen .sidebar {
        display: none;
      }

      .app.roomOpen .chat {
        display: flex;
      }

      .backButton {
        display: grid;
      }

      .bubble {
        max-width: 84%;
      }

      .messages {
        padding: 12px 9px;
      }

      .chatHeader {
        padding:
          8px 6px;
      }

      .iconButton {
        width: 38px;
        height: 38px;
      }

      .composer {
        gap: 2px;

        padding-left: 4px;
        padding-right: 4px;
      }

      .composerButton {
        width: 39px;
        min-width: 39px;
      }

      .emojiPanel {
        left: 7px;

        width:
          calc(100% - 14px);
      }

    }

  </style>
</head>


<body>


<div
  class="app"
  id="app"
>


  <!-- ===================================================
       SIDEBAR
  ==================================================== -->

  <aside class="sidebar">


    <div class="profile">


      <div class="logo">
        V
      </div>


      <div class="profileInfo">

        <div class="brand">
          VOBIXCHAT
        </div>

        <div
          class="username"
          id="myUsername"
        >
          @
        </div>

      </div>


      <div
        class="avatar"
        id="myAvatar"
      >
        V
      </div>


    </div>


    <!-- BUSCADOR -->

    <div class="searchArea">


      <div class="searchBox">


        <input
          id="searchInput"
          autocomplete="off"
          placeholder="Buscar usuario o teléfono"
        >


        <button
          class="searchButton"
          id="searchButton"
          type="button"
        >
          ⌕
        </button>


      </div>


      <div class="searchHelp">
        Busca por nombre o número de teléfono.
      </div>


    </div>


    <div
      class="searchResults"
      id="searchResults"
    ></div>


    <div class="sectionTitle">

      <span>
        CONVERSACIONES
      </span>

      <span
        id="conversationCount"
      >
        0
      </span>

    </div>


    <div
      class="conversations"
      id="conversationList"
    ></div>


  </aside>


  <!-- ===================================================
       CHAT
  ==================================================== -->

  <main class="chat">


    <section
      class="empty"
      id="emptyState"
    >

      <div>

        <div class="emptyLogo">
          V
        </div>

        <h1>
          VOBIXCHAT
        </h1>

        <p>
          Selecciona una conversación o busca una persona.
        </p>

        <p>
          Tus conversaciones se mantienen en salas privadas.
        </p>

      </div>

    </section>


    <!-- =================================================
         SALA
    ================================================== -->

    <section
      class="chatRoom"
      id="chatRoom"
    >


      <header class="chatHeader">


        <button
          class="iconButton backButton"
          id="backButton"
          type="button"
        >
          ←
        </button>


        <div
          class="avatar"
          id="roomAvatar"
        >
          V
        </div>


        <div class="chatUser">

          <div
            class="chatName"
            id="roomName"
          ></div>

          <div
            class="chatStatus"
            id="roomStatus"
          >
            Conversación privada
          </div>

        </div>


        <div class="headerActions">


          <button
            class="iconButton"
            id="voiceCallButton"
            title="Llamada de voz"
            type="button"
          >
            ☎
          </button>


          <button
            class="iconButton"
            id="videoCallButton"
            title="Videollamada"
            type="button"
          >
            🎥
          </button>


          <button
            class="iconButton"
            id="moreButton"
            title="Opciones"
            type="button"
          >
            ⋮
          </button>


        </div>


      </header>


      <div
        class="messages"
        id="messages"
      ></div>


      <div
        class="typing"
        id="typing"
      ></div>


      <!-- ===============================================
           ESCRITURA
      ================================================ -->

      <div class="composer">


        <button
          class="composerButton"
          id="emojiButton"
          type="button"
          title="Emojis"
        >
          😊
        </button>


        <button
          class="composerButton"
          id="attachButton"
          type="button"
          title="Adjuntar"
        >
          📎
        </button>


        <input
          class="composerInput"
          id="messageInput"
          autocomplete="off"
          placeholder="Escribe un mensaje..."
        >


        <button
          class="composerButton"
          id="cameraButton"
          type="button"
          title="Cámara"
        >
          📷
        </button>


        <button
          class="composerButton"
          id="audioButton"
          type="button"
          title="Nota de voz"
        >
          🎤
        </button>


        <button
          class="composerButton sendButton"
          id="sendButton"
          type="button"
          title="Enviar"
        >
          ➤
        </button>


        <!-- EMOJIS -->

        <div
          class="emojiPanel"
          id="emojiPanel"
        >

          <button class="emoji">😀</button>
          <button class="emoji">😂</button>
          <button class="emoji">😍</button>
          <button class="emoji">🥰</button>
          <button class="emoji">😎</button>
          <button class="emoji">🤔</button>
          <button class="emoji">😢</button>

          <button class="emoji">😭</button>
          <button class="emoji">😡</button>
          <button class="emoji">👍</button>
          <button class="emoji">👎</button>
          <button class="emoji">👏</button>
          <button class="emoji">🙏</button>
          <button class="emoji">💪</button>

          <button class="emoji">❤️</button>
          <button class="emoji">💚</button>
          <button class="emoji">🔥</button>
          <button class="emoji">🎉</button>
          <button class="emoji">✅</button>
          <button class="emoji">💯</button>
          <button class="emoji">🚀</button>

        </div>


        <!-- ADJUNTOS -->

        <div
          class="attachMenu"
          id="attachMenu"
        >

          <button
            class="attachOption"
            id="photoOption"
            type="button"
          >
            🖼️ Foto o vídeo
          </button>


          <button
            class="attachOption"
            id="documentOption"
            type="button"
          >
            📄 Documento
          </button>


          <button
            class="attachOption"
            id="cameraOption"
            type="button"
          >
            📷 Cámara
          </button>


        </div>


      </div>


      <input
        type="file"
        id="mediaInput"
        accept="image/*,video/*"
        hidden
      >


      <input
        type="file"
        id="documentInput"
        hidden
      >


      <input
        type="file"
        id="cameraInput"
        accept="image/*,video/*"
        capture="environment"
        hidden
      >


    </section>


  </main>


</div>


<div
  class="toast"
  id="toast"
></div>


<script>

'use strict';


// ========================================================
// SOCKET
// ========================================================

const socket = io();


// ========================================================
// ELEMENTOS
// ========================================================

const app =
  document.getElementById('app');

const myUsername =
  document.getElementById('myUsername');

const myAvatar =
  document.getElementById('myAvatar');

const searchInput =
  document.getElementById('searchInput');

const searchButton =
  document.getElementById('searchButton');

const searchResults =
  document.getElementById('searchResults');

const conversationList =
  document.getElementById('conversationList');

const conversationCount =
  document.getElementById('conversationCount');

const emptyState =
  document.getElementById('emptyState');

const chatRoom =
  document.getElementById('chatRoom');

const roomAvatar =
  document.getElementById('roomAvatar');

const roomName =
  document.getElementById('roomName');

const roomStatus =
  document.getElementById('roomStatus');

const messages =
  document.getElementById('messages');

const typing =
  document.getElementById('typing');

const messageInput =
  document.getElementById('messageInput');

const sendButton =
  document.getElementById('sendButton');

const backButton =
  document.getElementById('backButton');

const emojiButton =
  document.getElementById('emojiButton');

const emojiPanel =
  document.getElementById('emojiPanel');

const attachButton =
  document.getElementById('attachButton');

const attachMenu =
  document.getElementById('attachMenu');

const cameraButton =
  document.getElementById('cameraButton');

const audioButton =
  document.getElementById('audioButton');

const voiceCallButton =
  document.getElementById('voiceCallButton');

const videoCallButton =
  document.getElementById('videoCallButton');

const moreButton =
  document.getElementById('moreButton');

const mediaInput =
  document.getElementById('mediaInput');

const documentInput =
  document.getElementById('documentInput');

const cameraInput =
  document.getElementById('cameraInput');

const toast =
  document.getElementById('toast');


// ========================================================
// ESTADO
// ========================================================

let currentConversation = null;

let conversations = [];

let typingTimer = null;


// ========================================================
// USUARIO LOCAL
// ========================================================

function getLocalUser() {

  try {

    const raw =
      localStorage.getItem(
        'vobix_user'
      );

    if (!raw) {
      return null;
    }


    /*
    --------------------------------------------------------
    Compatibilidad:

    Algunas versiones antiguas guardaron:

    vobix_user = "SHNEYDER"

    Otras:

    {
      username:"SHNEYDER",
      phone:"+..."
    }

    --------------------------------------------------------
    */

    try {

      const parsed =
        JSON.parse(raw);

      if (
        parsed &&
        typeof parsed === 'object'
      ) {

        return parsed;

      }

      if (
        typeof parsed === 'string'
      ) {

        return {
          username: parsed
        };

      }

    } catch (error) {

      return {
        username: raw
      };

    }


    return null;


  } catch (error) {

    return null;

  }

}


const me =
  getLocalUser();


// ========================================================
// NOMBRE REAL
//
// Esta función corrige el problema "Usuario".
//
// Busca el nombre en todos los formatos que puede estar
// devolviendo VOBIXCHAT actualmente.
// ========================================================

function getUsername(data) {

  if (!data) {
    return '';
  }


  if (
    typeof data === 'string'
  ) {

    const value =
      data.trim();

    if (
      value &&
      value.toLowerCase() !==
      'usuario'
    ) {

      return value;

    }

    return '';

  }


  const directCandidates = [

    data.username,

    data.user_name,

    data.name,

    data.display_name,

    data.displayName,

    data.other_username,

    data.otherUsername,

    data.contact_username,

    data.contactUsername,

    data.participant_username,

    data.participantUsername,

    data.target_username,

    data.targetUsername

  ];


  for (
    const candidate
    of directCandidates
  ) {

    if (
      typeof candidate === 'string'
    ) {

      const value =
        candidate.trim();

      if (
        value &&
        value.toLowerCase() !==
        'usuario'
      ) {

        return value;

      }

    }

  }


  const nestedCandidates = [

    data.other_user,

    data.otherUser,

    data.user,

    data.contact,

    data.participant,

    data.target,

    data.profile

  ];


  for (
    const nested
    of nestedCandidates
  ) {

    const value =
      getUsername(nested);

    if (value) {
      return value;
    }

  }


  return '';

}


// ========================================================
// TELÉFONO
// ========================================================

function getPhone(data) {

  if (!data) {
    return '';
  }

  return (

    data.phone ||

    data.phone_number ||

    data.phoneNumber ||

    data.other_phone ||

    data.otherPhone ||

    (
      data.other_user &&
      getPhone(data.other_user)
    ) ||

    (
      data.otherUser &&
      getPhone(data.otherUser)
    ) ||

    (
      data.user &&
      getPhone(data.user)
    ) ||

    ''

  );

}


// ========================================================
// ID USUARIO
// ========================================================

function getUserId(data) {

  if (!data) {
    return null;
  }


  return (

    data.user_id ||

    data.userId ||

    data.other_user_id ||

    data.otherUserId ||

    data.contact_user_id ||

    data.contactUserId ||

    (
      data.other_user &&
      getUserId(data.other_user)
    ) ||

    (
      data.otherUser &&
      getUserId(data.otherUser)
    ) ||

    data.id ||

    null

  );

}


// ========================================================
// NOMBRE DE CONVERSACIÓN
// ========================================================

function getConversationName(
  conversation
) {

  if (!conversation) {
    return '';
  }


  /*
    Primero buscamos específicamente
    el otro participante.
  */

  const nested = [

    conversation.other_user,

    conversation.otherUser,

    conversation.contact,

    conversation.participant,

    conversation.user

  ];


  for (
    const item
    of nested
  ) {

    const name =
      getUsername(item);

    if (name) {
      return name;
    }

  }


  /*
    Después campos directos devueltos
    por SQL/API.
  */

  const direct = [

    conversation.other_username,

    conversation.otherUsername,

    conversation.contact_username,

    conversation.contactUsername,

    conversation.participant_username,

    conversation.participantUsername,

    conversation.username,

    conversation.user_name,

    conversation.name

  ];


  for (
    const value
    of direct
  ) {

    if (
      typeof value === 'string' &&
      value.trim() &&
      value.trim().toLowerCase()
        !== 'usuario'
    ) {

      return value.trim();

    }

  }


  /*
    En grupos sí puede usarse title.
  */

  if (
    conversation.type === 'group' &&
    conversation.title
  ) {

    return conversation.title;

  }


  /*
    IMPORTANTE:

    No ponemos "Usuario".

    Si el backend no envía el username,
    mostramos el teléfono o "Contacto"
    para poder detectar el problema real.
  */

  const phone =
    getPhone(conversation);

  if (phone) {
    return phone;
  }


  return 'Contacto';

}

// ========================================================
// ESCAPAR HTML
// ========================================================

function escapeHTML(value) {

  const div =
    document.createElement(
      'div'
    );

  div.textContent =
    value == null
      ? ''
      : String(value);

  return div.innerHTML;

}


// ========================================================
// REQUEST
// ========================================================

async function requestJSON(
  url,
  options = {}
) {

  const response =
    await fetch(
      url,
      options
    );


  let data = {};


  try {

    data =
      await response.json();

  } catch (error) {}


  if (!response.ok) {

    throw new Error(

      data.message ||

      data.msg ||

      data.error ||

      'Error del servidor'

    );

  }


  return data;

}

// ========================================================
// CREAR CONVERSACIÓN
// ========================================================

async function createConversation(
  user
) {

  try {

    const targetUserId =
      getUserId(user);


    if (!targetUserId) {

      showToast(
        'No encontramos el ID de este contacto'
      );

      return;

    }


    const data =
      await requestJSON(

        '/api/chat/conversations/private',

        {

          method: 'POST',

          headers: {

            'Content-Type':
              'application/json'

          },

          body:
            JSON.stringify({

              userId:
                targetUserId,

              targetUserId:
                targetUserId

            })

        }

      );


    const conversation =
      data.conversation ||
      data;


    /*
    --------------------------------------------------------
    MUY IMPORTANTE

    Conservamos el usuario real encontrado.

    Así aunque la respuesta de creación de conversación
    todavía no incluya username, NO perdemos "Flor".
    --------------------------------------------------------
    */

    if (
      !conversation.other_user &&
      !conversation.otherUser
    ) {

      conversation.other_user =
        user;

    }


    await loadConversations();


    /*
    --------------------------------------------------------
    Buscamos la conversación recargada.

    Si el backend ya devuelve el nombre correctamente,
    usamos esa.

    Si no, mantenemos el usuario encontrado.
    --------------------------------------------------------
    */

    const conversationId =
      conversation.id ||
      conversation.conversation_id ||
      conversation.conversationId;


    const refreshed =
      conversations.find(
        item => {

          const id =
            item.id ||
            item.conversation_id ||
            item.conversationId;

          return (
            String(id) ===
            String(conversationId)
          );

        }
      );


    if (refreshed) {

      const refreshedName =
        getConversationName(
          refreshed
        );


      if (
        refreshedName ===
        'Contacto'
      ) {

        refreshed.other_user =
          user;

      }


      await openConversation(
        refreshed
      );

    } else {

      await openConversation(
        conversation
      );

    }


    searchResults.innerHTML = '';

    searchInput.value = '';


  } catch (error) {

    console.error(
      'VOBIXCHAT CREATE CONVERSATION:',
      error
    );


    showToast(

      error.message ||

      'No se pudo abrir la conversación'

    );

  }

}

// ========================================================
// CARGAR MENSAJES
// ========================================================

async function loadMessages() {

  if (!currentConversation) {
    return;
  }


  const conversationId =

    currentConversation.id ||

    currentConversation.conversation_id ||

    currentConversation.conversationId;


  try {

    const data =
      await requestJSON(

        '/api/chat/conversations/' +

        encodeURIComponent(
          conversationId
        ) +

        '/messages'

      );


    const list =
      Array.isArray(data)

        ? data

        : (

            data.messages ||

            data.results ||

            data.data ||

            []

          );


    messages.innerHTML = '';


    list.forEach(
      message => {

        renderMessage(
          message
        );

      }
    );


    scrollBottom();


  } catch (error) {

    console.error(
      'VOBIXCHAT LOAD MESSAGES:',
      error
    );


    showToast(
      'No se pudieron cargar los mensajes'
    );

  }

}


// ========================================================
// MENSAJE
// ========================================================

function renderMessage(
  message
) {

  if (!message) {
    return;
  }


  const senderId =

    message.sender_user_id ||

    message.sender_id ||

    message.user_id ||

    message.senderUserId;


  const myId =
    me
      ? (
          me.id ||
          me.user_id ||
          me.userId
        )
      : null;


  const senderName =

    message.sender_username ||

    message.senderUsername ||

    getUsername(
      message.sender
    ) ||

    getUsername(
      message.user
    ) ||

    '';


  const myName =
    getUsername(me);


  const isMine =

    message.mine === true ||

    message.is_mine === true ||

    message.isMine === true ||

    (
      senderId &&
      myId &&
      String(senderId) ===
      String(myId)
    ) ||

    (
      senderName &&
      myName &&
      senderName.toLowerCase() ===
      myName.toLowerCase()
    );


  const row =
    document.createElement(
      'div'
    );


  row.className =
    'messageRow' +
    (
      isMine
        ? ' me'
        : ''
    );


  const content =

    message.content ??

    message.text ??

    message.message ??

    '';


  const created =

    message.created_at ||

    message.createdAt ||

    message.timestamp;


  const date =
    created
      ? new Date(created)
      : new Date();


  const time =
    date.toLocaleTimeString(
      [],
      {
        hour: '2-digit',
        minute: '2-digit'
      }
    );


  row.innerHTML = `

    <div class="bubble">

      ${
        !isMine &&
        senderName

          ? `

            <div class="messageSender">
              ${escapeHTML(senderName)}
            </div>

          `

          : ''
      }


      <div class="messageText">

        ${escapeHTML(content)}

      </div>


      <div class="messageMeta">

        <span>
          ${escapeHTML(time)}
        </span>

        ${
          isMine

            ? `
              <span class="ticks">
                ✓✓
              </span>
            `

            : ''
        }

      </div>

    </div>

  `;


  messages.appendChild(
    row
  );

}


// ========================================================
// ENVIAR MENSAJE
// ========================================================

async function sendMessage() {

  if (!currentConversation) {

    showToast(
      'Abre una conversación primero'
    );

    return;

  }


  const text =
    messageInput.value.trim();


  if (!text) {
    return;
  }


  const conversationId =

    currentConversation.id ||

    currentConversation.conversation_id ||

    currentConversation.conversationId;


  sendButton.disabled = true;


  try {

    const data =
      await requestJSON(

        '/api/chat/conversations/' +

        encodeURIComponent(
          conversationId
        ) +

        '/messages',

        {

          method: 'POST',

          headers: {

            'Content-Type':
              'application/json'

          },

          body:
            JSON.stringify({

              content: text,

              text: text,

              message_type:
                'text',

              type:
                'text'

            })

        }

      );


    messageInput.value = '';


    const message =
      data.message ||
      data;


    if (
      message &&
      (
        message.id ||
        message.message_id
      )
    ) {

      renderMessage({

        ...message,

        mine: true,

        sender_username:
          getUsername(me)

      });


      scrollBottom();

    }


  } catch (error) {

    console.error(
      'VOBIXCHAT SEND MESSAGE:',
      error
    );


    showToast(

      error.message ||

      'No se pudo enviar el mensaje'

    );


  } finally {

    sendButton.disabled =
      false;


    messageInput.focus();

  }

}


// ========================================================
// SOCKET - MENSAJES
// ========================================================

function socketMessage(
  data
) {

  if (!currentConversation) {
    return;
  }


  const currentId =

    currentConversation.id ||

    currentConversation.conversation_id ||

    currentConversation.conversationId;


  const incomingId =

    data.conversation_id ||

    data.conversationId;


  if (
    incomingId &&
    String(incomingId) !==
    String(currentId)
  ) {

    return;

  }


  renderMessage(
    data
  );


  scrollBottom();

}

  socketMessage
);

  'message',

);

searchInput.addEventListener(
  'keydown',
  event => {

    if (
      event.key === 'Enter'
    ) {

      searchUsers();

    }

  }
);


// ========================================================
// VOLVER
// ========================================================

backButton.addEventListener(
  'click',
  () => {

    app.classList.remove(
      'roomOpen'
    );

  }
);


// ========================================================
// CERRAR MENÚS
// ========================================================

document.addEventListener(
  'click',
  event => {


    if (
      !emojiPanel.contains(
        event.target
      ) &&
      !emojiButton.contains(
        event.target
      )
    ) {

      emojiPanel.classList.remove(
        'open'
      );

    }


    if (
      !attachMenu.contains(
        event.target
      ) &&
      !attachButton.contains(
        event.target
      )
    ) {

      attachMenu.classList.remove(
        'open'
      );

    }


  }
);


// ========================================================
// SOCKET CONECTADO
// ========================================================

socket.on(
  'connect',
  () => {


    console.log(
      'VOBIXCHAT SOCKET:',
      socket.id
    );


    if (me) {

      socket.emit(

        'set-user',

        getUsername(me)

      );

    }


  }
);


// ========================================================
// INICIAR
// ========================================================

loadConversations();


</script>


</body>
</html>
