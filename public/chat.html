      'call-request',

      {

        conversationId:
          conversationId,

        conversation_id:
          conversationId,

        type:
          'audio',

        username:
          getUsername(
            me
          ),

        targetName:
          contactName

      }

    );


    showToast(
      'Llamando a ' +
      contactName +
      '...'
    );

  }
);


// ========================================================
// VIDEOLLAMADA
// ========================================================

videoCallButton.addEventListener(
  'click',
  async () => {

    if (
      !currentConversation
    ) {

      showToast(
        'Abre una conversación primero'
      );

      return;

    }


    if (
      !navigator.mediaDevices ||
      !navigator.mediaDevices
        .getUserMedia
    ) {

      showToast(
        'Cámara o micrófono no disponibles'
      );

      return;

    }


    try {

      /*
        Comprobamos primero que el navegador tenga
        permiso de cámara y micrófono.
      */
      const stream =
        await navigator
          .mediaDevices
          .getUserMedia(
            {
              video:
                true,

              audio:
                true
            }
          );


      /*
        Todavía no iniciamos WebRTC aquí.
        Liberamos esta comprobación de permisos.
      */
      stream
        .getTracks()
        .forEach(
          track => {

            track.stop();

          }
        );


      const conversationId =
        getConversationId(
          currentConversation
        );


      if (!conversationId) {

        showToast(
          'Conversación no válida'
        );

        return;

      }


      const contactName =
        getConversationName(
          currentConversation
        );


      socket.emit(

        'call-request',

        {

          conversationId:
            conversationId,

          conversation_id:
            conversationId,

          type:
            'video',

          username:
            getUsername(
              me
            ),

          targetName:
            contactName

        }

      );


      showToast(
        'Videollamando a ' +
        contactName +
        '...'
      );

    } catch (error) {

      console.error(
        'VOBIXCHAT VIDEO:',
        error
      );


      showToast(
        'No se concedió acceso a cámara y micrófono'
      );

    }

  }
);


// ========================================================
// LLAMADA ENTRANTE
// ========================================================

socket.on(
  'call-request',
  data => {

    if (!data) {
      return;
    }


    const caller =

      data.username ||

      data.from ||

      getUsername(
        data.user
      ) ||

      'Contacto';


    const type =
      data.type === 'video'
        ? 'videollamada'
        : 'llamada';


    showToast(

      caller +
      ' está iniciando una ' +
      type

    );

  }
);


// ========================================================
// MÁS OPCIONES
// ========================================================

moreButton.addEventListener(
  'click',
  () => {

    if (
      !currentConversation
    ) {

      return;

    }


    showToast(
      'Opciones de conversación'
    );

  }
);


// ========================================================
// CERRAR MENÚS AL TOCAR FUERA
// ========================================================

document.addEventListener(
  'click',
  event => {

    if (
      !emojiPanel.contains(
        event.target
      ) &&
      !emojiButton.contains(
        event.target
      )
    ) {

      emojiPanel.classList.remove(
        'open'
      );

    }


    if (
      !attachMenu.contains(
        event.target
      ) &&
      !attachButton.contains(
        event.target
      )
    ) {

      attachMenu.classList.remove(
        'open'
      );

    }

  }
);


// ========================================================
// RECUPERAR INTERNET
// ========================================================

window.addEventListener(
  'online',
  async () => {

    showToast(
      'Conexión recuperada'
    );


    /*
      Socket.IO se reconectará automáticamente.
      Aun así dejamos marcada inmediatamente
      nuestra intención de volver a la sala.
    */
    rejoinCurrentConversation();


    /*
      PostgreSQL se consulta AQUÍ porque hubo
      realmente una interrupción de Internet.

      No hacemos este proceso después de cada
      mensaje normal.
    */
    try {

      await loadConversations();


      if (
        currentConversation
      ) {

        await loadMessages(
          currentConversation
        );

      }

    } catch (error) {

      console.warn(
        'VOBIXCHAT ONLINE SYNC:',
        error
      );

    }

  }
);


// ========================================================
// PERDER INTERNET
// ========================================================

window.addEventListener(
  'offline',
  () => {

    showToast(
      'Sin conexión a Internet'
    );


    if (
      currentConversation
    ) {

      roomStatus.textContent =
        'Sin conexión';

    }

  }
);


// ========================================================
// REGRESO DESDE SEGUNDO PLANO
//
// En móviles el navegador puede suspender la pestaña.
//
// Al regresar comprobamos el socket.
//
// IMPORTANTE:
// NO hacemos polling constante.
// NO esperamos 30 segundos para entregar mensajes.
// ========================================================

let visibilitySyncRunning =
  false;


document.addEventListener(
  'visibilitychange',
  async () => {

    if (
      document.visibilityState !==
        'visible' ||
      visibilitySyncRunning
    ) {

      return;

    }


    visibilitySyncRunning =
      true;


    try {

      /*
        Si Socket.IO sigue conectado, volvemos a
        asegurar la entrada en la sala.
      */
      if (
        socket.connected
      ) {

        rejoinCurrentConversation();

      }


      /*
        Esta consulta solo ocurre al regresar
        desde segundo plano.

        Recupera cualquier mensaje que pudiera
        haberse producido mientras el navegador
        estuvo suspendido.
      */
      await loadConversations();


      if (
        currentConversation
      ) {

        await loadMessages(
          currentConversation
        );

      }

    } catch (error) {

      console.warn(
        'VOBIXCHAT VISIBILITY SYNC:',
        error
      );

    } finally {

      visibilitySyncRunning =
        false;

    }

  }
);


// ========================================================
// FOCUS DE VENTANA
//
// No repetimos loadMessages() aquí porque
// visibilitychange ya cubre el regreso real desde
// segundo plano.
//
// Solamente aseguramos la sala Socket.IO.
// ========================================================

window.addEventListener(
  'focus',
  () => {

    if (
      socket.connected &&
      currentConversation
    ) {

      rejoinCurrentConversation();

    }

  }
);


// ========================================================
// PERMISO DE NOTIFICACIONES
//
// Se solicita después de una interacción real del
// usuario para respetar las restricciones modernas
// de los navegadores.
// ========================================================

let notificationPermissionAsked =
  false;


document.addEventListener(
  'pointerdown',
  () => {

    if (
      notificationPermissionAsked
    ) {

      return;

    }


    notificationPermissionAsked =
      true;


    requestNotificationPermission();

  },
  {
    once:
      true
  }
);
// ========================================================
// AJUSTAR ALTURA DEL TEXTAREA
// ========================================================

function resizeMessageInput() {

  messageInput.style.height =
    'auto';

  messageInput.style.height =
    Math.min(
      messageInput.scrollHeight,
      130
    ) + 'px';

}


messageInput.addEventListener(
  'input',
  resizeMessageInput
);


// ========================================================
// RESTAURAR ALTURA DESPUÉS DE ENVIAR
// ========================================================

messageInput.addEventListener(
  'input',
  () => {

    if (
      !messageInput.value
    ) {

      messageInput.style.height =
        '38px';

    }

  }
);


// ========================================================
// IDENTIFICAR USUARIO EN SOCKET
// ========================================================

function identifySocketUser() {

  if (
    !socket.connected ||
    !me
  ) {

    return;

  }


  const username =
    getUsername(
      me
    );


  const userId =
    normalizeId(

      me.id ??

      me.user_id ??

      me.userId ??

      ''

    );


  /*
    Compatibilidad con la identificación
    existente del servidor.
  */
  if (username) {

    socket.emit(
      'set-user',
      username
    );

  }


  socket.emit(

    'user-online',

    {

      username:
        username,

      userId:
        userId || null,

      user_id:
        userId || null,

      phone:
        getPhone(
          me
        ),

      token:
        getToken()

    }

  );

}


// ========================================================
// SOCKET AUTENTICADO
// ========================================================

socket.on(
  'authenticated',
  () => {

    /*
      Si el backend confirma autenticación después
      del evento connect, aseguramos nuevamente
      nuestra sala privada.
    */
    rejoinCurrentConversation();

  }
);


// ========================================================
// CONFIRMACIÓN DE ENTRADA A SALA
// ========================================================

socket.on(
  'conversation-joined',
  data => {

    if (!data) {
      return;
    }


    const conversationId =
      normalizeId(

        data.conversation_id ??

        data.conversationId ??

        data.id ??

        ''

      );


    if (conversationId) {

      joinedConversationId =
        conversationId;

    }

  }
);


// ========================================================
// SINCRONIZAR SALA ACTUAL DESPUÉS DE UN CORTE
//
// Esta función NO se usa para la recepción normal.
//
// Únicamente sirve como recuperación.
// ========================================================

async function recoverCurrentConversation() {

  if (
    !currentConversation
  ) {

    return;

  }


  const conversationId =
    getConversationId(
      currentConversation
    );


  if (!conversationId) {
    return;
  }


  /*
    Primero recuperamos la sala Socket.IO.
  */
  rejoinCurrentConversation();


  /*
    Después recuperamos de PostgreSQL cualquier
    mensaje que se hubiera producido mientras
    realmente estuvimos desconectados.
  */
  try {

    await loadMessages(
      currentConversation
    );

  } catch (error) {

    console.warn(
      'VOBIXCHAT RECOVERY:',
      error
    );

  }

}


// ========================================================
// DETECTAR CAMBIO DE PÁGINA VISIBLE
// ========================================================

let pageWasHidden =
  false;


document.addEventListener(
  'visibilitychange',
  () => {

    if (
      document.visibilityState ===
        'hidden'
    ) {

      pageWasHidden =
        true;

    }

  }
);


// ========================================================
// ESTADO INICIAL
// ========================================================

function renderLocalProfile() {

  if (!me) {

    myUsername.textContent =
      '@usuario';

    myAvatar.textContent =
      'V';

    return;

  }


  const username =

    getUsername(
      me
    ) ||

    getPhone(
      me
    ) ||

    'Usuario';


  myUsername.textContent =
    '@' + username;


  myAvatar.textContent =
    String(username)
      .charAt(0)
      .toUpperCase();

}


// ========================================================
// COMPROBAR SESIÓN
// ========================================================

function checkSession() {

  const token =
    getToken();


  if (!token) {

    console.warn(
      'VOBIXCHAT: token no encontrado'
    );

    showToast(
      'Sesión no disponible'
    );

    return false;

  }


  return true;

}


// ========================================================
// CARGA INICIAL DE CONVERSACIONES
// ========================================================

async function initialConversationLoad() {

  try {

    await loadConversations();

  } catch (error) {

    console.error(
      'VOBIXCHAT INITIAL CONVERSATIONS:',
      error
    );


    showToast(
      'No se pudieron cargar las conversaciones'
    );

  }

}


// ========================================================
// RECUPERACIÓN MANUAL CUANDO SOCKET VUELVE
// ========================================================

let socketRecoveryRunning =
  false;


async function recoverAfterSocketConnection() {

  if (
    socketRecoveryRunning
  ) {

    return;

  }


  socketRecoveryRunning =
    true;


  try {

    identifySocketUser();


    if (
      currentConversation
    ) {

      rejoinCurrentConversation();

    }


    /*
      Si la página estuvo realmente oculta,
      recuperamos el estado persistente.

      Si no estuvo oculta, NO recargamos mensajes
      innecesariamente.
    */
    if (
      pageWasHidden &&
      currentConversation
    ) {

      await recoverCurrentConversation();

      pageWasHidden =
        false;

    }

  } catch (error) {

    console.warn(
      'VOBIXCHAT SOCKET RECOVERY:',
      error
    );

  } finally {

    socketRecoveryRunning =
      false;

  }

}


// ========================================================
// CONEXIÓN SOCKET — REFUERZO FINAL
//
// Ya existe un listener connect en el bloque anterior.
// Socket.IO permite múltiples listeners.
//
// Este segundo listener NO envía mensajes.
// Únicamente garantiza identidad y sala.
// ========================================================

socket.on(
  'connect',
  () => {

    identifySocketUser();

    rejoinCurrentConversation();

  }
);


// ========================================================
// MENSAJES QUE LLEGAN DURANTE CARGA DEL HISTORIAL
//
// IMPORTANTE:
//
// Puede ocurrir:
//
// 1. usuario abre sala
// 2. GET /messages comienza
// 3. llega mensaje Socket.IO
// 4. renderMessage() lo pinta
// 5. termina GET /messages
//
// Si el GET fue iniciado antes de que llegara el nuevo
// mensaje, su respuesta podría no contenerlo.
//
// Para evitar que loadMessages() borre accidentalmente
// una burbuja recién recibida, guardamos temporalmente
// los mensajes en tiempo real recibidos mientras una
// carga está activa.
// ========================================================

const realtimeMessagesDuringLoad =
  new Map();


let messagesLoadCounter =
  0;


// ========================================================
// GUARDAR MENSAJE EN TIEMPO REAL COMO RESPALDO
// ========================================================

function rememberRealtimeMessage(
  rawMessage
) {

  const message =
    normalizeIncomingMessage(
      rawMessage
    );


  if (!message) {
    return;
  }


  const conversationId =
    getConversationIdFromMessage(
      message
    );


  if (!conversationId) {
    return;
  }


  const messageId =
    getMessageId(
      message
    );


  if (!messageId) {
    return;
  }


  if (
    !realtimeMessagesDuringLoad.has(
      conversationId
    )
  ) {

    realtimeMessagesDuringLoad.set(
      conversationId,
      new Map()
    );

  }


  realtimeMessagesDuringLoad
    .get(
      conversationId
    )
    .set(
      messageId,
      message
    );

}


// ========================================================
// LISTENERS DE RESPALDO PARA CARGAS SIMULTÁNEAS
//
// NO renderizan una segunda vez.
// receiveSocketMessage() sigue siendo quien pinta.
//
// Aquí solamente conservamos una referencia del mensaje.
// ========================================================

socket.on(
  'chat:message',
  rememberRealtimeMessage
);


socket.on(
  'message:new',
  rememberRealtimeMessage
);


socket.on(
  'conversation-message',
  rememberRealtimeMessage
);


// ========================================================
// CARGAR HISTORIAL SIN PERDER MENSAJES EN TIEMPO REAL
//
// Sustituimos la referencia utilizada por las llamadas
// posteriores a loadMessages().
//
// Mantiene la misma API:
// loadMessages(conversation)
// ========================================================

const baseLoadMessages =
  loadMessages;


loadMessages =
  async function(
    conversation =
      currentConversation
  ) {

    if (!conversation) {
      return;
    }


    const conversationId =
      getConversationId(
        conversation
      );


    if (!conversationId) {
      return;
    }


    const thisLoad =
      ++messagesLoadCounter;


    try {

      await baseLoadMessages(
        conversation
      );


      /*
        Si mientras cargábamos entró algún mensaje
        Socket.IO para ESTA conversación, comprobamos
        que continúe visible después de reconstruir
        el historial.
      */
      const realtime =
        realtimeMessagesDuringLoad.get(
          conversationId
        );


      if (
        realtime &&
        currentConversation &&
        getConversationId(
          currentConversation
        ) ===
        conversationId
      ) {

        for (
          const message
          of realtime.values()
        ) {

          renderMessage(
            message
          );

        }


        scrollBottom(
          true
        );

      }


      /*
        Solo la carga más reciente limpia el respaldo.
      */
      if (
        thisLoad ===
        messagesLoadCounter
      ) {

        realtimeMessagesDuringLoad.delete(
          conversationId
        );

      }

    } catch (error) {

      throw error;

    }

  };


// ========================================================
// NOTA SOBRE LA RECEPCIÓN
//
// La ruta NORMAL continúa siendo:
//
// routes/chat.js
//      ↓
// chat:message / message:new
//      ↓
// receiveSocketMessage()
//      ↓
// isConversationOpen()
//      ↓
// renderMessage()
//      ↓
// BURBUJA
//
// realtimeMessagesDuringLoad NO introduce retraso.
// Solamente evita que una petición GET antigua pueda
// borrar una burbuja que acaba de llegar.
// ========================================================


// ========================================================
// SIN POLLING DE MENSAJES
//
// DELIBERADAMENTE NO EXISTE:
//
// setInterval(loadMessages, 30000)
//
// ni:
//
// setInterval(loadMessages, 5000)
//
// ni:
//
// setInterval(loadMessages, 1000)
//
// Socket.IO es el canal de entrega en tiempo real.
//
// PostgreSQL se consulta:
// - al abrir sala;
// - después de una desconexión;
// - al volver desde segundo plano.
//
// Esto evita que el usuario tenga que esperar un
// intervalo para ver el mensaje.
// ========================================================


// ========================================================
// REPARACIÓN DEL ESTADO AL VOLVER A LA PESTAÑA
// ========================================================

document.addEventListener(
  'visibilitychange',
  async () => {

    if (
      document.visibilityState !==
        'visible'
    ) {

      return;

    }


    if (
      !navigator.onLine
    ) {

      return;

    }


    /*
      Primero rejoin. No esperamos HTTP para recuperar
      la conexión en tiempo real.
    */
    rejoinCurrentConversation();


    /*
      Después sincronizamos persistencia porque el
      navegador móvil pudo haber estado suspendido.
    */
    if (
      pageWasHidden
    ) {

      pageWasHidden =
        false;


      try {

        await loadConversations();


        if (
          currentConversation
        ) {

          await loadMessages(
            currentConversation
          );

        }

      } catch (error) {

        console.warn(
          'VOBIXCHAT RETURN SYNC:',
          error
        );

      }

    }

  }
);


// ========================================================
// PREVENIR CONTADOR EN LA SALA ABIERTA
// ========================================================

function enforceCurrentConversationUnreadState() {

  if (
    !currentConversation
  ) {

    return;

  }


  const conversationId =
    getConversationId(
      currentConversation
    );


  if (!conversationId) {
    return;
  }


  if (
    unreadConversations.has(
      conversationId
    )
  ) {

    unreadConversations.delete(
      conversationId
    );

    renderConversations();

  }

}


// ========================================================
// CUANDO LA VENTANA RECIBE FOCO
// ========================================================

window.addEventListener(
  'focus',
  () => {

    enforceCurrentConversationUnreadState();

    rejoinCurrentConversation();

  }
);


// ========================================================
// LIMPIAR TYPING CUANDO CAMBIA LA SALA
// ========================================================

conversationList.addEventListener(
  'click',
  () => {

    typing.textContent =
      '';

    clearTimeout(
      typingTimer
    );

  }
);


// ========================================================
// INICIALIZAR NOTIFICACIONES SIN BLOQUEAR EL CHAT
// ========================================================

function prepareNotifications() {

  /*
    No solicitamos permiso automáticamente al cargar.

    El listener pointerdown del bloque anterior
    lo solicitará después de una interacción real.
  */

  if (
    !('Notification' in window)
  ) {

    console.log(
      'VOBIXCHAT: navegador sin Notification API'
    );

  }

}


// ========================================================
// INICIAR VOBIXCHAT
// ========================================================

async function initVobixChat() {

  console.log(
    'VOBIXCHAT iniciando...'
  );


  renderLocalProfile();


  checkSession();


  prepareNotifications();


  /*
    Cargamos la lista inicial una sola vez.
  */
  await initialConversationLoad();


  /*
    Si Socket.IO ya consiguió conexión antes de
    terminar la carga HTTP, identificamos la cuenta.
  */
  if (
    socket.connected
  ) {

    identifySocketUser();

  }


  if (
    !navigator.onLine
  ) {

    showToast(
      'Sin conexión a Internet'
    );

  }


  console.log(
    'VOBIXCHAT listo'
  );

}


// ========================================================
// LIMPIEZA
// ========================================================

window.addEventListener(
  'beforeunload',
  () => {

    clearTimeout(
      typingTimer
    );


    clearTimeout(
      toastTimer
    );


    clearTimeout(
      conversationRefreshTimer
    );

  }
);


// ========================================================
// ARRANQUE
// ========================================================

initVobixChat();


// ========================================================
// FIN DE VOBIXCHAT
// ========================================================

</script>
