<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>VobixChat</title><style>body{margin:0;background:#080c09;color:#fff;font-family:Arial;display:flex;height:100vh}.side{width:260px;background:#0a110b;border-right:2px solid #3aff68;padding:14px}.main{flex:1;display:flex;flex-direction:column}.head{padding:14px;border-bottom:1px solid #1e3a22;background:#0a110b}.msgs{flex:1;padding:12px;overflow:auto}.b{background:#1a2b1e;padding:10px 12px;border-radius:12px;margin:6px 0;max-width:70%}.me{background:#3aff68;color:#000;margin-left:auto}.input{display:flex;gap:6px;padding:10px;background:#0a110b;border-top:1px solid #1e3a22}.input input{flex:1;background:#0a150c;border:1px solid #234427;border-radius:10px;padding:10px;color:#fff}.input button{background:#3aff68;border:none;border-radius:10px;padding:10px 14px;font-weight:900}</style></head><body><div class="side"><h3 style="color:#3aff68">VOBIXCHAT</h3><div style="border:1px solid #3aff68;padding:10px;border-radius:10px"><b id="un">SHNEYDER</b><br><small id="up"></small></div><br><small style="color:#8ac898">🔒 Cifrado de extremo a extremo</small><br><br><button onclick="localStorage.clear();location.href='index.html'" style="width:100%;background:transparent;color:#3aff68;border:1px solid #3aff68;padding:8px;border-radius:8px">Salir</button></div><div class="main"><div class="head">💬 Chat - <span id="un2">SHNEYDER</span></div><div class="msgs" id="msgs"><div class="b">¡Bienvenido a VobixChat! 🎉 Ya estás dentro.</div></div><div class="input"><input id="t" placeholder="Escribe..."><button onclick="s()">Enviar</button></div></div><script>document.getElementById('un').innerText=localStorage.getItem('vobix_user')||'SHNEYDER';document.getElementById('up').innerText=localStorage.getItem('vobix_phone')||'';document.getElementById('un2').innerText=localStorage.getItem('vobix_user')||'SHNEYDER';function s(){let i=document.getElementById('t');if(!i.value.trim())return;let d=document.createElement('div');d.className='b me';d.innerText=i.value;document.getElementById('msgs').appendChild(d);i.value='';}document.getElementById('t').addEventListener('keydown',e=>{if(e.key==='Enter')s()})</script></body></html>
