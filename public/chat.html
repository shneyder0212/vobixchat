<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  >

  <meta
    name="theme-color"
    content="#031108"
  >

  <title>VobixChat</title>

  <script src="/socket.io/socket.io.js"></script>

  <style>

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: Arial, Helvetica, sans-serif;
      background: #020d06;
      color: #ffffff;
    }

    button,
    input,
    textarea {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    #app {
      width: 100%;
      height: 100dvh;
      display: flex;
      background:
        radial-gradient(
          circle at 40% 30%,
          rgba(75, 255, 92, 0.06),
          transparent 32%
        ),
        #020d06;
    }


    /* =====================================================
       SIDEBAR
    ===================================================== */

    #sidebar {
      width: 350px;
      min-width: 350px;
      height: 100%;
      display: flex;
      flex-direction: column;
      border-right: 1px solid rgba(93, 255, 112, 0.18);
      background: rgba(2, 20, 9, 0.97);
      overflow: hidden;
    }

    .sidebarTop {
      padding: 18px 16px 15px;
      border-bottom: 1px solid rgba(93, 255, 112, 0.15);
    }

    .brandRow {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .logo {
      width: 45px;
      height: 45px;
      min-width: 45px;
      border-radius: 13px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #5dff70;
      color: #071108;
      font-weight: 900;
      font-size: 24px;
      box-shadow: 0 0 25px rgba(93, 255, 112, 0.30);
    }

    .brandInfo {
      min-width: 0;
      flex: 1;
    }

    .brandName {
      font-size: 17px;
      font-weight: 900;
      letter-spacing: 0.4px;
    }

    #myUsername {
      margin-top: 2px;
      color: #9db5a2;
      font-size: 12px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    #myAvatar {
      width: 39px;
      height: 39px;
      min-width: 39px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 1px solid rgba(93, 255, 112, 0.22);
      background: rgba(93, 255, 112, 0.07);
      color: #5dff70;
      font-weight: 900;
    }


    /* =====================================================
       BUSCADOR
    ===================================================== */

    .searchArea {
      padding: 14px 14px 12px;
      border-bottom: 1px solid rgba(93, 255, 112, 0.12);
    }

    .searchRow {
      display: flex;
      gap: 8px;
    }

    #searchInput {
      width: 100%;
      min-width: 0;
      height: 45px;
      padding: 0 13px;
      border-radius: 12px;
      border: 1px solid rgba(142, 181, 150, 0.26);
      outline: none;
      background: rgba(7, 29, 14, 0.88);
      color: #ffffff;
    }

    #searchInput::placeholder {
      color: #93a898;
    }

    #searchInput:focus {
      border-color: rgba(93, 255, 112, 0.65);
      box-shadow: 0 0 0 2px rgba(93, 255, 112, 0.06);
    }

    #searchButton {
      width: 46px;
      min-width: 46px;
      height: 45px;
      border: 0;
      border-radius: 12px;
      background: #5dff70;
      color: #061108;
      font-size: 18px;
      font-weight: 900;
    }

    .searchHelp {
      margin-top: 9px;
      color: #78917d;
      font-size: 11px;
      line-height: 1.35;
    }

    #searchResults {
      max-height: 230px;
      overflow-y: auto;
    }


    /* =====================================================
       CONVERSACIONES
    ===================================================== */

    .conversationHeader {
      padding: 14px 15px 8px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      color: #d4e8d7;
      font-size: 12px;
      font-weight: 900;
      letter-spacing: 0.7px;
    }

    #conversationCount {
      color: #9db5a2;
    }

    #conversationList {
      flex: 1;
      overflow-y: auto;
      padding-bottom: 15px;
    }

    .conversation {
      position: relative;
      min-height: 68px;
      display: flex;
      align-items: center;
      gap: 11px;
      padding: 10px 13px;
      border-left: 3px solid transparent;
      cursor: pointer;
      transition:
        background 0.15s ease,
        border-color 0.15s ease;
    }

    .conversation:hover {
      background: rgba(93, 255, 112, 0.045);
    }

    .conversation.active {
      background: rgba(93, 255, 112, 0.075);
      border-left-color: #5dff70;
    }

    .avatar {
      width: 43px;
      height: 43px;
      min-width: 43px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #5dff70;
      color: #071108;
      font-weight: 900;
      font-size: 17px;
    }

    .conversationBody {
      flex: 1;
      min-width: 0;
    }

    .conversationName {
      color: #f2fff4;
      font-size: 14px;
      font-weight: 800;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .conversationPreview {
      margin-top: 5px;
      color: #78917d;
      font-size: 12px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .unreadBadge {
      display: none;
      min-width: 20px;
      height: 20px;
      padding: 0 6px;
      border-radius: 999px;
      align-items: center;
      justify-content: center;
      background: #5dff70;
      color: #071108;
      font-size: 10px;
      font-weight: 900;
    }

    .unreadBadge.show {
      display: flex;
    }


    /* =====================================================
       PANEL DERECHO
    ===================================================== */

    #main {
      flex: 1;
      min-width: 0;
      height: 100%;
      position: relative;
      overflow: hidden;
    }

    #emptyState {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 30px;
    }

    .emptyContent {
      max-width: 520px;
    }

    .emptyLogo {
      width: 72px;
      height: 72px;
      margin: 0 auto 17px;
      border-radius: 19px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #5dff70;
      color: #071108;
      font-size: 36px;
      font-weight: 900;
      box-shadow: 0 0 40px rgba(93, 255, 112, 0.25);
    }

    .emptyTitle {
      font-size: 28px;
      font-weight: 900;
    }

    .emptyText {
      margin-top: 12px;
      color: #9ab29f;
      font-size: 13px;
      line-height: 1.6;
    }


    /* =====================================================
       SALA PRIVADA
    ===================================================== */

    #chatRoom {
      position: absolute;
      inset: 0;
      display: none;
      flex-direction: column;
      background:
        radial-gradient(
          circle at 50% 25%,
          rgba(93, 255, 112, 0.045),
          transparent 35%
        ),
        #020d06;
    }

    .roomHeader {
      height: 70px;
      min-height: 70px;
      display: flex;
      align-items: center;
      gap: 11px;
      padding: 0 16px;
      border-bottom: 1px solid rgba(93, 255, 112, 0.15);
      background: rgba(2, 18, 8, 0.96);
    }

    #backButton {
      display: none;
      width: 38px;
      height: 38px;
      border: 0;
      border-radius: 50%;
      background: transparent;
      color: #ffffff;
      font-size: 25px;
    }

    #roomAvatar {
      width: 43px;
      height: 43px;
      min-width: 43px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #5dff70;
      color: #071108;
      font-weight: 900;
      font-size: 17px;
    }

    .roomIdentity {
      min-width: 0;
      flex: 1;
    }

    #roomName {
      font-size: 15px;
      font-weight: 900;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    #roomStatus {
      margin-top: 3px;
      color: #7f9984;
      font-size: 11px;
    }

    .roomActions {
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .roomAction {
      width: 39px;
      height: 39px;
      border: 0;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      background: transparent;
      color: #b9cfbd;
      font-size: 19px;
    }

    .roomAction:hover {
      background: rgba(93, 255, 112, 0.07);
      color: #5dff70;
    }


    /* =====================================================
       MENSAJES
    ===================================================== */

    #messages {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      padding: 20px 18px 12px;
      scroll-behavior: smooth;
    }

    .messageRow {
      width: 100%;
      display: flex;
      justify-content: flex-start;
      margin: 4px 0;
    }

    .messageRow.me {
      justify-content: flex-end;
    }

    .bubble {
      max-width: min(72%, 620px);
      padding: 9px 11px 7px;
      border-radius: 4px 14px 14px 14px;
      background: #102519;
      border: 1px solid rgba(255, 255, 255, 0.035);
      box-shadow: 0 3px 12px rgba(0, 0, 0, 0.10);
      overflow-wrap: anywhere;
    }

    .messageRow.me .bubble {
      background: #164522;
      border-radius: 14px 4px 14px 14px;
    }

    .messageSender {
      margin-bottom: 4px;
      color: #5dff70;
      font-size: 11px;
      font-weight: 800;
    }

    .messageText {
      color: #f1fff3;
      font-size: 14px;
      line-height: 1.4;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .messageMeta {
      margin-top: 4px;
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 5px;
      color: #8ba391;
      font-size: 9px;
      line-height: 1;
    }

    .ticks {
      color: #7fe98b;
      font-weight: 900;
    }

    #typing {
      min-height: 20px;
      padding: 2px 18px 4px;
      color: #74d980;
      font-size: 11px;
    }


    /* =====================================================
       COMPOSITOR
    ===================================================== */

    .composerWrap {
      position: relative;
      padding:
        9px
        12px
        calc(9px + env(safe-area-inset-bottom));
      border-top: 1px solid rgba(93, 255, 112, 0.12);
      background: rgba(2, 17, 8, 0.97);
    }

    .composer {
      min-height: 48px;
      display: flex;
      align-items: flex-end;
      gap: 5px;
      padding: 5px 6px;
      border-radius: 16px;
      background: #0b2112;
      border: 1px solid rgba(93, 255, 112, 0.13);
    }

    .composerButton {
      width: 38px;
      height: 38px;
      min-width: 38px;
      border: 0;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      background: transparent;
      color: #a8c0ad;
      font-size: 18px;
    }

    .composerButton:hover {
      background: rgba(93, 255, 112, 0.07);
      color: #5dff70;
    }

    #messageInput {
      flex: 1;
      min-width: 0;
      min-height: 38px;
      max-height: 130px;
      resize: none;
      border: 0;
      outline: 0;
      padding: 9px 7px;
      background: transparent;
      color: #ffffff;
      line-height: 20px;
      overflow-y: auto;
    }

    #messageInput::placeholder {
      color: #718877;
    }

    #sendButton {
      width: 40px;
      height: 40px;
      min-width: 40px;
      border: 0;
      border-radius: 50%;
      background: #5dff70;
      color: #061108;
      font-size: 17px;
      font-weight: 900;
    }

    #sendButton:disabled {
      opacity: 0.55;
      cursor: default;
    }


    /* =====================================================
       EMOJIS
    ===================================================== */

    #emojiPanel {
      position: absolute;
      left: 12px;
      bottom: 68px;
      width: 280px;
      max-width: calc(100vw - 24px);
      padding: 10px;
      display: none;
      grid-template-columns: repeat(7, 1fr);
      gap: 5px;
      border-radius: 14px;
      border: 1px solid rgba(93, 255, 112, 0.18);
      background: #092010;
      box-shadow: 0 15px 40px rgba(0, 0, 0, 0.42);
      z-index: 20;
    }

    #emojiPanel.open {
      display: grid;
    }

    .emoji {
      height: 34px;
      border: 0;
      border-radius: 8px;
      background: transparent;
      font-size: 21px;
    }

    .emoji:hover {
      background: rgba(93, 255, 112, 0.09);
    }


    /* =====================================================
       ADJUNTOS
    ===================================================== */

    #attachMenu {
      position: absolute;
      left: 52px;
      bottom: 68px;
      width: 190px;
      display: none;
      padding: 7px;
      border-radius: 13px;
      border: 1px solid rgba(93, 255, 112, 0.18);
      background: #092010;
      box-shadow: 0 15px 40px rgba(0, 0, 0, 0.42);
      z-index: 20;
    }

    #attachMenu.open {
      display: block;
    }

    .attachOption {
      width: 100%;
      height: 42px;
      border: 0;
      border-radius: 9px;
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 0 10px;
      background: transparent;
      color: #e9ffed;
      text-align: left;
    }

    .attachOption:hover {
      background: rgba(93, 255, 112, 0.08);
    }


    /* =====================================================
       TOAST
    ===================================================== */

    #toast {
      position: fixed;
      left: 50%;
      bottom: 82px;
      transform: translate(-50%, 15px);
      max-width: calc(100vw - 30px);
      padding: 10px 15px;
      border-radius: 999px;
      background: rgba(19, 43, 25, 0.97);
      border: 1px solid rgba(93, 255, 112, 0.22);
      color: #effff1;
      font-size: 12px;
      opacity: 0;
      pointer-events: none;
      transition:
        opacity 0.18s ease,
        transform 0.18s ease;
      z-index: 100;
    }

    #toast.show {
      opacity: 1;
      transform: translate(-50%, 0);
    }

    .hiddenInput {
      display: none;
    }


    /* =====================================================
       RESPONSIVE
    ===================================================== */

    @media (max-width: 760px) {

      #sidebar {
        width: 100%;
        min-width: 100%;
        border-right: 0;
      }

      #main {
        position: fixed;
        inset: 0;
        z-index: 30;
        pointer-events: none;
        visibility: hidden;
        transform: translateX(100%);
        transition: transform 0.20s ease;
      }

      #app.roomOpen #main {
        pointer-events: auto;
        visibility: visible;
        transform: translateX(0);
      }

      #backButton {
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .roomHeader {
        padding: 0 9px;
      }

      .roomActions {
        gap: 0;
      }

      .roomAction {
        width: 35px;
        height: 35px;
      }

      #messages {
        padding: 15px 10px 10px;
      }

      .bubble {
        max-width: 84%;
      }

      .composerWrap {
        padding-left: 7px;
        padding-right: 7px;
      }

      .composer {
        gap: 1px;
        padding-left: 2px;
        padding-right: 3px;
      }

      .composerButton {
        width: 34px;
        min-width: 34px;
      }

    }

  </style>

</head>


<body>

<div id="app">

  <aside id="sidebar">

    <div class="sidebarTop">

      <div class="brandRow">

        <div class="logo">V</div>

        <div class="brandInfo">

          <div class="brandName">
            VOBIXCHAT
          </div>

          <div id="myUsername">
            @usuario
          </div>

        </div>

        <div id="myAvatar">
          V
        </div>

      </div>

    </div>


    <div class="searchArea">

      <div class="searchRow">

        <input
          id="searchInput"
          type="text"
          autocomplete="off"
          placeholder="Buscar usuario o teléfono"
        >

        <button
          id="searchButton"
          type="button"
          aria-label="Buscar"
        >
          ⌕
        </button>

      </div>

      <div class="searchHelp">
        Encuentra personas y abre una conversación privada.
      </div>

      <div id="searchResults"></div>

    </div>


    <div class="conversationHeader">

      <span>
        CONVERSACIONES
      </span>

      <span id="conversationCount">
        0
      </span>

    </div>


    <div id="conversationList">

      <div
        style="
          color:#7f9984;
          text-align:center;
          padding:35px 15px;
          font-size:13px;
        "
      >
        Todavía no tienes conversaciones.
      </div>

    </div>

  </aside>


  <main id="main">

    <section id="emptyState">

      <div class="emptyContent">

        <div class="emptyLogo">
          V
        </div>

        <div class="emptyTitle">
          VOBIXCHAT
        </div>

        <div class="emptyText">
          Selecciona una conversación o busca una persona para comenzar.
          <br>
          Tus conversaciones se mantienen separadas en salas privadas.
        </div>

      </div>

    </section>


    <section id="chatRoom">

      <header class="roomHeader">

        <button
          id="backButton"
          type="button"
          aria-label="Volver"
        >
          ‹
        </button>

        <div id="roomAvatar">
          V
        </div>

        <div class="roomIdentity">

          <div id="roomName">
            Conversación
          </div>

          <div id="roomStatus">
            Conversación privada
          </div>

        </div>


        <div class="roomActions">

          <button
            id="voiceCallButton"
            class="roomAction"
            type="button"
            title="Llamada"
            aria-label="Llamada"
          >
            ☎
          </button>

          <button
            id="videoCallButton"
            class="roomAction"
            type="button"
            title="Videollamada"
            aria-label="Videollamada"
          >
            ▣
          </button>

          <button
            id="moreButton"
            class="roomAction"
            type="button"
            title="Más opciones"
            aria-label="Más opciones"
          >
            ⋮
          </button>

        </div>

      </header>


      <div id="messages"></div>

      <div id="typing"></div>


      <div class="composerWrap">

        <div id="emojiPanel">

          <button class="emoji" type="button">😀</button>
          <button class="emoji" type="button">😂</button>
          <button class="emoji" type="button">😍</button>
          <button class="emoji" type="button">🥰</button>
          <button class="emoji" type="button">😎</button>
          <button class="emoji" type="button">😢</button>
          <button class="emoji" type="button">😭</button>

          <button class="emoji" type="button">😡</button>
          <button class="emoji" type="button">👍</button>
          <button class="emoji" type="button">👎</button>
          <button class="emoji" type="button">👏</button>
          <button class="emoji" type="button">🙏</button>
          <button class="emoji" type="button">❤️</button>
          <button class="emoji" type="button">💚</button>

          <button class="emoji" type="button">🔥</button>
          <button class="emoji" type="button">🎉</button>
          <button class="emoji" type="button">✨</button>
          <button class="emoji" type="button">💯</button>
          <button class="emoji" type="button">😘</button>
          <button class="emoji" type="button">🤔</button>
          <button class="emoji" type="button">😉</button>

        </div>


        <div id="attachMenu">

          <button
            id="photoOption"
            class="attachOption"
            type="button"
          >
            🖼️ Foto o vídeo
          </button>

          <button
            id="documentOption"
            class="attachOption"
            type="button"
          >
            📄 Documento
          </button>

          <button
            id="cameraOption"
            class="attachOption"
            type="button"
          >
            📷 Cámara
          </button>

        </div>


        <div class="composer">

          <button
            id="emojiButton"
            class="composerButton"
            type="button"
            title="Emoji"
            aria-label="Emoji"
          >
            ☺
          </button>

          <button
            id="attachButton"
            class="composerButton"
            type="button"
            title="Adjuntar"
            aria-label="Adjuntar"
          >
            📎
          </button>

          <button
            id="cameraButton"
            class="composerButton"
            type="button"
            title="Cámara"
            aria-label="Cámara"
          >
            📷
          </button>

          <textarea
            id="messageInput"
            rows="1"
            maxlength="5000"
            autocomplete="off"
            placeholder="Escribe un mensaje"
          ></textarea>

          <button
            id="audioButton"
            class="composerButton"
            type="button"
            title="Micrófono"
            aria-label="Micrófono"
          >
            🎤
          </button>

          <button
            id="sendButton"
            type="button"
            title="Enviar"
            aria-label="Enviar"
          >
            ➤
          </button>

        </div>

      </div>

    </section>

  </main>

</div>


<input
  id="mediaInput"
  class="hiddenInput"
  type="file"
  accept="image/*,video/*"
>

<input
  id="documentInput"
  class="hiddenInput"
  type="file"
>

<input
  id="cameraInput"
  class="hiddenInput"
  type="file"
  accept="image/*"
  capture="environment"
>

<div id="toast"></div>


<script>

'use strict';


// ========================================================
// SOCKET.IO
// ========================================================

const socket =
  io({

    transports: [
      'websocket',
      'polling'
    ],

    reconnection:
      true,

    reconnectionAttempts:
      Infinity,

    reconnectionDelay:
      400,

    reconnectionDelayMax:
      2500,

    timeout:
      10000

  });


// ========================================================
// ESTADO PRINCIPAL
// ========================================================

let me =
  null;

let conversations =
  [];

// ========================================================
// NORMALIZAR IDENTIFICADORES
// ========================================================

function normalizeId(
  value
) {

  if (
    value === null ||
    value === undefined
  ) {

    return '';

  }


  return String(
    value
  ).trim();

}


// ========================================================
// ID DE UNA CONVERSACIÓN
//
// IMPORTANTE:
//
// Esta función se utiliza SOLAMENTE con objetos que
// sabemos que representan conversaciones.
//
// Aquí sí podemos aceptar conversation.id.
// ========================================================

function getConversationId(
  conversation
) {

  if (
    !conversation ||
    typeof conversation !==
      'object'
  ) {

    return '';

  }


  return normalizeId(

    conversation.conversation_id ??

    conversation.conversationId ??

    conversation.id ??

    ''

  );

}


// ========================================================
// ID DE CONVERSACIÓN DESDE UN MENSAJE
//
// REPARACIÓN CRÍTICA:
//
// AQUÍ NO EXISTE:
//
// message.id
//
// porque message.id es el ID DEL MENSAJE.
//
// Para decidir a qué sala pertenece una burbuja,
// únicamente aceptamos campos que explícitamente
// representen la conversación.
// ========================================================

function getMessageConversationId(
  message
) {

  if (
    !message ||
    typeof message !==
      'object'
  ) {

    return '';

  }


  const direct =
    normalizeId(

      message.conversation_id ??

      message.conversationId ??

      message.chat_id ??

      message.chatId ??

      message.room_id ??

      message.roomId ??

      ''

    );


  if (direct) {

    return direct;

  }


  /*
    También admitimos un objeto conversation
    explícitamente anidado.
  */
  if (
    message.conversation &&
    typeof message.conversation ===
      'object'
  ) {

    return normalizeId(

      message.conversation
        .conversation_id ??

      message.conversation
        .conversationId ??

      message.conversation
        .id ??

      ''

    );

  }


  return '';

}


// ========================================================
// ID DEL MENSAJE
//
// Separado completamente del conversationId.
// ========================================================

function getMessageId(
  message
) {

  if (
    !message ||
    typeof message !==
      'object'
  ) {

    return '';

  }


  return normalizeId(

    message.message_id ??

    message.messageId ??

    message.id ??

    message.uuid ??

    ''

  );

}


// ========================================================
// EXTRAER MENSAJE DESDE EVENTO SOCKET
//
// El backend puede enviar directamente el mensaje:
//
// { id, conversation_id, content }
//
// o envolverlo:
//
// {
//   conversationId: 10,
//   message: {...}
// }
//
// Esta función conserva ambos datos SIN confundir
// el ID del mensaje con el ID de conversación.
// ========================================================

function normalizeSocketMessage(
  payload
) {

  if (
    !payload ||
    typeof payload !==
      'object'
  ) {

    return null;

  }


  let message;


  if (
    payload.message &&
    typeof payload.message ===
      'object'
  ) {

    message = {
      ...payload.message
    };

  } else {

    message = {
      ...payload
    };

  }


  let conversationId =
    getMessageConversationId(
      message
    );


  /*
    Solo si el mensaje no lo trae, buscamos campos
    EXPLÍCITOS de conversación en el envoltorio.

    OBSERVA QUE NO USAMOS payload.id.
  */
  if (!conversationId) {

    conversationId =
      normalizeId(

        payload.conversation_id ??

        payload.conversationId ??

        payload.chat_id ??

        payload.chatId ??

        payload.room_id ??

        payload.roomId ??

        ''

      );

  }


  /*
    Última forma permitida:
    payload.conversation.id

    Sabemos que ese ID pertenece explícitamente
    a un objeto llamado conversation.
  */
  if (
    !conversationId &&
    payload.conversation &&
    typeof payload.conversation ===
      'object'
  ) {

    conversationId =
      getConversationId(
        payload.conversation
      );

  }


  if (conversationId) {

    /*
      Desde aquí todo mensaje normalizado posee
      explícitamente conversation_id.
    */
    message.conversation_id =
      conversationId;

    message.conversationId =
      conversationId;

  }


  return message;

}


// ========================================================
// ¿PERTENECE A LA SALA ABIERTA?
//
// ESTA ES LA COMPARACIÓN QUE REPARA EL PROBLEMA
// MOSTRADO EN EL VÍDEO.
//
// No busca el nombre "Emilio".
// No consulta el historial lateral.
// No hace HTTP.
// No usa message.id.
//
// Compara:
//
// message.conversation_id
//
// contra:
//
// activeConversationId
// ========================================================

function messageBelongsToOpenRoom(
  message
) {

  const messageConversationId =
    getMessageConversationId(
      message
    );


  if (
    !messageConversationId ||
    !activeConversationId
  ) {

    return false;

  }


  return (
    normalizeId(
      messageConversationId
    ) ===
    normalizeId(
      activeConversationId
    )
  );

}


// ========================================================
// USUARIO LOCAL
// ========================================================

function getLocalUser() {

  const keys = [
    'vobix_user',
    'vobixUser',
    'user'
  ];


  for (
    const key
    of keys
  ) {

    try {

      const raw =
        localStorage.getItem(
          key
        );


      if (!raw) {
        continue;
      }


      const parsed =
        JSON.parse(
          raw
        );


      if (
        parsed &&
        typeof parsed ===
          'object'
      ) {

        return parsed;

      }

    } catch (error) {

      console.warn(
        'VOBIXCHAT LOCAL USER:',
        error
      );

    }

  }


  return null;

}

// ========================================================
// ESCAPAR HTML
// ========================================================

function escapeHTML(
  value
) {

  return String(
    value ?? ''
  )
    .replaceAll(
      '&',
      '&amp;'
    )
    .replaceAll(
      '<',
      '&lt;'
    )
    .replaceAll(
      '>',
      '&gt;'
    )
    .replaceAll(
      '"',
      '&quot;'
    )
    .replaceAll(
      "'",
      '&#039;'
    );

}


// ========================================================
// NOMBRE DE LA CONVERSACIÓN
// ========================================================

function getConversationName(
  conversation
) {

  if (!conversation) {
    return 'Contacto';
  }


  const other =

    conversation.other_user ||

    conversation.otherUser ||

    conversation.contact ||

    conversation.user ||

    null;


  const nestedName =
    getUsername(
      other
    );


  if (nestedName) {

    return nestedName;

  }


  const directName =

    conversation.other_username ??

    conversation.otherUsername ??

    conversation.contact_username ??

    conversation.contactUsername ??

    conversation.username ??

    conversation.name ??

    '';


  if (
    String(
      directName
    ).trim()
  ) {

    return String(
      directName
    ).trim();

  }


  const phone =

    getPhone(
      other
    ) ||

    conversation.other_phone ||

    conversation.otherPhone ||

    '';


  if (phone) {

    return String(phone);

  }


  return 'Contacto';

}


// ========================================================
// PETICIÓN JSON
// ========================================================

async function requestJSON(
  url,
  options = {}
) {

  const headers = {
    ...(options.headers || {})
  };


  const token =
    getToken();


  if (token) {

    headers.Authorization =
      'Bearer ' + token;

  }


  const response =
    await fetch(
      url,
      {
        ...options,
        headers
      }
    );


  let data = {};


  try {

    data =
      await response.json();

  } catch {
    data = {};
  }


  if (!response.ok) {

    const error =
      new Error(

        data.msg ||

        data.message ||

        data.error ||

        'Error de conexión'

      );


    error.status =
      response.status;


    throw error;

  }


  return data;

}

// ========================================================
// FECHA DEL MENSAJE
// ========================================================

function getMessageDate(
  message
) {

  if (!message) {
    return null;
  }


  const value =

    message.created_at ??

    message.createdAt ??

    message.timestamp ??

    message.sent_at ??

    message.sentAt ??

    null;


  if (!value) {
    return null;
  }


  const date =
    new Date(
      value
    );


  if (
    Number.isNaN(
      date.getTime()
    )
  ) {

    return null;

  }


  return date;

}


// ========================================================
// HORA DEL MENSAJE
// ========================================================

function getMessageTime(
  message
) {

  const date =
    getMessageDate(
      message
    );


  if (!date) {

    return '';

  }


  try {

    return date.toLocaleTimeString(
      [],
      {
        hour:
          '2-digit',

        minute:
          '2-digit'
      }
    );

  } catch {

    return '';

  }

}


// ========================================================
// ID DEL REMITENTE
// ========================================================

function getMessageSenderId(
  message
) {

  if (!message) {
    return '';
  }


  const direct =
    normalizeId(

      message.sender_id ??

      message.senderId ??

      message.user_id ??

      message.userId ??

      ''

    );


  if (direct) {
    return direct;
  }


  if (
    message.sender &&
    typeof message.sender ===
      'object'
  ) {

    return getUserId(
      message.sender
    );

  }


  if (
    message.user &&
    typeof message.user ===
      'object'
  ) {

    return getUserId(
      message.user
    );

  }


  return '';

}


// ========================================================
// NOMBRE DEL REMITENTE
// ========================================================

function getMessageSenderName(
  message
) {

  if (!message) {
    return '';
  }


  const direct =
    String(

      message.sender_username ??

      message.senderUsername ??

      message.username ??

      message.user_name ??

      ''

    ).trim();


  if (direct) {
    return direct;
  }


  if (
    message.sender &&
    typeof message.sender ===
      'object'
  ) {

    const name =
      getUsername(
        message.sender
      );


    if (name) {
      return name;
    }

  }


  if (
    message.user &&
    typeof message.user ===
      'object'
  ) {

    const name =
      getUsername(
        message.user
      );


    if (name) {
      return name;
    }

  }


  return '';

}


// ========================================================
// ¿ES MI MENSAJE?
// ========================================================

function isMyMessage(
  message
) {

  if (!message) {
    return false;
  }


  /*
    Si el backend ya lo especifica,
    respetamos ese valor.
  */
  if (
    message.mine === true ||
    message.is_mine === true ||
    message.isMine === true
  ) {

    return true;

  }


  if (
    message.mine === false ||
    message.is_mine === false ||
    message.isMine === false
  ) {

    return false;

  }


  const myId =
    getUserId(
      me
    );


  const senderId =
    getMessageSenderId(
      message
    );


  if (
    myId &&
    senderId
  ) {

    return (
      normalizeId(
        myId
      ) ===
      normalizeId(
        senderId
      )
    );

  }


  /*
    Solo como respaldo usamos username.

    Nunca utilizamos username para decidir
    la conversación; únicamente para saber
    quién envió la burbuja.
  */
  const myName =
    getUsername(
      me
    );


  const senderName =
    getMessageSenderName(
      message
    );


  if (
    myName &&
    senderName
  ) {

    return (
      String(myName)
        .toLowerCase() ===
      String(senderName)
        .toLowerCase()
    );

  }


  return false;

}

// ========================================================
// CREAR CLAVE LOCAL DE MENSAJE
//
// Si PostgreSQL entrega message.id usamos ese ID.
//
// Si por alguna razón un evento no trae ID todavía,
// construimos una clave temporal únicamente para evitar
// pintar el MISMO evento dos veces.
//
// ESTA CLAVE NO SE USA JAMÁS COMO conversationId.
// ========================================================

function getMessageRenderKey(
  message
) {

  const messageId =
    getMessageId(
      message
    );


  if (messageId) {

    return (
      'id:' +
      messageId
    );

  }


  const conversationId =
    getMessageConversationId(
      message
    );


  const senderId =
    getMessageSenderId(
      message
    );


  const senderName =
    getMessageSenderName(
      message
    );


  const text =
    getMessageText(
      message
    );


  const date =
    getMessageDate(
      message
    );


  const time =
    date
      ? date.getTime()
      : '';


  if (
    !conversationId ||
    !text
  ) {

    return '';

  }


  return [

    'temp',

    conversationId,

    senderId ||
      senderName,

    time,

    text

  ].join(
    ':'
  );

}


// ========================================================
// RENDERIZAR UNA BURBUJA
// ========================================================

function renderMessage(
  rawMessage,
  options = {}
) {

  const message =
    normalizeSocketMessage(
      rawMessage
    ) || rawMessage;


  if (
    !message ||
    typeof message !==
      'object'
  ) {

    return false;

  }


  const conversationId =
    getMessageConversationId(
      message
    );


  /*
    REGLA PRINCIPAL:

    renderMessage NO puede insertar un mensaje
    perteneciente a otra conversación.

    Esta comprobación evita mezclar salas.
  */
  if (
    conversationId &&
    activeConversationId &&
    normalizeId(
      conversationId
    ) !==
    normalizeId(
      activeConversationId
    )
  ) {

    return false;

  }


  const text =
    getMessageText(
      message
    );


  /*
    Este bloque corresponde a mensajes de texto.
    Archivos y llamadas tendrán su render separado.
  */
  if (!text) {

    return false;

  }


  const renderKey =
    getMessageRenderKey(
      message
    );


  if (
    renderKey &&
    renderedMessageIds.has(
      renderKey
    )
  ) {

    return false;

  }


  const mine =
    isMyMessage(
      message
    );


  const row =
    document.createElement(
      'div'
    );


  row.className =
    mine
      ? 'messageRow me'
      : 'messageRow';


  const messageId =
    getMessageId(
      message
    );


  if (messageId) {

    row.dataset.messageId =
      messageId;

  }


  if (conversationId) {

    row.dataset.conversationId =
      conversationId;

  }


  const bubble =
    document.createElement(
      'div'
    );


  bubble.className =
    'bubble';


  /*
    Mostramos nombre únicamente en mensajes
    recibidos.
  */
  if (!mine) {

    const senderName =

      getMessageSenderName(
        message
      ) ||

      getConversationName(
        currentConversation
      );


    if (senderName) {

      const sender =
        document.createElement(
          'div'
        );


      sender.className =
        'messageSender';


      sender.textContent =
        senderName;


      bubble.appendChild(
        sender
      );

    }

  }


  const textElement =
    document.createElement(
      'div'
    );


  textElement.className =
    'messageText';


  /*
    textContent evita inyectar HTML desde mensajes.
  */
  textElement.textContent =
    text;


  bubble.appendChild(
    textElement
  );


  const meta =
    document.createElement(
      'div'
    );


  meta.className =
    'messageMeta';


  const time =
    document.createElement(
      'span'
    );


  time.textContent =
    getMessageTime(
      message
    );


  meta.appendChild(
    time
  );


  if (mine) {

    const ticks =
      document.createElement(
        'span'
      );


    ticks.className =
      'ticks';


    ticks.textContent =
      message.read_at ||
      message.readAt
        ? '✓✓'
        : '✓';


    meta.appendChild(
      ticks
    );

  }


  bubble.appendChild(
    meta
  );


  row.appendChild(
    bubble
  );


  messages.appendChild(
    row
  );


  if (renderKey) {

    renderedMessageIds.add(
      renderKey
    );

  }


  if (
    options.scroll !== false
  ) {

    scrollBottom(
      true
    );

  }


  return true;

}

// ========================================================
// GUARDAR MENSAJE REALTIME
//
// Esto protege mensajes que llegan mientras
// loadMessages() está descargando el historial.
// ========================================================

function rememberRealtimeMessage(
  message
) {

  const conversationId =
    getMessageConversationId(
      message
    );


  if (!conversationId) {
    return;
  }


  if (
    !realtimeMessages.has(
      conversationId
    )
  ) {

    realtimeMessages.set(
      conversationId,
      new Map()
    );

  }


  const key =
    getMessageRenderKey(
      message
    );


  if (!key) {
    return;
  }


  realtimeMessages
    .get(
      conversationId
    )
    .set(
      key,
      message
    );

}


// ========================================================
// ACTUALIZAR PREVIEW DEL HISTORIAL
//
// IMPORTANTE:
//
// ESTO ES SECUNDARIO.
//
// Primero la burbuja entra a la sala.
// Después actualizamos el historial lateral.
//
// De esta forma Emilio no puede "atrapar" el mensaje.
// ========================================================

function updateConversationPreview(
  message
) {

  const conversationId =
    getMessageConversationId(
      message
    );


  if (!conversationId) {
    return;
  }


  const index =
    conversations.findIndex(
      conversation =>

        normalizeId(
          getConversationId(
            conversation
          )
        ) ===
        normalizeId(
          conversationId
        )
    );


  if (
    index < 0
  ) {

    /*
      No bloqueamos la burbuja esperando HTTP.

      La conversación lateral se recuperará
      posteriormente.
    */
    scheduleConversationRefresh();

    return;

  }


  const conversation =
    conversations[
      index
    ];


  const text =
    getMessageText(
      message
    );


  conversation.last_message =
    text;


  conversation.lastMessage =
    text;


  conversation.updated_at =

    message.created_at ??

    message.createdAt ??

    new Date()
      .toISOString();


  /*
    Movemos la conversación al principio,
    como en aplicaciones de mensajería normales.
  */
  if (
    index > 0
  ) {

    conversations.splice(
      index,
      1
    );


    conversations.unshift(
      conversation
    );

  }


  renderConversations();

}


// ========================================================
// CONTADOR NO LEÍDO
// ========================================================

function addUnreadMessage(
  conversationId
) {

  const id =
    normalizeId(
      conversationId
    );


  if (!id) {
    return;
  }


  /*
    NUNCA ponemos contador en la conversación
    que está abierta.
  */
  if (
    activeConversationId &&
    id ===
    normalizeId(
      activeConversationId
    )
  ) {

    unreadConversations.delete(
      id
    );

    return;

  }


  const current =
    Number(

      unreadConversations.get(
        id
      ) || 0

    );


  unreadConversations.set(
    id,
    current + 1
  );

}


// ========================================================
// NOTIFICACIÓN DEL NAVEGADOR
// ========================================================

async function requestNotificationPermission() {

  if (
    !('Notification' in window)
  ) {

    return;

  }


  if (
    Notification.permission !==
      'default'
  ) {

    return;

  }


  try {

    await Notification
      .requestPermission();

  } catch (error) {

    console.warn(
      'VOBIXCHAT NOTIFICATION:',
      error
    );

  }

}


// ========================================================
// MOSTRAR NOTIFICACIÓN
// ========================================================

function notifyIncomingMessage(
  message
) {

  if (
    !('Notification' in window)
  ) {

    return;

  }


  /*
    Si estamos viendo exactamente esa sala,
    no necesitamos una notificación del sistema.
  */
  if (
    document.visibilityState ===
      'visible' &&
    messageBelongsToOpenRoom(
      message
    )
  ) {

    return;

  }


  if (
    Notification.permission !==
      'granted'
  ) {

    return;

  }


  const name =

    getMessageSenderName(
      message
    ) ||

    'VOBIXCHAT';


  const text =
    getMessageText(
      message
    );


  try {

    new Notification(
      name,
      {
        body:
          text
      }
    );

  } catch (error) {

    console.warn(
      'VOBIXCHAT SHOW NOTIFICATION:',
      error
    );

  }

}


// ========================================================
// MARCAR SALA COMO LEÍDA LOCALMENTE
// ========================================================

function clearUnreadForOpenRoom() {

  if (!activeConversationId) {
    return;
  }


  unreadConversations.delete(
    normalizeId(
      activeConversationId
    )
  );

}


// ========================================================
// RECEPCIÓN REAL DEL SOCKET
//
// ESTE ES EL CENTRO DE LA REPARACIÓN.
//
// ORDEN:
//
// 1. Normalizar mensaje.
// 2. Obtener conversation_id REAL.
// 3. Guardarlo como respaldo.
// 4. Si coincide con activeConversationId:
//       BURBUJA INMEDIATA.
// 5. Después actualizar historial.
//
// NO esperamos:
// - click en Emilio;
// - loadMessages();
// - PostgreSQL GET;
// - renderConversations().
// ========================================================

function receiveSocketMessage(
  payload,
  sourceEvent = ''
) {

  const message =
    normalizeSocketMessage(
      payload
    );


  if (!message) {

    console.warn(
      'VOBIXCHAT: evento sin mensaje',
      sourceEvent,
      payload
    );

    return;

  }


  const conversationId =
    getMessageConversationId(
      message
    );


  /*
    Si no sabemos a qué conversación pertenece,
    NO usamos message.id como sustituto.

    Eso fue precisamente una fuente posible
    del error anterior.
  */
  if (!conversationId) {

    console.warn(
      'VOBIXCHAT: mensaje sin conversation_id',
      sourceEvent,
      message
    );

    return;

  }


  /*
    Guardamos primero una copia por si coincide
    con una carga HTTP que todavía está en curso.
  */
  rememberRealtimeMessage(
    message
  );


  const belongsToOpenRoom =
    (
      activeConversationId &&
      normalizeId(
        conversationId
      ) ===
      normalizeId(
        activeConversationId
      )
    );


  // ======================================================
  // CASO 1:
  // LA SALA PRIVADA ESTÁ ABIERTA
  //
  // AQUÍ SE SOLUCIONA EL FALLO DE EMILIO.
  // ======================================================

  if (
    belongsToOpenRoom
  ) {

    /*
      PRIMERO BURBUJA.

      No hacemos ninguna petición HTTP antes.
      No tocamos el sidebar antes.
    */
    const inserted =
      renderMessage(
        message,
        {
          scroll:
            true
        }
      );


    clearUnreadForOpenRoom();


    /*
      Mantenemos la sala visualmente abierta.
    */
    emptyState.style.display =
      'none';

    chatRoom.style.display =
      'flex';


    if (
      window.innerWidth <=
      760
    ) {

      app.classList.add(
        'roomOpen'
      );

    }


    /*
      Después de haber insertado la burbuja,
      actualizamos el preview lateral.
    */
    updateConversationPreview(
      message
    );


    /*
      Si el evento se recibió duplicado como
      chat:message y message:new, renderMessage()
      lo descartará mediante message.id.
    */
    if (inserted) {

      console.log(
        'VOBIXCHAT BURBUJA DIRECTA:',
        {
          event:
            sourceEvent,

          conversationId:
            conversationId,

          activeConversationId:
            activeConversationId,

          messageId:
            getMessageId(
              message
            )
        }
      );

    }


    return;

  }


  // ======================================================
  // CASO 2:
  // MENSAJE DE OTRA CONVERSACIÓN
  //
  // Aquí sí actualizamos historial + contador.
  // ======================================================

  if (
    !isMyMessage(
      message
    )
  ) {

    addUnreadMessage(
      conversationId
    );


    notifyIncomingMessage(
      message
    );

  }


  updateConversationPreview(
    message
  );

}


// ========================================================
// EVENTOS DE MENSAJES DEL BACKEND
//
// routes/chat.js puede publicar más de un nombre
// de evento por compatibilidad.
//
// Todos pasan por LA MISMA función.
//
// renderedMessageIds evita duplicados.
// ========================================================

socket.on(
  'chat:message',
  payload => {

    receiveSocketMessage(
      payload,
      'chat:message'
    );

  }
);


socket.on(
  'message:new',
  payload => {

    receiveSocketMessage(
      payload,
      'message:new'
    );

  }
);


socket.on(
  'conversation-message',
  payload => {

    receiveSocketMessage(
      payload,
      'conversation-message'
    );

  }
);


// ========================================================
// EVENTO ALTERNATIVO "new-message"
//
// Lo escuchamos por compatibilidad, pero siempre
// pasa por el mismo control conversation_id.
// ========================================================

socket.on(
  'new-message',
  payload => {

    receiveSocketMessage(
      payload,
      'new-message'
    );

  }
);


// ========================================================
// EVENTO ALTERNATIVO "new_message"
// ========================================================

socket.on(
  'new_message',
  payload => {

    receiveSocketMessage(
      payload,
      'new_message'
    );

  }
);


// ========================================================
// REFRESCO DEL SIDEBAR
//
// Nunca bloquea la recepción de burbujas.
// ========================================================

let conversationRefreshTimer =
  null;


function scheduleConversationRefresh() {

  clearTimeout(
    conversationRefreshTimer
  );


  conversationRefreshTimer =
    setTimeout(
      async () => {

        try {

          await loadConversations();

        } catch (error) {

          console.warn(
            'VOBIXCHAT CONVERSATION REFRESH:',
            error
          );

        }

      },
      250
    );

}


// ========================================================
// ENTRAR A LA SALA SOCKET
// ========================================================

function joinConversationRoom(
  conversationId
) {

  const id =
    normalizeId(
      conversationId
    );


  if (
    !id ||
    !socket.connected
  ) {

    return;

  }


  /*
    joinedConversationId es únicamente una referencia
    local. La autoridad visual sigue siendo
    activeConversationId.
  */
  joinedConversationId =
    id;


  /*
    Enviamos ambos nombres de propiedad para
    compatibilidad con el backend existente.
  */
  socket.emit(

    'join-conversation',

    {
      conversationId:
        id,

      conversation_id:
        id
    }

  );


  /*
    Compatibilidad adicional con servidores que
    escuchan conversation:join.
  */
  socket.emit(

    'conversation:join',

    {
      conversationId:
        id,

      conversation_id:
        id
    }

  );


  console.log(
    'VOBIXCHAT JOIN ROOM:',
    id
  );

}


// ========================================================
// REENTRAR A LA SALA ACTUAL
// ========================================================

function rejoinCurrentConversation() {

  /*
    IMPORTANTE:

    Usamos activeConversationId directamente.

    No volvemos a calcularlo a partir de un mensaje
    ni del preview lateral.
  */
  const id =
    normalizeId(
      activeConversationId
    );


  if (!id) {
    return;
  }


  joinConversationRoom(
    id
  );

}


// ========================================================
// CARGAR MENSAJES DE POSTGRESQL
//
// Esta función sirve para:
//
// - abrir inicialmente una conversación;
// - recuperar historial;
// - reconexión.
//
// NO es el mecanismo de entrega realtime.
// ========================================================

let historyLoadSequence =
  0;


async function loadMessages(
  conversation
) {

  const conversationId =
    getConversationId(
      conversation
    );


  if (!conversationId) {

    throw new Error(
      'Conversación sin ID'
    );

  }


  const requestedConversationId =
    normalizeId(
      conversationId
    );


  const sequence =
    ++historyLoadSequence;


  const data =
    await requestJSON(

      '/api/chat/conversations/' +

      encodeURIComponent(
        requestedConversationId
      ) +

      '/messages'

    );


  const history =
    Array.isArray(data)

      ? data

      : (
          data.messages ||
          data.results ||
          data.data ||
          []
        );


  /*
    ======================================================
    PROTECCIÓN CONTRA CAMBIO DE SALA
    ======================================================

    Ejemplo:

    1. hacemos click en Ana;
    2. comienza GET Ana;
    3. inmediatamente hacemos click en Emilio;
    4. comienza GET Emilio;
    5. termina GET Ana tarde.

    El historial de Ana NO puede borrar Emilio.
  */
  if (
    sequence !==
      historyLoadSequence ||
    normalizeId(
      activeConversationId
    ) !==
    requestedConversationId
  ) {

    console.log(
      'VOBIXCHAT: historial antiguo ignorado',
      requestedConversationId
    );

    return;

  }


  /*
    Guardamos mensajes realtime recibidos mientras
    el GET estaba viajando.
  */
  const realtime =
    realtimeMessages.get(
      requestedConversationId
    );


  /*
    Reconstruimos únicamente ESTA sala.
  */
  clearMessages();


  for (
    const raw
    of history
  ) {

    const message =
      normalizeSocketMessage(
        raw
      ) || {
        ...raw
      };


    /*
      Los mensajes del endpoint pueden no repetir
      conversation_id porque la URL ya identifica
      la conversación.

      AQUÍ sí podemos asignarlo con seguridad:
      conocemos la conversación por la URL del GET.

      NO estamos utilizando message.id.
    */
    if (
      !getMessageConversationId(
        message
      )
    ) {

      message.conversation_id =
        requestedConversationId;

      message.conversationId =
        requestedConversationId;

    }


    renderMessage(
      message,
      {
        scroll:
          false
      }
    );

  }


  /*
    ======================================================
    REINSERTAR REALTIME
    ======================================================

    Si un mensaje llegó por Socket mientras el GET
    estaba cargando, lo volvemos a comprobar después
    del historial.

    Si ya estaba en PostgreSQL, message.id evita
    duplicarlo.

    Si el GET era anterior al mensaje, aquí queda
    preservada la burbuja.
  */
  if (realtime) {

    for (
      const realtimeMessage
      of realtime.values()
    ) {

      if (
        normalizeId(
          activeConversationId
        ) !==
        requestedConversationId
      ) {

        break;

      }


      renderMessage(
        realtimeMessage,
        {
          scroll:
            false
        }
      );

    }

  }


  /*
    Solo limpiamos el respaldo después de haberlo
    reintegrado.
  */
  realtimeMessages.delete(
    requestedConversationId
  );


  scrollBottom(
    true
  );

}


// ========================================================
// ABRIR CONVERSACIÓN
//
// ESTA FUNCIÓN FIJA activeConversationId ANTES
// DE HACER HTTP.
//
// Así, desde el instante en que pulsas Emilio,
// cualquier Socket de Emilio ya sabe dónde entrar.
// ========================================================

async function openConversation(
  conversation
) {

  const conversationId =
    getConversationId(
      conversation
    );


  if (!conversationId) {

    showToast(
      'Esta conversación no tiene un ID válido'
    );

    return;

  }


  const id =
    normalizeId(
      conversationId
    );


  /*
    ======================================================
    PASO CRÍTICO
    ======================================================

    activeConversationId se establece ANTES de:

    - loadMessages();
    - renderConversations();
    - cualquier petición HTTP.

    Desde ESTE MOMENTO la sala ya es Emilio.
  */
  activeConversationId =
    id;


  openingConversationId =
    id;


  currentConversation =
    conversation;


  /*
    Eliminamos inmediatamente el contador.
  */
  unreadConversations.delete(
    id
  );


  const name =
    getConversationName(
      conversation
    );


  roomName.textContent =
    name;


  roomAvatar.textContent =
    String(name)
      .charAt(0)
      .toUpperCase();


  roomStatus.textContent =
    socket.connected
      ? 'Conversación privada'
      : 'Reconectando…';


  /*
    Mostramos la sala ANTES de esperar PostgreSQL.
  */
  emptyState.style.display =
    'none';


  chatRoom.style.display =
    'flex';


  app.classList.add(
    'roomOpen'
  );


  /*
    Marcamos visualmente la conversación activa.
  */
  renderConversations();


  /*
    Primero entramos en Socket.IO.
  */
  joinConversationRoom(
    id
  );


  /*
    Después cargamos el historial.
  */
  try {

    await loadMessages(
      conversation
    );

  } catch (error) {

    console.error(
      'VOBIXCHAT LOAD MESSAGES:',
      error
    );


    /*
      Si seguimos en la misma conversación,
      mostramos el error sin cerrar la sala.
    */
    if (
      normalizeId(
        activeConversationId
      ) ===
      id
    ) {

      showToast(
        error.message ||
        'No se pudo cargar el historial'
      );

    }

  } finally {

    if (
      openingConversationId ===
      id
    ) {

      openingConversationId =
        '';

    }

  }


  /*
    El textarea queda listo para escribir.
  */
  if (
    normalizeId(
      activeConversationId
    ) ===
    id
  ) {

    messageInput.focus();

  }

}


// ========================================================
// FIN BLOQUE 2
//
// YA QUEDA ESTABLECIDO:
//
// Socket mensaje
//      ↓
// receiveSocketMessage()
//      ↓
// conversation_id
//      ↓
// activeConversationId
//      ↓
// renderMessage()
//      ↓
// BURBUJA INMEDIATA
//
// Y SOLO DESPUÉS:
// updateConversationPreview()
// ======================================================== 
// ========================================================
// RENDERIZAR HISTORIAL DE CONVERSACIONES
// ========================================================

function renderConversations() {

  conversationCount.textContent =
    String(
      conversations.length
    );


  conversationList.innerHTML =
    '';


  if (
    conversations.length === 0
  ) {

    const empty =
      document.createElement(
        'div'
      );


    empty.style.color =
      '#7f9984';

    empty.style.textAlign =
      'center';

    empty.style.padding =
      '35px 15px';

    empty.style.fontSize =
      '13px';


    empty.textContent =
      'Todavía no tienes conversaciones.';


    conversationList.appendChild(
      empty
    );


    return;

  }


  for (
    const conversation
    of conversations
  ) {

    const conversationId =
      getConversationId(
        conversation
      );


    if (!conversationId) {

      console.warn(
        'VOBIXCHAT: conversación sin ID',
        conversation
      );

      continue;

    }


    const id =
      normalizeId(
        conversationId
      );


    const name =
      getConversationName(
        conversation
      );


    const row =
      document.createElement(
        'div'
      );


    row.className =
      'conversation';


    row.dataset.conversationId =
      id;


    /*
      La conversación activa se determina
      EXCLUSIVAMENTE con activeConversationId.

      No por nombre.
      No por posición.
      No por preview.
    */
    if (
      activeConversationId &&
      normalizeId(
        activeConversationId
      ) ===
      id
    ) {

      row.classList.add(
        'active'
      );

    }


    const avatar =
      document.createElement(
        'div'
      );


    avatar.className =
      'avatar';


    avatar.textContent =
      String(
        name || 'V'
      )
        .charAt(0)
        .toUpperCase();


    const body =
      document.createElement(
        'div'
      );


    body.className =
      'conversationBody';


    const nameElement =
      document.createElement(
        'div'
      );


    nameElement.className =
      'conversationName';


    nameElement.textContent =
      name;


    const preview =
      document.createElement(
        'div'
      );


    preview.className =
      'conversationPreview';


    const previewText =

      conversation.last_message ??

      conversation.lastMessage ??

      conversation.last_message_text ??

      conversation.lastMessageText ??

      conversation.preview ??

      '';


    preview.textContent =
      String(
        previewText || ''
      );


    body.appendChild(
      nameElement
    );


    body.appendChild(
      preview
    );


    const badge =
      document.createElement(
        'div'
      );


    badge.className =
      'unreadBadge';


    const unread =
      Number(

        unreadConversations.get(
          id
        ) || 0

      );


    /*
      Nunca mostramos unread en la sala
      que está abierta.
    */
    if (
      unread > 0 &&
      id !==
        normalizeId(
          activeConversationId
        )
    ) {

      badge.textContent =
        unread > 99
          ? '99+'
          : String(unread);


      badge.classList.add(
        'show'
      );

    }


    row.appendChild(
      avatar
    );


    row.appendChild(
      body
    );


    row.appendChild(
      badge
    );


    /*
      Al pulsar una conversación utilizamos
      directamente ESTE objeto de conversación.

      openConversation() establecerá
      activeConversationId antes de cualquier GET.
    */
    row.addEventListener(
      'click',
      () => {

        openConversation(
          conversation
        );

      }
    );


    conversationList.appendChild(
      row
    );

  }

}


// ========================================================
// NORMALIZAR RESPUESTA DE CONVERSACIONES
// ========================================================

function normalizeConversationResponse(
  data
) {

  if (
    Array.isArray(
      data
    )
  ) {

    return data;

  }


  if (
    data &&
    Array.isArray(
      data.conversations
    )
  ) {

    return data.conversations;

  }


  if (
    data &&
    Array.isArray(
      data.results
    )
  ) {

    return data.results;

  }


  if (
    data &&
    Array.isArray(
      data.data
    )
  ) {

    return data.data;

  }


  return [];

}


// ========================================================
// CARGAR CONVERSACIONES
//
// IMPORTANTE:
//
// loadConversations() puede actualizar el sidebar,
// pero NO cambia activeConversationId.
//
// Si Emilio está abierto, una actualización del
// historial no puede cerrar ni sustituir esa sala.
// ========================================================

async function loadConversations() {

  const data =
    await requestJSON(
      '/api/chat/conversations'
    );


  const incoming =
    normalizeConversationResponse(
      data
    );


  conversations =
    incoming;


  /*
    Si existe una sala abierta buscamos su versión
    actualizada dentro de la respuesta.

    PERO activeConversationId permanece intacto.
  */
  if (
    activeConversationId
  ) {

    const updated =
      conversations.find(
        conversation =>

          normalizeId(
            getConversationId(
              conversation
            )
          ) ===
          normalizeId(
            activeConversationId
          )
      );


    if (updated) {

      currentConversation =
        updated;


      /*
        Actualizamos únicamente metadatos visuales.
      */
      const name =
        getConversationName(
          updated
        );


      roomName.textContent =
        name;


      roomAvatar.textContent =
        String(
          name || 'V'
        )
          .charAt(0)
          .toUpperCase();

    }

  }


  renderConversations();

}


// ========================================================
// CERRAR SALA EN MÓVIL
//

// puedan seguir contabilizándose correctamente.
//

  'click',
  () => {

    app.classList.remove(
      'roomOpen'
    );


    messageInput.blur();

  }
