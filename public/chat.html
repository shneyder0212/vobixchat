<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width,initial-scale=1,viewport-fit=cover"
  >

  <meta name="theme-color" content="#071009">

  <title>VOBIXCHAT</title>

  <script src="/socket.io/socket.io.js"></script>

  <style>

    * {
      box-sizing: border-box;
    }

    :root {
      --green: #68ff72;
      --green2: #39db5b;
      --bg: #071009;
      --panel: #0b160d;
      --panel2: #101d13;
      --border: rgba(104,255,114,.18);
      --text: #f1fff3;
      --muted: #8da891;
      --bubble: #15251a;
      --bubbleMe: #155d35;
      --danger: #ff4d4d;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: var(--bg);
      color: var(--text);
      font-family:
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
    }

    button,
    input {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    .app {
      display: flex;
      width: 100%;
      height: 100dvh;

      background:
        radial-gradient(
          circle at 25% 10%,
          rgba(67,255,99,.08),
          transparent 30%
        ),
        var(--bg);
    }

    .sidebar {
      width: 350px;
      min-width: 350px;
      display: flex;
      flex-direction: column;
      border-right: 1px solid var(--border);
      background: rgba(6,20,9,.96);
    }

    .profile {
      min-height: 78px;
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 14px 16px;
      border-bottom: 1px solid var(--border);
    }

    .logo {
      width: 48px;
      height: 48px;
      border-radius: 15px;
      display: grid;
      place-items: center;
      background: var(--green);
      color: #061008;
      font-size: 25px;
      font-weight: 1000;
      box-shadow: 0 0 25px rgba(104,255,114,.22);
    }

    .profileInfo {
      flex: 1;
      min-width: 0;
    }

    .brand {
      font-size: 16px;
      font-weight: 1000;
    }

    .username {
      margin-top: 3px;
      color: var(--green);
      font-size: 12px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .avatar {
      width: 42px;
      height: 42px;
      min-width: 42px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      background: #14291a;
      color: var(--green);
      border: 1px solid var(--border);
      font-weight: 900;
    }

    .searchArea {
      padding: 14px;
      border-bottom: 1px solid var(--border);
    }

    .searchBox {
      display: flex;
      gap: 8px;
    }

    .searchBox input {
      width: 100%;
      min-width: 0;
      padding: 13px 14px;
      border-radius: 14px;
      border: 1px solid var(--border);
      outline: none;
      color: white;
      background: #0e1a11;
    }

    .searchBox input:focus {
      border-color: var(--green);
    }

    .searchButton {
      width: 50px;
      min-width: 50px;
      border: 0;
      border-radius: 14px;
      background: var(--green);
      color: #071009;
      font-size: 20px;
      font-weight: 900;
    }

    .searchHelp {
      margin-top: 8px;
      color: var(--muted);
      font-size: 11px;
    }

    .searchResults {
      border-bottom: 1px solid var(--border);
    }

    .sectionTitle {
      padding: 14px 16px 8px;
      display: flex;
      justify-content: space-between;
      color: #d7ffda;
      font-size: 12px;
      font-weight: 900;
      letter-spacing: 1px;
    }

    .conversations {
      flex: 1;
      overflow-y: auto;
    }

    .conversation {
      display: flex;
      align-items: center;
      gap: 11px;
      padding: 12px 14px;
      cursor: pointer;
      border-bottom: 1px solid rgba(104,255,114,.07);
    }

    .conversation:hover {
      background: rgba(104,255,114,.05);
    }

    .conversation.active {
      background: rgba(104,255,114,.10);
    }

    .conversationBody {
      flex: 1;
      min-width: 0;
    }

    .conversationName {
      font-weight: 800;
      font-size: 14px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .conversationPreview {
      margin-top: 3px;
      color: var(--muted);
      font-size: 11px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .chat {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
      position: relative;
    }

    .empty {
      flex: 1;
      display: grid;
      place-items: center;
      text-align: center;
      padding: 30px;
    }

    .emptyLogo {
      width: 86px;
      height: 86px;
      margin: auto;
      border-radius: 25px;
      display: grid;
      place-items: center;
      background: var(--green);
      color: #071009;
      font-size: 46px;
      font-weight: 1000;
      box-shadow: 0 0 40px rgba(104,255,114,.18);
    }

    .empty h1 {
      margin: 18px 0 8px;
      font-size: 27px;
    }

    .empty p {
      color: var(--muted);
    }

    .chatRoom {
      display: none;
      flex: 1;
      min-height: 0;
      flex-direction: column;
    }

    .chatHeader {
      min-height: 72px;
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px 16px;
      border-bottom: 1px solid var(--border);
      background: rgba(8,19,10,.98);
    }

    .backButton {
      display: none;
    }

    .chatUser {
      flex: 1;
      min-width: 0;
    }

    .chatName {
      font-weight: 900;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .chatStatus {
      margin-top: 2px;
      color: var(--green);
      font-size: 11px;
    }

    .headerActions {
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .iconButton {
      width: 42px;
      height: 42px;
      display: grid;
      place-items: center;
      border: 0;
      border-radius: 50%;
      background: transparent;
      color: #dfffe2;
      font-size: 19px;
    }

    .iconButton:hover {
      background: rgba(104,255,114,.10);
      color: var(--green);
    }

    .messages {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      padding: 18px;

      background:
        radial-gradient(
          circle at 70% 10%,
          rgba(104,255,114,.04),
          transparent 30%
        );
    }

    .messageRow {
      display: flex;
      margin: 5px 0;
    }

    .messageRow.me {
      justify-content: flex-end;
    }

    .bubble {
      max-width: min(72%,650px);
      padding: 8px 11px 6px;
      border-radius: 12px;
      background: var(--bubble);
      border: 1px solid rgba(255,255,255,.04);
      word-break: break-word;
    }

    .messageRow.me .bubble {
      background: var(--bubbleMe);
    }

    .messageSender {
      margin-bottom: 3px;
      color: var(--green);
      font-size: 10px;
      font-weight: 800;
    }

    .messageText {
      font-size: 14px;
      line-height: 1.4;
    }

    .messageMeta {
      margin-top: 3px;
      display: flex;
      justify-content: flex-end;
      gap: 5px;
      color: rgba(255,255,255,.62);
      font-size: 9px;
    }

    .ticks {
      color: #76dfff;
    }

    /* ==================================================
       MULTIMEDIA DE MENSAJES
       ================================================== */

    .messageMedia {
      display: block;
      width: min(100%,420px);
      max-height: 520px;
      margin-top: 5px;
      border-radius: 12px;
      object-fit: contain;
      background: #020603;
    }

    .messageVideo {
      display: block;
      width: min(100%,420px);
      max-height: 520px;
      margin-top: 5px;
      border-radius: 12px;
      background: #020603;
    }

    .messageAudio {
      display: block;
      width: min(100%,330px);
      margin-top: 5px;
    }

    .messageDocument {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 210px;
      margin-top: 5px;
      padding: 11px 12px;
      border-radius: 11px;
      border: 1px solid rgba(255,255,255,.10);
      background: rgba(0,0,0,.15);
      color: white;
      text-decoration: none;
    }

    .messageDocumentIcon {
      font-size: 25px;
    }

    .messageDocumentName {
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .uploadProgress {
      min-height: 18px;
      padding: 0 18px;
      color: var(--green);
      font-size: 11px;
      background: #08130a;
    }

    .typing {
      min-height: 20px;
      padding: 2px 18px;
      color: var(--green);
      font-size: 11px;
      background: #08130a;
    }

    .composer {
      position: relative;
      display: flex;
      align-items: center;
      gap: 5px;
      padding: 9px 10px calc(9px + env(safe-area-inset-bottom));
      border-top: 1px solid var(--border);
      background: #08130a;
    }

    .composerInput {
      flex: 1;
      min-width: 0;
      height: 46px;
      padding: 0 15px;
      border-radius: 23px;
      border: 1px solid var(--border);
      outline: none;
      background: #122016;
      color: white;
    }

    .composerInput:focus {
      border-color: rgba(104,255,114,.55);
    }

    .composerButton {
      width: 44px;
      height: 44px;
      min-width: 44px;
      display: grid;
      place-items: center;
      border: 0;
      border-radius: 50%;
      background: transparent;
      color: #d8ffdc;
      font-size: 20px;
    }

    .composerButton:hover {
      background: rgba(104,255,114,.09);
      color: var(--green);
    }

    .composerButton.recording {
      background: var(--danger);
      color: white;
      animation: recordingPulse 1s infinite;
    }

    @keyframes recordingPulse {

      0%,
      100% {
        transform: scale(1);
      }

      50% {
        transform: scale(1.08);
      }

    }

    .sendButton {
      background: var(--green);
      color: #071009;
      font-weight: 1000;
    }

    .emojiPanel {
      position: absolute;
      display: none;
      left: 10px;
      bottom: 68px;
      width: 285px;
      padding: 12px;
      grid-template-columns: repeat(7,1fr);
      gap: 6px;
      border: 1px solid var(--border);
      border-radius: 16px;
      background: #101c13;
      box-shadow: 0 15px 50px rgba(0,0,0,.45);
      z-index: 50;
    }

    .emojiPanel.open {
      display: grid;
    }

    .emoji {
      border: 0;
      padding: 5px;
      border-radius: 8px;
      background: transparent;
      font-size: 21px;
    }

    .attachMenu {
      position: absolute;
      display: none;
      left: 58px;
      bottom: 68px;
      width: 210px;
      padding: 8px;
      border-radius: 16px;
      border: 1px solid var(--border);
      background: #101c13;
      box-shadow: 0 15px 50px rgba(0,0,0,.45);
      z-index: 51;
    }

    .attachMenu.open {
      display: block;
    }

    .attachOption {
      width: 100%;
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 11px;
      border: 0;
      border-radius: 10px;
      background: transparent;
      color: white;
      text-align: left;
    }

    .attachOption:hover {
      background: rgba(104,255,114,.08);
    }

    .toast {
      position: fixed;
      left: 50%;
      bottom: 90px;
      transform: translateX(-50%) translateY(20px);
      padding: 11px 17px;
      border: 1px solid var(--border);
      border-radius: 30px;
      background: #122016;
      color: white;
      opacity: 0;
      pointer-events: none;
      transition: .2s;
      z-index: 3000;
    }

    .toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }


    /* ==================================================
       LLAMADAS VOBIXCHAT
       ================================================== */

    .callScreen {
      position: fixed;
      inset: 0;
      display: none;
      z-index: 2000;

      background:
        radial-gradient(
          circle at 50% 20%,
          rgba(104,255,114,.16),
          transparent 35%
        ),
        #030a05;
    }

    .callScreen.open {
      display: flex;
      flex-direction: column;
    }

    .callVideoArea {
      position: relative;
      flex: 1;
      min-height: 0;
      overflow: hidden;
      display: grid;
      place-items: center;
    }

    /*
      El vídeo remoto comienza grande.
      El vídeo local comienza flotante.

      En los siguientes bloques añadimos el JavaScript
      que intercambia realmente ambos al tocarlos.
    */

    .remoteVideo {
      width: 100%;
      height: 100%;
      object-fit: cover;
      background: #020603;
      cursor: pointer;
    }

    .localVideo {
      position: absolute;
      right: 18px;
      top: 18px;
      width: min(28vw,220px);
      aspect-ratio: 3/4;
      object-fit: cover;
      border-radius: 18px;
      border: 2px solid rgba(104,255,114,.45);
      background: #0b160d;
      box-shadow: 0 10px 35px rgba(0,0,0,.45);
      z-index: 5;
      cursor: pointer;
    }

    /*
      Modo invertido:
      cámara local grande y remoto flotante.
    */

    .callVideoArea.local-main .localVideo {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      aspect-ratio: auto;
      border: 0;
      border-radius: 0;
      object-fit: cover;
      z-index: 1;
    }

    .callVideoArea.local-main .remoteVideo {
      position: absolute;
      right: 18px;
      top: 18px;
      width: min(28vw,220px);
      height: auto;
      aspect-ratio: 3/4;
      border-radius: 18px;
      border: 2px solid rgba(104,255,114,.45);
      object-fit: cover;
      z-index: 5;
      box-shadow: 0 10px 35px rgba(0,0,0,.45);
    }

    .audioCallIdentity {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      text-align: center;
      pointer-events: none;
    }

    .audioCallAvatar {
      width: 120px;
      height: 120px;
      margin: auto;
      border-radius: 50%;
      display: grid;
      place-items: center;
      background: #17341d;
      border: 2px solid rgba(104,255,114,.35);
      color: var(--green);
      font-size: 52px;
      font-weight: 1000;
      box-shadow: 0 0 55px rgba(104,255,114,.14);
    }

    .audioCallName {
      margin-top: 20px;
      font-size: 25px;
      font-weight: 900;
    }

    .audioCallStatus {
      margin-top: 7px;
      color: var(--muted);
      font-size: 14px;
    }

    .callTop {
      position: absolute;
      left: 0;
      right: 0;
      top: 0;
      z-index: 10;
      padding: 22px;
      text-align: center;
      pointer-events: none;
    }

    .callTopName {
      font-size: 19px;
      font-weight: 900;
    }

    .callTopStatus {
      margin-top: 4px;
      color: #b9d9be;
      font-size: 12px;
    }

    .callControls {
      min-height: 112px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 18px;
      padding: 20px;
      background: rgba(3,10,5,.94);
    }

    .callControl {
      width: 60px;
      height: 60px;
      border: 0;
      border-radius: 50%;
      display: grid;
      place-items: center;
      background: #18261b;
      color: white;
      font-size: 23px;
    }

    .callControl.active {
      background: #344137;
    }

    .callControl.end {
      background: var(--danger);
    }

    .incomingCall {
      position: fixed;
      inset: 0;
      z-index: 2500;
      display: none;
      place-items: center;
      padding: 22px;
      background: rgba(1,7,3,.94);
      backdrop-filter: blur(12px);
    }

    .incomingCall.open {
      display: grid;
    }

    .incomingCard {
      width: min(100%,390px);
            padding: 32px 22px 26px;
      border: 1px solid rgba(104,255,114,.25);
      border-radius: 28px;
      background: #0b160d;
      text-align: center;
      box-shadow: 0 25px 80px rgba(0,0,0,.55);
    }

    .incomingAvatar {
      width: 100px;
      height: 100px;
      margin: auto;
      display: grid;
      place-items: center;
      border-radius: 50%;
      background: #17341d;
      color: var(--green);
      border: 2px solid rgba(104,255,114,.35);
      font-size: 43px;
      font-weight: 1000;
    }

    .incomingName {
      margin-top: 18px;
      font-size: 24px;
      font-weight: 900;
    }

    .incomingType {
      margin-top: 7px;
      color: var(--muted);
    }

    .incomingActions {
      display: flex;
      justify-content: center;
      gap: 42px;
      margin-top: 32px;
    }

    .incomingButton {
      width: 68px;
      height: 68px;
      border: 0;
      border-radius: 50%;
      color: white;
      font-size: 26px;
    }

    .incomingButton.reject {
      background: var(--danger);
    }

    .incomingButton.accept {
      background: #25c85a;
    }

    @media(max-width:720px) {

      .sidebar {
        width: 100%;
        min-width: 100%;
      }

      .chat {
        display: none;
        width: 100%;
      }

      .app.roomOpen .sidebar {
        display: none;
      }

      .app.roomOpen .chat {
        display: flex;
      }

      .backButton {
        display: grid;
      }

      .bubble {
        max-width: 84%;
      }

      .messages {
        padding: 12px 9px;
      }

      .chatHeader {
        padding: 8px 6px;
      }

      .iconButton {
        width: 38px;
        height: 38px;
      }

      .composer {
        gap: 2px;
        padding-left: 4px;
        padding-right: 4px;
      }

      .composerButton {
        width: 39px;
        min-width: 39px;
      }

      .emojiPanel {
        left: 7px;
        width: calc(100% - 14px);
      }

      .localVideo {
        width: 105px;
        right: 12px;
        top: 12px;
      }

      /*
        También corregimos el tamaño del vídeo
        remoto cuando el usuario invierte cámaras.
      */

      .callVideoArea.local-main .remoteVideo {
        width: 105px;
        right: 12px;
        top: 12px;
      }

      .callControls {
        min-height: 100px;
        gap: 13px;
      }

      .callControl {
        width: 56px;
        height: 56px;
      }

    }

  </style>
</head>

<body>

<div class="app" id="app">

  <aside class="sidebar">

    <div class="profile">

      <div class="logo">
        V
      </div>

      <div class="profileInfo">

        <div class="brand">
          VOBIXCHAT
        </div>

        <div
          class="username"
          id="myUsername"
        >
          @
        </div>

      </div>

      <div
        class="avatar"
        id="myAvatar"
      >
        V
      </div>

    </div>


    <div class="searchArea">

      <div class="searchBox">

        <input
          id="searchInput"
          autocomplete="off"
          placeholder="Buscar usuario o teléfono"
        >

        <button
          class="searchButton"
          id="searchButton"
          type="button"
        >
          ⌕
        </button>

      </div>

      <div class="searchHelp">
        Busca por nombre o número de teléfono.
      </div>

    </div>


    <div
      class="searchResults"
      id="searchResults"
    ></div>


    <div class="sectionTitle">

      <span>
        CONVERSACIONES
      </span>

      <span id="conversationCount">
        0
      </span>

    </div>


    <div
      class="conversations"
      id="conversationList"
    ></div>

  </aside>


  <main class="chat">

    <section
      class="empty"
      id="emptyState"
    >

      <div>

        <div class="emptyLogo">
          V
        </div>

        <h1>
          VOBIXCHAT
        </h1>

        <p>
          Selecciona una conversación o busca una persona.
        </p>

        <p>
          Tus conversaciones se mantienen en salas privadas.
        </p>

      </div>

    </section>


    <section
      class="chatRoom"
      id="chatRoom"
    >

      <header class="chatHeader">

        <button
          class="iconButton backButton"
          id="backButton"
          type="button"
        >
          ←
        </button>


        <div
          class="avatar"
          id="roomAvatar"
        >
          V
        </div>


        <div class="chatUser">

          <div
            class="chatName"
            id="roomName"
          ></div>

          <div
            class="chatStatus"
            id="roomStatus"
          >
            Conversación privada
          </div>

        </div>


        <div class="headerActions">

          <button
            class="iconButton"
            id="voiceCallButton"
            title="Llamada de voz"
            type="button"
          >
            ☎
          </button>

          <button
            class="iconButton"
            id="videoCallButton"
            title="Videollamada"
            type="button"
          >
            🎥
          </button>

          <button
            class="iconButton"
            id="moreButton"
            title="Opciones"
            type="button"
          >
            ⋮
          </button>

        </div>

      </header>


      <div
        class="messages"
        id="messages"
      ></div>


      <!--
        Estado de grabación / subida.
        Esto permite mostrar al usuario cuando
        una nota de voz o archivo se está enviando.
      -->

      <div
        class="uploadProgress"
        id="uploadProgress"
      ></div>


      <div
        class="typing"
        id="typing"
      ></div>


      <div class="composer">

        <button
          class="composerButton"
          id="emojiButton"
          type="button"
          title="Emojis"
        >
          😊
        </button>


        <button

function initials(
  value
) {

  const text =
    String(
      value || 'V'
    )
      .trim();


  if (!text) {
    return 'V';
  }


  const parts =
    text
      .split(/\s+/)
      .filter(Boolean);


  if (
    parts.length === 1
  ) {

    return parts[0]
      .slice(0, 2)
      .toUpperCase();

  }


  return (
    parts[0][0] +
    parts[1][0]
  ).toUpperCase();

}


function escapeHtml(
  value
) {

  return String(
    value ?? ''
  )
    .replace(
      /&/g,
      '&amp;'
    )
    .replace(
      /</g,
      '&lt;'
    )
    .replace(
      />/g,
      '&gt;'
    )
    .replace(
      /"/g,
      '&quot;'
    )
    .replace(
      /'/g,
      '&#039;'
    );

}

) {

  if (

      date.getTime()
    )

  }


  return date
    .toLocaleTimeString(
      [],
      {
        hour:
          '2-digit',

        minute:
          '2-digit'
      }
    );

}


// ========================================================
// API AUTENTICADA
// ========================================================

async function apiFetch(
  url,
  options = {}
) {

  const headers =
    new Headers(
      options.headers ||
      {}
    );


  if (VOBIX_TOKEN) {

    headers.set(
      'Authorization',
      `Bearer ${VOBIX_TOKEN}`
    );

  }


  if (
    options.body &&
    !(options.body instanceof FormData) &&
    !headers.has(
      'Content-Type'
    )
  ) {

    headers.set(
      'Content-Type',
      'application/json'
    );

  }


  const response =
    await fetch(
      url,
      {
        ...options,
        headers
      }
    );


  let data =
    null;


  try {

    data =
      await response.json();

  } catch (_) {

    data = {
      ok: false,
      msg:
        'Respuesta inválida del servidor'
    };

  }


  if (
    response.status === 401
  ) {

    localStorage.removeItem(
      'vobix_token'
    );

    localStorage.removeItem(
      'token'
    );

  }


  return {
    response,
    data
  };

}

      'VOBIXCHAT SESSION:',

    );


    showToast(

function getConversationId(
  conversation
) {

  return String(
    conversation?.id ||
    conversation?.conversationId ||
    conversation?.conversation_id ||
    ''
  );

function getConversationName(
  conversation
) {

  return String(
    conversation?.otherUsername ||
    conversation?.other_username ||
    conversation?.username ||
    conversation?.name ||
    conversation?.title ||

  );

}


function renderConversations() {

  conversationList.innerHTML =

  conversationCount.textContent =

  for (

async function startConversationWithUser(
  user
) {

  const userId =
    user.id ||
    user.userId ||
    user.user_id;


  if (!userId) {

    showToast(
      'Usuario no válido'
    );

    return;
  }


  try {

    const {
      response,
      data
    } =
      await apiFetch(
        '/api/chat/conversations',
        {

          method:
            'POST',

          body:
            JSON.stringify({
              userId
            })

        }
      );


    if (
      !response.ok ||
      !data.ok
    ) {

      showToast(
        data.msg ||
        'No se pudo abrir la conversación'
      );

      return;
    }


    const conversation =
      data.conversation ||
      data;


    searchResults.innerHTML =
      '';

    searchInput.value =
      '';


    await loadConversations();


    await openConversation(
      conversation
    );


  } catch (error) {

    console.error(
      'VOBIXCHAT START CONVERSATION:',
      error
    );


    showToast(
      'No se pudo iniciar la conversación'
    );

  }

}


async function openConversation(
  conversation
) {

  const id =
    getConversationId(
      conversation
    );


  if (!id) {

    showToast(
      'Conversación no válida'
    );

    return;
  }


  if (
    currentConversationId
  ) {

    socket.emit(
      'conversation-leave',
      {
        conversationId:
          currentConversationId
      }
    );

  }


  currentConversation =
    conversation;

  currentConversationId =
    id;


  const name =
    getConversationName(
      conversation
    );


  roomName.textContent =
    name;

  roomAvatar.textContent =
    initials(
      name
    );

  roomStatus.textContent =
    'Conversación privada';


  emptyState.style.display =
    'none';

  chatRoom.style.display =
    'flex';

  app.classList.add(
    'roomOpen'
  );


  renderConversations();


  socket.emit(
    'conversation-join',
    {
      conversationId:
        id
    },
    result => {

      if (
        result &&
        result.ok === false
      ) {

        showToast(
          result.msg ||
          'No se pudo abrir la conversación'
        );

      }

    }
  );


  await loadMessages(
    id
  );

}

  conversationId
) {

  try {

    messages.innerHTML =
      '';


    const {
      response,
      data
    } =
      await apiFetch(
        `/api/chat/conversations/${encodeURIComponent(conversationId)}/messages`
      );


    if (
      !response.ok ||
      !data.ok
    ) {

      showToast(
        data.msg ||
        'No se pudieron cargar los mensajes'
      );

      return;
    }


    const list =
      Array.isArray(
        data.messages
      )
        ? data.messages
        : [];


    for (
      const message
      of list
    ) {

      appendMessage(
        message
      );

    }


    scrollMessages();


  } catch (error) {

    console.error(
      'VOBIXCHAT LOAD MESSAGES:',
      error
    );

  }

}


// ========================================================
// MOSTRAR MENSAJES
// ========================================================

function appendMessage(
  message
) {

  if (!message) {
    return;
  }


  const senderId =
    message.senderId ??
    message.sender_user_id ??
    message.userId ??
    message.user_id;


  const mine =
    currentUser &&
    String(
      senderId
    ) ===
    String(
      currentUser.id
    );


  const type =
    String(
      message.messageType ||
      message.message_type ||
      message.type ||
      'text'
    ).toLowerCase();


  const content =
    String(
      message.content ??
      message.text ??
      ''
    );


  const mediaUrl =
    String(
      message.mediaUrl ||
      message.media_url ||
      message.fileUrl ||
      message.file_url ||
      ''
    );


  const fileName =
    String(
      message.fileName ||
      message.file_name ||
      'Archivo'
    );


  const row =
    document.createElement(
      'div'
    );


  row.className =
    mine
      ? 'messageRow me'
      : 'messageRow';


  const bubble =
    document.createElement(
      'div'
    );


  bubble.className =
    'bubble';


  if (!mine) {

    const sender =
      document.createElement(
        'div'
      );


    sender.className =
      'messageSender';


    sender.textContent =
      String(
        message.senderUsername ||
        message.sender_username ||
        getConversationName(
          currentConversation
        )
      );


    bubble.appendChild(
      sender
    );

  }


  // TEXTO

  if (
    type === 'text' ||
    (
      !mediaUrl &&
      content
    )
  ) {

    const text =
      document.createElement(
        'div'
      );


    text.className =
      'messageText';


    text.textContent =
      content;


    bubble.appendChild(
      text
    );

  }


  // IMAGEN

  if (
    type === 'image' ||
    type === 'photo'
  ) {

    const image =
      document.createElement(
        'img'
      );


    image.className =
      'messageMedia';


    image.src =
      mediaUrl ||
      content;


    image.alt =
      fileName;


    image.loading =
      'lazy';


    bubble.appendChild(
      image
    );

  }


  // VIDEO

  if (
    type === 'video'
  ) {

    const video =
      document.createElement(
        'video'
      );


    video.className =
      'messageVideo';


    video.src =
      mediaUrl ||
      content;

    video.controls =
      true;

    video.playsInline =
      true;

    video.preload =
      'metadata';


    bubble.appendChild(
      video
    );

  }


  // NOTA DE VOZ / AUDIO

  if (
    type === 'audio' ||
    type === 'voice'
  ) {

    const audio =
      document.createElement(
        'audio'
      );


    audio.className =
      'messageAudio';


    audio.src =
      mediaUrl ||
      content;

    audio.controls =
      true;

    audio.preload =
      'metadata';


    bubble.appendChild(
      audio
    );

  }


  // DOCUMENTO

  if (
    type === 'document' ||
    type === 'file'
  ) {

    const link =
      document.createElement(
        'a'
      );


    link.className =
      'messageDocument';


    link.href =
      mediaUrl ||
      content;

    link.target =
      '_blank';

    link.rel =
      'noopener noreferrer';


    const icon =
      document.createElement(
        'span'
      );


    icon.className =
      'messageDocumentIcon';

    icon.textContent =
      '📄';


    const name =
      document.createElement(
        'span'
      );


    name.className =
      'messageDocumentName';

    name.textContent =
      fileName;


    link.appendChild(
      icon
    );

    link.appendChild(
      name
    );

    bubble.appendChild(
      link
    );

  }


  const meta =
    document.createElement(
      'div'
    );


  meta.className =
    'messageMeta';


  const createdAt =
    message.createdAt ||
    message.created_at ||
    Date.now();


  meta.innerHTML = `

    <span>
      ${escapeHtml(formatTime(createdAt))}
    </span>

    ${
      mine
        ? '<span class="ticks">✓✓</span>'
        : ''
    }

  `;


  bubble.appendChild(
    meta
  );


  row.appendChild(
    bubble
  );


  messages.appendChild(
    row
  );


  scrollMessages();

}


function scrollMessages() {

  requestAnimationFrame(
    () => {

      messages.scrollTop =
        messages.scrollHeight;

    }
  );

}

// ENVIAR MENSAJE DE TEXTO
// ========================================================

function sendTextMessage() {

  if (
    !currentConversationId
  ) {

    showToast(
      'Selecciona una conversación'
    );

    return;
  }


  const text =
    String(
      messageInput.value ||
      ''
    ).trim();


  if (!text) {
    return;
  }


  messageInput.value =
    '';


  socket.emit(
    'conversation-message',
    {

      conversationId:
        currentConversationId,

      text

    },
    result => {

      if (
        result &&
        result.ok === false
      ) {

        messageInput.value =
          text;


        showToast(
          result.msg ||
          'No se pudo enviar el mensaje'
        );

      }

    }
  );

}

// ========================================================
// SUBIR ARCHIVO
// ========================================================

async function uploadChatFile(
  file,
  forcedType = ''
) {

  if (
    !file ||
    !currentConversationId
  ) {

    return;
  }


  if (isUploadingFile) {

    showToast(
      'Espera a que termine la subida actual'
    );

    return;
  }


  isUploadingFile =
    true;


  setUploadStatus(
    'Subiendo archivo...'
  );


  try {

    const form =
      new FormData();


    form.append(
      'file',
      file,
      file.name ||
      `vobix-${Date.now()}`
    );


    form.append(
      'conversationId',
      currentConversationId
    );


    if (forcedType) {

      form.append(
        'messageType',
        forcedType
      );

    }


    /*
      La ruta de subida debe existir en routes/chat.js.
      En el BLOQUE 4 dejamos también una alternativa
      para enviar Blob/base64 si tu backend actual
      todavía no utiliza multipart.
    */

    const {
      response,
      data
    } =
      await apiFetch(
        '/api/chat/upload',
        {

          method:
            'POST',

          body:
            form

        }
      );


    if (
      !response.ok ||
      !data.ok
    ) {

      throw new Error(
        data.msg ||
        'No se pudo subir el archivo'
      );

    }


    setUploadStatus(
      ''
    );


    /*
      Si el servidor devuelve el mensaje ya creado,
      Socket.IO normalmente lo distribuirá.
      Si no lo distribuye, lo mostramos localmente.
    */

    if (
      data.message &&
      !data.broadcasted
    ) {

      appendMessage(
        data.message
      );

    }


  } catch (error) {

    console.error(
      'VOBIXCHAT UPLOAD:',
      error
    );


    setUploadStatus(
      ''
    );


    showToast(
      error.message ||
      'No se pudo enviar el archivo'
    );


  } finally {

    isUploadingFile =
      false;

  }

}


// ========================================================

function getFileMessageType(
  file
) {

  const type =
    String(
      file?.type ||
      ''
    ).toLowerCase();


  if (
    type.startsWith(
      'image/'
    )
  ) {

    return 'image';

  }


  if (
    type.startsWith(
      'video/'
    )
  ) {

    return 'video';

  }


  if (
    type.startsWith(
      'audio/'
    )
  ) {

    return 'audio';

  }


  return 'document';

}

// ========================================================
// NOTAS DE VOZ
// ========================================================

function chooseAudioMimeType() {

  if (
    typeof MediaRecorder ===
    'undefined'
  ) {

    return '';

  }


  const candidates = [

    'audio/mp4',

    'audio/webm;codecs=opus',

    'audio/webm',

    'audio/ogg;codecs=opus'

  ];


  for (
    const candidate
    of candidates
  ) {

    try {

      if (
        MediaRecorder.isTypeSupported(
          candidate
        )
      ) {

        return candidate;

      }

    } catch (_) {}

  }


  return '';

}


async function startVoiceRecording() {

  if (
    !currentConversationId
  ) {

    showToast(
      'Selecciona una conversación'
    );

    return;
  }


  if (
    !navigator.mediaDevices ||
    !navigator.mediaDevices.getUserMedia
  ) {

    showToast(
      'El navegador no permite usar el micrófono'
    );

    return;
  }


  if (
    typeof MediaRecorder ===
    'undefined'
  ) {

    showToast(
      'Este navegador no permite grabar notas de voz'
    );

    return;
  }


  try {

    mediaRecorderStream =
      await navigator
        .mediaDevices
        .getUserMedia({

          audio: {

            echoCancellation:
              true,

            noiseSuppression:
              true,

            autoGainControl:
              true

          },

          video:
            false

        });


    recordedChunks =
      [];


    const mimeType =
      chooseAudioMimeType();


    const options =
      mimeType
        ? {
            mimeType
          }
        : undefined;


    mediaRecorder =
      new MediaRecorder(
        mediaRecorderStream,
        options
      );


    mediaRecorder.addEventListener(
      'dataavailable',
      event => {

        if (
          event.data &&
          event.data.size > 0
        ) {

          recordedChunks.push(
            event.data
          );

        }

      }
    );


    mediaRecorder.addEventListener(
      'stop',
      handleVoiceRecordingFinished
    );


    mediaRecorder.addEventListener(
      'error',
      event => {

        console.error(
          'VOBIXCHAT MEDIARECORDER:',
          event
        );


        showToast(
          'Error grabando la nota de voz'
        );

      }
    );


    mediaRecorder.start(
      250
    );


    recordingStartedAt =
      Date.now();


    audioButton.classList.add(
      'recording'
    );


    audioButton.textContent =
      '■';


    setUploadStatus(
      'Grabando nota de voz · toca ■ para enviar'
    );


    clearInterval(
      recordingTimer
    );


    recordingTimer =
      setInterval(
        () => {

          const seconds =
            Math.floor(
              (
                Date.now() -
                recordingStartedAt
              ) / 1000
            );


          setUploadStatus(
            `Grabando nota de voz · ${seconds}s · toca ■ para enviar`
          );

        },
        1000
      );


  } catch (error) {

    console.error(
      'VOBIXCHAT MICROPHONE:',
      error
    );


    stopRecorderTracks();


    if (
      error?.name ===
      'NotAllowedError'
    ) {

      showToast(
        'Debes permitir el acceso al micrófono'
      );

    } else {

      showToast(
        'No se pudo abrir el micrófono'
      );

    }

  }

}


function stopVoiceRecording() {

  if (
    !mediaRecorder
  ) {

    return;
  }


  if (
    mediaRecorder.state !==
    'inactive'
  ) {

    mediaRecorder.stop();

  }

}


function stopRecorderTracks() {

  if (
    mediaRecorderStream
  ) {

    for (
      const track
      of mediaRecorderStream.getTracks()
    ) {

      track.stop();

    }

  }


  mediaRecorderStream =
    null;

}


async function handleVoiceRecordingFinished() {

  clearInterval(
    recordingTimer
  );


  recordingTimer =
    null;


  audioButton.classList.remove(
    'recording'
  );


  audioButton.textContent =
    '🎤';


  setUploadStatus(
    'Preparando nota de voz...'
  );


  const mimeType =
    mediaRecorder?.mimeType ||
    recordedChunks?.[0]?.type ||
    'audio/webm';


  const blob =
    new Blob(
      recordedChunks,
      {
        type:
          mimeType
      }
    );


  recordedChunks =
    [];


  stopRecorderTracks();


  mediaRecorder =
    null;


  if (
    !blob.size
  ) {

    setUploadStatus(
      ''
    );


    showToast(
      'La nota de voz quedó vacía'
    );

    return;
  }


  const extension =
    mimeType.includes(
      'mp4'
    )
      ? 'm4a'
      : mimeType.includes(
          'ogg'
        )
          ? 'ogg'
          : 'webm';


  const file =
    new File(
      [blob],
      `nota-voz-${Date.now()}.${extension}`,
      {
        type:
          mimeType
      }
    );


  await uploadChatFile(
    file,
    'audio'
  );


  setUploadStatus(
    ''
  );

}

// ========================================================
// FIN DEL BLOQUE 3/5
// ========================================================
// ========================================================
// WEBRTC - CREAR PEER CONNECTION
// ========================================================

function createPeerConnection() {

  if (
    peerConnection &&
    peerConnection.signalingState !== 'closed'
  ) {

    return peerConnection;

  }


  peerConnection =
    new RTCPeerConnection(
      RTC_CONFIGURATION
    );


  // ------------------------------------------------------
  // ENVIAR ICE AL OTRO USUARIO
  // ------------------------------------------------------

  peerConnection.onicecandidate =
    event => {

      if (
        !event.candidate ||
        !currentCall ||
        !currentCall.conversationId
      ) {

        return;

      }


      socket.emit(
        'call:ice',
        {

          callId:
            currentCall.callId,

          conversationId:
            currentCall.conversationId,

          candidate:
            event.candidate

        }
      );

    };


  // ------------------------------------------------------
  // RECIBIR AUDIO / VIDEO REMOTO
  // ------------------------------------------------------

  peerConnection.ontrack =
    event => {

      if (
        event.streams &&
        event.streams[0]
      ) {

        remoteStream =
          event.streams[0];

      } else {

        if (!remoteStream) {

          remoteStream =
            new MediaStream();

        }


        remoteStream.addTrack(
          event.track
        );

      }


      remoteAudio.srcObject =
        remoteStream;


      remoteVideo.srcObject =
        remoteStream;


      /*
        iPhone/Safari puede bloquear play()
        hasta que hubo interacción del usuario.

        Como aceptar/iniciar llamada ya constituye
        interacción, volvemos a solicitar reproducción.
      */

      remoteAudio
        .play()
        .catch(
          () => {}
        );


      remoteVideo
        .play()
        .catch(
          () => {}
        );


      callTopStatus.textContent =
        'Conectado';


      audioCallStatus.textContent =
        'Conectado';

    };


  // ------------------------------------------------------
  // ESTADO DE CONEXIÓN
  // ------------------------------------------------------

  peerConnection.onconnectionstatechange =
    () => {

      if (!peerConnection) {
        return;
      }


      const state =
        peerConnection.connectionState;


      if (
        state === 'connected'
      ) {

        callTopStatus.textContent =
          'Conectado';

        audioCallStatus.textContent =
          'Conectado';

      }


      if (
        state === 'connecting'
      ) {

        callTopStatus.textContent =
          'Conectando...';

        audioCallStatus.textContent =
          'Conectando...';

      }


      if (
        state === 'failed'
      ) {

        callTopStatus.textContent =
          'Conexión perdida';

        audioCallStatus.textContent =
          'Conexión perdida';

      }


      if (
        state === 'disconnected'
      ) {

        callTopStatus.textContent =
          'Reconectando...';

        audioCallStatus.textContent =
          'Reconectando...';

      }

    };


  peerConnection.oniceconnectionstatechange =
    () => {

      if (!peerConnection) {
        return;
      }


      const state =
        peerConnection
          .iceConnectionState;


      if (
        state === 'failed'
      ) {

        /*
          Intentamos reiniciar ICE cuando
          el navegador lo permite.
        */

        try {

          peerConnection.restartIce();

        } catch (_) {}

      }

    };


  return peerConnection;

}


// ========================================================
// OBTENER MICRÓFONO / CÁMARA
// ========================================================

async function openLocalMedia(
  callType
) {

  if (
    !navigator.mediaDevices ||
    !navigator.mediaDevices.getUserMedia
  ) {

    throw new Error(
      'Este navegador no permite acceder al micrófono o cámara'
    );

  }


  /*
    Detenemos un stream anterior para evitar
    dejar bloqueada la cámara en iPhone.
  */

  stopLocalStream();


  const wantsVideo =
    callType === 'video';


  const constraints = {

    audio: {

      echoCancellation:
        true,

      noiseSuppression:
        true,

      autoGainControl:
        true

    },

    video:
      wantsVideo
        ? {

            facingMode:
              'user',

            width: {
              ideal:
                1280
            },

            height: {
              ideal:
                720
            }

          }
        : false

  };


  try {

    localStream =
      await navigator
        .mediaDevices
        .getUserMedia(
          constraints
        );


  } catch (error) {

    /*
      Algunos Safari/iPhone pueden rechazar
      constraints demasiado específicos.

      Segundo intento con constraints simples.
    */

    console.warn(
      'VOBIXCHAT MEDIA FIRST TRY:',
      error
    );


    localStream =
      await navigator
        .mediaDevices
        .getUserMedia({

          audio:
            true,

          video:
            wantsVideo

        });

  }


  localVideo.srcObject =
    localStream;


  localVideo.muted =
    true;


  localVideo.playsInline =
    true;


  try {

    await localVideo.play();

  } catch (_) {}


  callIsMuted =
    false;


  callCameraEnabled =
    wantsVideo;


  updateCallButtons();


  return localStream;

}


// ========================================================
// AGREGAR TRACKS LOCALES
// ========================================================

function addLocalTracksToPeer() {

  if (
    !peerConnection ||
    !localStream
  ) {

    return;
  }


  const existingSenders =
    peerConnection
      .getSenders();


  for (
    const track
    of localStream.getTracks()
  ) {

    const existingSender =
      existingSenders.find(
        sender =>
          sender.track &&
          sender.track.kind ===
            track.kind
      );


    if (
      existingSender
    ) {

      existingSender
        .replaceTrack(
          track
        )
        .catch(
          error => {

            console.error(
              'VOBIXCHAT REPLACE TRACK:',
              error
            );

          }
        );

    } else {

      peerConnection.addTrack(
        track,
        localStream
      );

    }

  }

}


// ========================================================
// DETENER STREAM LOCAL
// ========================================================

function stopLocalStream() {

  if (!localStream) {
    return;
  }


  for (
    const track
    of localStream.getTracks()
  ) {

    try {

      track.stop();

    } catch (_) {}

  }


  localStream =
    null;


  localVideo.srcObject =
    null;

}


// ========================================================
// LIMPIAR STREAM REMOTO
// ========================================================

function clearRemoteStream() {

  remoteVideo.srcObject =
    null;

  remoteAudio.srcObject =
    null;


  remoteStream =
    null;

}


// ========================================================
// CERRAR PEER CONNECTION
// ========================================================

function closePeerConnection() {

  if (!peerConnection) {
    return;
  }


  peerConnection.onicecandidate =
    null;

  peerConnection.ontrack =
    null;

  peerConnection.onconnectionstatechange =
    null;

  peerConnection.oniceconnectionstatechange =
    null;


  try {

    peerConnection.close();

  } catch (_) {}


  peerConnection =
    null;

}


// ========================================================
// CANDIDATOS ICE PENDIENTES
// ========================================================

async function flushRemoteCandidates() {

  if (
    !peerConnection ||
    !peerConnection.remoteDescription
  ) {

    return;

  }


  const candidates =
    [
      ...pendingRemoteCandidates
    ];


  pendingRemoteCandidates =
    [];


  for (
    const candidate
    of candidates
  ) {

    try {

      await peerConnection
        .addIceCandidate(
          new RTCIceCandidate(
            candidate
          )
        );


    } catch (error) {

      console.error(
        'VOBIXCHAT ADD ICE:',
        error
      );

    }

  }

}


// ========================================================
// MOSTRAR PANTALLA DE LLAMADA
// ========================================================

function showCallScreen(

// ========================================================
// OCULTAR PANTALLA DE LLAMADA
// ========================================================

function hideCallScreen() {

  );

}


// ========================================================
// ACTUALIZAR BOTONES MIC / CÁMARA
// ========================================================

function updateCallButtons() {

  callMuteButton.classList.toggle(
    'active',
    callIsMuted
  );


  callMuteButton.textContent =
    callIsMuted
      ? '🔇'
      : '🎤';


  callCameraButton.classList.toggle(
    'active',
    !callCameraEnabled
  );


  callCameraButton.textContent =
    callCameraEnabled
      ? '📹'
      : '🚫';

}


// ========================================================
// SILENCIAR / ACTIVAR MICRÓFONO
// ========================================================

function toggleCallMute() {

  if (!localStream) {
    return;
  }


  const tracks =
    localStream
      .getAudioTracks();


  if (!tracks.length) {
    return;
  }


  callIsMuted =
    !callIsMuted;


  for (
    const track
    of tracks
  ) {

    track.enabled =
      !callIsMuted;

  }


  updateCallButtons();

}


// ========================================================
// ACTIVAR / DESACTIVAR CÁMARA
// ========================================================

function toggleCallCamera() {

  if (!localStream) {
    return;
  }


  const tracks =
    localStream
      .getVideoTracks();


  if (!tracks.length) {

    showToast(
      'Esta llamada no tiene cámara'
    );

    return;
  }


  callCameraEnabled =
    !callCameraEnabled;


  for (
    const track
    of tracks
  ) {

    track.enabled =
      callCameraEnabled;

  }


  updateCallButtons();

}


// ========================================================
// LIMPIAR ESTADO DE LLAMADA
// ========================================================

function cleanupCall() {

  stopLocalStream();

  clearRemoteStream();

  closePeerConnection();


  pendingRemoteCandidates =
    [];


  currentCall =
    null;

  incomingCallData =
    null;


  callIsMuted =
    false;

  callCameraEnabled =
    true;


  hideCallScreen();

}


// ========================================================
// INICIAR LLAMADA DESDE EL BOTÓN
// ========================================================

async function startCall(
  callType
) {

  if (
    !currentConversationId
  ) {

    showToast(
      'Selecciona una conversación'
    );

    return;
  }


  if (currentCall) {

    showToast(
      'Ya tienes una llamada activa'
    );

    return;
  }


  const type =
    callType === 'video'
      ? 'video'
      : 'audio';


  const contactName =
    getConversationName(
      currentConversation
    );


  /*
    IMPORTANTE:
    getUserMedia se ejecuta directamente
    después del clic del usuario.

    Esto mejora compatibilidad con Safari/iPhone.
  */

  try {

    showCallScreen(
      type,
      contactName
    );


    callTopStatus.textContent =
      type === 'video'
        ? 'Abriendo cámara...'
        : 'Abriendo micrófono...';


    await openLocalMedia(
      type
    );


    createPeerConnection();


    addLocalTracksToPeer();


  } catch (error) {

    console.error(
      'VOBIXCHAT START MEDIA:',
      error
    );


    cleanupCall();


    if (
      error?.name ===
      'NotAllowedError'
    ) {

      showToast(
        'Debes permitir cámara y micrófono'
      );

    } else {

      showToast(
        error.message ||
        'No se pudo abrir el micrófono o cámara'
      );

    }


    return;
  }


  const temporaryCallId =
    (
      window.crypto &&
      typeof window.crypto.randomUUID ===
        'function'
    )
      ? window.crypto.randomUUID()
      : `call-${Date.now()}-${Math.random()
          .toString(16)
          .slice(2)}`;


  currentCall = {

    callId:
      temporaryCallId,

    conversationId:
      currentConversationId,

    type,

    direction:
      'outgoing',

    name:
      contactName

  };


  callTopStatus.textContent =
    'Llamando...';


  audioCallStatus.textContent =
    'Llamando...';


  socket.emit(
    'call:start',
    {

      callId:
        temporaryCallId,

      conversationId:
        currentConversationId,

      type

    },
    async result => {

      if (
        !result ||
        result.ok === false
      ) {

        const message =
          result?.msg ||
          'No se pudo iniciar la llamada';


        cleanupCall();


        showToast(
          message
        );


        return;
      }


      /*
        El servidor puede devolver su propio callId.
      */

      if (
        currentCall &&
        result.callId
      ) {

        currentCall.callId =
          result.callId;

      }


      if (
        result.pending
      ) {

        callTopStatus.textContent =
          'Llamando...';

        audioCallStatus.textContent =
          'Llamando...';

      }

    }
  );

}


// ========================================================
// CREAR OFFER CUANDO EL DESTINATARIO ACEPTA
// ========================================================

async function createAndSendOffer() {

  if (
    !currentCall ||
    !peerConnection
  ) {

    return;
  }


  try {

    const offer =
      await peerConnection
        .createOffer({

          offerToReceiveAudio:
            true,

          offerToReceiveVideo:
            currentCall.type ===
              'video'

        });


    await peerConnection
      .setLocalDescription(
        offer
      );


    socket.emit(
      'call:offer',
      {

        callId:
          currentCall.callId,

        conversationId:
          currentCall.conversationId,

        type:
          currentCall.type,

        offer:
          peerConnection.localDescription

      }
    );


  } catch (error) {

    console.error(
      'VOBIXCHAT CREATE OFFER:',
      error
    );


    showToast(
      'No se pudo establecer la llamada'
    );

  }

}


// ========================================================
// LLAMADA ENTRANTE
// ========================================================

socket.on(
  'call:incoming',
  data => {

    if (!data) {
      return;
    }


    /*
      Si ya existe otra llamada activa,
      rechazamos la nueva como ocupado.
    */

    if (
      currentCall &&
      String(
        currentCall.callId
      ) !==
      String(
        data.callId
      )
    ) {

      socket.emit(
        'call:reject',
        {

          callId:
            data.callId,

          conversationId:
            data.conversationId ||
            data.conversation_id,

          reason:
            'busy'

        }
      );


      return;
    }


    const type =
      String(
        data.type ||
        data.callType ||
        'audio'
      ).toLowerCase() ===
      'video'
        ? 'video'
        : 'audio';


    incomingCallData = {

      ...data,

      type,

      conversationId:
        String(
          data.conversationId ||
          data.conversation_id ||
          ''
        )

    };


    const callerName =
      String(
        data.fromUsername ||
        data.callerUsername ||
        'Contacto'
      );


    incomingName.textContent =
      callerName;


    incomingAvatar.textContent =
      initials(
        callerName
      );


    incomingType.textContent =
      type === 'video'
        ? 'Videollamada entrante'
        : 'Llamada entrante';


    incomingCall.classList.add(
      'open'
    );


    /*
      En iPhone una página abierta puede mostrar
      esta pantalla aunque el audio automático
      del timbre sea limitado por Safari.
    */

    if (
      navigator.vibrate
    ) {

      try {

        navigator.vibrate([
          250,
          150,
          250
        ]);

      } catch (_) {}

    }

  }
);


// ========================================================
// ACEPTAR LLAMADA
// ========================================================

async function acceptIncomingCall() {

  if (!incomingCallData) {
    return;
  }


  const data =
    incomingCallData;


  const callerName =
    String(
      data.fromUsername ||
      data.callerUsername ||
      'Contacto'
    );


  incomingCall.classList.remove(
    'open'
  );


  currentCall = {

    callId:
      data.callId,

    conversationId:
      data.conversationId,

    type:
      data.type,

    direction:
      'incoming',

    name:
      callerName

  };


  try {

    /*
      El usuario acaba de tocar "Aceptar",
      por eso pedimos los permisos aquí.
    */

    showCallScreen(
      data.type,
      callerName
    );


    await openLocalMedia(
      data.type
    );


    createPeerConnection();


    addLocalTracksToPeer();


    socket.emit(
      'call:accept',
      {

        callId:
          data.callId,

        conversationId:
          data.conversationId

      },
      result => {

        if (
          result &&
          result.ok === false
        ) {

          showToast(
            result.msg ||
            'No se pudo aceptar la llamada'
          );

        }

      }
    );


    incomingCallData =
      null;


  } catch (error) {

    console.error(
      'VOBIXCHAT ACCEPT CALL:',
      error
    );


    socket.emit(
      'call:reject',
      {

        callId:
          data.callId,

        conversationId:
          data.conversationId,

        reason:
          'media-error'

      }
    );


    cleanupCall();


    if (
      error?.name ===
      'NotAllowedError'
    ) {

      showToast(
        'Debes permitir cámara y micrófono'
      );

    } else {

      showToast(
        'No se pudo abrir el micrófono o cámara'
      );

    }

  }

}


// ========================================================
// RECHAZAR LLAMADA
// ========================================================

function rejectIncomingCall() {

  if (!incomingCallData) {
    return;
  }


  socket.emit(
    'call:reject',
    {

      callId:
        incomingCallData.callId,

      conversationId:
        incomingCallData.conversationId,

      reason:
        'rejected'

    }
  );


  incomingCallData =
    null;


  incomingCall.classList.remove(
    'open'
  );

}


// ========================================================
// EL DESTINATARIO ACEPTÓ
// ========================================================

socket.on(
  'call:accepted',
  async data => {

    if (
      !currentCall ||
      currentCall.direction !==
        'outgoing'
    ) {

      return;
    }


    if (
      data?.callId &&
      String(
        data.callId
      ) !==
      String(
        currentCall.callId
      )
    ) {

      return;
    }


    callTopStatus.textContent =
      'Conectando...';


    audioCallStatus.textContent =
      'Conectando...';


    await createAndSendOffer();

  }
);


// ========================================================
// RECIBIR OFFER
// ========================================================

socket.on(
  'call:offer',
  async data => {

    if (
      !data ||
      !data.offer
    ) {

      return;
    }


    try {

      /*
        Normalmente el peer ya existe porque
        el usuario aceptó la llamada.

        Lo recreamos solamente si fuera necesario.
      */

      if (!currentCall) {

        currentCall = {

          callId:
            data.callId,

          conversationId:
            String(
              data.conversationId ||
              data.conversation_id ||
              ''
            ),

          type:
            String(
              data.type ||
              'audio'
            ).toLowerCase() ===
            'video'
              ? 'video'
              : 'audio',

          direction:
            'incoming',

          name:
            data.fromUsername ||
            'Contacto'

        };

      }


      if (!localStream) {

        showCallScreen(
          currentCall.type,
          currentCall.name
        );


        await openLocalMedia(
          currentCall.type
        );

      }


      createPeerConnection();


      addLocalTracksToPeer();


      await peerConnection
        .setRemoteDescription(
          new RTCSessionDescription(
            data.offer
          )
        );


      await flushRemoteCandidates();


      const answer =
        await peerConnection
          .createAnswer();


      await peerConnection
        .setLocalDescription(
          answer
        );


      socket.emit(
        'call:answer',
        {

          callId:
            currentCall.callId,

          conversationId:
            currentCall.conversationId,

          answer:
            peerConnection.localDescription

        }
      );


      callTopStatus.textContent =
        'Conectando...';


      audioCallStatus.textContent =
        'Conectando...';


  } catch (error) {

      console.error(
        'VOBIXCHAT RECEIVE OFFER:',
        error
      );


      showToast(
        'No se pudo responder la llamada'
      );

    }

  }
);


// ========================================================
// RECIBIR ANSWER
// ========================================================

socket.on(
  'call:answer',
  async data => {

    if (
      !peerConnection ||
      !data?.answer
    ) {

      return;
    }


    if (
      currentCall &&
      data.callId &&
      String(
        data.callId
      ) !==
      String(
        currentCall.callId
      )
    ) {

      return;
    }


    try {

      await peerConnection
        .setRemoteDescription(
          new RTCSessionDescription(
            data.answer
          )
        );


      await flushRemoteCandidates();


    } catch (error) {

      console.error(
        'VOBIXCHAT RECEIVE ANSWER:',
        error
      );

    }

  }
);


// ========================================================
// RECIBIR ICE
// ========================================================

socket.on(
  'call:ice',
  async data => {

    const candidate =
      data?.candidate ||
      data?.iceCandidate;


    if (!candidate) {
      return;
    }


    if (
      currentCall &&
      data.callId &&
      String(
        data.callId
      ) !==
      String(
        currentCall.callId
      )
    ) {

      return;
    }


    if (
      !peerConnection ||
      !peerConnection.remoteDescription
    ) {

      pendingRemoteCandidates.push(
        candidate
      );

      return;
    }


    try {

      await peerConnection
        .addIceCandidate(
          new RTCIceCandidate(
            candidate
          )
        );


    } catch (error) {

      console.error(
        'VOBIXCHAT ICE CANDIDATE:',
        error
      );

    }

  }
);


// ========================================================
// LLAMADA RECHAZADA
// ========================================================

socket.on(
  'call:rejected',
  data => {

    if (
      currentCall &&
      data?.callId &&
      String(
        data.callId
      ) !==
      String(
        currentCall.callId
      )
    ) {

      return;
    }


    const reason =
      data?.reason;


    cleanupCall();


    if (
      reason === 'busy'
    ) {

      showToast(
        'El usuario está en otra llamada'
      );

    } else {

      showToast(
        'Llamada rechazada'
      );

    }

  }
);


// ========================================================
// SIN RESPUESTA
// ========================================================

socket.on(
  'call:no-answer',
  data => {

    if (
      currentCall &&
      data?.callId &&
      String(
        data.callId
      ) !==
      String(
        currentCall.callId
      )
    ) {

      return;
    }


    cleanupCall();


    showToast(
      'La llamada no fue contestada'
    );

  }
);


// ========================================================
// LLAMADA FINALIZADA POR EL OTRO USUARIO
// ========================================================

socket.on(
  'call:ended',
  data => {

    if (
      currentCall &&
      data?.callId &&
      String(
        data.callId
      ) !==
      String(
        currentCall.callId
      )
    ) {

      return;
    }


    cleanupCall();


    showToast(
      'Llamada finalizada'
    );

  }
);


// ========================================================
// COLGAR
// ========================================================

function endCurrentCall() {

  if (!currentCall) {

    cleanupCall();

    return;
  }


  const call =
    {
      ...currentCall
    };


  socket.emit(
    'call:end',
    {

      callId:
        call.callId,

      conversationId:
        call.conversationId,

      reason:
        'ended'

    }
  );


  cleanupCall();

}
