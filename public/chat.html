<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>VobixChat</title>
<style>
*{box-sizing:border-box;font-family:Arial;margin:0}
body{height:100vh;display:flex;background:#080c09;color:#fff;overflow:hidden}
.left{width:320px;background:#0a110b;border-right:2px solid #3aff68;display:flex;flex-direction:column}
.right{flex:1;display:flex;flex-direction:column;background:#0e1a10}
.top{padding:12px;background:#0a110b;border-bottom:1px solid #1e3a22;display:flex;justify-content:space-between;align-items:center}
.logo{color:#3aff68;font-weight:900;font-size:16px}
.btnS{background:#3aff68;border:none;padding:8px 12px;border-radius:8px;font-weight:900;cursor:pointer;color:#000;width:100%}
.contact{padding:12px;border-bottom:1px solid #152a18;display:flex;gap:10px;cursor:pointer}
.contact.active{background:#1a2f1e;border-left:3px solid #3aff68}
.ava{width:40px;height:40px;background:#3aff68;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#000;font-weight:900}
.msgs{flex:1;overflow:auto;padding:16px;background-image:radial-gradient(rgba(58,255,104,.08) 1px,transparent 1px);background-size:20px 20px}
.bub{max-width:68%;padding:10px 12px;border-radius:12px;margin:6px 0;font-size:14px;position:relative}
.me{background:#3aff68;color:#000;margin-left:auto;border-bottom-right-radius:2px}
.other{background:#1e2f22;border:1px solid #2d5a35;border-bottom-left-radius:2px}
.bar{display:flex;gap:6px;padding:8px;background:#0a110b;border-top:1px solid #1e3a22;align-items:center}
.bar button{background:transparent;border:none;color:#3aff68;font-size:20px;cursor:pointer;padding:6px}
.bar input{flex:1;background:#0a150c;border:1px solid #234427;border-radius:22px;padding:11px 14px;color:#fff;outline:none}
.sendBtn{background:#3aff68!important;color:#000!important;width:42px;height:42px;border-radius:50%!important;font-size:18px!important;display:flex;align-items:center;justify-content:center}
.modal{position:fixed;inset:0;background:#000d;display:none;align-items:center;justify-content:center;z-index:99}
.boxM{background:#0a110b;border:2px solid #3aff68;border-radius:16px;padding:20px;width:92%;max-width:360px;text-align:center}
.redBtn{background:#ff3333;color:#fff;border:none;padding:12px 26px;border-radius:24px;font-weight:900;cursor:pointer}
.emojiP{display:none;padding:8px;background:#111f13;border-top:1px solid #1e3a22;font-size:22px;gap:6px;flex-wrap:wrap}
.emojiP span{cursor:pointer}
</style>
</head>
<body>
<div class="left">
<div class="top"><span class="logo">VOBIXCHAT</span><span style="font-size:12px;color:#8ac898" id="myName"></span></div>
<div style="padding:8px"><button class="btnS" onclick="addPerson()">+ AGREGAR PERSONA</button></div>
<div id="list" style="flex:1;overflow:auto"></div>
<div style="padding:10px;border-top:1px solid #1e3a22;display:flex;flex-direction:column;gap:6px">
<button onclick="invite()" style="background:transparent;border:1px solid #3aff68;color:#3aff68;padding:9px;border-radius:8px;cursor:pointer">📨 Invitar amigo</button>
<button onclick="localStorage.clear();location.href='index.html'" style="background:transparent;border:none;color:#777;cursor:pointer;font-size:12px">Salir</button>
</div>
</div>
<div class="right">
<div class="top">
<div style="display:flex;align-items:center;gap:10px"><div class="ava" id="chatAva">V</div><div><b id="chatName">Selecciona un chat</b><br><small style="color:#8ac898">Cifrado de extremo a extremo</small></div></div>
<div style="display:flex;gap:8px">
<button onclick="call(false)" style="background:transparent;border:none;font-size:22px;cursor:pointer">📞</button>
<button onclick="call(true)" style="background:transparent;border:none;font-size:22px;cursor:pointer">📹</button>
<button onclick="document.getElementById('menu').style.display='flex'" style="background:transparent;border:none;color:#fff;font-size:20px;cursor:pointer">⋮</button>
</div>
</div>
<div id="msgs" class="msgs"><div class="bub other">¡Bienvenido a VobixChat! Ya estás dentro. Agrega una persona para chatear en privado.</div></div>
<div class="emojiP" id="emojiP"><span onclick="ins('😊')">😊</span><span onclick="ins('❤️')">❤️</span><span onclick="ins('😂')">😂</span><span onclick="ins('🔥')">🔥</span><span onclick="ins('👍')">👍</span><span onclick="ins('🎉')">🎉</span><span onclick="ins('😍')">😍</span><span onclick="ins('🙏')">🙏</span><span onclick="ins('😢')">😢</span><span onclick="ins('👋')">👋</span></div>
<div class="bar">
<button onclick="toggleEmoji()">😊</button>
<button onclick="file.click()">📎</button>
<button onclick="openCam()">📷</button>
<input id="txt" placeholder="Escribe un mensaje" onkeydown="if(event.key==='Enter')sendMsg()">
<button id="mic" onclick="voice()">🎤</button>
<button class="sendBtn" onclick="sendMsg()">➤</button>
</div>
</div>

<div id="menu" class="modal" onclick="this.style.display='none'"><div class="boxM" onclick="event.stopPropagation()"><h3>Menu</h3><br><div style="text-align:left"><p onclick="alert('🔒 Cifrado de extremo a extremo activado')" style="padding:10px;cursor:pointer">🔒 Seguridad</p><p onclick="clearChat()" style="padding:10px;cursor:pointer">🗑️ Vaciar chat privado</p><p onclick="alert('Notificaciones activadas ✓')" style="padding:10px;cursor:pointer">🔔 Notificaciones</p></div><br><button onclick="document.getElementById('menu').style.display='none'" class="btnS">Cerrar</button></div></div>

<div id="callMod" class="modal"><div class="boxM"><h3 id="callT">Llamando...</h3><p id="callWho"></p><div style="font-size:70px;margin:18px">📞</div><p id="timer">00:00</p><br><button class="redBtn" onclick="endCall()">Colgar</button></div></div>
<div id="vidMod" class="modal"><div class="boxM" style="max-width:420px;width:95%"><h3>Videollamada</h3><video id="vid" autoplay muted playsinline style="width:100%;height:240px;background:#000;border-radius:12px;margin:12px 0"></video><br><button class="redBtn" onclick="endVid()">Colgar</button></div></div>

<input type="file" id="file" hidden onchange="sendFile(this)">

<script>
let contacts=JSON.parse(localStorage.getItem('vobix_contacts')||'[]');
if(contacts.length==0) contacts=[{name:"Maria",phone:"611111111"}];
let cur=0;
let msgs=JSON.parse(localStorage.getItem('vobix_msgs')||'{}');
let callInt=null, sec=0, streamRec=null, recorder=null, rec=false;

function render(){ let l=document.getElementById('list'); l.innerHTML=''; contacts.forEach((c,i)=>{ let d=document.createElement('div'); d.className='contact'+(i==cur?' active':''); d.innerHTML=`<div class="ava">${c.name[0].toUpperCase()}</div><div style="flex:1"><b>${c.name}</b><br><small style="color:#8ac898">${c.phone}</small></div>`; d.onclick=()=>openC(i); l.appendChild(d); }); document.getElementById('myName').innerText=localStorage.getItem('vobix_user')||''; }
function openC(i){ cur=i; document.getElementById('chatName').innerText=contacts[i].name; document.getElementById('chatAva').innerText=contacts[i].name[0].toUpperCase(); render(); load(); }
function load(){ let box=document.getElementById('msgs'); box.innerHTML=''; let k=contacts[cur].phone; (msgs[k]||[]).forEach(m=>{ let b=document.createElement('div'); b.className='bub '+(m.me?'me':'other'); b.innerHTML=m.html||m.text; box.appendChild(b); }); box.scrollTop=box.scrollHeight; }
function sendMsg(){ let t=document.getElementById('txt'); if(!t.value.trim())return; let k=contacts[cur].phone; if(!msgs[k])msgs[k]=[]; msgs[k].push({text:t.value,me:true,html:t.value}); save(); t.value=''; load(); }
function save(){ localStorage.setItem('vobix_msgs',JSON.stringify(msgs)); localStorage.setItem('vobix_contacts',JSON.stringify(contacts)); }
function ins(e){ document.getElementById('txt').value+=e; }
function toggleEmoji(){ let p=document.getElementById('emojiP'); p.style.display=p.style.display==='flex'?'none':'flex'; }
function addPerson(){ let n=prompt('Nombre de la persona:'); if(!n)return; let ph=prompt('Telefono:'); if(!ph)return; contacts.push({name:n,phone:ph}); save(); render(); openC(contacts.length-1); }
function invite(){ let link=location.origin; prompt('Envia este link a tu amigo:',link); }
function clearChat(){ if(confirm('¿Borrar chat privado?')){ msgs[contacts[cur].phone]=[]; save(); load(); } }
function sendFile(i){ if(!i.files[0])return; let k=contacts[cur].phone; if(!msgs[k])msgs[k]=[]; msgs[k].push({me:true,html:'📎 <b>'+i.files[0].name+'</b>'}); save(); load(); }
function openCam(){ navigator.mediaDevices.getUserMedia({video:true}).then(s=>{ document.getElementById('vidMod').style.display='flex'; document.getElementById('vid').srcObject=s; streamRec=s; setTimeout(()=>{ let k=contacts[cur].phone; if(!msgs[k])msgs[k]=[]; msgs[k].push({me:true,html:'📷 <i>Foto enviada</i>'}); save(); load(); },1200); }).catch(()=>alert('Permite camara')); }
function endVid(){ document.getElementById('vidMod').style.display='none'; if(streamRec) streamRec.getTracks().forEach(t=>t.stop()); }

function call(v){ document.getElementById('callMod').style.display='flex'; document.getElementById('callWho').innerText=contacts[cur].name; document.getElementById('callT').innerText=v?'Videollamada...':'Llamando...'; sec=0; callInt=setInterval(()=>{sec++; document.getElementById('timer').innerText=String(Math.floor(sec/60)).padStart(2,'0')+':'+String(sec%60).padStart(2,'0');},1000); if(v){ setTimeout(()=>{ endCall(); document.getElementById('vidMod').style.display='flex'; navigator.mediaDevices.getUserMedia({video:true,audio:true}).then(s=>{ document.getElementById('vid').srcObject=s; streamRec=s; }); },1200); } }
function endCall(){ document.getElementById('callMod').style.display='none'; clearInterval(callInt); document.getElementById('timer').innerText='00:00'; }

function voice(){ let b=document.getElementById('mic'); if(!rec){ navigator.mediaDevices.getUserMedia({audio:true}).then(s=>{ recorder=new MediaRecorder(s); recorder.onstop=()=>{ let k=contacts[cur].phone; if(!msgs[k])msgs[k]=[]; msgs[k].push({me:true,html:'🎤 <i>Nota de voz</i>'}); save(); load(); s.getTracks().forEach(t=>t.stop()); }; recorder.start(); rec=true; b.innerText='⏹️'; b.style.color='#ff4444'; }); } else { recorder.stop(); rec=false; document.getElementById('mic').innerText='🎤'; document.getElementById('mic').style.color='#3aff68'; } }

render(); if(contacts.length) openC(0);
</script>
</body>
</html>
