<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width,initial-scale=1,viewport-fit=cover"
  >

  <meta name="theme-color" content="#071009">

  <title>VOBIXCHAT</title>

  <script src="/socket.io/socket.io.js"></script>

  <style>

    * {
      box-sizing: border-box;
    }

    :root {
      --green: #68ff72;
      --green2: #39db5b;
      --bg: #071009;
      --panel: #0b160d;
      --panel2: #101d13;
      --border: rgba(104,255,114,.18);
      --text: #f1fff3;
      --muted: #8da891;
      --bubble: #15251a;
      --bubbleMe: #155d35;
      --danger: #ff4d4d;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: var(--bg);
      color: var(--text);
      font-family:
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
    }

    button,
    input {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    .app {
      display: flex;
      width: 100%;
      height: 100dvh;

      background:
        radial-gradient(
          circle at 25% 10%,
          rgba(67,255,99,.08),
          transparent 30%
        ),
        var(--bg);
    }

    .sidebar {
      width: 350px;
      min-width: 350px;
      display: flex;
      flex-direction: column;
      border-right: 1px solid var(--border);
      background: rgba(6,20,9,.96);
    }

    .profile {
      min-height: 78px;
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 14px 16px;
      border-bottom: 1px solid var(--border);
    }

    .logo {
      width: 48px;
      height: 48px;
      border-radius: 15px;
      display: grid;
      place-items: center;
      background: var(--green);
      color: #061008;
      font-size: 25px;
      font-weight: 1000;
      box-shadow: 0 0 25px rgba(104,255,114,.22);
    }

    .profileInfo {
      flex: 1;
      min-width: 0;
    }

    .brand {
      font-size: 16px;
      font-weight: 1000;
    }

    .username {
      margin-top: 3px;
      color: var(--green);
      font-size: 12px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .avatar {
      width: 42px;
      height: 42px;
      min-width: 42px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      background: #14291a;
      color: var(--green);
      border: 1px solid var(--border);
      font-weight: 900;
    }

    .searchArea {
      padding: 14px;
      border-bottom: 1px solid var(--border);
    }

    .searchBox {
      display: flex;
      gap: 8px;
    }

    .searchBox input {
      width: 100%;
      min-width: 0;
      padding: 13px 14px;
      border-radius: 14px;
      border: 1px solid var(--border);
      outline: none;
      color: white;
      background: #0e1a11;
    }

    .searchBox input:focus {
      border-color: var(--green);
    }

    .searchButton {
      width: 50px;
      min-width: 50px;
      border: 0;
      border-radius: 14px;
      background: var(--green);
      color: #071009;
      font-size: 20px;
      font-weight: 900;
    }

    .searchHelp {
      margin-top: 8px;
      color: var(--muted);
      font-size: 11px;
    }

    .searchResults {
      border-bottom: 1px solid var(--border);
    }

    .sectionTitle {
      padding: 14px 16px 8px;
      display: flex;
      justify-content: space-between;
      color: #d7ffda;
      font-size: 12px;
      font-weight: 900;
      letter-spacing: 1px;
    }

    .conversations {
      flex: 1;
      overflow-y: auto;
    }

    .conversation {
      display: flex;
      align-items: center;
      gap: 11px;
      padding: 12px 14px;
      cursor: pointer;
      border-bottom: 1px solid rgba(104,255,114,.07);
    }

    .conversation:hover {
      background: rgba(104,255,114,.05);
    }

    .conversation.active {
      background: rgba(104,255,114,.10);
    }

    .conversationBody {
      flex: 1;
      min-width: 0;
    }

    .conversationName {
      font-weight: 800;
      font-size: 14px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .conversationPreview {
      margin-top: 3px;
      color: var(--muted);
      font-size: 11px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .chat {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
      position: relative;
    }

    .empty {
      flex: 1;
      display: grid;
      place-items: center;
      text-align: center;
      padding: 30px;
    }

    .emptyLogo {
      width: 86px;
      height: 86px;
      margin: auto;
      border-radius: 25px;
      display: grid;
      place-items: center;
      background: var(--green);
      color: #071009;
      font-size: 46px;
      font-weight: 1000;
      box-shadow: 0 0 40px rgba(104,255,114,.18);
    }

    .empty h1 {
      margin: 18px 0 8px;
      font-size: 27px;
    }

    .empty p {
      color: var(--muted);
    }

    .chatRoom {
      display: none;
      flex: 1;
      min-height: 0;
      flex-direction: column;
    }

    .chatHeader {
      min-height: 72px;
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px 16px;
      border-bottom: 1px solid var(--border);
      background: rgba(8,19,10,.98);
    }

    .backButton {
      display: none;
    }

    .chatUser {
      flex: 1;
      min-width: 0;
    }

    .chatName {
      font-weight: 900;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .chatStatus {
      margin-top: 2px;
      color: var(--green);
      font-size: 11px;
    }

    .headerActions {
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .iconButton {
      width: 42px;
      height: 42px;
      display: grid;
      place-items: center;
      border: 0;
      border-radius: 50%;
      background: transparent;
      color: #dfffe2;
      font-size: 19px;
    }

    .iconButton:hover {
      background: rgba(104,255,114,.10);
      color: var(--green);
    }

    .messages {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      padding: 18px;
      background:
        radial-gradient(
          circle at 70% 10%,
          rgba(104,255,114,.04),
          transparent 30%
        );
    }

    .messageRow {
      display: flex;
      margin: 5px 0;
    }

    .messageRow.me {
      justify-content: flex-end;
    }

    .bubble {
      max-width: min(72%,650px);
      padding: 8px 11px 6px;
      border-radius: 12px;
      background: var(--bubble);
      border: 1px solid rgba(255,255,255,.04);
      word-break: break-word;
    }

    .messageRow.me .bubble {
      background: var(--bubbleMe);
    }

    .messageSender {
      margin-bottom: 3px;
      color: var(--green);
      font-size: 10px;
      font-weight: 800;
    }

    .messageText {
      font-size: 14px;
      line-height: 1.4;
    }

    .messageMeta {
      margin-top: 3px;
      display: flex;
      justify-content: flex-end;
      gap: 5px;
      color: rgba(255,255,255,.62);
      font-size: 9px;
    }

    .ticks {
      color: #76dfff;
    }

    .typing {
      min-height: 20px;
      padding: 2px 18px;
      color: var(--green);
      font-size: 11px;
      background: #08130a;
    }

    .composer {
      position: relative;
      display: flex;
      align-items: center;
      gap: 5px;
      padding: 9px 10px calc(9px + env(safe-area-inset-bottom));
      border-top: 1px solid var(--border);
      background: #08130a;
    }

    .composerInput {
      flex: 1;
      min-width: 0;
      height: 46px;
      padding: 0 15px;
      border-radius: 23px;
      border: 1px solid var(--border);
      outline: none;
      background: #122016;
      color: white;
    }

    .composerInput:focus {
      border-color: rgba(104,255,114,.55);
    }

    .composerButton {
      width: 44px;
      height: 44px;
      min-width: 44px;
      display: grid;
      place-items: center;
      border: 0;
      border-radius: 50%;
      background: transparent;
      color: #d8ffdc;
      font-size: 20px;
    }

    .composerButton:hover {
      background: rgba(104,255,114,.09);
      color: var(--green);
    }

    .sendButton {
      background: var(--green);
      color: #071009;
      font-weight: 1000;
    }

    .emojiPanel {
      position: absolute;
      display: none;
      left: 10px;
      bottom: 68px;
      width: 285px;
      padding: 12px;
      grid-template-columns: repeat(7,1fr);
      gap: 6px;
      border: 1px solid var(--border);
      border-radius: 16px;
      background: #101c13;
      box-shadow: 0 15px 50px rgba(0,0,0,.45);
      z-index: 50;
    }

    .emojiPanel.open {
      display: grid;
    }

    .emoji {
      border: 0;
      padding: 5px;
      border-radius: 8px;
      background: transparent;
      font-size: 21px;
    }

    .attachMenu {
      position: absolute;
      display: none;
      left: 58px;
      bottom: 68px;
      width: 210px;
      padding: 8px;
      border-radius: 16px;
      border: 1px solid var(--border);
      background: #101c13;
      box-shadow: 0 15px 50px rgba(0,0,0,.45);
      z-index: 51;
    }

    .attachMenu.open {
      display: block;
    }

    .attachOption {
      width: 100%;
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 11px;
      border: 0;
      border-radius: 10px;
      background: transparent;
      color: white;
      text-align: left;
    }

    .attachOption:hover {
      background: rgba(104,255,114,.08);
    }

    .toast {
      position: fixed;
      left: 50%;
      bottom: 90px;
      transform: translateX(-50%) translateY(20px);
      padding: 11px 17px;
      border: 1px solid var(--border);
      border-radius: 30px;
      background: #122016;
      color: white;
      opacity: 0;
      pointer-events: none;
      transition: .2s;
      z-index: 3000;
    }

    .toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }


    /* ==================================================
       LLAMADAS VOBIXCHAT
       ================================================== */

    .callScreen {
      position: fixed;
      inset: 0;
      display: none;
      z-index: 2000;
      background:
        radial-gradient(
          circle at 50% 20%,
          rgba(104,255,114,.16),
          transparent 35%
        ),
        #030a05;
    }

    .callScreen.open {
      display: flex;
      flex-direction: column;
    }

    .callVideoArea {
      position: relative;
      flex: 1;
      min-height: 0;
      overflow: hidden;
      display: grid;
      place-items: center;
    }

    .remoteVideo {
      width: 100%;
      height: 100%;
      object-fit: cover;
      background: #020603;
    }

    .localVideo {
      position: absolute;
      right: 18px;
      top: 18px;
      width: min(28vw,220px);
      aspect-ratio: 3/4;
      object-fit: cover;
      border-radius: 18px;
      border: 2px solid rgba(104,255,114,.45);
      background: #0b160d;
      box-shadow: 0 10px 35px rgba(0,0,0,.45);
      z-index: 5;
    }

    .audioCallIdentity {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      text-align: center;
      pointer-events: none;
    }

    .audioCallAvatar {
      width: 120px;
      height: 120px;
      margin: auto;
      border-radius: 50%;
      display: grid;
      place-items: center;
      background: #17341d;
      border: 2px solid rgba(104,255,114,.35);
      color: var(--green);
      font-size: 52px;
      font-weight: 1000;
      box-shadow: 0 0 55px rgba(104,255,114,.14);
    }

    .audioCallName {
      margin-top: 20px;
      font-size: 25px;
      font-weight: 900;
    }

    .audioCallStatus {
      margin-top: 7px;
      color: var(--muted);
      font-size: 14px;
    }

    .callTop {
      position: absolute;
      left: 0;
      right: 0;
      top: 0;
      z-index: 10;
      padding: 22px;
      text-align: center;
      pointer-events: none;
    }

    .callTopName {
      font-size: 19px;
      font-weight: 900;
    }

    .callTopStatus {
      margin-top: 4px;
      color: #b9d9be;
      font-size: 12px;
    }

    .callControls {
      min-height: 112px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 18px;
      padding: 20px;
      background: rgba(3,10,5,.94);
    }

    .callControl {
      width: 60px;
      height: 60px;
      border: 0;
      border-radius: 50%;
      display: grid;
      place-items: center;
      background: #18261b;
      color: white;
      font-size: 23px;
    }

    .callControl.active {
      background: #344137;
    }

    .callControl.end {
      background: var(--danger);
    }

    .incomingCall {
      position: fixed;
      inset: 0;
      z-index: 2500;
      display: none;
      place-items: center;
      padding: 22px;
      background: rgba(1,7,3,.94);
      backdrop-filter: blur(12px);
    }

    .incomingCall.open {
      display: grid;
    }

    .incomingCard {
      width: min(100%,390px);
      padding: 32px 22px 26px;
      border: 1px solid rgba(104,255,114,.25);
      border-radius: 28px;
      background: #0b160d;
      text-align: center;
      box-shadow: 0 25px 80px rgba(0,0,0,.55);
    }

    .incomingAvatar {
      width: 100px;
      height: 100px;
      margin: auto;
      display: grid;
      place-items: center;
      border-radius: 50%;
      background: #17341d;
      color: var(--green);
      border: 2px solid rgba(104,255,114,.35);
      font-size: 43px;
      font-weight: 1000;
    }

    .incomingName {
      margin-top: 18px;
      font-size: 24px;
      font-weight: 900;
    }

    .incomingType {
      margin-top: 7px;
      color: var(--muted);
    }

    .incomingActions {
      display: flex;
      justify-content: center;
      gap: 42px;
      margin-top: 32px;
    }

    .incomingButton {
      width: 68px;
      height: 68px;
      border: 0;
      border-radius: 50%;
      color: white;
      font-size: 26px;
    }

    .incomingButton.reject {
      background: var(--danger);
    }

    .incomingButton.accept {
      background: #25c85a;
    }

    @media(max-width:720px) {

      .sidebar {
        width: 100%;
        min-width: 100%;
      }

      .chat {
        display: none;
        width: 100%;
      }

      .app.roomOpen .sidebar {
        display: none;
      }

      .app.roomOpen .chat {
        display: flex;
      }

      .backButton {
        display: grid;
      }

      .bubble {
        max-width: 84%;
      }

      .messages {
        padding: 12px 9px;
      }

      .chatHeader {
        padding: 8px 6px;
      }

      .iconButton {
        width: 38px;
        height: 38px;
      }

      .composer {
        gap: 2px;
        padding-left: 4px;
        padding-right: 4px;
      }

      .composerButton {
        width: 39px;
        min-width: 39px;
      }

      .emojiPanel {
        left: 7px;
        width: calc(100% - 14px);
      }

      .localVideo {
        width: 105px;
        right: 12px;
        top: 12px;
      }

      .callControls {
        min-height: 100px;
        gap: 13px;
      }

      .callControl {
        width: 56px;
        height: 56px;
      }

    }

  </style>
</head>

<body>

<div class="app" id="app">

  <aside class="sidebar">

    <div class="profile">

      <div class="logo">
        V
      </div>

      <div class="profileInfo">

        <div class="brand">
          VOBIXCHAT
        </div>

        <div
          class="username"
          id="myUsername"
        >
          @
        </div>

      </div>

      <div
        class="avatar"
        id="myAvatar"
      >
        V
      </div>

    </div>

    <div class="searchArea">

      <div class="searchBox">

        <input
          id="searchInput"
          autocomplete="off"
          placeholder="Buscar usuario o teléfono"
        >

        <button
          class="searchButton"
          id="searchButton"
          type="button"
        >
          ⌕
        </button>

      </div>

      <div class="searchHelp">
        Busca por nombre o número de teléfono.
      </div>

    </div>

    <div
      class="searchResults"
      id="searchResults"
    ></div>

    <div class="sectionTitle">

      <span>
        CONVERSACIONES
      </span>

      <span id="conversationCount">
        0
      </span>

    </div>

    <div
      class="conversations"
      id="conversationList"
    ></div>

  </aside>


  <main class="chat">

    <section
      class="empty"
      id="emptyState"
    >

      <div>

        <div class="emptyLogo">
          V
        </div>

        <h1>
          VOBIXCHAT
        </h1>

        <p>
          Selecciona una conversación o busca una persona.
        </p>

        <p>
          Tus conversaciones se mantienen en salas privadas.
        </p>

      </div>

    </section>


    <section
      class="chatRoom"
      id="chatRoom"
    >

      <header class="chatHeader">

        <button
          class="iconButton backButton"
          id="backButton"
          type="button"
        >
          ←
        </button>

        <div
          class="avatar"
          id="roomAvatar"
        >
          V
        </div>

        <div class="chatUser">

          <div
            class="chatName"
            id="roomName"
          ></div>

          <div
            class="chatStatus"
            id="roomStatus"
          >
            Conversación privada
          </div>

        </div>

        <div class="headerActions">

          <button
            class="iconButton"
            id="voiceCallButton"
            title="Llamada de voz"
            type="button"
          >
            ☎
          </button>

          <button
            class="iconButton"
            id="videoCallButton"
            title="Videollamada"
            type="button"
          >
            🎥
          </button>

          <button
            class="iconButton"
            id="moreButton"
            title="Opciones"
            type="button"
          >
            ⋮
          </button>

        </div>

      </header>


      <div
        class="messages"
        id="messages"
      ></div>


      <div
        class="typing"
        id="typing"
      ></div>


      <div class="composer">

        <button
          class="composerButton"
          id="emojiButton"
          type="button"
          title="Emojis"
        >
          😊
        </button>

        <button
          class="composerButton"
          id="attachButton"
          type="button"
          title="Adjuntar"
        >
          📎
        </button>

        <input
          class="composerInput"
          id="messageInput"
          autocomplete="off"
          placeholder="Escribe un mensaje..."
        >

        <button
          class="composerButton"
          id="cameraButton"
          type="button"
          title="Cámara"
        >
          📷
        </button>

        <button
          class="composerButton"
          id="audioButton"
          type="button"
          title="Nota de voz"
        >
          🎤
        </button>

        <button
          class="composerButton sendButton"
          id="sendButton"
          type="button"
          title="Enviar"
        >
          ➤
        </button>


        <div
          class="emojiPanel"
          id="emojiPanel"
        >

          <button class="emoji">😀</button>
          <button class="emoji">😂</button>
          <button class="emoji">😍</button>
          <button class="emoji">🥰</button>
          <button class="emoji">😎</button>
          <button class="emoji">🤔</button>
          <button class="emoji">😢</button>

          <button class="emoji">😭</button>
          <button class="emoji">😡</button>
          <button class="emoji">👍</button>
          <button class="emoji">👎</button>
          <button class="emoji">👏</button>
          <button class="emoji">🙏</button>
          <button class="emoji">💪</button>

          <button class="emoji">❤️</button>
          <button class="emoji">💚</button>
          <button class="emoji">🔥</button>
          <button class="emoji">🎉</button>
          <button class="emoji">✅</button>
          <button class="emoji">💯</button>
          <button class="emoji">🚀</button>

        </div>


        <div
          class="attachMenu"
          id="attachMenu"
        >

          <button
            class="attachOption"
            id="photoOption"
            type="button"
          >
            🖼️ Foto o vídeo
          </button>

          <button
            class="attachOption"
            id="documentOption"
            type="button"
          >
            📄 Documento
          </button>

          <button
            class="attachOption"
            id="cameraOption"
            type="button"
          >
            📷 Cámara
          </button>

        </div>

      </div>


      <input
        type="file"
        id="mediaInput"
        accept="image/*,video/*"
        hidden
      >

      <input
        type="file"
        id="documentInput"
        hidden
      >

      <input
        type="file"
        id="cameraInput"
        accept="image/*,video/*"
        capture="environment"
        hidden
      >

    </section>

  </main>

</div>


<!-- ====================================================
     PANTALLA DE LLAMADA
     ==================================================== -->

<div
  class="callScreen"
  id="callScreen"
>

  <div class="callVideoArea">

    <video
      class="remoteVideo"
      id="remoteVideo"
      autoplay
      playsinline
    ></video>

    <video
      class="localVideo"
      id="localVideo"
      autoplay
      muted
      playsinline
    ></video>


    <div
      class="audioCallIdentity"

function getLocalUser() {

  const freshUsername =

      localStorage.getItem(
        'username'
      ) ||
      ''
    )
      .trim()

  let storedUser =
    null;


  try {

    const raw =
      localStorage.getItem(
        'vobix_user'
      ) ||
      localStorage.getItem(
        'vobixUser'
      ) ||
      localStorage.getItem(
        'user'
      ) ||
      '';


    if (raw) {

      try {

        const parsed =
          JSON.parse(raw);


        if (
          parsed &&
          typeof parsed ===
            'object'
        ) {

          storedUser =
            parsed;

        } else if (
          typeof parsed ===
            'string'
        ) {

          storedUser = {
            username:
              parsed
          };

        }

      } catch (error) {

        storedUser = {
          username:
            raw
        };

      }

    }

  } catch (error) {

    storedUser =
      null;

  }


  if (freshUsername) {

    return {

      ...(storedUser || {}),

      username:
        freshUsername

    };

  }


  if (storedUser) {

    const storedUsername =
      (
        storedUser.username ||
        storedUser.user_name ||
        storedUser.display_name ||
        storedUser.displayName ||
        ''
      )
        .toString()
        .trim()
        .replace(
          /^@+/,
          ''
        );


    if (storedUsername) {

      return {

        ...storedUser,

        username:
          storedUsername

      };

    }

  }


  return null;

}

// ========================================================
// OBTENER USERNAME
// ========================================================

function getUsername(
  data
) {

  if (!data) {
    return '';
  }


  if (
    typeof data ===
    'string'
  ) {

    const value =
      data
        .trim()
        .replace(
          /^@+/,
          ''
        );


    if (
      value &&
      value.toLowerCase() !==
        'usuario'
    ) {

      return value;

    }


    return '';

  }


  const directCandidates = [

    data.username,
    data.user_name,
    data.name,
    data.display_name,
    data.displayName,
    data.other_username,
    data.otherUsername,
    data.contact_username,
    data.contactUsername,
    data.participant_username,
    data.participantUsername,
    data.target_username,
    data.targetUsername

  ];


  for (
    const candidate
    of directCandidates
  ) {

    if (
      typeof candidate ===
      'string'
    ) {

      const value =
        candidate
          .trim()
          .replace(
            /^@+/,
            ''
          );


      if (
        value &&
        value.toLowerCase() !==
          'usuario'
      ) {

        return value;

      }

    }

  }


  const nestedCandidates = [

    data.other_user,
    data.otherUser,
    data.user,
    data.contact,
    data.participant,
    data.target,
    data.profile

  ];


  for (
    const nested
    of nestedCandidates
  ) {

    const value =
      getUsername(
        nested
      );


    if (value) {
      return value;
    }

  }


  return '';

}


// ========================================================
// OBTENER TELÉFONO
// ========================================================

function getPhone(
  data
) {

  if (!data) {
    return '';
  }


  return (

    data.phone ||
    data.phone_number ||
    data.phoneNumber ||
    data.other_phone ||
    data.otherPhone ||

    (
      data.other_user &&
      getPhone(
        data.other_user
      )
    ) ||

    (
      data.otherUser &&
      getPhone(
        data.otherUser
      )
    ) ||

    (
      data.user &&
      getPhone(
        data.user
      )
    ) ||

    ''

  );

}


// ========================================================
// OBTENER ID DE USUARIO
// ========================================================

function getUserId(
  data
) {

  if (!data) {
    return null;
  }


  return (

    data.user_id ||
    data.userId ||
    data.other_user_id ||
    data.otherUserId ||
    data.contact_user_id ||
    data.contactUserId ||

    (
      data.other_user &&
      getUserId(
        data.other_user
      )
    ) ||

    (
      data.otherUser &&
      getUserId(
        data.otherUser
      )
    ) ||

    data.id ||
    null

  );

}


// ========================================================
// NOMBRE DE CONVERSACIÓN
// ========================================================

function getConversationName(
  conversation
) {

  if (!conversation) {
    return '';
  }


  const nested = [

    conversation.other_user,
    conversation.otherUser,
    conversation.contact,
    conversation.participant,
    conversation.user

  ];


  for (
    const item
    of nested
  ) {

    const name =
      getUsername(
        item
      );


    if (name) {
      return name;
    }

  }


  const direct = [

    conversation.other_username,
    conversation.otherUsername,
    conversation.contact_username,
    conversation.contactUsername,
    conversation.participant_username,
    conversation.participantUsername,
    conversation.username,
    conversation.user_name,
    conversation.name

  ];


  for (
    const value
    of direct
  ) {

    if (
      typeof value ===
        'string' &&
      value.trim() &&
      value
        .trim()
        .toLowerCase() !==
        'usuario'
    ) {

      return value
        .trim()
        .replace(
          /^@+/,
          ''
        );

    }

  }


  if (
    conversation.type ===
      'group' &&
    conversation.title
  ) {

    return conversation.title;

  }


  const conversationId =
    conversation.id ||
    conversation.conversation_id ||
    conversation.conversationId;


  const otherUserId =
    getUserId(
      conversation.other_user ||
      conversation.otherUser ||
      conversation.contact ||
      conversation.participant ||
      null
    );


  const cached =
    cachedContactName(
      'c:' +
      conversationId
    ) ||
    cachedContactName(
      'u:' +
      otherUserId
    );


  if (cached) {
    return cached;
  }


  const phone =
    getPhone(
      conversation
    );


  if (phone) {
    return phone;
  }


  return 'Contacto';

}

// ========================================================
// AUTORIZACIÓN HTTP
// ========================================================

function buildAuthHeaders(
  headers = {}
) {

  const finalHeaders =
    new Headers(
      headers || {}
    );


  if (VOBIX_TOKEN) {

    finalHeaders.set(
      'Authorization',
      'Bearer ' +
      VOBIX_TOKEN
    );

  }


  return finalHeaders;

}


// ========================================================
// REQUEST JSON
// ========================================================

async function requestJSON(
  url,
  options = {}
) {

  const finalOptions = {

    ...options,

    headers:
      buildAuthHeaders(
        options.headers
      )

  };


  const response =
    await fetch(
      url,
      finalOptions
    );


  let data = {};


  try {

    data =
      await response.json();

  } catch (error) {}


  if (
    response.status ===
    401
  ) {

    throw new Error(
      data.message ||
      data.msg ||
      data.error ||
      'La sesión no es válida'
    );

  }


  if (!response.ok) {

    throw new Error(
      data.message ||
      data.msg ||
      data.error ||
      'Error del servidor'
    );

  }


  return data;

}

      const foundUserId =

        );


      if (
        foundUserId &&

      ) {

        saveContactName(

        );

      item.addEventListener(

    }
  );

// ========================================================
// CREAR / ABRIR CONVERSACIÓN PRIVADA
// ========================================================

async function createConversation(
  user
) {

  try {

    const targetUserId =
      getUserId(
        user
      );


    if (!targetUserId) {

      showToast(
        'No encontramos el ID de este contacto'
      );

      return;

    }


    const data =
      await requestJSON(

        '/api/chat/conversations/private',

        {

          method:
            'POST',

          headers: {

            'Content-Type':
              'application/json'

          },

          body:
            JSON.stringify({

              userId:
                targetUserId,

              targetUserId:
                targetUserId

            })

        }

      );


    const conversation =
      data.conversation ||
      data;


    if (
      !conversation.other_user &&
      !conversation.otherUser
    ) {

      conversation.other_user =
        user;

    }


    const conversationId =
      conversation.id ||
      conversation.conversation_id ||
      conversation.conversationId;


    const realTargetName =
      getUsername(
        user
      ) ||
      getPhone(
        user
      );


    if (
      conversationId &&
      realTargetName
    ) {

      saveContactName(
        'c:' +
        conversationId,
        realTargetName
      );

    }


    if (
      targetUserId &&
      realTargetName
    ) {

      saveContactName(
        'u:' +
        targetUserId,
        realTargetName
      );

    }


    await loadConversations();


    const refreshed =
      conversations.find(
        item => {

          const id =
            item.id ||
            item.conversation_id ||
            item.conversationId;


          return (
            String(id) ===
            String(
              conversationId
            )
          );

        }
      );


    if (refreshed) {

      const refreshedName =
        getConversationName(
          refreshed
        );


      if (
        !refreshedName ||
        refreshedName ===
          'Contacto'
      ) {

        refreshed.other_user =
          user;

      }


      await openConversation(
        refreshed
      );

    } else {

      await openConversation(
        conversation
      );

    }


    searchResults.innerHTML =
      '';

    searchInput.value =
      '';


  } catch (error) {

    console.error(
      'VOBIXCHAT CREATE CONVERSATION:',
      error
    );


    showToast(
      error.message ||
      'No se pudo abrir la conversación'
    );

  }

}


// ========================================================
// CARGAR CONVERSACIONES
// ========================================================

async function loadConversations() {

  try {

    const data =
      await requestJSON(
        '/api/chat/conversations'
      );


    conversations =
      Array.isArray(data)

        ? data

        : (

            data.conversations ||
            data.results ||
            data.data ||
            []

          );


    conversations.forEach(
      conversation => {

        const conversationId =
          conversation.id ||
          conversation.conversation_id ||
          conversation.conversationId;


        const name =
          getConversationName(
            conversation
          );


        if (
          conversationId &&
          name &&
          name !==
            'Contacto'
        ) {

          saveContactName(
            'c:' +
            conversationId,

// ========================================================
// ENTRAR EN SALA PRIVADA
// ========================================================

function joinConversationRoom(
  conversationId
) {

  return new Promise(
    resolve => {

      if (!conversationId) {

        resolve(false);

        return;

      }


      let finished =
        false;


      const finish =
        value => {

          if (finished) {
            return;
          }


          finished =
            true;


          clearTimeout(
            timer
          );


          resolve(
            value !== false
          );

        };


      const timer =
        setTimeout(
          () => {

            finish(true);

          },
          1200
        );


      try {

        socket.emit(

          'conversation-join',

          {

            conversationId:
              conversationId,

            conversation_id:
              conversationId

          },

          ack => {

            if (
              ack &&
              (
                ack.ok === false ||
                ack.success === false
              )
            ) {

              console.error(
                'VOBIXCHAT JOIN RECHAZADO:',
                ack
              );


              finish(false);

              return;

            }


            finish(true);

          }

        );


      } catch (error) {

        console.error(
          'VOBIXCHAT JOIN ERROR:',
          error
        );


        finish(false);

      }

    }
  );

}

// ========================================================
// ID DE CONVERSACIÓN DEL MENSAJE
// ========================================================

function getMessageConversationId(
  message
) {

  if (!message) {
    return null;
  }


  return (

    message.conversation_id ||
    message.conversationId ||
    (
      message.conversation &&
      (
        message.conversation.id ||
        message.conversation.conversation_id
      )
    ) ||
    null

  );

}


// ========================================================
// ID DEL REMITENTE
// ========================================================

function getMessageSenderId(
  message
) {

  if (!message) {
    return null;
  }


  return (

    message.sender_id ||
    message.senderId ||
    message.user_id ||
    message.userId ||
    (
      message.sender &&
      getUserId(
        message.sender
      )
    ) ||
    (
      message.user &&
      getUserId(
        message.user
      )
    ) ||
    null

  );

}


// ========================================================
// ¿ES MENSAJE MÍO?
// ========================================================

function isMyMessage(
  message
) {

  if (!message) {
    return false;
  }


  if (
    message.mine === true ||
    message.isMine === true ||
    message.is_mine === true
  ) {

    return true;

  }


  const senderId =
    getMessageSenderId(
      message
    );


  const myId =
    getUserId(
      me
    );


  if (
    senderId != null &&
    myId != null
  ) {

    return (
      String(senderId) ===
      String(myId)
    );

  }


  const senderName =
    getUsername(
      message.sender ||
      message.user ||
      {
        username:
          message.sender_username ||
          message.senderUsername
      }
    );


  const myName =
    getUsername(
      me
    );


  if (
    senderName &&
    myName
  ) {

    return (
      senderName
        .toLowerCase() ===
      myName
        .toLowerCase()
    );

  }


  return false;

}


// ========================================================
// TEXTO DEL MENSAJE
// ========================================================

function getMessageText(
  message
) {

  if (!message) {
    return '';
  }


  if (
    typeof message ===
    'string'
  ) {

    return message;

  }


  return (

    message.text ||
    message.content ||
    message.body ||
    message.message ||
    ''

  );

}


// ========================================================
// HORA DEL MENSAJE
// ========================================================

function getMessageTime(
  message
) {

  const value =
    message &&
    (
      message.created_at ||
      message.createdAt ||
      message.timestamp ||
      message.sent_at ||
      message.sentAt
    );


  if (!value) {
    return '';
  }


  const date =
    new Date(
      value
    );


  if (
    Number.isNaN(
      date.getTime()
    )
  ) {

    return '';

  }


  return date.toLocaleTimeString(
    [],
    {
      hour:
        '2-digit',

      minute:
        '2-digit'
    }
  );

}


// ========================================================
// EVITAR MENSAJES DUPLICADOS
// ========================================================

function messageAlreadyRendered(
  message
) {

  const id =
    message &&
    (
      message.id ||
      message.message_id ||
      message.messageId
    );


  if (!id) {
    return false;
  }


  return Boolean(
    messages.querySelector(
      '[data-message-id="' +
      CSS.escape(
        String(id)
      ) +
      '"]'
    )
  );

}


// ========================================================
// RENDERIZAR MENSAJE
// ========================================================

function renderMessage(
  message
) {

  if (
    !message ||
    messageAlreadyRendered(
      message
    )
  ) {

    return;

  }


  const mine =
    isMyMessage(
      message
    );


  const row =
    document.createElement(
      'div'
    );


  row.className =
    'messageRow' +
    (
      mine
        ? ' me'
        : ''
    );


  const id =
    message.id ||
    message.message_id ||
    message.messageId;


  if (id != null) {

    row.dataset.messageId =
      String(id);

  }


  const senderName =
    getUsername(
      message.sender ||
      message.user ||
      {
        username:
          message.sender_username ||
          message.senderUsername
      }
    );


  const text =
    getMessageText(
      message
    );


  const time =
    getMessageTime(
      message
    );


  const status =
    message.read_at ||
    message.readAt

      ? '✓✓'

      : message.delivered_at ||
        message.deliveredAt

        ? '✓✓'

        : '✓';


  row.innerHTML = `

    <div class="bubble">

      ${
        !mine &&
        senderName

          ? `

            <div class="messageSender">

              ${escapeHTML(
                senderName
              )}

            </div>

          `

          : ''
      }

      <div class="messageText">

        ${escapeHTML(
          text
        )}

      </div>

      <div class="messageMeta">

        <span>

          ${escapeHTML(
            time
          )}

        </span>

        ${
          mine

            ? `

              <span class="ticks">

                ${status}

              </span>

            `

            : ''
        }

      </div>

    </div>

  `;


  messages.appendChild(
    row
  );


  messages.scrollTop =
    messages.scrollHeight;

}


// ========================================================
// CARGAR MENSAJES
// ========================================================

async function loadMessages() {

  if (!currentConversation) {
    return;
  }


  const conversationId =
    currentConversation.id ||
    currentConversation.conversation_id ||
    currentConversation.conversationId;


  if (!conversationId) {
    return;
  }


  try {

    const data =
      await requestJSON(

        '/api/chat/conversations/' +

        encodeURIComponent(
          conversationId
        ) +

        '/messages'

      );


    const list =
      Array.isArray(data)

        ? data

        : (

            data.messages ||
            data.results ||
            data.data ||
            []

          );


    messages.innerHTML =
      '';


    list.forEach(
      renderMessage
    );


    messages.scrollTop =
      messages.scrollHeight;


  } catch (error) {

    console.error(
      'VOBIXCHAT LOAD MESSAGES:',
      error
    );


    showToast(
      error.message ||
      'No se pudieron cargar los mensajes'
    );

  }

}


// ========================================================
// ENVIAR MENSAJE
// ========================================================

async function sendMessage() {

  const text =
    messageInput
      .value
      .trim();


  if (
    !text ||
    !currentConversation
  ) {

    return;

  }


  const conversationId =
    currentConversation.id ||
    currentConversation.conversation_id ||
    currentConversation.conversationId;


  if (!conversationId) {

    showToast(
      'Conversación no válida'
    );

    return;

  }


  messageInput.value =
    '';


  try {

    socket.emit(
      'conversation-typing',
      {
        conversationId,
        typing: false
      }
    );


    const data =
      await requestJSON(

        '/api/chat/conversations/' +

        encodeURIComponent(
          conversationId
        ) +

        '/messages',

        {

          method:
            'POST',

          headers: {

            'Content-Type':
              'application/json'

          },

          body:
            JSON.stringify({

              text,
              content:
                text,
              message:
                text

            })

        }

      );


    const createdMessage =
      data.message ||
      data.data ||
      data;


    if (
      createdMessage &&
      typeof createdMessage ===
        'object'
    ) {

      if (
        !getMessageConversationId(
          createdMessage
        )
      ) {

        createdMessage.conversation_id =
          conversationId;

      }


      if (
        !getMessageSenderId(
          createdMessage
        )
      ) {

        createdMessage.sender_id =
          getUserId(
            me
          );

      }


      createdMessage.mine =
        true;


      renderMessage(
        createdMessage
      );


      socket.emit(
        'conversation-message',
        {

          conversationId,

          message:
            createdMessage

        }
      );

    }


    await loadConversations();


  } catch (error) {

    console.error(
      'VOBIXCHAT SEND:',
      error
    );


    messageInput.value =
      text;


    showToast(
      error.message ||
      'No se pudo enviar el mensaje'
    );

  }

}

// ========================================================
// RECIBIR MENSAJES EN TIEMPO REAL
// ========================================================

socket.on(
  'conversation-message',
  data => {

    const incomingMessage =
      data &&
      (
        data.message ||
        data.data ||
        data
      );


    if (
      !incomingMessage ||
      !currentConversation
    ) {

      loadConversations();

      return;

    }


    const currentId =
      currentConversation.id ||
      currentConversation.conversation_id ||
      currentConversation.conversationId;


    const incomingConversationId =
      getMessageConversationId(
        incomingMessage
      ) ||
      data.conversationId ||
      data.conversation_id;


    if (
      incomingConversationId != null &&
      String(
        incomingConversationId
      ) ===
      String(
        currentId
      )
    ) {

      renderMessage(
        incomingMessage
      );

    }


    loadConversations();

  }
);

// ========================================================

  'conversation-typing',
  data => {

    if (
      !data ||
      !currentConversation
    ) {

      return;

    }


    const currentId =
      currentConversation.id ||
      currentConversation.conversation_id ||
      currentConversation.conversationId;


    const incomingId =
      data.conversationId ||
      data.conversation_id;


    if (
      incomingId == null ||
      String(incomingId) !==
      String(currentId)
    ) {

      return;

    if (
      data.userId != null &&
      getUserId(me) != null &&
      String(data.userId) ===
      String(
        getUserId(me)
      )
    ) {

      return;

      data.typing === false
    ) {

      typing.textContent =
        '';

      getUsername(

      );

    );

      );

// ========================================================
// SUBIR ARCHIVO
// ========================================================

async function uploadFile(
  file,
  type = 'file'
) {

  if (!file) {
    return;
  }


  if (!currentConversation) {

    showToast(
      'Selecciona una conversación'
    );

    return;

  }


  const conversationId =
    currentConversation.id ||
    currentConversation.conversation_id ||
    currentConversation.conversationId;


  if (!conversationId) {

    showToast(
      'Conversación no válida'
    );

    return;

  }


  const form =
    new FormData();


  form.append(
    'file',
    file
  );


  form.append(
    'type',
    type
  );


  form.append(
    'conversationId',
    conversationId
  );


  form.append(
    'conversation_id',
    conversationId
  );


  try {

    showToast(
      'Enviando archivo...'
    );


    const response =
      await fetch(

        '/api/chat/conversations/' +

        encodeURIComponent(
          conversationId
        ) +

        '/files',

        {

          method:
            'POST',

          headers:
            buildAuthHeaders(),

          body:
            form

        }

      );


    let data = {};


    try {

      data =
        await response.json();

    } catch (error) {}


    if (!response.ok) {

      throw new Error(

        data.message ||
        data.msg ||
        data.error ||
        'No se pudo enviar el archivo'

      );

    }


    const createdMessage =
      data.message ||
      data.data ||
      (
        data.id
          ? data
          : null
      );


    if (
      createdMessage &&
      typeof createdMessage ===
        'object'
    ) {

      if (
        !getMessageConversationId(
          createdMessage
        )
      ) {

        createdMessage.conversation_id =
          conversationId;

      }


      createdMessage.mine =
        true;


      renderMessage(
        createdMessage
      );


      socket.emit(
        'conversation-message',
        {

          conversationId,

          message:
            createdMessage

        }
      );

    }


    showToast(
      'Archivo enviado'
    );


  } catch (error) {

    console.error(
      'VOBIXCHAT UPLOAD:',
      error
    );


    showToast(
      error.message ||
      'No se pudo enviar el archivo'
    );

  }

}

// ========================================================
// NOTAS DE VOZ
// ========================================================

let mediaRecorder =
  null;

let audioChunks =
  [];

let recordingStream =
  null;

let recordingStartedAt =
  0;


// ========================================================
// INICIAR NOTA DE VOZ
// ========================================================

async function startVoiceRecording() {

  if (
    !navigator.mediaDevices ||
    !navigator.mediaDevices.getUserMedia
  ) {

    showToast(
      'Tu navegador no permite grabar audio'
    );

    return;

  }


  if (!currentConversation) {

    showToast(
      'Selecciona una conversación'
    );

    return;

  }


  try {

    recordingStream =
      await navigator.mediaDevices
        .getUserMedia({

          audio: true

        });


    audioChunks =
      [];


    let options = {};


    if (
      typeof MediaRecorder !==
        'undefined' &&
      MediaRecorder.isTypeSupported &&
      MediaRecorder.isTypeSupported(
        'audio/webm;codecs=opus'
      )
    ) {

      options.mimeType =
        'audio/webm;codecs=opus';

    }


    mediaRecorder =
      new MediaRecorder(
        recordingStream,
        options
      );


    mediaRecorder.addEventListener(
      'dataavailable',
      event => {

        if (
          event.data &&
          event.data.size > 0
        ) {

          audioChunks.push(
            event.data
          );

        }

      }
    );


    mediaRecorder.addEventListener(
      'stop',
      async () => {

        const mimeType =
          mediaRecorder &&
          mediaRecorder.mimeType

            ? mediaRecorder.mimeType

            : 'audio/webm';


        const blob =
          new Blob(
            audioChunks,
            {
              type:
                mimeType
            }
          );


        audioChunks =
          [];


        if (recordingStream) {

          recordingStream
            .getTracks()
            .forEach(
              track => {

                track.stop();

              }
            );

        }


        recordingStream =
          null;


        audioButton.textContent =
          '🎤';


        audioButton.title =
          'Nota de voz';


        if (
          blob.size === 0
        ) {

          showToast(
            'La nota de voz está vacía'
          );

          return;

        }


        const extension =
          mimeType.includes(
            'ogg'
          )

            ? 'ogg'

            : mimeType.includes(
                'mp4'
              )

              ? 'm4a'

              : 'webm';


        const file =
          new File(

            [blob],

            'vobix-voice-' +
            Date.now() +
            '.' +
            extension,

            {
              type:
                mimeType
            }

          );


        await uploadFile(
          file,
          'voice'
        );

      }
    );


    mediaRecorder.start(
      250
    );


    recordingStartedAt =
      Date.now();


    audioButton.textContent =
      '⏹️';


    audioButton.title =
      'Detener y enviar';


    showToast(
      'Grabando nota de voz...'
    );


  } catch (error) {

    console.error(
      'VOBIXCHAT MICROPHONE:',
      error
    );


    if (recordingStream) {

      recordingStream
        .getTracks()
        .forEach(
          track => {

            track.stop();

          }
        );

    }


    recordingStream =
      null;

    mediaRecorder =
      null;

    audioButton.textContent =
      '🎤';


    if (
      error &&
      (
        error.name ===
          'NotAllowedError' ||
        error.name ===
          'PermissionDeniedError'
      )
    ) {

      showToast(
        'Debes permitir el acceso al micrófono'
      );

      return;

    }


    showToast(
      'No se pudo acceder al micrófono'
    );

  }

}


// ========================================================
// DETENER NOTA DE VOZ
// ========================================================

function stopVoiceRecording() {

  if (
    !mediaRecorder ||
    mediaRecorder.state ===
      'inactive'
  ) {

    return;

  }


  const elapsed =
    Date.now() -
    recordingStartedAt;


  if (
    elapsed < 300
  ) {

    setTimeout(
      stopVoiceRecording,
      300 - elapsed
    );

    return;

  }


  mediaRecorder.stop();

}

// BOTÓN NOTA DE VOZ
// ========================================================

audioButton.addEventListener(

  () => {

    if (
      mediaRecorder &&
      mediaRecorder.state !==
        'inactive'
    ) {

      stopVoiceRecording();

    }


    startVoiceRecording();

  }
);

// ========================================================
// FORMATEAR DURACIÓN DE LLAMADA
// ========================================================

function formatCallDuration(
  milliseconds
) {

  const totalSeconds =
    Math.max(
      0,
      Math.floor(
        milliseconds /
        1000
      )
    );


  const minutes =
    Math.floor(
      totalSeconds /
      60
    );


  const seconds =
    totalSeconds %
    60;


  return (
    String(minutes)
      .padStart(
        2,
        '0'
      ) +
    ':' +
    String(seconds)
      .padStart(
        2,
        '0'
      )
  );

}


// ========================================================
// INICIAR TEMPORIZADOR DE LLAMADA
// ========================================================

function startCallTimer() {

  stopCallTimer();


  callStartedAt =
    Date.now();


  const update =
    () => {

      if (!callStartedAt) {
        return;
      }


      const duration =
        formatCallDuration(
          Date.now() -
          callStartedAt
        );


      callTopStatus.textContent =
        duration;

      audioCallStatus.textContent =
        duration;

    };


  update();


  callTimer =
    setInterval(
      update,
      1000
    );

}

// ========================================================
// LIMPIAR LLAMADA LOCAL
// ========================================================

function cleanupCall() {

  stopCallTimer();

  stopLocalCallStream();

  stopRemoteCallStream();

  closePeerConnection();


  pendingIceCandidates =
    [];


  currentCall =
    null;

  pendingIncomingCall =
    null;


  resetCallButtons();

  hideCallScreen();

}


// ========================================================
// OBTENER MICRÓFONO / CÁMARA PARA LLAMADA
// ========================================================

async function getCallMedia(
  type
) {

  if (
    !navigator.mediaDevices ||
    !navigator.mediaDevices.getUserMedia
  ) {

    throw new Error(
      'Este navegador no permite llamadas'
    );

  }


  const constraints = {

    audio: {

      echoCancellation:
        true,

      noiseSuppression:
        true,

      autoGainControl:
        true

    },

    video:
      type ===
      'video'

        ? {

            facingMode:
              'user',

            width: {
              ideal: 1280
            },

            height: {
              ideal: 720
            }

          }

        : false

  };


  const stream =
    await navigator.mediaDevices
      .getUserMedia(
        constraints
      );


  localCallStream =
    stream;


  if (
    type ===
    'video'
  ) {

    localVideo.srcObject =
      stream;


    try {

      await localVideo.play();

    } catch (error) {}

  }


  return stream;

}


// ========================================================
// CREAR CONEXIÓN WEBRTC
// ========================================================

function createPeerConnection() {

  closePeerConnection();


  peerConnection =
    new RTCPeerConnection(
      RTC_CONFIGURATION
    );


  remoteCallStream =
    new MediaStream();


  remoteVideo.srcObject =
    remoteCallStream;

  remoteAudio.srcObject =
    remoteCallStream;


  peerConnection.onicecandidate =
    event => {

      if (
        !event.candidate ||
        !currentCall
      ) {

        return;

      }


      socket.emit(
        'call:ice',
        {

          callId:
            currentCall.callId,

          conversationId:
            currentCall.conversationId,

          conversation_id:
            currentCall.conversationId,

          candidate:
            event.candidate

        }
      );

    };


  peerConnection.ontrack =
    event => {

      const streams =
        event.streams || [];


      if (
        streams[0]
      ) {

        streams[0]
          .getTracks()
          .forEach(
            track => {

              const exists =
                remoteCallStream
                  .getTracks()
                  .some(
                    currentTrack =>
                      currentTrack.id ===
                      track.id
                  );


              if (!exists) {

                remoteCallStream.addTrack(
                  track
                );

              }

            }
          );

      } else if (
        event.track
      ) {

        const exists =
          remoteCallStream
            .getTracks()
            .some(
              currentTrack =>
                currentTrack.id ===
                event.track.id
            );


        if (!exists) {

          remoteCallStream.addTrack(
            event.track
          );

        }

      }


      if (
        currentCall &&
        currentCall.type ===
          'video'
      ) {

        remoteVideo.srcObject =
          remoteCallStream;


        remoteVideo
          .play()
          .catch(
            () => {}
          );

      }


      remoteAudio.srcObject =
        remoteCallStream;


      remoteAudio
        .play()
        .catch(
          () => {}
        );

    };


  peerConnection.onconnectionstatechange =
    () => {

      if (!peerConnection) {
        return;
      }


      const state =
        peerConnection
          .connectionState;


      if (
        state ===
        'connected'
      ) {

        callTopStatus.textContent =
          'Conectado';

        audioCallStatus.textContent =
          'Conectado';


        if (!callStartedAt) {

          startCallTimer();

        }

      }


      if (
        state ===
          'failed' ||
        state ===
          'closed'
      ) {

        showToast(
          'La llamada terminó'
        );


        cleanupCall();

      }


      if (
        state ===
        'disconnected'
      ) {

        callTopStatus.textContent =
          'Reconectando...';

        audioCallStatus.textContent =
          'Reconectando...';

      }

    };


  peerConnection.oniceconnectionstatechange =
    () => {

      if (!peerConnection) {
        return;
      }


      const state =
        peerConnection
          .iceConnectionState;


      if (
        state ===
        'failed'
      ) {

        callTopStatus.textContent =
          'Error de conexión';

        audioCallStatus.textContent =
          'Error de conexión';

      }

    };


  return peerConnection;

}


// ========================================================
// AÑADIR STREAM LOCAL A WEBRTC
// ========================================================

function addLocalTracksToPeer() {

  if (
    !peerConnection ||
    !localCallStream
  ) {

    return;

  }


  localCallStream
    .getTracks()
    .forEach(
      track => {

        peerConnection.addTrack(
          track,
          localCallStream
        );

      }
    );

}


// ========================================================
// PROCESAR ICE PENDIENTES
// ========================================================

async function flushPendingIceCandidates() {

  if (
    !peerConnection ||
    !peerConnection.remoteDescription
  ) {

    return;

  }


  const candidates =
    [
      ...pendingIceCandidates
    ];


  pendingIceCandidates =
    [];


  for (
    const candidate
    of candidates
  ) {

    try {

      await peerConnection
        .addIceCandidate(
          new RTCIceCandidate(
            candidate
          )
        );

    } catch (error) {

      console.error(
        'VOBIXCHAT ICE PENDIENTE:',
        error
      );

    }

  }

}


// ========================================================
// CREAR OFFER
// ========================================================

async function createAndSendOffer() {

  if (
    !peerConnection ||
    !currentCall
  ) {

    return;

  }


  const offer =
    await peerConnection
      .createOffer();


  await peerConnection
    .setLocalDescription(
      offer
    );


  socket.emit(
    'call:offer',
    {

      callId:
        currentCall.callId,

      conversationId:
        currentCall.conversationId,

      conversation_id:
        currentCall.conversationId,

      type:
        currentCall.type,

      offer:
        peerConnection.localDescription

    },

    ack => {

      if (
        ack &&
        ack.ok === false
      ) {

        console.error(
          'VOBIXCHAT OFFER RECHAZADA:',
          ack
        );

      }

    }
  );

}


// ========================================================
// PREPARAR LLAMADA SALIENTE
// ========================================================

async function startOutgoingCall(
  type
) {

  if (
    currentCall ||
    pendingIncomingCall
  ) {

    showToast(
      'Ya hay una llamada activa'
    );

    return;

  }


  if (!currentConversation) {

    showToast(
      'Selecciona una conversación'
    );

    return;

  }


  const conversationId =
    getCurrentConversationId();


  if (!conversationId) {

    showToast(
      'Conversación no válida'
    );

    return;

  }


  const contactName =
    getConversationName(
      currentConversation
    ) ||
    'Contacto';


  try {

    showCallScreen(
      type,
      contactName
    );


    callTopStatus.textContent =
      'Preparando ' +
      (
        type === 'video'
          ? 'cámara...'
          : 'micrófono...'
      );


    audioCallStatus.textContent =
      'Preparando micrófono...';


    await getCallMedia(
      type
    );


    callTopStatus.textContent =
      'Llamando...';

    audioCallStatus.textContent =
      'Llamando...';


    socket.emit(
      'call:start',
      {

        conversationId,

        conversation_id:
          conversationId,

        type

      },

      async ack => {

        if (
          !ack ||
          ack.ok === false
        ) {

          showToast(
            (
              ack &&
              (
                ack.msg ||
                ack.message
              )
            ) ||
            'No se pudo iniciar la llamada'
          );


          cleanupCall();

          return;

        }


        currentCall = {

          callId:
            ack.callId,

          conversationId,

          type,

          direction:
            'outgoing',

          contactName

        };


        createPeerConnection();

        addLocalTracksToPeer();


        /*
          La oferta se crea después de que
          el receptor acepte la llamada.
        */

      }
    );


  } catch (error) {

    console.error(
      'VOBIXCHAT START CALL:',
      error
    );


    cleanupCall();


    if (
      error &&
      (
        error.name ===
          'NotAllowedError' ||
        error.name ===
          'PermissionDeniedError'
      )
    ) {

      showToast(
        type === 'video'
          ? 'Debes permitir cámara y micrófono'
          : 'Debes permitir el micrófono'
      );

      return;

    }


    if (
      error &&
      error.name ===
        'NotFoundError'
    ) {

      showToast(
        type === 'video'
          ? 'No encontramos cámara o micrófono'
          : 'No encontramos un micrófono'
      );

      return;

    }


    showToast(
      error.message ||
      'No se pudo iniciar la llamada'
    );

  }

}

// ========================================================
// LLAMADA ENTRANTE
// ========================================================

socket.on(
  'call:incoming',
  data => {

    if (!data) {
      return;
    }


    if (
      currentCall ||
      pendingIncomingCall
    ) {

      socket.emit(
        'call:reject',
        {

          callId:
            data.callId,

          conversationId:
            data.conversationId ||
            data.conversation_id,

          reason:
            'busy'

        }
      );


      return;

    }


    const conversationId =
      String(
        data.conversationId ||
        data.conversation_id ||
        ''
      ).trim();


    if (!conversationId) {
      return;
    }


    const callerName =
      getUsername(
        data.caller
      ) ||
      data.callerUsername ||
      data.fromUsername ||
      'Contacto';


    const type =
      data.type ===
        'video'

        ? 'video'

        : 'audio';


    pendingIncomingCall = {

      callId:
        data.callId,

      conversationId,

      type,

      direction:
        'incoming',

      contactName:
        callerName

    };


    incomingName.textContent =
      callerName;


    incomingAvatar.textContent =
      callerName
        .charAt(0)
        .toUpperCase() ||
      'V';


    incomingType.textContent =
      type ===
        'video'

        ? 'Videollamada entrante'

        : 'Llamada de voz entrante';


    acceptCallButton.textContent =
      type ===
        'video'

        ? '🎥'

        : '☎';


    incomingCall.classList.add(
      'open'
    );

  }
);


// ========================================================
// ACEPTAR LLAMADA ENTRANTE
// ========================================================

acceptCallButton.addEventListener(
  'click',
  async () => {

    if (!pendingIncomingCall) {
      return;
    }


    const incoming = {

      ...pendingIncomingCall

    };


    try {

      incomingCall.classList.remove(
        'open'
      );


      showCallScreen(
        incoming.type,
        incoming.contactName
      );


      callTopStatus.textContent =
        'Preparando conexión...';

      audioCallStatus.textContent =
        'Preparando conexión...';


      await getCallMedia(
        incoming.type
      );


      currentCall =
        incoming;


      pendingIncomingCall =
        null;


      createPeerConnection();

      addLocalTracksToPeer();


      socket.emit(
        'call:accept',
        {

          callId:
            currentCall.callId,

          conversationId:
            currentCall.conversationId,

          conversation_id:
            currentCall.conversationId

        },

        ack => {

          if (
            ack &&
            ack.ok === false
          ) {

            showToast(
              ack.msg ||
              'No se pudo aceptar la llamada'
            );


            cleanupCall();

          }

        }
      );


      callTopStatus.textContent =
        'Conectando...';

      audioCallStatus.textContent =
        'Conectando...';


    } catch (error) {

      console.error(
        'VOBIXCHAT ACCEPT CALL:',
        error
      );


      socket.emit(
        'call:reject',
        {

          callId:
            incoming.callId,

          conversationId:
            incoming.conversationId,

          reason:
            'media-error'

        }
      );


      cleanupCall();


      if (
        error &&
        (
          error.name ===
            'NotAllowedError' ||
          error.name ===
            'PermissionDeniedError'
        )
      ) {

        showToast(
          incoming.type ===
            'video'
            ? 'Debes permitir cámara y micrófono'
            : 'Debes permitir el micrófono'
        );

        return;

      }


      showToast(
        'No se pudo aceptar la llamada'
      );

    }

  }
);


// ========================================================

rejectCallButton.addEventListener(

        reason:
          'rejected'

      }
    );

    incomingCall.classList.remove(

// ========================================================
// EL RECEPTOR ACEPTÓ
// ========================================================

socket.on(
  'call:accepted',
  async data => {

    if (
      !currentCall ||
      !data
    ) {

      return;

    }


    if (
      data.callId &&
      currentCall.callId &&
      String(data.callId) !==
      String(currentCall.callId)
    ) {

      return;

    }


    try {

      callTopStatus.textContent =
        'Conectando...';

      audioCallStatus.textContent =
        'Conectando...';


      await createAndSendOffer();


    } catch (error) {

      console.error(
        'VOBIXCHAT CREATE OFFER:',
        error
      );


      showToast(
        'No se pudo conectar la llamada'
      );


      endCurrentCall(
        true
      );

    }

  }
);


// ========================================================
// RECIBIR OFFER
// ========================================================

socket.on(
  'call:offer',
  async data => {

    if (
      !currentCall ||
      !data ||
      !data.offer
    ) {

      return;

    }


    if (
      data.callId &&
      currentCall.callId &&
      String(data.callId) !==
      String(currentCall.callId)
    ) {

      return;

    }


    try {

      if (!peerConnection) {

        createPeerConnection();

        addLocalTracksToPeer();

      }


      await peerConnection
        .setRemoteDescription(
          new RTCSessionDescription(
            data.offer
          )
        );


      await flushPendingIceCandidates();


      const answer =
        await peerConnection
          .createAnswer();


      await peerConnection
        .setLocalDescription(
          answer
        );


      socket.emit(
        'call:answer',
        {

          callId:
            currentCall.callId,

          conversationId:
            currentCall.conversationId,

          conversation_id:
            currentCall.conversationId,

          answer:
            peerConnection.localDescription

        }
      );


    } catch (error) {

      console.error(
        'VOBIXCHAT RECEIVE OFFER:',
        error
      );


      showToast(
        'Error conectando la llamada'
      );


      endCurrentCall(
        true
      );

    }

  }
);


// ========================================================
// RECIBIR ANSWER
// ========================================================

socket.on(
  'call:answer',
  async data => {

    if (
      !currentCall ||
      !peerConnection ||
      !data ||
      !data.answer
    ) {

      return;

    }


    if (
      data.callId &&
      currentCall.callId &&
      String(data.callId) !==
      String(currentCall.callId)
    ) {

      return;

    }


    try {

      await peerConnection
        .setRemoteDescription(
          new RTCSessionDescription(
            data.answer
          )
        );


      await flushPendingIceCandidates();


    } catch (error) {

      console.error(
        'VOBIXCHAT RECEIVE ANSWER:',
        error
      );


      showToast(
        'Error completando la llamada'
      );

    }

  }
);


// ========================================================
// RECIBIR ICE
// ========================================================

socket.on(
  'call:ice',
  async data => {

    if (
      !currentCall ||
      !data ||
      !data.candidate
    ) {

      return;

    }


    if (
      data.callId &&
      currentCall.callId &&
      String(data.callId) !==
      String(currentCall.callId)
    ) {

      return;

    }


    if (
      !peerConnection ||
      !peerConnection.remoteDescription
    ) {

      pendingIceCandidates.push(
        data.candidate
      );

      return;

    }


    try {

      await peerConnection
        .addIceCandidate(
          new RTCIceCandidate(
            data.candidate
          )
        );


    } catch (error) {

      console.error(
        'VOBIXCHAT ADD ICE:',
        error
      );

    }

  }
);


// ========================================================
// LLAMADA RECHAZADA
// ========================================================

socket.on(
  'call:rejected',
  data => {

    if (!currentCall) {
      return;
    }


    if (
      data &&
      data.callId &&
      currentCall.callId &&
      String(data.callId) !==
      String(currentCall.callId)
    ) {

      return;

    }


    showToast(

    cleanupCall();

);

);

        conversation_id:

}

// ========================================================

async function loadMyProfile() {

  const localUser =
    getLocalUser();


  if (localUser) {

    me = {

      ...(me || {}),

      ...localUser

    };

  }


  const localUsername =
    getUsername(
      localUser
    );


  renderMyProfile();


  /*
    En esta instalación la sesión válida puede
    recuperarse directamente desde /api/session.
  */

  const routes = [

    '/api/session',
    '/api/auth/me',
    '/api/me',
    '/api/users/me',
    '/api/profile'

  ];


  for (
    const route
    of routes
  ) {

    try {

      const data =
        await requestJSON(
          route
        );


      const serverUser =
        data.user ||
        data.profile ||
        data.data ||
        data;


      if (
        !serverUser ||
        typeof serverUser !==
          'object'
      ) {

        continue;

      }


      const serverUsername =
        getUsername(
          serverUser
        );


      /*
        Conservamos como prioridad el nombre
        introducido al entrar en VOBIXCHAT.
      */

      const finalUsername =
        localUsername ||
        serverUsername ||
        getUsername(
          me
        );


      me = {

        ...(me || {}),

        ...serverUser,

        username:
          finalUsername

      };


      try {

        localStorage.setItem(
          'vobix_user',
          JSON.stringify(
            me
          )
        );


        if (finalUsername) {

          localStorage.setItem(
            'vobix_username',
            finalUsername
          );


          localStorage.setItem(
            'username',
            finalUsername
          );

        }

      } catch (error) {}


      renderMyProfile();


      return;

    } catch (error) {

      /*
        Si una ruta no existe,
        probamos la siguiente.
      */

    }

  }


  renderMyProfile();

}
