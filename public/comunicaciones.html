<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sala - VobixChat</title>
<script src="/socket.io/socket.io.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:Arial;background:#0a0a0a;color:white;display:flex;flex-direction:column;height:100vh}
header{background:#111;border-bottom:1px solid #00ff88;padding:12px 16px;display:flex;justify-content:space-between;align-items:center}
header h3{color:#00ff88}
#messages{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:10px}
.msg{background:#1c1c1c;padding:10px 14px;border-radius:14px;max-width:80%;border:1px solid #222}
.msg b{color:#00ff88;font-size:13px;display:block;margin-bottom:3px}
.input-area{display:flex;gap:8px;padding:12px;background:#111;border-top:1px solid #222}
.input-area input{flex:1;padding:13px;border-radius:12px;border:1px solid #333;background:#1a1a1a;color:white;outline:none}
.input-area button{padding:13px 20px;background:#00ff88;border:none;border-radius:12px;font-weight:bold;cursor:pointer}
</style>
</head>
<body>
<header>
<h3>VobixChat Sala</h3>
<span id="me" style="font-size:13px;opacity:0.8"></span>
</header>
<div id="messages"></div>
<div class="input-area">
<input id="text" placeholder="Escribe un mensaje..." onkeydown="if(event.key==='Enter')send()">
<button onclick="send()">Enviar</button>
</div>
<script>
const params = new URLSearchParams(location.search);
const myUser = params.get('u') || 'usuario';
document.getElementById('me').innerText = '@' + myUser;
const socket = io();
function send(){
  let t=document.getElementById('text').value.trim();
  if(!t) return;
  socket.emit('chat',{username:myUser, text:t});
  document.getElementById('text').value='';
}
socket.on('chat', data=>{
  let div=document.createElement('div');
  div.className='msg';
  div.innerHTML=`<b>@${data.username}</b>${data.text}`;
  document.getElementById('messages').appendChild(div);
  document.getElementById('messages').scrollTop = 999999;
});
</script>
</body>
</html>
