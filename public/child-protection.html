<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Vobix Protección Infantil</title><style>body{margin:0;background:#17251c;color:#183724;font:16px system-ui}.wrap{max-width:860px;margin:auto;padding:18px}.card{background:#f6f0e5;border-radius:18px;padding:20px;margin:14px 0}label{display:grid;gap:6px;margin:12px 0}select,button{padding:12px;border:1px solid #78906f;border-radius:10px;font:inherit}button{background:#4f9d31;color:white;font-weight:850}.danger{background:#8c3028}.notice{color:#58665c;line-height:1.5}.profile{padding:12px;border-top:1px solid #9caa9e}</style></head><body><main class="wrap"><section class="card"><h1>Vobix Protección Infantil</h1><p class="notice">Protección familiar transparente: requiere aceptación del menor y del tutor verificado. No permite leer conversaciones ni vigilar en secreto. La ayuda y las emergencias permanecen disponibles.</p><label>Guardián Familiar aceptado<select id="guardian"><option value="">Cargando…</option></select></label><label><span><input type="checkbox" id="childConsent"> Acepto solicitar esta protección familiar</span></label><button id="request">Solicitar vinculación</button><p id="status" aria-live="polite"></p></section><section class="card"><h2>Vinculaciones</h2><div id="profiles">Cargando…</div></section><section class="card"><button class="danger" id="disable">Desactivar mi vinculación</button></section></main><script>
(()=>{'use strict';const $=id=>document.getElementById(id);function headers(body=false){const t=localStorage.getItem('vobix_token')||localStorage.getItem('token')||'';return {...(t?{Authorization:'Bearer '+t}:{}),...(body?{'Content-Type':'application/json'}:{})}}async function api(path,opt={}){const r=await fetch(path,{...opt,headers:headers(Boolean(opt.body))}),d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.msg||'No se pudo completar');return d}function show(e){$('status').textContent=e.message||String(e)}async function load(){try{const [g,d]=await Promise.all([api('/api/guardian'),api('/api/child-protection')]);const own=(g.relationships||[]).filter(x=>x.role==='protected'&&x.status==='active');$('guardian').replaceChildren(new Option(own.length?'Elige tutor':'Primero configura un Guardián',''));own.forEach(x=>$('guardian').add(new Option(x.other_username,x.id)));$('profiles').replaceChildren();if(!d.profiles.length)$('profiles').textContent='No hay protección vinculada.';d.profiles.forEach(p=>{const x=document.createElement('div');x.className='profile';x.textContent=`${p.role==='child'?'Mi protección':'Protección familiar'} · ${p.status}`;if(p.role==='guardian'&&p.status==='pending_guardian'){const b=document.createElement('button');b.textContent='Aceptar como tutor';b.onclick=()=>api('/api/child-protection/respond',{method:'POST',body:JSON.stringify({childUserId:p.child_user_id,decision:'accept',guardianConsent:true})}).then(load).catch(show);x.append(' ',b)}$('profiles').append(x)})}catch(e){show(e)}}$('request').onclick=()=>api('/api/child-protection/request',{method:'POST',body:JSON.stringify({relationshipId:$('guardian').value,childConsent:$('childConsent').checked})}).then(()=>{show('Solicitud enviada al tutor.');load()}).catch(show);$('disable').onclick=()=>api('/api/child-protection/disable',{method:'POST'}).then(()=>{show('Protección desactivada.');load()}).catch(show);load()})();
</script></body></html>
