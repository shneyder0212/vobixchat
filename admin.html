<!DOCTYPE html>
<html><head><meta charset="UTF-8"><title>Admin VobixChat</title>
<style>body{font-family:Arial;background:#111;color:white;padding:20px}input{padding:10px} table{width:100%;margin-top:20px;border-collapse:collapse} td,th{border:1px solid #333;padding:8px} th{background:#00ff88;color:black}</style>
</head><body>
<h2>Panel Privado VobixChat - Solo Admin</h2>
<input id="key" type="password" placeholder="Clave de admin">
<button onclick="loadUsers()">Entrar</button>
<input id="search" placeholder="Buscar por nombre, telefono, pais..." oninput="filter()" style="width:60%;margin-left:20px">
<table><thead><tr><th>Teléfono</th><th>Fecha Registro</th><th>País/IP</th><th>Idioma</th></tr></thead><tbody id="tbody"></tbody></table>
<script>
let allUsers=[];
async function loadUsers(){
 let k=document.getElementById('key').value;
 let r=await fetch('/admin/users',{headers:{'x-admin-key':k}});
 let d=await r.json();
 if(d.error) return alert(d.error);
 allUsers=d.users; render(allUsers);
}
function render(list){
 document.getElementById('tbody').innerHTML=list.map(u=>`<tr><td>${u.phone}</td><td>${u.date}</td><td>${u.country||'-'}</td><td>${u.lang||'-'}</td></tr>`).join('');
}
function filter(){
 let q=document.getElementById('search').value.toLowerCase();
 render(allUsers.filter(u=>JSON.stringify(u).toLowerCase().includes(q)));
}
</script>
</body></html>
